    `List<int>` jest generyczna i przechowuje inty bezpośrednio, bez boxingu.
    Konwersja `int` na `long` to konwersja między typami wartościowymi, a `ref int` przekazuje referencję do zmiennej bez tworzenia obiektu.

- id: 40
  question: Która operacja wymaga jawnego rzutowania?
  answers:
    - text: Przypisanie `int` do zmiennej `double`
      correct: false
    - text: Przypisanie klasy pochodnej do zmiennej typu bazowego
      correct: false
    - text: Boxing, np. `object obj = 5`
      correct: false
    - text: Unboxing, np. `int x = (int)obj`
      correct: true
  explanation: |
    Unboxing zawsze wymaga jawnego rzutowania i rzuca `InvalidCastException` przy złym typie.
    Boxing, rzutowanie w górę hierarchii i poszerzająca konwersja `int` na `double` są niejawne.

- id: 41
  question: Dlaczego boxing i unboxing szkodzą wydajności?
  answers:
    - text: Bo każda taka konwersja wymaga założenia blokady i synchronizacji między wątkami
      correct: false
    - text: Boxing alokuje obiekt na stercie, a unboxing sprawdza typ i kopiuje
      correct: true
    - text: Bo wymuszają ponowną kompilację JIT całej metody przy każdym wywołaniu
      correct: false
    - text: Bo zawsze powodują wyjątek `InvalidCastException`, który trzeba obsłużyć w `catch`
      correct: false
  explanation: |
    Każdy boxing to alokacja i kopiowanie wartości, a w pętlach i dużych kolekcjach koszt i presja na GC rosną.
    Nie ma tu synchronizacji wątków ani ponownej kompilacji JIT.
    Wyjątek pojawia się tylko przy unboxingu do złego typu, a nie zawsze.

- id: 42
  question: Dlaczego wielokrotne łączenie stringów w pętli jest nieefektywne?
