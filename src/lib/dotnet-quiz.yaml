- id: 1
  question: Jaka jest relacja między C# a .NET?
  answers:
    - text: C# to środowisko uruchomieniowe, a .NET to język, w którym pisze się aplikacje
      correct: false
    - text: C# to język programowania, a .NET to platforma (CLR, biblioteki, narzędzia), na której działa kod C#
      correct: true
    - text: C# i .NET to dwie nazwy tego samego języka - .NET to nazwa używana od wersji 5
      correct: false
    - text: .NET to kompilator C#, który bez etapu pośredniego generuje kod maszynowy dla konkretnego procesora
      correct: false
  explanation: |
    C# jest językiem, który kompiluje się do IL, a .NET dostarcza środowisko uruchomieniowe CLR, bibliotekę klas bazowych i narzędzia.
    To nie są synonimy - na .NET działają też F# i VB.NET.
    .NET nie generuje bezpośrednio kodu maszynowego z C# (robi to JIT w czasie wykonania z IL), a nazwanie C# środowiskiem uruchomieniowym, a .NET językiem odwraca ich role.

- id: 2
  question: Do czego kompilowany jest kod C# przed uruchomieniem?
  answers:
    - text: Do języka pośredniego IL, kompilowanego przez JIT w czasie wykonania
      correct: true
    - text: Do kodu JavaScript wykonywanego przez wbudowany silnik V8
      correct: false
    - text: Bezpośrednio do kodu maszynowego dla konkretnego procesora, bez etapu pośredniego
      correct: false
    - text: Do bajtkodu Javy uruchamianego przez maszynę wirtualną JVM
      correct: false
  explanation: |
    Kompilator Roslyn generuje IL (Intermediate Language) zapisany w assembly, a JIT kompiluje go do kodu maszynowego przy pierwszym wywołaniu metody.
    Bezpośrednia kompilacja do kodu maszynowego jest możliwa tylko w szczególnym trybie Native AOT, a nie domyślnie.
    JavaScript i bajtkod JVM to zupełnie inne ekosystemy.

- id: 3
  question: Która cecha OOP pozwala ponownie wykorzystać kod klasy bazowej w klasie pochodnej?
  answers:
    - text: Hermetyzacja
      correct: false
    - text: Abstrakcja
      correct: false
    - text: Przeciążanie operatorów
      correct: false
    - text: Dziedziczenie
      correct: true
  explanation: |
    Dziedziczenie pozwala klasie pochodnej przejąć składowe klasy bazowej i je rozszerzyć.
    Hermetyzacja dotyczy ukrywania stanu, abstrakcja - wystawiania tylko istotnych cech, a przeciążanie operatorów to definiowanie własnego zachowania operatorów dla typu.
    Żadna z tych trzech nie służy bezpośrednio do ponownego użycia kodu klasy bazowej.

- id: 4
  question: Która z poniższych jest rzeczywistą wadą programowania obiektowego?
  answers:
    - text: Głębokie hierarchie dziedziczenia prowadzą do silnych powiązań i kruchego kodu
      correct: true
    - text: W programowaniu obiektowym nie da się napisać aplikacji działającej na wielu wątkach
      correct: false
    - text: OOP nie pozwala na ukrywanie danych wewnątrz obiektów przed resztą programu
      correct: false
    - text: Kod obiektowy nie może korzystać z interfejsów
      correct: false
  explanation: |
    Nadużywanie dziedziczenia tworzy silne zależności między klasami, przez co zmiana bazy psuje klasy pochodne.
    Ukrywanie danych to wręcz jedna z zalet OOP (hermetyzacja).
    OOP nie ma nic wspólnego z ograniczeniami wielowątkowości, a interfejsy są jednym z podstawowych narzędzi OOP.

- id: 5
  question: Czym jest obiekt w C#?
  answers:
    - text: Konkretną instancją klasy, utworzoną zwykle słowem `new` i posiadającą własny stan
      correct: true
    - text: Plikiem `.cs` zawierającym definicję jednej klasy wraz z jej metodami
      correct: false
    - text: Szablonem definiującym pola i metody, z którego kompilator tworzy kolejne klasy
      correct: false
    - text: Przestrzenią nazw grupującą powiązane klasy
      correct: false
  explanation: |
    Klasa jest szablonem (blueprint), a obiekt to konkretna instancja tej klasy z własnymi wartościami pól.
    Opis "szablonu definiującego pola i metody" pasuje do klasy, a nie obiektu.
    Plik `.cs` to tylko jednostka organizacji kodu, a przestrzeń nazw to logiczne grupowanie typów.

- id: 6
  question: Która cecha opisuje klasę statyczną w C#?
  answers:
    - text: Jest automatycznie singletonem, którego jedyną instancję CLR tworzy przy starcie
      correct: false
    - text: Zawiera wyłącznie składowe statyczne i nie można utworzyć jej instancji
      correct: true
    - text: Może mieć konstruktory instancyjne, ale nie może mieć pól
      correct: false
    - text: Można po niej dziedziczyć, ale nie można utworzyć jej instancji przez `new`
      correct: false
  explanation: |
    Klasa statyczna zawiera tylko składowe statyczne, jest niejawnie zapieczętowana i nie pozwala na tworzenie instancji.
    Po klasie statycznej nie można dziedziczyć - "można dziedziczyć, ale nie zainstancjonować" to opis klasy abstrakcyjnej.
    Nie jest to singleton (nie ma żadnej instancji), a konstruktorów instancyjnych mieć nie może - może mieć za to statyczne pola i konstruktor statyczny.

- id: 7
  question: Który sposób NIE blokuje tworzenia instancji klasy spoza niej?
  answers:
    - text: Oznaczenie klasy jako `static`
      correct: false
    - text: Ustawienie wszystkich konstruktorów jako `private`
      correct: false
    - text: Oznaczenie klasy jako `sealed`
      correct: true
    - text: Oznaczenie klasy jako `abstract`
      correct: false
  explanation: |
    `sealed` blokuje dziedziczenie, ale obiekty takiej klasy można normalnie tworzyć.
    Klasy abstrakcyjnej nie da się zainstancjonować, statycznej w ogóle nie można utworzyć, a prywatne konstruktory pozwalają tworzyć obiekty tylko wewnątrz klasy.
    Dlatego tylko `sealed` nie wpływa na możliwość tworzenia obiektów.

- id: 8
  question: Czym jest właściwość (property) w C#?
  answers:
    - text: Atrybutem dodawanym w nawiasach kwadratowych nad klasą
      correct: false
    - text: Publicznym polem klasy, które działa szybciej od zmiennej, ale nie pozwala dodać walidacji ani żadnej logiki
      correct: false
    - text: Składową z akcesorami `get` i `set`, która kontroluje dostęp do wartości, ukrywając pole wspierające
      correct: true
    - text: Metodą statyczną klasy, która zwraca kopię wartości prywatnego pola wskazanego w atrybucie
      correct: false
  explanation: |
    Właściwość wygląda dla wywołującego jak pole, ale pod spodem akcesory `get` i `set` są metodami, więc można dodać walidację lub logikę.
    Publiczne pole nie pozwala na żadną logikę - to właśnie odróżnia je od właściwości.
    Właściwość nie musi być statyczna, a atrybuty w nawiasach kwadratowych to zupełnie inna konstrukcja (metadane).

- id: 9
  question: Kiedy zamiast właściwości lepiej użyć metody?
  answers:
    - text: Gdy pobranie wartości jest kosztowne, ma efekty uboczne lub wymaga argumentów
      correct: true
    - text: Gdy wartość ma być widoczna w debuggerze
      correct: false
    - text: Gdy wartość jest prostym polem tylko do odczytu, ustawianym raz w konstruktorze
      correct: false
    - text: Gdy klasa ma więcej niż pięć pól i musi być serializowana do formatu JSON
      correct: false
  explanation: |
    Właściwości powinny być tanie, przewidywalne i bez efektów ubocznych, bo wywołujący traktuje je jak pole.
    Proste pole tylko do odczytu to idealny kandydat właśnie na właściwość.
    Widoczność w debuggerze ani liczba pól klasy nie mają znaczenia przy wyborze między właściwością a metodą.

- id: 10
  question: Do czego służą przestrzenie nazw (namespaces)?
  answers:
    - text: Do fizycznego podziału aplikacji na osobne pliki `.dll`
      correct: false
    - text: Do logicznego grupowania typów i unikania kolizji nazw
      correct: true
    - text: Do określenia, w jakiej kolejności ładowane są klasy
      correct: false
    - text: Do kontroli dostępu do składowych klasy
      correct: false
  explanation: |
    Namespace to logiczny kontener - dwie klasy Logger mogą istnieć obok siebie w różnych przestrzeniach nazw.
    Fizyczną jednostką wdrożenia jest assembly, niezależne od przestrzeni nazw.
    Dostęp kontrolują modyfikatory dostępu, a kolejność ładowania klas nie zależy od namespace'ów.

- id: 11
  question: Jaką relację modeluje dziedziczenie?
  answers:
    - text: Relację "jest" (is-a), np. `SavingsAccount` jest Account
      correct: true
    - text: Relację "zawiera się w" (part-of), np. pokój jest częścią budynku
      correct: false
    - text: Relację "ma" (has-a), np. samochód ma silnik
      correct: false
    - text: Relację "używa" (uses-a), np. kontroler używa serwisu
      correct: false
  explanation: |
    Dziedziczenie wyraża, że typ pochodny jest szczególnym przypadkiem typu bazowego.
    Relacja "ma" i "zawiera się w" to kompozycja lub agregacja, a "używa" to zależność, np. przez wstrzyknięcie.
    Mylenie tych relacji prowadzi do nadużywania dziedziczenia tam, gdzie lepsza byłaby kompozycja.

- id: 12
  question: Który rodzaj dziedziczenia klas NIE jest wspierany w C#?
  answers:
    - text: Wielopoziomowe - C dziedziczy po B, a B po A
      correct: false
    - text: Wielokrotne - jedna klasa dziedziczy po dwóch klasach jednocześnie
      correct: true
    - text: Hierarchiczne - kilka klas dziedziczy po tej samej klasie bazowej
      correct: false
    - text: Pojedyncze - jedna klasa dziedziczy po jednej klasie bazowej
      correct: false
  explanation: |
    C# pozwala dziedziczyć tylko po jednej klasie, więc dziedziczenie wielokrotne klas jest niedozwolone (można za to implementować wiele interfejsów).
    Pojedyncze, wielopoziomowe i hierarchiczne dziedziczenie są w pełni wspierane.
    Ograniczenie ma chronić przed problemem diamentu i niejednoznacznością.

- id: 13
  question: Jak w C# osiągnąć efekt podobny do wielokrotnego dziedziczenia?
  answers:
    - text: Używając słowa kluczowego multiple w deklaracji klasy
      correct: false
    - text: Implementując wiele interfejsów i ewentualnie używając kompozycji
      correct: true
    - text: Oznaczając obie klasy bazowe słowem `virtual`, aby uniknąć problemu diamentu
      correct: false
    - text: Dziedzicząc po dwóch klasach bazowych oznaczonych modyfikatorem `partial`
      correct: false
  explanation: |
    Klasa może dziedziczyć po jednej klasie i implementować dowolną liczbę interfejsów, a wspólną logikę dostarcza kompozycja lub domyślne metody interfejsów.
    `partial` dzieli definicję jednej klasy na pliki, a nie pozwala dziedziczyć po wielu klasach.
    Klas nie oznacza się słowem `virtual`, a słowo multiple w C# nie istnieje.

- id: 14
  question: Które słowo kluczowe blokuje możliwość dziedziczenia po klasie?
  answers:
    - text: "`static readonly`"
      correct: false
    - text: "`internal`"
      correct: false
    - text: "`abstract`"
      correct: false
    - text: "`sealed`"
      correct: true
  explanation: |
    Klasa oznaczona `sealed` nie może być klasą bazową.
    `abstract` działa odwrotnie - wymusza dziedziczenie, bo takiej klasy nie da się zainstancjonować.
    `internal` ogranicza widoczność do assembly (w jego obrębie dalej można dziedziczyć), a `static readonly` dotyczy pól, nie klas.

- id: 15
  question: Czy klasa pochodna ma dostęp do prywatnych pól klasy bazowej?
  answers:
    - text: Nie - pola istnieją w obiekcie, ale kod pochodny nie ma do nich dostępu
      correct: true
    - text: Tak, ale tylko w konstruktorze klasy pochodnej
      correct: false
    - text: Nie - prywatne pola klasy bazowej są pomijane przy tworzeniu obiektu klasy pochodnej
      correct: false
    - text: Tak - dziedziczenie daje klasie pochodnej pełny dostęp do wszystkich składowych bazy
      correct: false
  explanation: |
    Prywatne pola są częścią pamięci obiektu pochodnego, ale są widoczne tylko w klasie, w której je zadeklarowano.
    Do współdzielenia z klasami pochodnymi służy modyfikator `protected`.
    Konstruktor pochodny też nie ma do nich dostępu, a pola nie są usuwane - inaczej metody bazowe nie mogłyby działać.

- id: 16
  question: Które narzędzia języka C# służą głównie do realizacji abstrakcji?
  answers:
    - text: Atrybuty i refleksja
      correct: false
    - text: Modyfikatory `private` i `protected`
      correct: false
    - text: Pętle `foreach` i instrukcje `switch`
      correct: false
    - text: Interfejsy i klasy abstrakcyjne
      correct: true
  explanation: |
    Abstrakcja polega na wystawieniu kontraktu i ukryciu implementacji, co w C# realizują interfejsy i klasy abstrakcyjne.
    Modyfikatory dostępu to narzędzie hermetyzacji.
    Pętle, `switch`, atrybuty i refleksja nie służą do definiowania abstrakcji.

- id: 17
  question: Który przykład najlepiej ilustruje hermetyzację?
  answers:
    - text: Klasa `BankAccount` z publicznym polem Balance, które każda klasa może bezpośrednio zmienić
      correct: false
    - text: Klasa `BankAccount` z prywatnym saldem i metodami Deposit/Withdraw, które walidują operacje
      correct: true
    - text: Interfejs `IAccount` implementowany przez kilka różnych klas kont z własną logiką
      correct: false
    - text: Klasa `SavingsAccount` dziedzicząca po `BankAccount`
      correct: false
  explanation: |
    Hermetyzacja to ukrycie stanu i udostępnienie kontrolowanych operacji, które pilnują niezmienników.
    Publiczne pole Balance to dokładne przeciwieństwo hermetyzacji.
    Interfejs z wieloma implementacjami ilustruje abstrakcję i polimorfizm, a `SavingsAccount` dziedziczący po `BankAccount` - dziedziczenie.

- id: 18
  question: Jak najkrócej opisać różnicę między abstrakcją a hermetyzacją?
  answers:
    - text: Abstrakcja i hermetyzacja to synonimy
      correct: false
    - text: Abstrakcja ukrywa złożoność (co obiekt robi), hermetyzacja ukrywa dane (jak jest zbudowany)
      correct: true
    - text: Abstrakcja działa wyłącznie w czasie wykonania, a hermetyzacja wyłącznie w czasie kompilacji
      correct: false
    - text: Abstrakcja dotyczy tylko klas statycznych, hermetyzacja tylko struktur
      correct: false
  explanation: |
    Abstrakcja to decyzja projektowa o tym, jakie cechy obiekt wystawia, a hermetyzacja to mechanizm ukrycia stanu i kontrolowania dostępu.
    Nie są synonimami, choć się uzupełniają.
    Nie ograniczają się do klas statycznych czy struktur, a podział na czas wykonania i kompilacji nie oddaje ich różnicy.

- id: 19
  question: Jak realizowany jest polimorfizm czasu wykonania w C#?
  answers:
    - text: "Przez metody generyczne z ograniczeniem `where` T : `class`"
      correct: false
    - text: Przez metody wirtualne, nadpisywanie (`override`) i interfejsy
      correct: true
    - text: Przez przeciążanie operatorów
      correct: false
    - text: Przez przeciążanie metod o tej samej nazwie i różnych parametrach
      correct: false
  explanation: |
    Polimorfizm dynamiczny wybiera implementację na podstawie faktycznego typu obiektu w czasie wykonania - to rola `virtual/override` i interfejsów.
    Przeciążanie metod i operatorów to polimorfizm czasu kompilacji.
    Generyki to polimorfizm parametryczny rozstrzygany przy kompilacji, a ograniczenie `class` nie zmienia tego mechanizmu.

- id: 20
  question: Która zmiana sygnatury NIE pozwala na przeciążenie metody?
  answers:
    - text: Zmiana typów parametrów
      correct: false
    - text: Zmiana wyłącznie typu zwracanego
      correct: true
    - text: Zmiana kolejności parametrów o różnych typach
      correct: false
    - text: Zmiana liczby parametrów
      correct: false
  explanation: |
    Typ zwracany nie jest częścią sygnatury metody w C#, więc dwie metody różniące się tylko nim nie skompilują się.
    Liczba, typy i kolejność typów parametrów należą do sygnatury i umożliwiają przeciążanie.
    Kompilator nie miałby jak wybrać metody po samym typie wyniku, zwłaszcza gdy wynik jest ignorowany.

- id: 21
  question: Co się stanie, gdy w klasie zdefiniujesz dwie metody różniące się tylko typem zwracanym?
  answers:
    - text: Wystąpi błąd kompilacji, bo typ zwracany nie należy do sygnatury
      correct: true
    - text: Program się skompiluje, ale rzuci wyjątek przy pierwszym wywołaniu
      correct: false
    - text: Kompilator wybierze metodę na podstawie typu zmiennej, do której przypisujemy wynik
      correct: false
    - text: Druga metoda ukryje pierwszą i wywoływana będzie zawsze ta zdefiniowana później
      correct: false
  explanation: |
    Kompilator zgłasza błąd CS0111, bo typ już definiuje składową z takimi samymi typami parametrów.
    C# nie rozstrzyga przeciążeń po typie, do którego przypisujemy wynik.
    Nie ma tu mechanizmu ukrywania ani błędu w czasie wykonania - kod po prostu się nie kompiluje.

- id: 22
  question: Kiedy rozstrzygane jest wywołanie metody przeciążonej (overloading), a kiedy nadpisanej (overriding)?
  answers:
    - text: Obie w czasie kompilacji
      correct: false
    - text: Przeciążonej w czasie kompilacji, nadpisanej w czasie wykonania
      correct: true
    - text: Przeciążonej w czasie wykonania, nadpisanej w czasie kompilacji
      correct: false
    - text: Obie w czasie wykonania
      correct: false
  explanation: |
    Przy przeciążaniu kompilator wybiera metodę na podstawie typów argumentów (wczesne wiązanie).
    Przy nadpisywaniu wybór zależy od faktycznego typu obiektu, więc dzieje się w czasie wykonania przez tablicę metod wirtualnych.
    Pozostałe kombinacje mylą lub ujednolicają te dwa mechanizmy.

- id: 23
  question: Czy metodę oznaczoną jako `virtual` trzeba nadpisać w klasie pochodnej?
  answers:
    - text: Tak - bez `override` kompilator zgłosi błąd w klasie pochodnej
      correct: false
    - text: Nie - bez nadpisania używana jest implementacja bazowa
      correct: true
    - text: Tak, ale tylko gdy klasa pochodna jest publiczna
      correct: false
    - text: Nie, ale bez nadpisania metoda staje się niedostępna w klasie pochodnej
      correct: false
  explanation: |
    `virtual` oznacza "można nadpisać" - klasa pochodna, która tego nie robi, dziedziczy implementację bazową.
    Obowiązek nadpisania dotyczy tylko metod `abstract` w nieabstrakcyjnej klasie pochodnej.
    Widoczność klasy nie ma tu znaczenia, a metoda nie znika - jest normalnie dostępna.

- id: 24
  question: Co się stanie, gdy metodę z klasy bazowej ukryjesz słowem `new` zamiast nadpisać przez `override`?
  answers:
    - text: Zawsze wywoła się metoda klasy bazowej, nawet przez referencję typu pochodnego
      correct: false
    - text: Kompilator zgłosi błąd, bo `new` nie może być użyte przy metodach
      correct: false
    - text: Zawsze wywoła się metoda klasy pochodnej, nawet przez zmienną typu bazowego
      correct: false
    - text: Wywołana metoda zależy od typu referencji, a nie obiektu
      correct: true
  explanation: |
    Ukrywanie (method hiding) tworzy niezwiązaną metodę o tej samej nazwie - zmienna typu Base wywoła wersję bazową, a zmienna typu Derived wersję pochodną.
    Zawsze metodę pochodną wywołałby dopiero `override`.
    `new` jest poprawnym modyfikatorem metody, więc błędu kompilacji nie ma.

- id: 25
  question: Która różnica między klasą abstrakcyjną a interfejsem jest prawdziwa?
  answers:
    - text: Metody interfejsu są domyślnie prywatne, a klasy abstrakcyjnej publiczne
      correct: false
    - text: Interfejs może mieć pola instancji, klasa abstrakcyjna nie
      correct: false
    - text: Klasa może implementować tylko jeden interfejs, ale dziedziczyć po wielu klasach abstrakcyjnych
      correct: false
    - text: Klasa abstrakcyjna może mieć pola instancji i konstruktory, interfejs nie
      correct: true
  explanation: |
    Klasa abstrakcyjna może przechowywać stan (pola) i mieć konstruktory, a interfejs nie może mieć pól instancji ani konstruktorów instancyjnych.
