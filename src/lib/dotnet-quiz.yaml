- id: 46
  question: Co robi instrukcja `continue` w pętli?
  answers:
    - text: Kończy całą metodę
      correct: false
    - text: Pomija resztę bieżącej iteracji i przechodzi do następnej
      correct: true
    - text: Kończy całą pętlę i przechodzi do kodu za nią
      correct: false
    - text: Wznawia całą pętlę od pierwszej iteracji, resetując licznik
      correct: false
