      correct: false
    - text: Konwersją obiektu ze sterty z powrotem na typ wartościowy przez jawne rzutowanie
      correct: false
    - text: Konwersją typu wartościowego na `object`, kopiującą wartość na stertę
      correct: true
    - text: Opakowaniem obiektu w słowo kluczowe `using`
      correct: false
  explanation: |
    Boxing ma miejsce np. przy `object` `o = 5` - wartość jest kopiowana do nowej alokacji na stercie.
    Konwersja w drugą stronę z jawnym rzutowaniem to unboxing.
    `using` służy do zwalniania zasobów, a serializacja to zupełnie inny proces.

- id: 39
  question: Który z tych przypadków powoduje boxing?
  answers:
    - text: Przypisanie `int` do zmiennej `long`
      correct: false
    - text: Przekazanie `int` jako parametru `ref int`
      correct: false
