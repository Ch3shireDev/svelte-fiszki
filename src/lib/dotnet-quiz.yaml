- id: 47
  question: Który operator zwraca prawą wartość tylko wtedy, gdy lewa jest `null`?
  answers:
    - text: "?:"
      correct: false
    - text: ?.
      correct: false
    - text: "`||`"
      correct: false
    - text: ??
      correct: true
  explanation: |
    Operator ?? (null-coalescing) zwraca lewy operand, chyba że jest `null` - wtedy zwraca prawy.
    ?. to operator warunkowego dostępu, który zwraca `null` zamiast rzucać wyjątek.
    ?: to operator trójargumentowy, a `||` to logiczne `OR` dla wartości `bool`.

- id: 48
  question: Ile bloków `catch` wykona się dla jednego rzuconego wyjątku?
  answers:
    - text: Żaden, jeśli istnieje blok `finally`
      correct: false
    - text: Wszystkie bloki w kolejności deklaracji
      correct: false
    - text: Tylko jeden - pierwszy pasujący
      correct: true
    - text: Wszystkie bloki, których typ pasuje do wyjątku
      correct: false
  explanation: |
    Wyjątek trafia do pierwszego `catch`, którego typ pasuje - dlatego bardziej szczegółowe wyjątki deklaruje się przed ogólnymi.
    Kolejne pasujące bloki nie są wykonywane.
    Obecność `finally` nie wyłącza bloków `catch` - `finally` po prostu wykonuje się na końcu.

- id: 49
  question: Do czego najlepiej użyć bloku `finally`?
  answers:
    - text: Do kodu sprzątającego, który musi się wykonać niezależnie od wystąpienia wyjątku
      correct: true
    - text: Do ponownego rzucenia złapanego wyjątku z nowym, pełniejszym stack trace
      correct: false
    - text: Do kodu, który ma się wykonać tylko przy sukcesie
      correct: false
    - text: Do logowania wyłącznie tych przypadków, w których w bloku `try` wystąpił wyjątek
      correct: false
  explanation: |
    `finally` wykonuje się zawsze - po sukcesie i po wyjątku - więc służy do zamykania połączeń, zwalniania locków czy plików.
    Kod tylko dla wyjątków należy do `catch`, a tylko dla sukcesu - na koniec bloku `try`.
    Ponowne rzucanie wyjątku robi się w `catch`, najlepiej przez `throw;` zachowujące stack trace.

- id: 50
  question: Czy blok `try` może istnieć bez bloku `catch`?
  answers:
    - text: Tak, ale tylko w metodach `async`
      correct: false
    - text: Nie, `catch` jest zawsze wymagany
      correct: false
    - text: Tak, zawsze - sam blok `try` jest poprawny
      correct: false
    - text: Tak, jeśli towarzyszy mu blok `finally`
      correct: true
  explanation: |
    Konstrukcja try-finally jest poprawna i pozwala zagwarantować sprzątanie, przekazując wyjątek wyżej.
    Sam `try` bez `catch` i `finally` się nie skompiluje.
    Reguła nie zależy od tego, czy metoda jest asynchroniczna.

- id: 51
  question: Czym różni się `finally` od Finalize?
  answers:
    - text: "`finally` to blok obsługi wyjątków, Finalize - metoda wołana przez GC"
      correct: true
    - text: Finalize wykonuje się zawsze po bloku `catch`, a `finally` tylko przy zamykaniu całej aplikacji
      correct: false
    - text: To ta sama konstrukcja zapisana na dwa sposoby
      correct: false
    - text: "`finally` wywołuje garbage collector, a Finalize programista ręcznie w bloku `try`"
      correct: false
  explanation: |
    `finally` działa deterministycznie po `try/catch`, a Finalize (destruktor) wywołuje garbage collector w nieprzewidywalnym momencie.
    To zupełnie różne mechanizmy, a nie dwie składnie jednego.
    Pozostałe odpowiedzi zamieniają ich role lub opisują nieistniejące zachowanie.

- id: 52
  question: Dlaczego przy ponownym rzucaniu wyjątku lepiej użyć `throw;` niż `throw ex;`?
  answers:
    - text: "`throw ex;` jest niedozwolone w nowszych wersjach C# i powoduje błąd kompilacji"
      correct: false
    - text: "`throw;` zachowuje oryginalny stack trace, a `throw ex;` resetuje go do bieżącego miejsca"
      correct: true
    - text: "`throw;` tworzy nowy obiekt wyjątku, który zawiera pełniejsze dane diagnostyczne niż oryginał"
      correct: false
    - text: "`throw ex;` nie przerywa wykonania metody"
      correct: false
  explanation: |
    Po `throw ex;` stack trace pokazuje miejsce ponownego rzucenia, przez co gubi się informacja, gdzie naprawdę wystąpił błąd.
    `throw ex;` jest poprawną składnią, ale złą praktyką.
    `throw;` nie tworzy nowego obiektu, a oba warianty przerywają wykonanie.

- id: 53
  question: Jaka jest główna zaleta generyków w C#?
  answers:
    - text: Automatyczne serializowanie obiektów do JSON i XML bez dodatkowej konfiguracji
      correct: false
    - text: Bezpieczeństwo typów w czasie kompilacji bez rzutowania i bez boxingu typów wartościowych
      correct: true
    - text: Możliwość zmiany typu zmiennej w czasie wykonania bez utraty sprawdzania przez kompilator
      correct: false
    - text: Brak konieczności deklarowania typów w ogóle
      correct: false
  explanation: |
    Generyki, jak `List<T>`, sprawdzają typy przy kompilacji i dla typów wartościowych generują wyspecjalizowany kod bez boxingu.
    Zmiana typu w runtime to domena `dynamic`, a serializacja nie ma związku z generykami.
    Generyki wymagają podania (lub wywnioskowania) typów, więc nie eliminują ich deklarowania.

- id: 54
  question: Które ograniczenie generyczne wymaga, by typ miał publiczny konstruktor bezparametrowy?
  answers:
    - text: "`where` T : `new()`"
      correct: true
    - text: "`where` T : `notnull`"
      correct: false
    - text: "`where` T : `struct`"
      correct: false
    - text: "`where` T : `class`"
      correct: false
  explanation: |
    Ograniczenie `new()` pozwala wewnątrz metody wywołać `new T()`.
    `class` wymaga typu referencyjnego, `struct` - typu wartościowego, a `notnull` - typu nienullowalnego.
    Żadne z nich nie gwarantuje istnienia konstruktora bezparametrowego.

- id: 55
  question: Dlaczego `ArrayList` i Hashtable uważa się za przestarzałe?
  answers:
    - text: Bo mają stały rozmiar i nie pozwalają na dodawanie elementów po utworzeniu
      correct: false
    - text: Bo działają tylko w aplikacjach Windows Forms
      correct: false
    - text: Bo są niegeneryczne - przechowują `object`, co wymaga rzutowania i powoduje boxing
      correct: true
    - text: Bo zostały usunięte z .NET Core i nie są dostępne w żadnej nowszej wersji platformy
      correct: false
  explanation: |
    Kolekcje z `System.Collections` przechowują elementy jako `object`, więc tracą bezpieczeństwo typów i wydajność.
    Nadal istnieją w nowym .NET, tylko są zastąpione przez `List<T>` i `Dictionary<TKey,TValue>`.
    Obie pozwalają dodawać elementy i nie są związane z Windows Forms.

- id: 56
  question: Czym różni się tablica od `ArrayList`?
  answers:
    - text: Tablica rośnie dynamicznie przy dodawaniu elementów, a `ArrayList` ma stały rozmiar ustalany przy tworzeniu
      correct: false
    - text: Nie ma różnic - `ArrayList` to tylko alias dla tablicy
      correct: false
    - text: "`ArrayList` jest silnie typowana dzięki generykom, a tablica zawsze przechowuje elementy jako `object`"
      correct: false
    - text: Tablica ma stały rozmiar i jest silnie typowana, `ArrayList` rośnie dynamicznie i przechowuje `object`
      correct: true
  explanation: |
    Rozmiar tablicy ustala się przy tworzeniu i nie da się go zmienić, a typ elementów jest ściśle określony.
    `ArrayList` zmienia rozmiar automatycznie, ale przechowuje `object`, co wymaga rzutowania.
    Odpowiedzi przypisujące tablicy dynamiczny rozmiar lub przechowywanie `object` odwracają te cechy, a `ArrayList` jest osobną klasą, nie aliasem.

- id: 57
  question: Jaka jest średnia złożoność wyszukiwania po kluczu w `Dictionary<TKey,TValue>`?
  answers:
    - text: "`O(1)`"
      correct: true
    - text: "`O(log n)`"
      correct: false
    - text: "`O(n)`"
      correct: false
    - text: "`O(n log n)`"
      correct: false
  explanation: |
    Dictionary jest tablicą haszującą, więc średnio wyszukuje element w czasie stałym.
    `O(n)` to wyszukiwanie wartości w `List<T>`, a `O(log n)` - w strukturach drzewiastych jak `SortedDictionary`.
    `O(n log n)` to typowa złożoność sortowania.

- id: 58
  question: Co jest wymagane, by po obiekcie można było iterować pętlą `foreach`?
  answers:
    - text: Implementacja `ICloneable` (lub publicznej metody Clone)
      correct: false
    - text: Implementacja `IComparable` lub `IEquatable<T>`
      correct: false
    - text: Implementacja `IDisposable`, aby enumerator mógł zostać zwolniony
      correct: false
    - text: Implementacja `IEnumerable` lub metoda `GetEnumerator`
      correct: true
  explanation: |
    `foreach` wywołuje `GetEnumerator` i przechodzi po sekwencji przez `MoveNext` i Current - zapewnia to `IEnumerable` lub wzorzec z metodą `GetEnumerator`.
    `ICloneable` służy do klonowania, `IDisposable` do zwalniania zasobów, a `IComparable` do porównywania.

- id: 59
  question: Czym `IEnumerator` różni się od `IEnumerable`?
  answers:
    - text: To dwie nazwy tego samego interfejsu w różnych wersjach .NET
      correct: false
    - text: "`IEnumerator` to kolekcja przechowująca elementy, a `IEnumerable` reprezentuje pojedynczy element tej kolekcji"
      correct: false
    - text: "`IEnumerable` jest implementowany tylko przez tablice, a `IEnumerator` tylko przez `List<T>` i słowniki"
      correct: false
    - text: "`IEnumerator` to kursor z `MoveNext` i Current, który utrzymuje stan iteracji; `IEnumerable` zwraca taki kursor"
      correct: true
  explanation: |
    `IEnumerable` oznacza "można po mnie iterować" i ma metodę `GetEnumerator`, a `IEnumerator` faktycznie przechodzi przez elementy.
    Każdy `foreach` dostaje nowy enumerator, który pamięta bieżącą pozycję.
    Pozostałe odpowiedzi mylą role interfejsów lub błędnie ograniczają ich zastosowanie.

- id: 60
  question: Dlaczego w zapytaniach EF Core warto pracować na `IQueryable`, a nie na `IEnumerable`?
  answers:
    - text: Bo `IQueryable` cache'uje wyniki zapytań w pamięci aplikacji między żądaniami
      correct: false
    - text: Bo `IQueryable` zawsze wykonuje zapytania synchronicznie, a `IEnumerable` asynchronicznie
      correct: false
    - text: Bo `IQueryable` tłumaczy wyrażenia na SQL i filtruje w bazie
      correct: true
    - text: Bo `IEnumerable` nie wspiera metody Where
      correct: false
  explanation: |
    Na `IQueryable` filtry, sortowanie i stronicowanie trafiają do SQL, więc z bazy pobierane są tylko potrzebne wiersze.
    Przejście na `IEnumerable` zbyt wcześnie ściąga dane do pamięci i filtruje je w C#.
    `IQueryable` nie jest cache'em, `IEnumerable` ma Where (LINQ to Objects), a synchroniczność nie zależy od tego wyboru.

- id: 61
  question: Co się dzieje z domyślnym konstruktorem, gdy w klasie zdefiniujesz konstruktor z parametrami?
  answers:
    - text: Kompilator zgłasza błąd, dopóki nie dopiszesz konstruktora bezparametrowego
      correct: false
    - text: Domyślny konstruktor nadal istnieje i jest publiczny
      correct: false
    - text: Kompilator przestaje generować domyślny konstruktor bezparametrowy
      correct: true
    - text: Domyślny konstruktor staje się prywatny
      correct: false
  explanation: |
    Kompilator dodaje publiczny konstruktor bezparametrowy tylko wtedy, gdy klasa nie ma żadnego konstruktora.
    Po dodaniu konstruktora z parametrami bezparametrowy trzeba w razie potrzeby napisać samemu.
    Nie zmienia się on w prywatny i nie ma błędu kompilacji - po prostu `new Klasa()` przestaje działać.

- id: 62
  question: Kiedy wykonuje się konstruktor statyczny?
  answers:
    - text: Przy każdym tworzeniu nowej instancji klasy
      correct: false
    - text: Tylko gdy wywoła się go jawnie
      correct: false
    - text: Automatycznie, raz, przed pierwszym użyciem typu
      correct: true
    - text: Przy starcie aplikacji, dla wszystkich klas naraz
      correct: false
  explanation: |
    CLR uruchamia konstruktor statyczny jednokrotnie, przed pierwszym utworzeniem obiektu lub odwołaniem do składowej statycznej.
    Konstruktory instancyjne wykonują się przy każdym `new`, a konstruktora statycznego nie da się wywołać ręcznie.
    Nie wykonuje się on też dla wszystkich klas przy starcie aplikacji.

- id: 63
  question: Które stwierdzenie o konstruktorze statycznym jest prawdziwe?
  answers:
    - text: Nie może mieć parametrów ani modyfikatora dostępu
      correct: true
    - text: Klasa może mieć kilka przeciążonych konstruktorów statycznych
      correct: false
    - text: Może mieć parametry, ale nie modyfikator dostępu
      correct: false
    - text: Musi być publiczny
      correct: false
  explanation: |
    Konstruktor statyczny wywołuje środowisko uruchomieniowe, więc nie da się przekazać mu argumentów ani określić, kto może go wywołać.
    Klasa może mieć tylko jeden konstruktor statyczny, bezparametrowy i bez modyfikatora dostępu.

- id: 64
  question: Czy C# automatycznie generuje konstruktor kopiujący dla klas?
  answers:
    - text: Nie - trzeba go napisać samemu (rekordy mają kopiowanie przez `with`)
      correct: true
    - text: Tak, każda klasa dziedziczy po `object` publiczną metodę `Copy()` tworzącą kopię
      correct: false
    - text: Tak, ale tylko dla klas zapieczętowanych, które nie mają konstruktora
      correct: false
    - text: Tak - kompilator generuje go dla każdej klasy, która ma wyłącznie publiczne pola
      correct: false
  explanation: |
    Konstruktor kopiujący w C# to zwykły konstruktor przyjmujący obiekt tej samej klasy, który trzeba napisać ręcznie.
    Rekordy udostępniają kopiowanie przez wyrażenie `with`, a `object` ma chronioną metodę `MemberwiseClone`, ale klasy nie dostają automatycznej metody `Copy()`.
    Ani publiczne pola, ani `sealed` nie powodują generowania konstruktora kopiującego.

- id: 65
  question: W którym wzorcu projektowym typowo stosuje się prywatny konstruktor?
  answers:
    - text: Observer
      correct: false
    - text: Singleton
      correct: true
    - text: Decorator
      correct: false
    - text: Strategy
      correct: false
  explanation: |
    Singleton używa prywatnego konstruktora, żeby jedynym sposobem uzyskania instancji była statyczna właściwość lub metoda klasy.
    Observer, Strategy i Decorator opierają się na normalnie tworzonych obiektach i interfejsach.

- id: 66
  question: Jak uniknąć powielania logiki między przeciążonymi konstruktorami?
  answers:
    - text: Oznaczyć konstruktory słowem `override` i wywołać wersję bazową
      correct: false
    - text: "Wywołać inny konstruktor tej samej klasy przez : `this(...)`"
      correct: true
    - text: Zdefiniować wspólną logikę w konstruktorach statycznych
      correct: false
    - text: "Wywołać konstruktor klasy bazowej przez `: base(...)`"
      correct: false
  explanation: |
    : `this(...)` przekazuje inicjalizację do innego konstruktora tej samej klasy, więc wspólna logika jest w jednym miejscu.
    `: base(...)` wywołuje konstruktor klasy bazowej, a nie innego konstruktora w tej klasie.
    Konstruktorów nie można nadpisywać, a statyczny konstruktor może być tylko jeden.

- id: 67
  question: Który konstruktor wykona się pierwszy przy tworzeniu obiektu klasy pochodnej?
  answers:
    - text: Kolejność jest losowa i zależy od JIT
      correct: false
    - text: Konstruktor klasy bazowej, a potem pochodnej
      correct: true
    - text: Tylko konstruktor klasy pochodnej
      correct: false
    - text: Konstruktor klasy pochodnej, a potem bazowej
      correct: false
  explanation: |
    Część bazowa obiektu musi być zainicjalizowana przed kodem klasy pochodnej, więc konstruktory wykonują się od góry hierarchii.
    Inicjalizatory pól klasy pochodnej wykonują się jednak jeszcze przed konstruktorem bazowym.
    Konstruktor bazowy jest wywoływany zawsze, a kolejność jest deterministyczna.

- id: 68
  question: Czym jest destruktor (`~NazwaKlasy`) w C#?
  answers:
    - text: Metodą wywoływaną natychmiast, gdy zmienna wskazująca obiekt wychodzi poza zakres
      correct: false
    - text: Finalizatorem wywoływanym przez GC w nieokreślonym czasie przed zwolnieniem obiektu
      correct: true
    - text: Synonimem metody Dispose
      correct: false
    - text: Metodą, którą należy wywołać ręcznie, aby zwolnić pamięć zajmowaną przez obiekt
      correct: false
  explanation: |
    Destruktor kompiluje się do metody Finalize, uruchamianej przez garbage collector - nie wiadomo kiedy.
    C# nie ma deterministycznych destruktorów jak C++, a destruktora nie da się wywołać ręcznie.
    Do deterministycznego zwalniania zasobów służy Dispose, które jest osobnym mechanizmem.

- id: 69
  question: Co dzieje się, gdy obiekt klasy przekażesz do metody bez `ref` i wewnątrz przypiszesz parametrowi nowy obiekt?
  answers:
    - text: Kompilator zgłasza błąd, bo do parametrów typu referencyjnego nie można przypisywać nowych obiektów
      correct: false
    - text: Zmienna wywołującego nadal wskazuje stary obiekt, bo metoda dostała kopię referencji
      correct: true
    - text: Stary obiekt zostaje natychmiast usunięty przez GC
      correct: false
    - text: Zmienna wywołującego zaczyna wskazywać nowy obiekt, bo klasy zawsze przekazywane są przez referencję
      correct: false
  explanation: |
    Domyślnie przekazywana jest kopia referencji - metoda może zmienić stan obiektu, ale przypisanie nowego obiektu do parametru nie wpływa na zmienną wywołującego.
    Żeby podmienić obiekt u wywołującego, trzeba użyć `ref`.
    GC nie usuwa obiektu natychmiast (a stary obiekt i tak jest dalej używany przez wywołującego), a przypisanie do parametru jest w pełni dozwolone.

- id: 70
  question: Który sposób zwracania wielu wartości z metody jest dziś najbardziej idiomatyczny dla wewnętrznych metod?
  answers:
    - text: Ustawianie pól statycznych klasy przed zakończeniem metody
      correct: false
    - text: Rzucanie wyjątku zawierającego wyniki
      correct: false
    - text: Zwracanie tablicy `object[]` z wartościami różnych typów
      correct: false
    - text: Krotki wartościowe, np. (`int` min, `int` max) `GetRange()`
      correct: true
  explanation: |
    Krotki wartościowe z nazwanymi elementami są zwięzłe, silnie typowane i wspierają dekonstrukcję.
    `object[]` traci typy i wymaga rzutowania, pola statyczne psują współbieżność i testowalność, a wyjątki służą do błędów, nie do zwracania danych.
    Dla publicznego API często lepszy jest rekord lub klasa wynikowa.

- id: 71
  question: Czym różni się parametr `out` od `ref`?
  answers:
    - text: "`out` przekazuje kopię wartości do metody, a `ref` przekazuje referencję do zmiennej wywołującego"
      correct: false
    - text: "`out` nie wymaga inicjalizacji, ale metoda musi go przypisać; `ref` wymaga inicjalizacji"
      correct: true
    - text: "`ref` nie wymaga inicjalizacji przed wywołaniem, a `out` musi być zainicjalizowany i metoda nie może go zmienić"
      correct: false
    - text: Nie ma różnicy, to synonimy
      correct: false
  explanation: |
    `out` służy do zwracania dodatkowych wyników (wzorzec `TryParse`), więc zmienna nie musi mieć wartości, ale metoda musi ją ustawić.
    `ref` modyfikuje istniejącą wartość, dlatego zmienna musi być wcześniej zainicjalizowana.
    Oba przekazują zmienną przez referencję - różnią się regułami inicjalizacji, więc nie są synonimami.

- id: 72
  question: Które stwierdzenie o słowie kluczowym `params` jest prawdziwe?
  answers:
    - text: "`params` działa tylko z parametrem typu `string[]` lub `object[]`"
      correct: false
    - text: Musi oznaczać ostatni parametr metody i może wystąpić tylko raz
      correct: true
    - text: Metoda może mieć kilka parametrów `params`, pod warunkiem że mają różne typy
      correct: false
    - text: Może oznaczać dowolny parametr, także pierwszy
      correct: false
  explanation: |
    `params` pozwala przekazać zmienną liczbę argumentów, więc musi być na końcu listy parametrów i tylko jeden.
    Działa z tablicą dowolnego typu, a od C# 13 także z innymi kolekcjami, np. `Span<T>` czy `List<T>`.

- id: 73
  question: Jakie ograniczenie dotyczy wartości domyślnej parametru opcjonalnego?
  answers:
    - text: Musi być typu `string`
      correct: false
    - text: Może być dowolnym wyrażeniem obliczanym przy wywołaniu, np. `DateTime.Now`
      correct: false
    - text: Może być wynikiem wywołania innej metody statycznej tej samej klasy
      correct: false
    - text: Musi być stałą czasu kompilacji (lub `default/new()` dla typu wartościowego)
      correct: true
  explanation: |
    Wartość domyślna jest wkompilowywana w miejsce wywołania, więc musi być znana podczas kompilacji.
    `DateTime.Now` i wywołania metod są obliczane w czasie wykonania, więc nie są dozwolone.
    Parametr opcjonalny może być dowolnego typu, nie tylko `string`.

- id: 74
  question: "Co dają argumenty nazwane, np. `Send(to: \"a@b.pl\", urgent: true)`?"
  answers:
    - text: Zmieniają nazwy parametrów w definicji metody na nazwy użyte w wywołaniu
      correct: false
    - text: Tworzą nowe zmienne lokalne o podanych nazwach w metodzie wywołującej
      correct: false
    - text: Pozwalają podać argumenty w dowolnej kolejności i są czytelniejsze
      correct: true
    - text: Wymuszają przekazanie wszystkich argumentów przez referencję, tak jak `ref`
      correct: false
  explanation: |
    Argument nazwany jest przypisywany do parametru po nazwie, więc kolejność nie musi odpowiadać definicji, a znaczenie wartości typu `bool` jest od razu widoczne.
    Nie tworzy zmiennych lokalnych, nie zmienia definicji metody i nie ma nic wspólnego z `ref`.

- id: 75
  question: Jak definiuje się metodę rozszerzającą w C#?
  answers:
    - text: Jako statyczną metodę w statycznej klasie, ze słowem `this` przed pierwszym parametrem
      correct: true
    - text: Przez dziedziczenie po rozszerzanej klasie i dodanie w niej nowej metody publicznej
      correct: false
    - text: Jako metodę instancyjną z atrybutem `[Extension]` w klasie, którą rozszerzamy
      correct: false
    - text: Jako metodę oznaczoną słowem `partial` w dowolnej klasie tej samej przestrzeni nazw
      correct: false
  explanation: |
    Składnia `static` T `Metoda(this Typ x)` w statycznej klasie pozwala wywołać ją jak metodę instancyjną typu Typ.
    Nie trzeba modyfikować rozszerzanej klasy ani po niej dziedziczyć - dlatego można rozszerzać nawet `string` czy typy zapieczętowane.
    `partial` służy do dzielenia klasy na pliki.

- id: 76
  question: Czym jest delegat w C#?
  answers:
    - text: Mechanizmem przekazywania zadań między procesami przez kolejkę systemu operacyjnego
      correct: false
    - text: Bezpiecznym typowo typem reprezentującym referencję do metody o określonej sygnaturze
      correct: true
    - text: Specjalnym rodzajem interfejsu z jedną właściwością, implementowanym automatycznie przez kompilator
      correct: false
    - text: Klasą bazową wszystkich wyjątków
      correct: false
  explanation: |
    Delegat pozwala przechować metodę w zmiennej, przekazać ją jako parametr i wywołać później - to podstawa callbacków, zdarzeń i LINQ.
    Klasą bazową wyjątków jest `Exception`.
    Delegaty nie są interfejsami i działają w obrębie procesu, a nie między procesami.

- id: 77
  question: Co zwraca wywołanie delegata multicast, który wskazuje kilka metod zwracających wartość?
  answers:
    - text: Tablicę wartości ze wszystkich metod
      correct: false
    - text: Wartość zwróconą przez ostatnią wywołaną metodę
      correct: true
    - text: Wartość z pierwszej metody na liście
      correct: false
    - text: Sumę wartości zwróconych przez wszystkie metody
      correct: false
  explanation: |
    Wywołanie delegata multicast uruchamia wszystkie metody po kolei, ale zwraca tylko wynik ostatniej.
    Żeby zebrać wszystkie wyniki, trzeba iterować po `GetInvocationList()`.
    Delegat nie agreguje ani nie sumuje wyników.

- id: 78
  question: Co dziś najczęściej zastępuje anonimowe delegaty (`delegate(int x)` `{ ... }`)?
  answers:
    - text: Wyrażenia lambda
      correct: true
    - text: Metody rozszerzające
      correct: false
    - text: Klasy anonimowe
      correct: false
    - text: Atrybuty
      correct: false
  explanation: |
    Lambdy (x `=> x * 2`) to zwięźlejsza składnia tego samego mechanizmu, wprowadzona w C# 3.
    Metody rozszerzające rozszerzają typy, typy anonimowe przechowują dane, a atrybuty to metadane - żadne z nich nie jest funkcją anonimową.

- id: 79
  question: Co odróżnia zdarzenie (`event`) od publicznego pola delegata?
  answers:
    - text: Zdarzenie może wskazywać tylko jedną metodę
      correct: false
    - text: Z zewnątrz można tylko (od)subskrybować; wywołać je może tylko właściciel
      correct: true
    - text: Zdarzenie wykonuje każdego subskrybenta na osobnym wątku z puli, a pole delegata - synchronicznie
      correct: false
    - text: Zdarzenie może mieć subskrybentów tylko z tej samej klasy, a pole delegata - z dowolnej
      correct: false
  explanation: |
    Słowo `event` ogranicza operacje dostępne z zewnątrz do `+= i -=`, więc obca klasa nie może wywołać zdarzenia ani nadpisać listy subskrybentów przez `=`.
    Zdarzenie jest multicastowe, przyjmuje subskrybentów z dowolnych klas i domyślnie wywołuje ich synchronicznie na bieżącym wątku.

- id: 80
  question: Którego zastosowania słowa kluczowego `this` NIE ma w C#?
  answers:
    - text: "Łańcuchowania konstruktorów przez : `this(...)`"
      correct: false
    - text: Odwołania do pola statycznego w metodzie statycznej
      correct: true
    - text: Rozróżnienia pola od parametru o tej samej nazwie
      correct: false
    - text: Definiowania metod rozszerzających i indekserów
      correct: false
  explanation: |
    `this` odnosi się do bieżącej instancji, więc w metodzie statycznej nie istnieje - użycie go tam powoduje błąd kompilacji.
    Pozostałe zastosowania (`this.name = name`, : `this(...)`, `this` w metodach rozszerzających i indekserach) są poprawne.

- id: 81
  question: Co gwarantuje instrukcja `using` (`using var conn = ...`)?
  answers:
    - text: Wykonanie bloku w osobnym wątku
      correct: false
    - text: Import przestrzeni nazw obiektu do bieżącego pliku na czas trwania bloku
      correct: false
    - text: Wywołanie Dispose na obiekcie po wyjściu z zakresu, także przy wyjątku
      correct: true
    - text: Automatyczne ponowienie operacji na obiekcie, jeśli w bloku wystąpi wyjątek
      correct: false
  explanation: |
    Instrukcja `using` to skrót `try/finally` wywołującego Dispose, więc zasób zostanie zwolniony niezależnie od wyjątków.
    Import przestrzeni nazw robi dyrektywa `using` na początku pliku - to inne użycie tego samego słowa.
    `using` nie ponawia operacji ani nie tworzy wątków.

- id: 82
  question: Z jakimi typami można używać instrukcji `using`?
  answers:
    - text: Z dowolnym typem referencyjnym, nawet jeśli nie ma metody Dispose
      correct: false
    - text: Tylko z `SqlConnection`, `DbContext` i innymi obiektami połączeń do baz danych
      correct: false
    - text: Tylko z typami z przestrzeni nazw `System.IO`
      correct: false
    - text: Z każdym typem implementującym `IDisposable` (`await using` - z `IAsyncDisposable`)
      correct: true
  explanation: |
    `using` działa z każdym `IDisposable`: strumieniami, plikami, `HttpResponseMessage`, transakcjami czy własnymi klasami.
    Nie jest ograniczony do połączeń bazodanowych ani `System.IO`.
    Typ musi mieć Dispose (przez interfejs lub, dla `ref struct`, wzorzec), inaczej kompilator zgłosi błąd.

- id: 83
  question: Co zwraca operator `as`, gdy rzutowanie się nie powiedzie?
  answers:
    - text: Zwraca `false`
      correct: false
    - text: "`null`"
      correct: true
    - text: Zwraca wartość domyślną typu docelowego, np. 0 dla `int`
      correct: false
    - text: Rzuca `InvalidCastException`
      correct: false
  explanation: |
    `as` próbuje rzutowania i przy niepowodzeniu zwraca `null` zamiast rzucać wyjątek, dlatego działa tylko dla typów referencyjnych i nullowalnych.
    Wyjątek rzuca zwykłe rzutowanie `(T)obj`.
    Wartości `bool` zwraca operator `is`, a `as` nie może być użyty z nienullowalnym `int`.

- id: 84
  question: Czym różni się `const` od `readonly`?
  answers:
    - text: Nie ma różnic poza nazwą
      correct: false
    - text: "`const` jest ustalane w czasie kompilacji i niejawnie statyczne, `readonly` można ustawić także w konstruktorze"
      correct: true
    - text: "`readonly` jest ustalane w czasie kompilacji i niejawnie statyczne, a `const` można ustawić w konstruktorze"
      correct: false
    - text: "`const` można zmieniać w konstruktorze, a `readonly` musi mieć wartość już w deklaracji"
      correct: false
  explanation: |
    `const` musi mieć wartość w deklaracji i jest wkompilowywane w miejsce użycia, co ma znaczenie przy zmianach w bibliotekach.
    `readonly` jest ustalane w czasie wykonania (w deklaracji lub konstruktorze) i może być instancyjne.
    Odwrócenie tych ról jest błędne, a różnice są istotne.

- id: 85
  question: Dlaczego klasa statyczna słabo nadaje się do logiki biznesowej z zależnościami?
  answers:
    - text: Bo klasa statyczna jest usuwana z pamięci po każdym wywołaniu jej metody
      correct: false
    - text: Bo klasa statyczna nie może mieć metod publicznych
      correct: false
    - text: Bo metody statyczne działają zauważalnie wolniej niż metody instancyjne
      correct: false
    - text: Bo utrudnia podmianę zależności i testowanie
      correct: true
  explanation: |
    Klasy statycznej nie da się zarejestrować w kontenerze DI ani zamockować, więc kod od niej zależny jest silnie powiązany.
    Metody statyczne nie są wolniejsze, mogą być publiczne, a klasa statyczna żyje przez cały czas działania aplikacji.

- id: 86
  question: Czym różni się `var` od `dynamic`?
  answers:
    - text: "`var` rozstrzyga typ w czasie wykonania przez DLR, a `dynamic` to tylko skrót zapisu ustalany przez kompilator"
      correct: false
    - text: "`var` to typowanie statyczne wywnioskowane przez kompilator, `dynamic` wyłącza sprawdzanie typów do czasu wykonania"
      correct: true
    - text: "`dynamic` można użyć tylko z typami wartościowymi, a `var` tylko z referencyjnymi"
      correct: false
    - text: "`var` i `dynamic` działają identycznie"
      correct: false
  explanation: |
    Zmienna `var` ma konkretny typ ustalony przy kompilacji - to tylko skrót zapisu.
    `dynamic` przenosi rozstrzyganie wywołań do czasu wykonania (DLR), więc błędy objawiają się jako `RuntimeBinderException`.
    Odwrócenie ról jest błędne, a `dynamic` działa z dowolnymi typami.

- id: 87
  question: Jaki jest domyślny typ bazowy enuma i od jakiej wartości numerowane są jego elementy?
  answers:
    - text: "`int`, od 1"
      correct: false
    - text: "`long`, od 0"
      correct: false
    - text: "`int`, od 0"
      correct: true
    - text: "`byte`, od 1"
      correct: false
  explanation: |
    Bez jawnej deklaracji `enum` ma typ bazowy `int`, a pierwszy element ma wartość 0, kolejne - kolejne liczby.
    Typ bazowy można zmienić (np. `enum` Status : `byte`), a wartości ustawić ręcznie.

- id: 88
  question: Do czego służy atrybut `[Flags]` na enumie?
  answers:
    - text: Do oznaczenia enuma jako przestarzałego
      correct: false
    - text: Do łączenia wartości bitowo, np. Read `|` Write
      correct: true
    - text: Do automatycznej serializacji enuma do JSON jako `string`
      correct: false
    - text: Do zablokowania dodawania nowych wartości do enuma
      correct: false
  explanation: |
    `[Flags]` sygnalizuje, że wartości są flagami bitowymi (zwykle potęgami dwójki) i wpływa na `ToString()`, które wypisze kombinację nazw.
    Nie blokuje enuma, nie zmienia serializacji (do tego służy np. `JsonStringEnumConverter`) i nie oznacza przestarzałości (do tego jest `[Obsolete]`).

- id: 89
  question: Czy można dziedziczyć po typie `enum`?
  answers:
    - text: Tak, przez słowo extends
      correct: false
    - text: Nie - enumy są niejawnie zapieczętowane
      correct: true
    - text: Tak, jeśli `enum` jest publiczny
      correct: false
    - text: Tak, ale tylko jeśli `enum` ma atrybut `[Flags]`
      correct: false
  explanation: |
    Każdy `enum` dziedziczy po `System.Enum` i jest zapieczętowany, więc nie można po nim dziedziczyć ani dodawać wartości przez dziedziczenie.
    W C# nie ma słowa extends, a ani widoczność, ani `[Flags]` tego nie zmieniają.
    Zachowanie enuma można rozszerzyć metodami rozszerzającymi.

- id: 90
  question: Co robi słowo kluczowe `yield return`?
  answers:
    - text: Zwraca kolejny element leniwie, przez generowaną maszynę stanów
      correct: true
    - text: Zwraca wartość z metody `async` bez użycia `await`, nie tworząc obiektu `Task`
      correct: false
    - text: Przenosi dalsze wykonanie metody na inny wątek z puli, nie blokując wywołującego
      correct: false
    - text: Natychmiast buduje całą kolekcję w pamięci, zwraca ją i kończy wykonywanie metody
      correct: false
  explanation: |
    Metoda z `yield return` produkuje elementy dopiero podczas iteracji, więc nie musi budować całej kolekcji w pamięci.
    Nie kończy metody (robi to `yield break` lub koniec metody), nie tworzy wątków i nie jest związana z `async`.
    Istnieje też wariant asynchroniczny `IAsyncEnumerable` z `await foreach`.

- id: 91
  question: Czym jest LINQ?
  answers:
    - text: Mechanizmem łączenia wielu assembly w jeden plik wykonywalny podczas publikacji aplikacji
      correct: false
    - text: Składnią do deklaratywnych zapytań na kolekcjach, bazach i XML
      correct: true
    - text: Narzędziem do linkowania bibliotek natywnych C++ z kodem C# podczas kompilacji
      correct: false
    - text: Biblioteką Microsoftu do komunikacji z bazami NoSQL, np. MongoDB i Cosmos DB
      correct: false
  explanation: |
    LINQ (Language Integrated Query) daje jednolite API (Where, Select, `GroupBy...`) i składnię zapytań dla różnych źródeł danych.
    Nie jest biblioteką NoSQL, mechanizmem łączenia assembly ani narzędziem do interop z kodem natywnym.

- id: 92
  question: Która z poniższych jest realną wadą LINQ?
  answers:
    - text: LINQ działa tylko z bazą SQL Server, więc nie da się go użyć na kolekcjach w pamięci
      correct: false
    - text: LINQ nie pozwala na sortowanie danych
      correct: false
    - text: Brak sprawdzania typów w czasie kompilacji, przez co błędy wychodzą dopiero w runtime
      correct: false
    - text: Leniwe wykonanie może prowadzić do wielokrotnego wykonania tego samego zapytania
      correct: true
  explanation: |
    Zapytanie LINQ jest wykonywane przy każdej iteracji, więc np. dwukrotne wywołanie `Count()` i `foreach` może dwa razy odpytać bazę.
    LINQ ma pełne sprawdzanie typów, działa z wieloma źródłami (obiekty, EF, XML) i wspiera sortowanie przez `OrderBy`.

- id: 93
  question: Na co może zostać przekształcone wyrażenie lambda?
  answers:
    - text: Tylko na `string` z kodem źródłowym
      correct: false
    - text: Tylko na delegat Action, bo lambda nie może zwracać wartości
      correct: false
    - text: Na klasę anonimową z jedną metodą Invoke generowaną przez kompilator
      correct: false
    - text: Na delegat (np. Func, Action) lub drzewo wyrażeń Expression
      correct: true
  explanation: |
    Ta sama lambda może być skompilowana do delegata albo do drzewa wyrażeń, które EF Core analizuje i tłumaczy na SQL.
    Nie jest ograniczona do Action, nie staje się stringiem ani klasą anonimową.

- id: 94
  question: Co się stanie, gdy wywołasz `First()` na pustej sekwencji?
  answers:
    - text: Zostanie zwrócony `null`
      correct: false
    - text: Zostanie zwrócona pusta kolekcja
      correct: false
    - text: Zostanie rzucony `InvalidOperationException`
      correct: true
    - text: Zostanie zwrócona wartość domyślna typu
      correct: false
  explanation: |
    First wymaga co najmniej jednego elementu i rzuca wyjątek, gdy sekwencja jest pusta.
    Wartość domyślną (`null` lub 0) zwraca `FirstOrDefault`.
    Żadna z tych metod nie zwraca kolekcji - zawsze pojedynczy element.

- id: 95
  question: Czym różni się `Single()` od `First()`?
  answers:
    - text: Single wymaga dokładnie jednego elementu i rzuca wyjątek, gdy jest ich więcej
      correct: true
    - text: Single zwraca `null`, gdy sekwencja jest pusta, a przy wielu elementach zwraca pierwszy
      correct: false
    - text: Single działa tylko na tablicach
      correct: false
    - text: Single zwraca ostatni element sekwencji, a First pierwszy
      correct: false
  explanation: |
    Single sprawdza, że element jest jedyny - przy zero lub więcej niż jednym elemencie rzuca `InvalidOperationException`.
    Ostatni element zwraca Last, Single działa na każdym `IEnumerable`, a `null` przy pustej sekwencji zwraca `SingleOrDefault`.

- id: 96
  question: Który komponent .NET odpowiada za JIT, GC i obsługę wyjątków?
  answers:
    - text: CLR (Common Language Runtime)
      correct: true
    - text: NuGet
      correct: false
    - text: BCL (Base Class Library)
      correct: false
    - text: CLS (Common Language Specification)
      correct: false
  explanation: |
    CLR to środowisko uruchomieniowe, które kompiluje IL, zarządza pamięcią i wyjątkami.
    BCL to biblioteka klas, CLS to zestaw reguł zgodności między językami, a NuGet to menedżer pakietów.

- id: 97
  question: Czym jest assembly w .NET?
  answers:
    - text: Plikiem konfiguracyjnym aplikacji w formacie XML, opisującym zależności i wersje bibliotek
      correct: false
    - text: "Jednostką wdrożenia i wersjonowania: `.dll` lub `.exe` z IL i manifestem"
      correct: true
    - text: Folderem z wszystkimi plikami projektu
      correct: false
    - text: Kodem źródłowym w języku asemblera, generowanym przez kompilator przed etapem JIT
      correct: false
  explanation: |
    Assembly zawiera skompilowany kod IL, opis typów i manifest z wersją i zależnościami.
    Konfiguracja to pliki `.config` lub `.json`, kod asemblera to zupełnie inny poziom, a folder projektu to nie assembly.

- id: 98
  question: Czy GAC istnieje w .NET Core i .NET 5+?
  answers:
    - text: Tak, działa identycznie jak w .NET Framework
      correct: false
    - text: Tak, ale wymaga uruchomienia aplikacji jako administrator
      correct: false
    - text: Tak, ale tylko na Windows
      correct: false
    - text: Nie - zależności dostarcza się przez NuGet
      correct: true
  explanation: |
    GAC to mechanizm .NET Framework do współdzielonych, podpisanych assembly.
    W nowym .NET aplikacje są samodzielne lub korzystają ze współdzielonego frameworka, a biblioteki trafiają z NuGet - GAC nie jest używany na żadnej platformie.

- id: 99
  question: Do czego służy refleksja w .NET?
  answers:
    - text: Do automatycznej optymalizacji kodu przez kompilator na podstawie metadanych typów
      correct: false
    - text: Do odbijania (przekierowywania) żądań HTTP na inny serwer w ASP.NET Core
      correct: false
    - text: Do odczytu metadanych typów i dynamicznego wywoływania w runtime
      correct: true
    - text: Do głębokiego kopiowania obiektów w pamięci z zachowaniem wszystkich referencji
      correct: false
  explanation: |
    Refleksja (`System.Reflection`) pozwala sprawdzać właściwości, metody i atrybuty typu oraz korzystać z nich dynamicznie - używają jej serializatory, ORM-y i kontenery DI.
    Nie optymalizuje kodu (wręcz jest wolna), nie ma związku z przekierowaniem HTTP i nie jest mechanizmem kopiowania.

- id: 100
  question: Który serializator został usunięty z nowego .NET z powodu problemów z bezpieczeństwem?
  answers:
    - text: "`XmlSerializer`"
      correct: false
    - text: "`BinaryFormatter`"
      correct: true
    - text: "`DataContractSerializer`"
      correct: false
    - text: "`System.Text.Json`"
      correct: false
  explanation: |
    `BinaryFormatter` pozwalał na ataki przez deserializację niezaufanych danych, więc został oznaczony jako przestarzały, a od .NET 9 jego implementacja jest usunięta.
    `System.Text.Json`, `XmlSerializer` i `DataContractSerializer` są nadal wspierane.

- id: 101
  question: Czym różni się globalizacja od lokalizacji?
  answers:
    - text: Globalizacja to tłumaczenie tekstów na wiele języków, a lokalizacja to dostosowanie formatów dat i liczb do serwera
      correct: false
    - text: Globalizacja dotyczy ustawień kultury serwera, a lokalizacja ustawień kultury przeglądarki użytkownika
      correct: false
    - text: To synonimy
      correct: false
    - text: Globalizacja przygotowuje aplikację na wiele kultur, lokalizacja dostosowuje ją do jednej
      correct: true
  explanation: |
    Globalizacja obejmuje obsługę różnych formatów dat, liczb, walut i sortowania, a lokalizacja - konkretne tłumaczenia i zasoby (`.resx`) dla danego języka.
    Nie są synonimami i nie dzielą się na serwer i przeglądarkę.

- id: 102
  question: Jak w nowym .NET tworzy się odpowiednik usługi Windows?
  answers:
    - text: Klasę dziedziczącą po Controller z atrybutem `[Service]`
      correct: false
    - text: Aplikację konsolową uruchamianą przez Harmonogram zadań co minutę
      correct: false
    - text: Worker Service z `BackgroundService` i `UseWindowsService()`
      correct: true
    - text: Projekt Blazor WebAssembly
      correct: false
  explanation: |
    Szablon Worker Service z `BackgroundService` (lub `IHostedService`) i metodą `UseWindowsService()` pozwala uruchomić aplikację jako usługę Windows.
    Kontrolery służą do obsługi HTTP, harmonogram zadań to obejście, a Blazor WebAssembly działa w przeglądarce.

- id: 103
  question: Jak garbage collector w .NET ustala, które obiekty można usunąć?
  answers:
    - text: Śledzi obiekty osiągalne od korzeni (zmienne lokalne, pola statyczne) i usuwa nieosiągalne
      correct: true
    - text: Usuwa obiekty starsze niż określony czas
      correct: false
    - text: Liczy referencje do każdego obiektu i natychmiast usuwa te, których licznik spadnie do zera
      correct: false
    - text: Usuwa obiekty, które nie były używane przez ostatnią minutę, niezależnie od istniejących referencji
      correct: false
  explanation: |
    GC w .NET jest śledzący (tracing) - oznacza obiekty osiągalne z korzeni i zwalnia resztę, dzięki czemu radzi sobie z cyklami referencji.
    Zliczanie referencji stosuje np. CPython, a wiek czy czas od ostatniego użycia nie decydują o usunięciu.

- id: 104
  question: Do której generacji GC trafiają nowo utworzone obiekty?
  answers:
    - text: Do Large Object Heap, niezależnie od rozmiaru
      correct: false
    - text: Do generacji 0
      correct: true
    - text: Do generacji 1
      correct: false
    - text: Do generacji 2
      correct: false
  explanation: |
    Nowe obiekty trafiają do generacji 0, sprzątanej najczęściej i najtaniej; te, które przeżyją, awansują do 1 i 2.
    Do Large Object Heap trafiają tylko duże obiekty (od 85 000 bajtów).

- id: 105
  question: Czym różni się Dispose od Finalize?
  answers:
    - text: Oba wywołuje garbage collector, ale Dispose w generacji 0, a Finalize w generacji 2
      correct: false
    - text: Dispose woła programista deterministycznie, Finalize - GC w nieznanym czasie
      correct: true
    - text: Dispose natychmiast zwalnia pamięć zarządzaną obiektu, a Finalize zamyka otwarte pliki
      correct: false
    - text: Finalize wywołuje programista, a Dispose GC
      correct: false
  explanation: |
    Dispose (`IDisposable`) wywołuje się jawnie lub przez `using`, a finalizator to zabezpieczenie uruchamiane przez GC, gdy Dispose nie został wywołany.
    GC nie wywołuje Dispose, a pamięć zarządzaną zwalnia sam GC - Dispose służy do zasobów takich jak połączenia, pliki czy uchwyty.

- id: 106
  question: Dlaczego zwykle nie należy wywoływać `GC.Collect()` w kodzie produkcyjnym?
  answers:
    - text: Bo `GC.Collect()` zawsze kończy działanie aplikacji, jeśli wywoła się go poza wątkiem głównym
      correct: false
    - text: Bo `GC.Collect()` został usunięty w .NET 5 i zastąpiony automatycznym sprzątaniem
      correct: false
    - text: Bo `GC.Collect()` usuwa również obiekty, które są nadal używane przez inne wątki aplikacji
      correct: false
    - text: Bo GC lepiej wie, kiedy sprzątać, a wymuszanie psuje jego heurystyki
      correct: true
  explanation: |
    Wymuszone sprzątanie awansuje obiekty do starszych generacji i wstrzymuje wątki, więc często więcej szkodzi niż pomaga.
    GC nigdy nie usuwa osiągalnych obiektów, metoda nadal istnieje i nie kończy aplikacji.
    Wyjątkiem bywają testy lub benchmarki.

- id: 107
  question: Która cecha odróżnia proces od wątku?
  answers:
    - text: Proces może mieć tylko jeden wątek
      correct: false
    - text: Wątki jednego procesu zawsze działają na jednym rdzeniu procesora, a procesy na wielu
      correct: false
    - text: Wątek ma własną, izolowaną przestrzeń adresową, a procesy na tej samej maszynie dzielą pamięć
      correct: false
    - text: Proces ma własną, izolowaną przestrzeń adresową, a wątki jednego procesu dzielą pamięć
      correct: true
  explanation: |
    Procesy są od siebie odizolowane, a wątki wewnątrz procesu współdzielą pamięć, co ułatwia komunikację, ale wymaga synchronizacji.
    Proces może mieć wiele wątków, a wątki mogą działać równolegle na wielu rdzeniach.

- id: 108
  question: Jaki problem pojawia się, gdy kilka wątków bez synchronizacji modyfikuje te same dane?
  answers:
    - text: Memory leak - wyciek pamięci, bo GC nie widzi obiektów współdzielonych
      correct: false
    - text: Race condition - wynik zależy od nieprzewidywalnej kolejności wykonania
      correct: true
    - text: Boxing - konwersja typu wartościowego na `object`
      correct: false
    - text: Stack overflow - przepełnienie stosu, bo każdy wątek zapisuje dane na stosie innego
      correct: false
  explanation: |
    Operacje jak counter++ nie są atomowe, więc równoległe wątki mogą nadpisywać swoje wyniki.
    Przepełnienie stosu wynika z głębokiej rekurencji, wyciek pamięci z trzymania niepotrzebnych referencji, a boxing to konwersja typów - żadne nie wynika bezpośrednio z braku synchronizacji.

- id: 109
  question: Dlaczego asynchroniczność zwiększa przepustowość aplikacji ASP.NET Core?
  answers:
    - text: Bo podczas oczekiwania na I/O wątek wraca do puli i może obsłużyć inne żądania
      correct: true
    - text: Bo każde żądanie obsługiwane asynchronicznie dostaje dedykowany rdzeń procesora
      correct: false
    - text: Bo każdy kod `async` wykonuje się szybciej niż jego synchroniczny odpowiednik
      correct: false
    - text: Bo `async` wyłącza garbage collector na czas żądania
      correct: false
  explanation: |
    `await` na operacji I/O zwalnia wątek zamiast go blokować, więc ta sama pula wątków obsługuje więcej równoczesnych żądań.
    Async nie przydziela rdzeni, sam w sobie nie przyspiesza obliczeń (ma nawet niewielki narzut) i nie wpływa na GC.

- id: 110
  question: Jaka jest główna przewaga `Task` nad bezpośrednim użyciem Thread?
  answers:
    - text: "`Task` zwykle korzysta z puli wątków i wspiera wyniki, wyjątki, anulowanie oraz `async/await`"
      correct: true
    - text: "`Task` nie może zwracać wartości, przez co jest prostszy"
      correct: false
    - text: "`Task` działa tylko na jednym rdzeniu procesora, co eliminuje problemy z synchronizacją"
      correct: false
    - text: "`Task` zawsze tworzy nowy, dedykowany wątek systemowy, więc działa szybciej niż Thread"
      correct: false
  explanation: |
    `Task` to wysokopoziomowa abstrakcja operacji - reużywa wątki z `ThreadPool`, ma `Task<T>` z wynikiem, propaguje wyjątki i wspiera `CancellationToken`.
    Nie tworzy zawsze nowego wątku, nie ogranicza się do jednego rdzenia i jak najbardziej zwraca wartości.

- id: 111
  question: Dlaczego należy unikać `.Result` i `.Wait()` na Taskach w kodzie asynchronicznym?
  answers:
    - text: Bo blokują wątek i mogą spowodować deadlock
      correct: true
    - text: Bo nie istnieją w .NET 5 i nowszych
      correct: false
    - text: Bo w aplikacjach ASP.NET Core zawsze rzucają `NotSupportedException`
      correct: false
    - text: Bo uruchamiają zadanie po raz drugi, przez co operacja wykonuje się dwukrotnie
      correct: false
  explanation: |
    Blokujące czekanie na `Task` (sync-over-async) marnuje wątek i może się zakleszczyć, gdy kontynuacja potrzebuje zablokowanego kontekstu (np. UI lub stary ASP.NET).
    Metody istnieją i działają - problemem jest blokowanie, a nie wyjątek czy ponowne uruchomienie zadania.

- id: 112
  question: Kiedy dopuszczalne jest użycie `async void`?
  answers:
    - text: W testach jednostkowych
      correct: false
    - text: W metodach kontrolerów ASP.NET Core
      correct: false
    - text: W każdej metodzie, która nie zwraca wartości
      correct: false
    - text: Praktycznie tylko w handlerach zdarzeń
      correct: true
  explanation: |
    `async void` nie pozwala wywołującemu poczekać na zakończenie ani złapać wyjątku, więc stosuje się je tylko tam, gdzie sygnatura jest narzucona - w handlerach zdarzeń.
    Metody bez wyniku powinny zwracać `Task`, także w kontrolerach i testach (frameworki testowe obsługują `async Task`).

- id: 113
  question: Co odróżnia RDBMS od ogólnego DBMS?
  answers:
    - text: RDBMS trzyma dane w powiązanych tabelach, wspiera SQL, więzy i transakcje
      correct: true
    - text: RDBMS to odmiana DBMS działająca wyłącznie w chmurze, np. jako Azure SQL
      correct: false
    - text: RDBMS przechowuje dane wyłącznie w pamięci RAM, dzięki czemu jest szybszy od zwykłego DBMS
      correct: false
    - text: RDBMS nie obsługuje transakcji ani więzów integralności, w przeciwieństwie do zwykłego DBMS
      correct: false
  explanation: |
    Relacyjny system opiera się na modelu tabel, kluczy i relacji, z więzami integralności i transakcjami ACID.
    Nie jest ograniczony do pamięci RAM ani do chmury, a obsługa transakcji to właśnie jego mocna strona.

- id: 114
  question: Który constraint gwarantuje, że wartość w kolumnie istnieje w kluczu głównym innej tabeli?
  answers:
    - text: "`FOREIGN KEY`"
      correct: true
    - text: "`CHECK`"
      correct: false
    - text: "`DEFAULT`"
      correct: false
    - text: "`UNIQUE`"
      correct: false
  explanation: |
    Klucz obcy wymusza integralność referencyjną między tabelami.
    `UNIQUE` pilnuje unikalności w tej samej tabeli, `CHECK` sprawdza warunek na wartości, a `DEFAULT` ustawia wartość domyślną.

- id: 115
  question: Czym różni się klucz główny od klucza unikalnego w SQL Server?
  answers:
    - text: Klucz unikalny nie tworzy żadnego indeksu, więc wyszukiwanie po nim jest wolniejsze niż po kluczu głównym
      correct: false
    - text: Tabela ma jeden klucz główny bez `NULL`, a kluczy unikalnych może być wiele i dopuszczają jeden `NULL`
      correct: true
    - text: Tabela może mieć wiele kluczy głównych, ale tylko jeden klucz unikalny bez wartości `NULL`
      correct: false
    - text: Klucz główny dopuszcza `NULL`, a unikalny nie
      correct: false
  explanation: |
    `PRIMARY KEY` identyfikuje wiersz i nie dopuszcza `NULL`; `UNIQUE` może wystąpić wielokrotnie i w SQL Server pozwala na jeden `NULL`.
    Oba tworzą indeks (domyślnie PK klastrowany, `UNIQUE` nieklastrowany).
    Pozostałe odpowiedzi odwracają te reguły.

- id: 116
  question: Jakiego typu trigger wykonuje się zamiast operacji, która go wywołała?
  answers:
    - text: BEFORE
      correct: false
    - text: DDL
      correct: false
    - text: "`INSTEAD OF`"
      correct: true
    - text: "`AFTER`"
      correct: false
  explanation: |
    Trigger `INSTEAD OF` zastępuje oryginalną operację, np. przy modyfikacji danych przez widok.
    `AFTER` wykonuje się po operacji, triggerów BEFORE SQL Server w ogóle nie ma (są np. w Oracle i PostgreSQL), a DDL triggery reagują na zmiany schematu.

- id: 117
  question: Czy zwykły (nieindeksowany) widok przechowuje dane?
  answers:
    - text: Nie - jest zapisanym zapytaniem, a dane pochodzą z tabel bazowych przy każdym odczycie
      correct: true
    - text: Tak, ale tylko dla kolumn tekstowych
      correct: false
    - text: Tak - kopiuje dane z tabel bazowych przy utworzeniu i aktualizuje je przy każdym zapisie
      correct: false
    - text: Tak - przechowuje kopię danych, którą SQL Server Agent odświeża domyślnie co godzinę
      correct: false
  explanation: |
    Widok to wirtualna tabela zdefiniowana przez `SELECT` - przy zapytaniu SQL Server wkleja jego definicję do planu.
    Fizycznie dane przechowuje dopiero widok indeksowany, który jest aktualizowany na bieżąco, a nie okresowo.

- id: 118
  question: Gdzie można użyć funkcji agregującej, np. `COUNT(*) > 5`, aby filtrować wyniki?
  answers:
    - text: W klauzuli `HAVING`
      correct: true
    - text: W klauzuli `ON` złączenia
      correct: false
    - text: W klauzuli `WHERE`
      correct: false
    - text: W klauzuli `FROM`
      correct: false
  explanation: |
    `HAVING` filtruje grupy po `GROUP BY`, więc może używać agregatów.
    `WHERE` działa na pojedynczych wierszach przed grupowaniem i nie dopuszcza funkcji agregujących, a `FROM` i `ON` nie służą do filtrowania po agregatach.

- id: 119
  question: Czym jest podzapytanie skorelowane?
  answers:
    - text: Podzapytaniem odwołującym się do kolumn zapytania zewnętrznego, logicznie wykonywanym dla każdego wiersza
      correct: true
    - text: Podzapytaniem w klauzuli `FROM`
      correct: false
    - text: Podzapytaniem wykonywanym tylko raz, niezależnie od zapytania zewnętrznego, a wynik jest cache'owany
      correct: false
    - text: Podzapytaniem zwracającym zawsze pojedynczą wartość skalarną używaną w klauzuli `SELECT`
      correct: false
  explanation: |
    Skorelowane podzapytanie używa wartości z bieżącego wiersza zapytania zewnętrznego, np. `WHERE o.CustomerId = c.Id`.
    Podzapytanie wykonywane raz to nieskorelowane, a miejsce (`FROM`) czy liczba zwracanych wartości nie definiują korelacji.

- id: 120
  question: Jak ręcznie wstawić wartość do kolumny `IDENTITY` w SQL Server?
  answers:
    - text: Nie da się tego zrobić w żaden sposób w SQL Server
      correct: false
    - text: Włączyć `SET IDENTITY_INSERT nazwa_tabeli ON`
      correct: true
    - text: Usunąć kolumnę i dodać ją ponownie
      correct: false
    - text: Użyć `ALTER TABLE ... DISABLE IDENTITY`
      correct: false
  explanation: |
    `SET IDENTITY_INSERT ON` pozwala wstawić jawną wartość do kolumny `IDENTITY` (tylko dla jednej tabeli naraz w sesji).
    Usuwanie kolumny niszczy dane, a polecenie DISABLE `IDENTITY` nie istnieje.

- id: 121
  question: Który `JOIN` zwraca wszystkie wiersze z lewej tabeli i `NULL` tam, gdzie brak dopasowania w prawej?
  answers:
    - text: "`LEFT OUTER JOIN`"
      correct: true
    - text: "`CROSS JOIN`"
      correct: false
    - text: "`INNER JOIN`"
      correct: false
    - text: "`RIGHT OUTER JOIN`"
      correct: false
  explanation: |
    `LEFT JOIN` zachowuje wszystkie wiersze z lewej strony, uzupełniając kolumny prawej tabeli wartościami `NULL`.
    `INNER JOIN` zwraca tylko dopasowane wiersze, `CROSS JOIN` - iloczyn kartezjański, a `RIGHT JOIN` zachowuje wiersze prawej tabeli.

- id: 122
  question: Kiedy stosuje się self-join?
  answers:
    - text: Gdy tabela odwołuje się sama do siebie, np. pracownik i przełożony
      correct: true
    - text: Gdy chcemy złączyć tabele z dwóch różnych baz danych na tym samym serwerze
      correct: false
    - text: Gdy tabela nie ma klucza głównego i trzeba porównać wiersze między sobą
      correct: false
    - text: Gdy łączymy tabelę z jej kopią zapasową, aby porównać dane przed i po zmianie
      correct: false
  explanation: |
    Self-join łączy tabelę z nią samą przez dwa aliasy, typowo dla hierarchii z kolumną `ManagerId`.
    Nie dotyczy kopii zapasowych, łączenia baz ani braku klucza głównego.

- id: 123
  question: Jaki jest główny koszt dodawania indeksów?
  answers:
    - text: Wyłączenie transakcji na tabeli
      correct: false
    - text: Spowolnienie wszystkich zapytań `SELECT`, bo optymalizator musi sprawdzić każdy indeks
      correct: false
    - text: Spowolnienie operacji `INSERT`, `UPDATE` i `DELETE` oraz dodatkowe miejsce na dysku
      correct: true
    - text: Utrata możliwości tworzenia kluczy obcych na indeksowanych kolumnach tabeli
      correct: false
  explanation: |
    Każdy indeks trzeba aktualizować przy modyfikacjach danych i przechowywać, więc nadmiar indeksów spowalnia zapisy.
    Dobre indeksy przyspieszają odczyty, nie blokują kluczy obcych i nie wyłączają transakcji.

- id: 124
  question: Ile indeksów klastrowanych może mieć tabela?
  answers:
    - text: Dwa
      correct: false
    - text: Do 999
      correct: false
    - text: Jeden
      correct: true
    - text: Dowolną liczbę
      correct: false
  explanation: |
    Indeks klastrowany określa fizyczną kolejność danych, więc może być tylko jeden.
    999 to limit indeksów nieklastrowanych na tabelę.

- id: 125
  question: Czym jest key lookup przy indeksie nieklastrowanym?
  answers:
    - text: Odczytem metadanych indeksu z katalogu systemowego przed wykonaniem zapytania
      correct: false
    - text: Wyszukaniem wartości w kluczu obcym innej tabeli w celu sprawdzenia integralności
      correct: false
    - text: Dodatkowym odczytem z indeksu klastrowanego po brakujące kolumny
      correct: true
    - text: Sprawdzeniem unikalności klucza w indeksie przed wstawieniem każdego nowego wiersza
      correct: false
  explanation: |
    Gdy indeks nieklastrowany nie zawiera wszystkich potrzebnych kolumn, SQL Server dla każdego wiersza sięga do indeksu klastrowanego.
    Eliminuje się to kolumnami `INCLUDE` (indeks pokrywający).
    Pozostałe odpowiedzi opisują niezwiązane operacje.

- id: 126
  question: Który indeks zwykle tworzy SQL Server automatycznie przy definiowaniu `PRIMARY KEY`?
  answers:
    - text: Pełnotekstowy na wszystkich kolumnach klucza
      correct: false
    - text: Columnstore, jeśli tabela ma więcej niż milion wierszy
      correct: false
    - text: Klastrowany (jeśli tabela nie ma już innego)
      correct: true
    - text: Nieklastrowany filtrowany, obejmujący tylko wiersze bez `NULL`
      correct: false
  explanation: |
    Domyślnie klucz główny tworzy indeks klastrowany, chyba że tabela już ma klastrowany lub jawnie podano `NONCLUSTERED`.
    Indeksy filtrowane, columnstore i pełnotekstowe trzeba tworzyć ręcznie.

- id: 127
  question: Na której kolumnie warto założyć indeks dla zapytania `SELECT id, class FROM student WHERE name = 'happy'`?
  answers:
    - text: Na `class`, bo kolumny zwracane w `SELECT` powinny być pierwszymi kolumnami indeksu
      correct: false
    - text: Na id, bo to klucz główny
      correct: false
    - text: Na name, najlepiej z `INCLUDE` (`class`), aby indeks był pokrywający
      correct: true
    - text: Na wszystkich trzech kolumnach osobno, aby optymalizator mógł wybrać najlepszy
      correct: false
  explanation: |
    Indeks powinien wspierać warunek `WHERE`, czyli kolumnę name, a `INCLUDE` (`class`) eliminuje key lookup.
    Indeks na `class` nie pomoże w filtrowaniu, id i tak jest kluczem klastrowanym zawartym w indeksach nieklastrowanych, a osobne indeksy na wszystkich kolumnach to marnotrawstwo.

- id: 128
  question: Która różnica między funkcją a procedurą składowaną w SQL Server jest prawdziwa?
  answers:
    - text: W funkcji można wykonywać `INSERT` na tabelach trwałych, a w procedurze nie
      correct: false
    - text: Procedura musi zwracać wartość przez `RETURN`, a funkcja nie musi
      correct: false
    - text: Funkcję można użyć w `SELECT` lub `JOIN`, a procedurę wywołuje się przez `EXEC`
      correct: true
    - text: Procedura nie może mieć parametrów
      correct: false
  explanation: |
    Funkcje są wyrażeniami, więc da się ich użyć w zapytaniu; procedury są osobnymi poleceniami.
    To funkcja musi zwracać wartość, procedury mogą modyfikować dane (funkcje na tabelach trwałych - nie) i obie mogą mieć parametry.

- id: 129
  question: Który warunek w `WHERE` uniemożliwia użycie indeksu na kolumnie `OrderDate` (nie jest SARGable)?
  answers:
    - text: "`WHERE OrderDate = '2026-05-01'`"
      correct: false
    - text: "`WHERE YEAR(OrderDate) = 2026`"
      correct: true
    - text: "`WHERE OrderDate BETWEEN '2026-01-01' AND '2026-01-31'`"
      correct: false
    - text: "`WHERE OrderDate >= '2026-01-01' AND OrderDate < '2027-01-01'`"
      correct: false
  explanation: |
    Funkcja na kolumnie zmusza SQL Server do wyliczenia jej dla każdego wiersza, więc seek na indeksie nie jest możliwy.
    Warunki zakresowe i równości na "gołej" kolumnie pozwalają użyć seeka.

- id: 130
  question: Dlaczego kursorów w SQL Server należy unikać?
  answers:
    - text: Bo przetwarzają dane wiersz po wierszu zamiast zbiorowo
      correct: true
    - text: Bo działają tylko na tabelach tymczasowych i zmiennych tabelarycznych
      correct: false
    - text: Bo nie można ich używać w procedurach składowanych ani w transakcjach
      correct: false
    - text: Bo automatycznie blokują całą bazę danych na czas otwarcia kursora
      correct: false
  explanation: |
    SQL Server jest zoptymalizowany pod operacje na zbiorach, a kursor (RBAR) wykonuje logikę dla każdego wiersza osobno, zużywając zasoby i trzymając blokady.
    Kursory działają w procedurach i na zwykłych tabelach, a nie blokują całej bazy.

- id: 131
  question: Dlaczego zamiast `@@IDENTITY` zaleca się `SCOPE_IDENTITY()`?
  answers:
    - text: Bo `@@IDENTITY` może zwrócić wartość wygenerowaną przez trigger w innej tabeli
      correct: true
    - text: Bo `@@IDENTITY` działa tylko w SQL Server 2000
      correct: false
    - text: Bo `SCOPE_IDENTITY()` zwraca wszystkie wartości wygenerowane w transakcji naraz
      correct: false
    - text: Bo `@@IDENTITY` zwraca wartość wygenerowaną przez dowolną inną sesję
      correct: false
  explanation: |
    `@@IDENTITY` uwzględnia wszystkie zakresy bieżącej sesji, więc trigger wstawiający do tabeli z `IDENTITY` zmieni wynik.
    `SCOPE_IDENTITY()` ogranicza się do bieżącego zakresu (oba działają w obrębie sesji).
    `@@IDENTITY` nadal istnieje, a wiele wartości zwraca klauzula `OUTPUT`, nie `SCOPE_IDENTITY()`.

- id: 132
  question: Czym jest CTE?
  answers:
    - text: Widokiem przechowywanym na stałe w bazie i dostępnym dla wszystkich zapytań
      correct: false
    - text: Tabelą tymczasową zapisywaną fizycznie w tempdb i dostępną do końca sesji
      correct: false
    - text: Rodzajem indeksu przyspieszającego złączenia, tworzonego na czas jednego zapytania
      correct: false
    - text: Nazwanym, tymczasowym zestawem wyników z `WITH`, w jednym zapytaniu
      correct: true
  explanation: |
    CTE (Common Table Expression) poprawia czytelność i pozwala na rekurencję, ale żyje tylko w zakresie jednego zapytania i nie jest materializowane.
    Tabela tymczasowa i widok to trwalsze obiekty, a CTE nie jest indeksem.

- id: 133
  question: Które polecenie usuwa wszystkie wiersze tabeli, resetuje `IDENTITY` i nie uruchamia triggerów `DELETE`?
  answers:
    - text: "`DELETE FROM` bez `WHERE`"
      correct: false
    - text: "`DROP TABLE`"
      correct: false
    - text: "`TRUNCATE TABLE`"
      correct: true
    - text: "`ALTER TABLE ... CLEAR`"
      correct: false
  explanation: |
    `TRUNCATE` dealokuje strony danych, jest minimalnie logowany, resetuje `IDENTITY` i nie wywołuje triggerów.
    `DELETE` usuwa wiersze pojedynczo z logowaniem i triggerami, `DROP` usuwa całą tabelę, a `ALTER TABLE ... CLEAR` nie istnieje.

- id: 134
  question: Która funkcja okna najlepiej nadaje się do znalezienia N-tej najwyższej pensji przy duplikatach wartości?
  answers:
    - text: "`ROW_NUMBER`"
      correct: false
    - text: "`NTILE`"
      correct: false
    - text: "`LAG`"
      correct: false
    - text: "`DENSE_RANK`"
      correct: true
  explanation: |
    `DENSE_RANK` nadaje równym pensjom ten sam numer bez luk, więc N-ta pozycja to N-ta unikalna wartość.
    `ROW_NUMBER` numeruje duplikaty osobno, `NTILE` dzieli wiersze na grupy, a `LAG` zwraca wartość z poprzedniego wiersza.

- id: 135
  question: Co oznacza litera I w ACID?
  answers:
    - text: Indexing - każda tabela ma indeks
      correct: false
    - text: Isolation - równoległe transakcje nie widzą swoich niezatwierdzonych zmian
      correct: true
    - text: Integrity - dane w każdej chwili spełniają wszystkie więzy integralności
      correct: false
    - text: Idempotency - transakcję można bezpiecznie powtórzyć bez skutków ubocznych
      correct: false
  explanation: |
    ACID to Atomicity, Consistency, Isolation i Durability.
    Integralność wiąże się z literą C (Consistency), a indeksowanie i idempotentność nie należą do tego akronimu.

- id: 136
  question: Czym są tabele inserted i deleted w SQL Server?
  answers:
    - text: Tabelami archiwum, do których SQL Server trwale przenosi usunięte i zmienione wiersze
      correct: false
    - text: Tabelami tymczasowymi w tempdb, tworzonymi przy każdym `INSERT` i usuwanymi po `COMMIT`
      correct: false
    - text: Systemowymi tabelami logu transakcji, z których administrator odczytuje historię zmian
      correct: false
    - text: Wirtualnymi tabelami w triggerach i `OUTPUT` z nowymi i starymi wierszami
      correct: true
  explanation: |
    Te "magiczne tabele" istnieją tylko w kontekście triggera lub `OUTPUT` - inserted zawiera nowe wartości, deleted stare, a `UPDATE` wypełnia obie.
    Nie są logiem transakcji, archiwum ani trwałymi tabelami tymczasowymi.

- id: 137
  question: Która warstwa wzorca MVC odpowiada za obsługę żądania i wybór odpowiedzi?
  answers:
    - text: Controller
      correct: true
    - text: Model
      correct: false
    - text: View
      correct: false
    - text: Router
      correct: false
  explanation: |
    Kontroler przyjmuje żądanie, korzysta z modelu i zwraca wynik, np. widok.
    Model reprezentuje dane i logikę, View - prezentację, a routing jest mechanizmem frameworka, a nie warstwą MVC.

- id: 138
  question: Która cecha ASP.NET MVC jest przewagą nad Web Forms?
  answers:
    - text: Model zdarzeń podobny do aplikacji desktopowych, z obsługą kliknięć na serwerze
      correct: false
    - text: Brak konieczności rozumienia HTTP
      correct: false
    - text: Łatwe testowanie jednostkowe kontrolerów i pełna kontrola nad HTML
      correct: true
    - text: Automatyczne przechowywanie stanu kontrolek między żądaniami w `ViewState`
      correct: false
  explanation: |
    MVC rozdziela odpowiedzialności, nie generuje ciężkiego `ViewState` i pozwala testować kontrolery bez serwera.
    `ViewState` i model zdarzeń to cechy Web Forms, a abstrahowanie od HTTP jest raczej ich wadą niż zaletą MVC.

- id: 139
  question: Jaki typ zwraca akcja kontrolera, aby wyrenderować widok Razor?
  answers:
    - text: "`RedirectResult` (przez `return Redirect(url)`)"
      correct: false
    - text: "`JsonResult` (przez `return Json(model)`)"
      correct: false
    - text: "`ViewResult` (przez `return View()`)"
      correct: true
    - text: "`FileResult`"
      correct: false
  explanation: |
    `View()` tworzy `ViewResult`, który renderuje szablon widoku.
    `JsonResult` zwraca JSON, `RedirectResult` wykonuje przekierowanie, a `FileResult` zwraca plik.

- id: 140
  question: Który filtr MVC wykonuje się jako pierwszy w pipeline?
  answers:
    - text: Filtr wyników
      correct: false
    - text: Filtr autoryzacji
      correct: true
    - text: Filtr wyjątków
      correct: false
    - text: Filtr akcji
      correct: false
  explanation: |
    Filtry autoryzacji uruchamiają się przed wszystkimi innymi - jeśli odrzucą żądanie, akcja się nie wykona.
    Filtry akcji działają wokół akcji, filtry wyników wokół wykonania wyniku, a filtry wyjątków tylko przy nieobsłużonym wyjątku.

- id: 141
  question: Czym różni się uwierzytelnianie od autoryzacji?
  answers:
    - text: Uwierzytelnianie dotyczy tylko API, a autoryzacja tylko stron MVC
      correct: false
    - text: To synonimy
      correct: false
    - text: Uwierzytelnianie ustala, kim jest użytkownik, a autoryzacja - do czego ma dostęp
      correct: true
    - text: Uwierzytelnianie ustala uprawnienia użytkownika, a autoryzacja jego tożsamość
      correct: false
  explanation: |
    Najpierw system sprawdza tożsamość (login, token), a potem decyduje o dostępie do zasobów (role, polityki).
    Odwrócenie ról jest błędne, nie są to synonimy i oba pojęcia dotyczą każdego typu aplikacji.

- id: 142
  question: Który atrybut wyłącza wymóg autoryzacji dla akcji w kontrolerze oznaczonym `[Authorize]`?
  answers:
    - text: "`[IgnoreAuthorize]`"
      correct: false
    - text: "`[AllowAnonymous]`"
      correct: true
    - text: "`[Anonymous]`"
      correct: false
    - text: "`[NonAction]`"
      correct: false
  explanation: |
    `[AllowAnonymous]` pozwala na dostęp bez logowania, np. do akcji Login.
    `[NonAction]` wyłącza metodę jako akcję w ogóle, a `[Anonymous]` i `[IgnoreAuthorize]` nie istnieją.

- id: 143
  question: Która metoda uwierzytelniania jest typowa dla aplikacji intranetowych w domenie firmowej?
  answers:
    - text: Uwierzytelnianie przez SMS
      correct: false
    - text: Basic Authentication bez HTTPS
      correct: false
    - text: Uwierzytelnianie kluczem API
      correct: false
    - text: Windows Authentication
      correct: true
  explanation: |
    Windows Authentication korzysta z kont domenowych, więc użytkownik nie musi się osobno logować.
    Klucze API służą głównie integracjom systemów, Basic bez HTTPS jest niebezpieczne, a SMS to co najwyżej drugi składnik.

- id: 144
  question: Do czego służy output caching w MVC?
  answers:
    - text: Do buforowania wyników zapytań z bazy w Entity Framework między żądaniami
      correct: false
    - text: Do zapisywania logów aplikacji w pamięci przed wysłaniem ich do pliku
      correct: false
    - text: Do przechowywania odpowiedzi akcji, by jej nie wykonywać ponownie
      correct: true
    - text: Do cache'owania plików statycznych w przeglądarce przez nagłówek ETag
      correct: false
  explanation: |
    Output caching zapamiętuje cały wynik akcji (np. `[OutputCache(Duration = 60)]` lub middleware Output Caching w Core).
    Cache przeglądarki steruje się nagłówkami HTTP, EF nie ma takiego wbudowanego cache, a logowanie to inny mechanizm.

- id: 145
  question: Jak brzmi domyślna trasa w aplikacji ASP.NET MVC?
  answers:
    - text: "`api/{controller}/{id}`"
      correct: false
    - text: "`{action}/{controller}/{id?}`"
      correct: false
    - text: "`{area}/{page}/{handler}`"
      correct: false
    - text: "`{controller}/{action}/{id}`"
      correct: true
  explanation: |
    Domyślna trasa mapuje pierwszy segment na kontroler, drugi na akcję, a opcjonalny trzeci na id, z domyślnymi wartościami Home i Index.
    Trasa z api/ jest typowa dla Web API, page i handler występują w Razor Pages, a odwrócona kolejność nie jest domyślna.

- id: 146
  question: Jak w MVC 5 włącza się routing oparty na atrybutach?
  answers:
    - text: Wywołując `routes.MapMvcAttributeRoutes()` w konfiguracji tras
      correct: true
    - text: Ustawiając `attributeRouting="true"` w sekcji `system.web` pliku `web.config`
      correct: false
    - text: Dodając atrybut `[EnableRouting]` do każdego kontrolera korzystającego z tras
      correct: false
    - text: Routing atrybutowy działa tylko w ASP.NET Core
      correct: false
  explanation: |
    W MVC 5 routing atrybutowy aktywuje `MapMvcAttributeRoutes()` w `RouteConfig`.
    `[EnableRouting]` i ustawienie w `web.config` nie istnieją, a routing atrybutowy był dostępny już w MVC 5, nie tylko w Core.

- id: 147
  question: Który mechanizm przekazuje dane do następnego żądania, np. po przekierowaniu?
  answers:
    - text: "`ViewBag`"
      correct: false
    - text: Model widoku
      correct: false
    - text: "`ViewData`"
      correct: false
    - text: "`TempData`"
      correct: true
  explanation: |
    `TempData` przechowuje dane do momentu odczytu, typowo w kolejnym żądaniu - przydaje się we wzorcu Post/Redirect/Get.
    `ViewBag`, `ViewData` i model działają tylko w bieżącym żądaniu.

- id: 148
  question: Jaki jest zalecany sposób przekazywania danych z kontrolera do widoku w MVC?
  answers:
    - text: Ciasteczka ustawiane w kontrolerze
      correct: false
    - text: Silnie typowany model (`ViewModel`) przekazany przez `return View(model)`
      correct: true
    - text: "`ViewBag` dla wszystkich danych, bo jest dynamiczny i nie wymaga klas modeli"
      correct: false
    - text: Zmienne globalne w klasie statycznej, odczytywane bezpośrednio w widoku
      correct: false
  explanation: |
    Silnie typowany model daje IntelliSense i sprawdzanie typów w widoku.
    Zmienne globalne psują współbieżność, `ViewBag` jest dynamiczny i podatny na literówki, a ciasteczka służą do przechowywania danych po stronie klienta, nie do przekazania danych widokowi.

- id: 149
  question: Czym jest `partial` view?
  answers:
    - text: Widokiem bez modelu
      correct: false
    - text: Widokiem wyświetlanym tylko dla zalogowanych użytkowników z odpowiednią rolą
      correct: false
    - text: Fragmentem widoku wielokrotnego użytku, renderowanym wewnątrz innych widoków
      correct: true
    - text: Widokiem ładowanym asynchronicznie przez JavaScript po wyrenderowaniu strony
      correct: false
  explanation: |
    Partial view pozwala uniknąć duplikacji HTML, np. dla karty produktu używanej w wielu miejscach.
    Nie jest z definicji asynchroniczny, może mieć model i nie ma związku z uwierzytelnianiem.

- id: 150
  question: Do czego służą Areas w ASP.NET MVC?
  answers:
    - text: Do definiowania obszarów strony w layoucie, np. nagłówka, stopki i paska bocznego
      correct: false
    - text: Do podziału dużej aplikacji na moduły z własnymi kontrolerami, widokami i modelami
      correct: true
    - text: Do podziału bazy danych na schematy odpowiadające poszczególnym kontrolerom
      correct: false
    - text: Do przechowywania plików statycznych
      correct: false
  explanation: |
    Areas grupują funkcjonalności, np. Admin czy Shop, z własną strukturą folderów i trasą `{area}`.
    Obszary layoutu to sekcje (`RenderSection`), pliki statyczne trafiają do wwwroot lub Content, a schematy bazy to osobny mechanizm.

- id: 151
  question: Jak sprawdzić w akcji MVC, czy dane z formularza przeszły walidację Data Annotations?
  answers:
    - text: Przez wywołanie `Validate()` na każdym polu ręcznie
      correct: false
    - text: Przez `ModelState.IsValid`
      correct: true
    - text: Przez sprawdzenie, czy model nie jest `null`
      correct: false
    - text: Przez `Request.IsValid`
      correct: false
  explanation: |
    Model binding wypełnia `ModelState` błędami walidacji, a `IsValid` informuje, czy jest poprawny.
    `Request.IsValid` nie istnieje, ręczne wywoływanie walidacji pól nie jest potrzebne, a niepusty model wcale nie oznacza poprawnych danych.

- id: 152
  question: Co generuje scaffolding w MVC?
  answers:
    - text: Schemat bazy danych i migracje na podstawie istniejących widoków
      correct: false
    - text: Kod kontrolerów i widoków (np. CRUD) na podstawie modelu
      correct: true
    - text: Testy jednostkowe dla wszystkich kontrolerów i akcji w projekcie
      correct: false
    - text: Pliki konfiguracyjne serwera IIS
      correct: false
  explanation: |
    Scaffolding tworzy szkielet aplikacji: akcje Index, Details, Create, Edit, Delete wraz z widokami.
    Schemat bazy tworzą migracje, testy pisze się samodzielnie, a konfiguracja IIS nie jest generowana przez scaffolding.

- id: 153
  question: Jaki jest cel bundlingu plików CSS i JS?
  answers:
    - text: Przeniesienie skryptów na serwer bazy danych
      correct: false
    - text: Automatyczne przetłumaczenie plików TypeScript na kod C# po stronie serwera
      correct: false
    - text: Zaszyfrowanie kodu JavaScript, aby użytkownik nie mógł go odczytać w przeglądarce
      correct: false
    - text: Zmniejszenie liczby żądań HTTP przez połączenie wielu plików w jeden
      correct: true
  explanation: |
    Bundling łączy pliki, a minifikacja zmniejsza ich rozmiar - razem przyspieszają ładowanie strony.
    Nie szyfrują kodu (jest tylko trudniejszy do czytania), nie tłumaczą języków i nie mają związku z bazą danych.

- id: 154
  question: Co chroni aplikację MVC przed atakami CSRF?
  answers:
    - text: Zapytania parametryzowane do bazy wykonywane przez Entity Framework
      correct: false
    - text: Kodowanie wyjścia HTML w widokach przez automatyczne escapowanie Razor
      correct: false
    - text: Wymuszenie HTTPS
      correct: false
    - text: Tokeny antyforgery weryfikowane atrybutem `[ValidateAntiForgeryToken]`
      correct: true
  explanation: |
    Token antyforgery potwierdza, że formularz pochodzi z naszej aplikacji, a nie z obcej strony.
    Kodowanie wyjścia chroni przed XSS, zapytania parametryzowane przed SQL Injection, a HTTPS przed podsłuchem - żadne z nich nie blokuje CSRF.

- id: 155
  question: W którym zdarzeniu cyklu życia strony Web Forms kontrolki są w pełni załadowane?
  answers:
    - text: "`Page_Load`"
      correct: true
    - text: Init
      correct: false
    - text: Unload
      correct: false
    - text: "`PreInit`"
      correct: false
  explanation: |
    W Load kontrolki mają już odtworzony `ViewState` i wartości z postbacku.
    `PreInit` i Init są za wcześnie, a w Unload strona jest już wyrenderowana i sprzątana.

- id: 156
  question: Czym różni się `Server.Transfer` od `Response.Redirect`?
  answers:
    - text: "`Server.Transfer` działa na serwerze bez zmiany URL, Redirect wysyła 302"
      correct: true
    - text: "`Server.Transfer` zmienia adres URL w przeglądarce, a `Response.Redirect` działa wyłącznie na serwerze"
      correct: false
    - text: Oba wymagają dodatkowego żądania od przeglądarki
      correct: false
    - text: "`Response.Redirect` działa tylko w obrębie tej samej aplikacji, a `Server.Transfer` także na zewnętrzne adresy"
      correct: false
  explanation: |
    `Server.Transfer` działa wewnątrz serwera, więc przeglądarka nie wie o zmianie strony.
    `Response.Redirect` powoduje nowe żądanie i może przekierować nawet na zewnętrzny adres.
    Pozostałe odpowiedzi odwracają te cechy.

- id: 157
  question: Który rodzaj cache'owania zapamiętuje tylko fragment strony, np. kontrolkę użytkownika?
  answers:
    - text: Data caching
      correct: false
    - text: Cache przeglądarki
      correct: false
    - text: Output caching całej strony
      correct: false
    - text: Fragment caching
      correct: true
  explanation: |
    Fragment (partial page) caching cache'uje wybrany fragment, np. kontrolkę `.ascx` z dyrektywą `OutputCache`.
    Output caching całej strony obejmuje całość, data caching przechowuje obiekty danych, a cache przeglądarki działa po stronie klienta.

- id: 158
  question: Który mechanizm zarządzania stanem działa po stronie serwera?
  answers:
    - text: "`ViewState`"
      correct: false
    - text: Cookies
      correct: false
    - text: Query string
      correct: false
    - text: Session
      correct: true
  explanation: |
    Dane sesji są przechowywane na serwerze (w pamięci, State Server, SQL Server lub Redis), a klient ma tylko identyfikator.
    `ViewState`, ciasteczka i query `string` to mechanizmy po stronie klienta.

- id: 159
  question: Gdzie przechowywany jest `ViewState` strony Web Forms?
  answers:
    - text: W ukrytym polu formularza `__VIEWSTATE` po stronie klienta
      correct: true
    - text: W pliku `web.config`
      correct: false
    - text: W sesji użytkownika na serwerze, a klient dostaje tylko jej identyfikator
      correct: false
    - text: W bazie danych SQL Server skonfigurowanej w sekcji `sessionState`
      correct: false
  explanation: |
    `ViewState` jest serializowany, kodowany Base64 i przesyłany z każdą odpowiedzią i postbackiem w ukrytym polu.
    Nie trafia do sesji, bazy ani konfiguracji - dlatego duży `ViewState` zwiększa rozmiar strony.

- id: 160
  question: Który tryb przechowywania sesji ASP.NET ginie przy restarcie procesu aplikacji?
  answers:
    - text: "`StateServer`"
      correct: false
    - text: SQLServer
      correct: false
    - text: "`InProc`"
      correct: true
    - text: Custom z Redisem
      correct: false
  explanation: |
    `InProc` trzyma sesję w pamięci procesu w3wp, więc restart aplikacji lub puli ją kasuje.
    SQLServer i Redis przechowują dane trwale lub poza procesem, a `StateServer` w osobnej usłudze, która przetrwa restart aplikacji.

- id: 161
  question: Gdzie przechowywany jest identyfikator sesji w trybie cookieless?
  answers:
    - text: W adresie URL
      correct: true
    - text: W `localStorage` przeglądarki
      correct: false
    - text: W ukrytym polu formularza
      correct: false
    - text: W nagłówku Authorization
      correct: false
  explanation: |
    Sesja bez ciasteczek wkleja identyfikator do URL, np. `/(S(abc123))/Default.aspx`, co zwiększa ryzyko przejęcia sesji.
    Ukryte pola, `localStorage` i nagłówek Authorization nie są używane przez ten mechanizm.

- id: 162
  question: Jak wymusić walidację wszystkich kontrolek walidacji na stronie Web Forms po stronie serwera?
  answers:
    - text: Wywołać `Response.Validate()`
      correct: false
    - text: Ustawić `CausesValidation="false"` na wszystkich przyciskach formularza
      correct: false
    - text: Wyłączyć `ViewState` na stronie, aby walidatory odczytały świeże wartości
      correct: false
    - text: Wywołać `Page.Validate()`, a potem sprawdzić `Page.IsValid`
      correct: true
  explanation: |
    `Page.Validate()` uruchamia wszystkie walidatory (lub grupę), a `IsValid` informuje o wyniku.
    `CausesValidation="false"` wręcz wyłącza walidację, `Response.Validate()` nie istnieje, a `ViewState` nie ma związku z walidacją.

- id: 163
  question: Który komponent ADO.NET zapewnia szybki, jednokierunkowy odczyt danych tylko do przodu?
  answers:
    - text: "`DataSet`"
      correct: false
    - text: "`DataTable`"
      correct: false
    - text: "`DataReader`"
      correct: true
    - text: "`DataAdapter`"
      correct: false
  explanation: |
    `DataReader` (np. `SqlDataReader`) czyta wiersze strumieniowo przy otwartym połączeniu.
    `DataSet` i `DataTable` przechowują dane w pamięci w trybie rozłączonym, a `DataAdapter` je wypełnia i zapisuje zmiany.

- id: 164
  question: Czym charakteryzuje się architektura rozłączona w ADO.NET?
  answers:
    - text: Połączenie z bazą jest otwarte przez cały czas działania aplikacji, a dane odczytuje się na bieżąco
      correct: false
    - text: Dane są odczytywane strumieniowo przez `DataReader`, a połączenie zamyka się po każdym wierszu
      correct: false
    - text: Aplikacja w ogóle nie łączy się z bazą danych
      correct: false
    - text: Dane są pobierane do `DataSet`, połączenie jest zamykane, a zmiany zapisuje się później przez `DataAdapter`
      correct: true
  explanation: |
    Tryb rozłączony pracuje na kopii danych w pamięci, co pozwala edytować je bez utrzymywania połączenia.
    Stale otwarte połączenie i odczyt strumieniowy to cechy architektury połączonej, a połączenie z bazą jest potrzebne przy pobieraniu i zapisie.

- id: 165
  question: Która metoda `SqlCommand` zwraca liczbę zmienionych wierszy?
  answers:
    - text: "`ExecuteNonQuery`"
      correct: true
    - text: "`ExecuteXmlReader`"
      correct: false
    - text: "`ExecuteReader`"
      correct: false
    - text: "`ExecuteScalar`"
      correct: false
  explanation: |
    `ExecuteNonQuery` służy do `INSERT`, `UPDATE`, `DELETE` i DDL i zwraca liczbę zmienionych wierszy.
    `ExecuteScalar` zwraca pierwszą kolumnę pierwszego wiersza, `ExecuteReader` - `DataReader` z wynikami, a `ExecuteXmlReader` - `XmlReader`.

- id: 166
  question: Które uwierzytelnianie do SQL Server nie wymaga przechowywania hasła w connection stringu?
  answers:
    - text: Basic Authentication
      correct: false
    - text: SQL Server Authentication z loginem sa, bo konto administratora nie wymaga hasła
      correct: false
    - text: SQL Server Authentication z dowolnym loginem, jeśli serwer działa w trybie mieszanym
      correct: false
    - text: Windows Authentication (Integrated Security) lub managed identity w Azure
      correct: true
  explanation: |
    Uwierzytelnianie zintegrowane korzysta z tożsamości procesu (konta Windows lub managed identity), więc w konfiguracji nie ma hasła.
    SQL Server Authentication zawsze wymaga loginu i hasła, a Basic Authentication to mechanizm HTTP, nie SQL Server.

- id: 167
  question: Czym Dapper różni się od Entity Framework Core?
  answers:
    - text: Dapper generuje SQL z wyrażeń LINQ i ma wbudowane migracje, ale nie ma change trackera
      correct: false
    - text: Dapper to ORM przeznaczony wyłącznie dla baz NoSQL, takich jak MongoDB
      correct: false
    - text: Dapper to micro-ORM mapujący wyniki SQL na obiekty, bez change trackera
      correct: true
    - text: Dapper to nowa nazwa Entity Framework Core, nadana od wersji .NET 8
      correct: false
  explanation: |
    Dapper jest lekki i bardzo szybki, ale SQL piszesz samodzielnie i nie ma change trackera ani migracji.
    To EF Core tłumaczy LINQ na SQL i oferuje migracje, a Dapper działa na ADO.NET z bazami relacyjnymi i jest osobnym projektem.

- id: 168
  question: Co tłumaczy zapytania LINQ na SQL w Entity Framework?
  answers:
    - text: Przeglądarka użytkownika przez bibliotekę JavaScript EF
      correct: false
    - text: Moduł ASP.NET Core w serwerze IIS
      correct: false
    - text: Provider bazy danych, np. dla SQL Server
      correct: true
    - text: Kompilator C# (Roslyn) już w czasie budowania projektu
      correct: false
  explanation: |
    EF Core analizuje drzewo wyrażeń LINQ, a provider generuje SQL dla konkretnej bazy w czasie wykonania.
    IIS i przeglądarka nie biorą w tym udziału, a kompilator C# tworzy jedynie drzewo wyrażeń, nie SQL.

- id: 169
  question: Kiedy lepiej użyć ADO.NET (lub Dappera) zamiast Entity Framework?
  answers:
    - text: Gdy potrzebne jest automatyczne śledzenie zmian obiektów i zapis przez `SaveChanges`
      correct: false
    - text: Gdy aplikacja ma wiele encji z relacjami i potrzebne są migracje schematu
      correct: false
    - text: Gdy zespół chce pisać zapytania w LINQ
      correct: false
    - text: Gdy potrzebna jest pełna kontrola nad SQL i maksymalna wydajność kluczowych zapytań
      correct: true
  explanation: |
    ADO.NET daje bezpośrednią kontrolę nad zapytaniami i minimalny narzut.
    Migracje, LINQ i change tracking to właśnie mocne strony EF, więc wskazują na jego wybór.

- id: 170
  question: Jak zarejestrować `DbContext` w aplikacji ASP.NET Core?
  answers:
    - text: "`new AppDbContext()` w każdym kontrolerze"
      correct: false
    - text: "`app.UseDbContext<AppDbContext>(connectionString)` w pipeline middleware"
      correct: false
    - text: "`builder.Services.AddSingleton<AppDbContext>(new AppDbContext(connectionString))`"
      correct: false
    - text: "`builder.Services.AddDbContext<AppDbContext>(o => o.UseSqlServer(connectionString))`"
      correct: true
  explanation: |
    `AddDbContext` rejestruje kontekst jako scoped i konfiguruje providera bazy.
    Singleton `DbContext` jest błędem, bo kontekst nie jest bezpieczny wątkowo; `UseDbContext` nie istnieje, a ręczne tworzenie omija DI i konfigurację.

- id: 171
  question: Jaki czas życia ma domyślnie `DbContext` zarejestrowany przez `AddDbContext`?
  answers:
    - text: Scoped - jedna instancja na żądanie HTTP
      correct: true
    - text: Singleton - jedna instancja na aplikację
      correct: false
    - text: Thread-static - jedna instancja na wątek
      correct: false
    - text: Transient - nowa instancja przy każdym wstrzyknięciu
      correct: false
  explanation: |
    `DbContext` jest krótkożyjący i nie jest bezpieczny wątkowo, więc rejestruje się go per żądanie.
    Singleton prowadziłby do błędów współbieżności i rosnącego change trackera, a transient i thread-static nie są domyślne.

- id: 172
  question: Które podejście jest obecnie standardem przy pracy z EF Core?
  answers:
    - text: Database First z plikiem EDMX
      correct: false
    - text: Model First z designerem EDMX
      correct: false
    - text: Schema First z plikami XSD
      correct: false
    - text: Code First z migracjami
      correct: true
  explanation: |
    W EF Core definiuje się klasy encji, a migracje generują i aktualizują schemat bazy.
    Model First i EDMX dotyczą starego EF6; w EF Core istniejącą bazę obsługuje się scaffoldingiem do kodu, bez EDMX. Schema First z XSD nie jest podejściem EF.

- id: 173
  question: Która cecha odróżnia Entity Framework od LINQ to SQL?
  answers:
    - text: EF działa tylko z SQL Server, a LINQ to SQL z wieloma bazami
      correct: false
    - text: LINQ to SQL wspiera migracje schematu, a Entity Framework nie
      correct: false
    - text: LINQ to SQL jest nowszy i zastąpił Entity Framework w .NET Core
      correct: false
    - text: EF wspiera wiele baz, a LINQ to SQL tylko SQL Server
      correct: true
  explanation: |
    LINQ to SQL to porzucona technologia mapująca tabele SQL Server 1:1 na klasy.
    EF oferuje wiele providerów, złożone mapowania i migracje; pozostałe odpowiedzi odwracają te fakty.

- id: 174
  question: Co zwraca typowe ASP.NET Web API?
  answers:
    - text: Pliki `.aspx`
      correct: false
    - text: Skompilowane pliki `.dll` dla klienta
      correct: false
    - text: Strony HTML generowane przez Razor
      correct: false
    - text: Dane, zwykle w formacie JSON
      correct: true
  explanation: |
    Web API służy do budowy usług HTTP konsumowanych przez SPA, aplikacje mobilne i inne serwisy, więc zwraca dane.
    Widoki Razor to domena MVC, `.aspx` to Web Forms, a assembly nie wysyła się klientom przez API.

- id: 175
  question: Która metoda HTTP jest idempotentna?
  answers:
    - text: CONNECT
      correct: false
    - text: "`PATCH` (zawsze z definicji)"
      correct: false
    - text: "`PUT`"
      correct: true
    - text: "`POST`"
      correct: false
  explanation: |
    Wielokrotne wysłanie tego samego `PUT` zastępuje zasób tym samym stanem, więc efekt jest taki sam jak po jednym wywołaniu.
    `POST` z definicji nie jest idempotentny, `PATCH` nie musi być idempotentny (np. "zwiększ o 1"), a CONNECT służy do tunelowania.

- id: 176
  question: Czym różni się REST od Web API?
  answers:
    - text: To synonimy
      correct: false
    - text: Web API to standard ISO opisujący usługi sieciowe, a REST to framework Microsoftu do ich budowy
      correct: false
    - text: REST to styl architektury, a Web API to dowolne API sieciowe, niekoniecznie RESTowe
      correct: true
    - text: REST wymaga protokołu SOAP i XML, a Web API zawsze używa JSON przez HTTP
      correct: false
  explanation: |
    Nie każde Web API jest RESTowe - REST to zbiór ograniczeń (bezstanowość, zasoby, jednolity interfejs).
    REST nie wymaga SOAP, a Web API nie jest standardem ISO (ASP.NET Web API to konkretny framework Microsoftu).

- id: 177
  question: Które z poniższych NIE jest ograniczeniem stylu REST?
  answers:
    - text: Bezstanowość komunikacji
      correct: false
    - text: Jednolity interfejs
      correct: false
    - text: Cache'owalność odpowiedzi
      correct: false
    - text: Wymóg używania formatu XML
      correct: true
  explanation: |
    REST nie narzuca formatu danych - reprezentacją może być JSON, XML czy cokolwiek innego.
    Bezstanowość, jednolity interfejs i cache'owalność należą do klasycznych ograniczeń REST.

- id: 178
  question: Jak poprawnie używać `HttpClient` w aplikacji ASP.NET Core?
  answers:
    - text: Używając `WebClient` zamiast `HttpClient`
      correct: false
    - text: Tworząc jeden statyczny `HttpClient` i nigdy nie przejmując się zmianami DNS
      correct: false
    - text: Przez `IHttpClientFactory` (`AddHttpClient`), najlepiej jako typed client
      correct: true
    - text: Tworząc `new HttpClient()` w bloku `using` przy każdym wysyłanym żądaniu
      correct: false
  explanation: |
    `IHttpClientFactory` zarządza pulą handlerów, rozwiązując problem wyczerpania socketów i nieaktualnego DNS.
    Nowy `HttpClient` przy każdym żądaniu może wyczerpać sockety, statyczny klient ignoruje zmiany DNS (o ile nie skonfigurowano `PooledConnectionLifetime`), a `WebClient` jest przestarzały.

- id: 179
  question: Co daje atrybut `[ApiController]` w ASP.NET Core?
  answers:
    - text: Automatyczną walidację modelu z 400 i wiązanie parametrów z body
      correct: true
    - text: Automatyczne generowanie widoków Razor dla każdej akcji zwracającej model
      correct: false
    - text: Automatyczne uwierzytelnianie wszystkich żądań tokenem JWT bez dodatkowej konfiguracji
      correct: false
    - text: Wyłączenie routingu atrybutowego na rzecz tras konwencjonalnych
      correct: false
  explanation: |
    `[ApiController]` włącza zachowania typowe dla API: zwraca `ProblemDetails` przy błędnym `ModelState` i wiąże parametry złożone z body.
    Nie generuje widoków, wręcz wymaga routingu atrybutowego i nie dodaje uwierzytelniania.

- id: 180
  question: Dlaczego Basic Authentication wymaga HTTPS?
  answers:
    - text: Bo Basic Authentication nie działa po HTTP technicznie
      correct: false
    - text: Bo przeglądarki odrzucają nagłówek Authorization w żądaniach przez HTTP
      correct: false
    - text: Bo login i hasło są tylko zakodowane Base64, a nie zaszyfrowane
      correct: true
    - text: Bo HTTPS kompresuje nagłówki, a Base64 jest za długi dla HTTP
      correct: false
  explanation: |
    Base64 łatwo odkodować, więc bez TLS dane uwierzytelniające są widoczne dla każdego, kto podsłuchuje ruch.
    Basic technicznie działa po HTTP, a kompresja i blokowanie nagłówków przez przeglądarki nie są powodem.

- id: 181
  question: Co zwykle identyfikuje klucz API?
  answers:
    - text: Wersję API
      correct: false
    - text: Konkretnego użytkownika końcowego wraz z jego rolami i uprawnieniami
      correct: false
    - text: Aplikację lub klienta integracji, a nie konkretnego użytkownika
      correct: true
    - text: Bieżącą sesję użytkownika w przeglądarce
      correct: false
  explanation: |
    Klucz API to stały sekret przypisany do systemu klienckiego, przydatny do integracji i limitowania ruchu.
    Do identyfikacji użytkownika służą tokeny (np. JWT z OpenID Connect), sesja to inny mechanizm, a wersję API określa się w URL lub nagłówku.

- id: 182
  question: Dlaczego uwierzytelnianie tokenowe dobrze się skaluje?
  answers:
    - text: Bo token jest przechowywany w pamięci serwera, więc nie trzeba odpytywać bazy
      correct: false
    - text: Bo tokeny nigdy nie wygasają
      correct: false
    - text: Bo token jest wysyłany tylko przy pierwszym żądaniu, a kolejne korzystają z sesji
      correct: false
    - text: Bo serwer weryfikuje token bez przechowywania sesji, więc API pozostaje bezstanowe
      correct: true
  explanation: |
    Każda instancja API może zweryfikować podpisany token samodzielnie, bez współdzielonego magazynu sesji.
    Token nie jest trzymany na serwerze, wysyła się go z każdym żądaniem, a tokeny mają czas ważności (odnawiany refresh tokenem).

- id: 183
  question: Z jakich części składa się token JWT?
  answers:
    - text: Nagłówek HTTP, Ciało, Stopka
      correct: false
    - text: Klucz publiczny, Klucz prywatny, Certyfikat
      correct: false
    - text: Header, Payload, Signature
      correct: true
    - text: Login, Hasło, Sól
      correct: false
  explanation: |
    JWT to trzy części kodowane Base64Url i rozdzielone kropkami: nagłówek z algorytmem, payload z claims i podpis.
    JWT nie zawiera hasła ani kluczy, a "stopka" nie istnieje w tej strukturze.

- id: 184
  question: Czy payload tokenu JWT jest zaszyfrowany?
  answers:
    - text: Tak - jest szyfrowany kluczem publicznym klienta, więc tylko on może go odczytać
      correct: false
    - text: Tak, ale tylko gdy w nagłówku tokenu wskazano algorytm HS256
      correct: false
    - text: Nie - jest tylko zakodowany Base64Url; podpis chroni przed zmianą
      correct: true
    - text: Tak - jest zawsze szyfrowany algorytmem AES kluczem serwera
      correct: false
  explanation: |
    Standardowy JWT (JWS) jest podpisany, nie zaszyfrowany, więc nie umieszcza się w nim sekretów.
    Szyfrowanie zapewnia osobny format JWE, a HS256 to algorytm podpisu (HMAC), a nie szyfrowania.

- id: 185
  question: Gdzie standardowo przesyła się token JWT w żądaniu do API?
  answers:
    - text: W ścieżce URL
      correct: false
    - text: W treści (body) każdego żądania, także `GET`
      correct: false
    - text: W nagłówku Content-Type jako parametr `token=`
      correct: false
    - text: "W nagłówku Authorization: Bearer `<token>`"
      correct: true
  explanation: |
    Schemat Bearer w nagłówku Authorization to standard OAuth 2.0.
    `GET` nie powinien mieć treści, Content-Type określa format danych, a token w URL trafia do logów i historii.

- id: 186
  question: Które narzędzie w ASP.NET Core służy do testów integracyjnych API w pamięci?
  answers:
    - text: k6
      correct: false
    - text: Swagger UI
      correct: false
    - text: "`WebApplicationFactory`"
      correct: true
    - text: Postman
      correct: false
  explanation: |
    `WebApplicationFactory` uruchamia aplikację w `TestServer`, więc testy wysyłają prawdziwe żądania HTTP bez stawiania serwera.
    Postman i Swagger UI służą do testów ręcznych, a k6 do testów obciążeniowych.

- id: 187
  question: Jaki kod statusu zwraca akcja Web API z typem zwracanym `void`?
  answers:
    - text: 200 OK
      correct: false
    - text: 201 Created
      correct: false
    - text: 204 No Content
      correct: true
    - text: 404 Not Found
      correct: false
  explanation: |
    Brak treści odpowiedzi oznacza 204.
    200 zwraca się z treścią, 201 przy utworzeniu zasobu, a 404 gdy zasób nie istnieje.

- id: 188
  question: Czym `IHttpActionResult` różni się od `HttpResponseMessage` w Web API 2?
  answers:
    - text: "`IHttpActionResult` upraszcza kod i testy helperami jak `Ok()` i `NotFound()`"
      correct: true
    - text: "`IHttpActionResult` jest dostępny tylko w ASP.NET Core, a nie w Web API 2"
      correct: false
    - text: "`HttpResponseMessage` nie pozwala ustawić kodu statusu, więc zawsze zwraca 200 OK"
      correct: false
    - text: "`IHttpActionResult` jest szybszy, bo pomija serializację i wysyła obiekty binarnie"
      correct: false
  explanation: |
    `IHttpActionResult` tworzy `HttpResponseMessage` asynchronicznie, ale ukrywa szczegóły, przez co kod jest czytelniejszy.
    Nie pomija serializacji, `HttpResponseMessage` pozwala ustawić wszystko, a `IHttpActionResult` należy do Web API 2 na .NET Framework.

- id: 189
  question: Którego typu zwracanego używa się w kontrolerach ASP.NET Core zamiast `IHttpActionResult`?
  answers:
    - text: "`IActionResult` lub `ActionResult<T>`"
      correct: true
    - text: "`Task<string>`"
      correct: false
    - text: "`HttpResponseMessage`"
      correct: false
    - text: "`IHttpResult` z przestrzeni `System.Web`"
      correct: false
  explanation: |
    W ASP.NET Core MVC i API są zunifikowane, a akcje zwracają `IActionResult` lub `ActionResult<T>`.
    `HttpResponseMessage` jest możliwy, ale nie jest idiomatyczny, `IHttpResult` z `System.Web` nie istnieje, a `Task<string>` traci kontrolę nad kodem statusu.

- id: 190
  question: Na podstawie którego nagłówka działa content negotiation?
  answers:
    - text: Host
      correct: false
    - text: Content-Length
      correct: false
    - text: Accept
      correct: true
    - text: Cache-Control
      correct: false
  explanation: |
    Klient w nagłówku Accept wskazuje preferowany format (np. application/json), a serwer dobiera formatter.
    Content-Length to rozmiar treści, Host - nazwa serwera, a Cache-Control steruje cache'owaniem.

- id: 191
  question: Jaką rolę pełniła klasa `MediaTypeFormatter` w Web API 2?
  answers:
    - text: Kompresowała odpowiedzi GZip
      correct: false
    - text: Serializowała i deserializowała treść dla określonych typów MIME
      correct: true
    - text: Zarządzała uwierzytelnianiem użytkowników na podstawie typu treści żądania
      correct: false
    - text: Formatowała daty i liczby w odpowiedziach zgodnie z kulturą klienta
      correct: false
  explanation: |
    Formattery (JSON, XML, form-urlencoded) zamieniały obiekty na treść HTTP i odwrotnie.
    Formatowanie dat to szczegół serializatora, uwierzytelnianiem zajmują się handlery i filtry, a kompresją - middleware lub serwer.

- id: 192
  question: Który kod statusu oznacza, że klient jest uwierzytelniony, ale nie ma uprawnień do zasobu?
  answers:
    - text: 404 Not Found
      correct: false
    - text: 400 Bad Request
      correct: false
    - text: 403 Forbidden
      correct: true
    - text: 401 Unauthorized
      correct: false
  explanation: |
    403 oznacza brak uprawnień przy znanej tożsamości.
    401 mimo nazwy oznacza brak lub nieprawidłowe uwierzytelnienie, 400 - błędne żądanie, a 404 - brak zasobu.

- id: 193
  question: Która cecha opisuje .NET (dawniej .NET Core)?
  answers:
    - text: Wymaga zainstalowanego IIS
      correct: false
    - text: Działa wyłącznie na Windows
      correct: false
    - text: Jest zamkniętym oprogramowaniem dostępnym tylko w Visual Studio
      correct: false
    - text: Jest wieloplatformowy i open source
      correct: true
  explanation: |
    .NET Core powstał jako wieloplatformowy i otwarty następca .NET Framework, a od wersji 5 nazywa się po prostu .NET.
    Nie jest ograniczony do Windows, nie wymaga IIS (ma Kestrel) i jest open source.

- id: 194
  question: Do czego dziś głównie używa się .NET Standard?
  answers:
    - text: Do pisania aplikacji mobilnych w Swift
      correct: false
    - text: Do budowania aplikacji webowych jako lżejsza alternatywa dla ASP.NET Core
      correct: false
    - text: Jako nowszej, ustandaryzowanej wersji .NET 8 z dłuższym wsparciem
      correct: false
    - text: Do bibliotek dla .NET Framework i nowego .NET jednocześnie
      correct: true
  explanation: |
    .NET Standard to specyfikacja API wspólnego dla implementacji .NET - biblioteka celująca w `netstandard2.0` działa na obu światach.
    Nie jest frameworkiem webowym, nowszą wersją .NET ani narzędziem dla Swifta.

- id: 195
  question: Która cecha jest przewagą .NET nad .NET Framework?
  answers:
    - text: Wbudowany GAC
      correct: false
    - text: Obsługa Web Forms
      correct: false
    - text: Wieloplatformowość i wdrożenia w kontenerach Linux
      correct: true
    - text: Obsługa WCF jako serwera bez dodatkowych bibliotek
      correct: false
  explanation: |
    Nowy .NET działa na Linuxie i w kontenerach, jest szybszy i rozwijany aktywnie.
    Web Forms, serwer WCF i GAC to właśnie technologie .NET Framework, których nowy .NET nie wspiera (serwer WCF jest dostępny tylko przez CoreWCF).

- id: 196
  question: Co zawiera `Program.cs` w aplikacji ASP.NET Core od .NET 6?
  answers:
    - text: Rejestrację serwisów, pipeline middleware i start aplikacji
      correct: true
    - text: Wyłącznie definicje modeli bazy danych i konfigurację Entity Framework
      correct: false
    - text: Konfigurację serwera IIS zapisaną w formacie XML, tak jak `web.config`
      correct: false
    - text: Tylko kod widoków Razor i layoutów aplikacji
      correct: false
  explanation: |
    W modelu minimal hosting `Program.cs` tworzy `WebApplicationBuilder`, rejestruje serwisy, buduje aplikację, konfiguruje middleware i endpointy, a na końcu wywołuje `Run()`.
    Modele, konfiguracja IIS i widoki znajdują się gdzie indziej.

- id: 197
  question: Co robiła metoda `ConfigureServices` w klasie Startup?
  answers:
    - text: Tworzyła migracje bazy danych przy starcie aplikacji
      correct: false
    - text: Uruchamiała serwer Kestrel
      correct: false
    - text: Konfigurowała kolejność middleware w pipeline żądań
      correct: false
    - text: Rejestrowała serwisy w kontenerze dependency injection
      correct: true
  explanation: |
    `ConfigureServices(IServiceCollection services)` służyła do rejestracji MVC, `DbContext`, uwierzytelniania i własnych serwisów.
    Kolejność middleware ustalała metoda Configure, Kestrel uruchamiał host, a migracje tworzy narzędzie `dotnet ef`.

- id: 198
  question: Dlaczego kolejność middleware w metodzie Configure (lub w `Program.cs`) ma znaczenie?
  answers:
    - text: Bo middleware zarejestrowane później ma wyższy priorytet i nadpisuje wcześniejsze
      correct: false
    - text: Bo middleware obsługują żądanie w kolejności rejestracji
      correct: true
    - text: Bo kolejność wpływa tylko na szybkość startu aplikacji
      correct: false
    - text: Nie ma znaczenia - ASP.NET Core sortuje middleware automatycznie
      correct: false
  explanation: |
    Np. `UseAuthentication` musi być przed `UseAuthorization`, a obsługa wyjątków na początku, żeby złapać błędy z dalszych etapów.
    Middleware się nie nadpisują, kolejność nie dotyczy tylko startu i nie jest automatycznie sortowana.

- id: 199
  question: Co tworzy Kestrel na początku obsługi żądania?
  answers:
    - text: Nowy wątek systemowy dedykowany każdemu żądaniu aż do wysłania odpowiedzi
      correct: false
    - text: Nową instancję `DbContext` dla każdego połączenia TCP
      correct: false
    - text: Plik logu dla żądania
      correct: false
    - text: Obiekt `HttpContext` przekazywany przez pipeline middleware
      correct: true
  explanation: |
    `HttpContext` zawiera Request, Response, User i Items i przechodzi przez wszystkie middleware.
    `DbContext` tworzy kontener DI na żądanie zależności, żądania obsługuje pula wątków, a logowanie zależy od konfiguracji.

- id: 200
  question: Dlaczego po .NET Core 3.1 wydano .NET 5, pomijając numer 4?
  answers:
    - text: Bo wersja 4 zawierała krytyczny błąd bezpieczeństwa
      correct: false
    - text: Aby uniknąć pomyłek z .NET Framework `4.x`
      correct: true
    - text: Bo .NET 4 został wydany tylko dla Windows Phone
      correct: false
    - text: Bo numer 4 był zarezerwowany dla Mono
      correct: false
  explanation: |
    .NET 5 kontynuował linię .NET Core i usunął "Core" z nazwy, a numer 4 pominięto, by nie mylić go z .NET Framework 4.8.
    Pozostałe odpowiedzi to zmyślone powody.

- id: 201
  question: Jak w ASP.NET Core 3.0+ referencjonuje się framework ASP.NET Core?
  answers:
    - text: Przez instalację w GAC
      correct: false
    - text: Przez metapakiet NuGet `Microsoft.AspNetCore.All` dodawany do każdego projektu
      correct: false
    - text: Przez ręczne kopiowanie plików `.dll` frameworka do katalogu bin aplikacji
      correct: false
    - text: Jako shared framework `Microsoft.AspNetCore.App`
      correct: true
  explanation: |
    Od 3.0 ASP.NET Core jest współdzielonym frameworkiem, a SDK Web dodaje do niego referencję automatycznie.
    Metapakiet `Microsoft.AspNetCore.All` był używany w 2.0, ręczne kopiowanie dll nie jest metodą, a GAC nie istnieje w nowym .NET.

- id: 202
  question: Na czym polega Dependency Injection?
  answers:
    - text: Zależności są pobierane z globalnych zmiennych statycznych
      correct: false
    - text: Obiekt otrzymuje zależności z zewnątrz zamiast tworzyć je sam
      correct: true
    - text: Obiekt tworzy wszystkie swoje zależności w konstruktorze przez `new`
      correct: false
    - text: Kod jest wstrzykiwany do aplikacji w czasie wykonania przez refleksję
      correct: false
  explanation: |
    DI odwraca odpowiedzialność za tworzenie zależności - dostarcza je kontener, zwykle przez konstruktor.
    Tworzenie przez `new` i globalne zmienne to właśnie silne powiązania, których DI unika, a wstrzykiwanie kodu przez refleksję to coś zupełnie innego.

- id: 203
  question: Jak zarejestrować implementację `SmtpEmailSender` dla interfejsu `IEmailSender` z czasem życia per żądanie?
  answers:
    - text: "`services.Register(typeof(SmtpEmailSender))`"
      correct: false
    - text: "`builder.Services.AddScoped<IEmailSender, SmtpEmailSender>()`"
      correct: true
    - text: "`app.UseScoped<IEmailSender>()`"
      correct: false
    - text: "`builder.Services.AddScoped<SmtpEmailSender, IEmailSender>()`"
      correct: false
  explanation: |
    Pierwszy parametr generyczny to typ usługi (interfejs), drugi - implementacja.
    Odwrócona kolejność się nie skompiluje, `UseScoped` nie istnieje, a wbudowany kontener nie ma metody Register.

- id: 204
  question: Jak wstrzyknąć serwis do widoku Razor w ASP.NET Core?
  answers:
    - text: Przez kolekcję `ViewBag.Services` dostępną w każdym widoku
      correct: false
    - text: Nie da się wstrzykiwać serwisów do widoków
      correct: false
    - text: Dyrektywą `@inject`, np. `@inject IConfiguration` Config
      correct: true
    - text: Atrybutem `[FromServices]` umieszczonym nad dyrektywą `@model` widoku
      correct: false
  explanation: |
    `@inject` udostępnia serwis z kontenera jako właściwość widoku.
    `[FromServices]` działa na parametrach akcji, `ViewBag` nie zawiera serwisów, a wstrzykiwanie do widoków jest jak najbardziej możliwe.

- id: 205
  question: Na czym polega problem captive dependency?
  answers:
    - text: Serwis o krótszym czasie życia (scoped) zostaje wstrzyknięty do singletona i żyje za długo
      correct: true
    - text: Kontener DI nie może utworzyć serwisu, którego konstruktor przyjmuje inny serwis scoped
      correct: false
    - text: Serwis transient nie może być wstrzyknięty do kontrolera
      correct: false
    - text: Serwis singleton jest tworzony od nowa przy każdym żądaniu, bo trzyma referencję do scoped
      correct: false
  explanation: |
    Singleton trzyma referencję do serwisu scoped (np. `DbContext`) przez cały czas działania aplikacji, co prowadzi do błędów współbieżności i nieaktualnego stanu.
    Walidacja zakresów w środowisku Development wykrywa ten błąd przy starcie.
    Pozostałe odpowiedzi opisują nieprawdziwe lub niezwiązane zachowania.

- id: 206
  question: Który czas życia zastosować dla bezstanowego, bezpiecznego wątkowo serwisu cache używanego w całej aplikacji?
  answers:
    - text: Scoped
      correct: false
    - text: Singleton
      correct: true
    - text: Per-thread
      correct: false
    - text: Transient
      correct: false
  explanation: |
    Jedna instancja na aplikację sprawdza się dla współdzielonych, bezpiecznych wątkowo serwisów, np. cache czy konfiguracji.
    Scoped tworzy instancję per żądanie, transient przy każdym pobraniu, a czasu życia per-thread wbudowany kontener nie oferuje.

- id: 207
  question: Jaką sygnaturę ma typowa metoda własnego middleware w ASP.NET Core?
  answers:
    - text: "`public void Configure(IApplicationBuilder app)` w klasie dziedziczącej po Middleware"
      correct: false
    - text: "`public IActionResult Execute(HttpRequest request)`, wywoływana dla każdego żądania"
      correct: false
    - text: "`async Task InvokeAsync(HttpContext)`, z next w konstruktorze"
      correct: true
    - text: "`public void ProcessRequest(HttpContext context)` z interfejsu `IHttpHandler`"
      correct: false
  explanation: |
    Middleware oparte na konwencji przyjmuje następny element pipeline'u w konstruktorze i obsługuje żądanie w `InvokeAsync`, wywołując `await next(context)`.
    Configure konfiguruje pipeline, `IActionResult` zwracają akcje kontrolerów, a `IHttpHandler` to mechanizm starego `System.Web`.

- id: 208
  question: Czym middleware ASP.NET Core różni się od `HttpModule` z `System.Web`?
  answers:
    - text: "`HttpModule` jest nowszym mechanizmem, który w ASP.NET Core zastąpił middleware"
      correct: false
    - text: Nie ma między nimi różnic
      correct: false
    - text: Middleware to jawny, liniowy łańcuch rejestrowany w kodzie i niezależny od IIS
      correct: true
    - text: Middleware działa tylko w IIS, a `HttpModule` na każdym serwerze, także na Kestrelu
      correct: false
  explanation: |
    Kolejność middleware wynika wprost z kolejności rejestracji, a pipeline działa na Kestrelu, w kontenerze czy za dowolnym proxy.
    `HttpModule` był związany z IIS i zdarzeniami cyklu życia żądania i to on jest starszy.

- id: 209
  question: Czym jest `RequestDelegate`?
  answers:
    - text: Interfejsem bazowym wszystkich kontrolerów i stron Razor w ASP.NET Core
      correct: false
    - text: Delegatem `Task` (`HttpContext`) obsługującym żądanie w pipeline
      correct: true
    - text: Atrybutem oznaczającym asynchroniczne akcje kontrolerów
      correct: false
    - text: Klasą do wysyłania żądań HTTP do innych serwisów, używaną zamiast `HttpClient`
      correct: false
  explanation: |
    Każdy middleware dostaje `RequestDelegate` wskazujący na następny element, a pipeline to złożenie tych delegatów.
    Kontrolery dziedziczą po `ControllerBase`, żądania wychodzące wysyła `HttpClient`, a `RequestDelegate` nie jest atrybutem.

- id: 210
  question: Czym różni się `app.Run()` od `app.Use()`?
  answers:
    - text: Run zawsze uruchamia całą aplikację, a Use rejestruje serwis w kontenerze dependency injection
      correct: false
    - text: Use dodaje middleware końcowy, który nie wywołuje następnego, a Run rozgałęzia pipeline po ścieżce
      correct: false
    - text: Run dodaje middleware końcowy, a Use może wywołać next
      correct: true
    - text: To synonimy
      correct: false
  explanation: |
    Middleware z Run kończy pipeline (short-circuit), a Use może wykonać kod przed i po wywołaniu `next()`.
    Bezparametrowe `app.Run()` uruchamia aplikację, ale wariant z delegatem dodaje middleware; serwisy rejestruje się przez `builder.Services`.
    Rozgałęzianie pipeline'u to Map lub `MapWhen`.

- id: 211
  question: Czym jest hosting in-process w IIS dla ASP.NET Core?
  answers:
    - text: Aplikacja działa w przeglądarce użytkownika
      correct: false
    - text: Aplikacja jest kompilowana do kodu natywnego IIS
      correct: false
    - text: Aplikacja działa na Kestrelu w osobnym procesie, a IIS przekazuje żądania jako proxy
      correct: false
    - text: Aplikacja działa wewnątrz procesu roboczego IIS (`w3wp.exe`) bez osobnego Kestrela
      correct: true
  explanation: |
    W trybie in-process ASP.NET Core Module ładuje aplikację do `w3wp.exe` i używa `IISHttpServer`, co daje lepszą wydajność.
    Osobny proces z Kestrelem i IIS jako proxy to hosting out-of-process.
    Pozostałe odpowiedzi opisują coś innego niż hosting w IIS.

- id: 212
  question: Czym jest Kestrel?
  answers:
    - text: Wbudowanym, wieloplatformowym serwerem HTTP ASP.NET Core
      correct: true
    - text: Narzędziem wiersza poleceń do migracji bazy danych
      correct: false
    - text: Pełnym serwerem WWW z panelem administracyjnym, działającym tylko na Windows
      correct: false
    - text: Biblioteką do logowania
      correct: false
  explanation: |
    Kestrel to domyślny serwer ASP.NET Core, działający na Windows, Linux i macOS, samodzielnie lub za reverse proxy.
    Pełny serwer WWW tylko dla Windows to IIS, a migracje i logowanie realizują inne narzędzia.

- id: 213
  question: Co oznacza segment `{id:int}` w trasie ASP.NET Core?
  answers:
    - text: Parametr id, który jest opcjonalny i domyślnie wynosi 0
      correct: false
    - text: Parametr id przekazywany w query stringu jako liczba
      correct: false
    - text: Parametr id, który musi być GUID-em
      correct: false
    - text: Parametr id z ograniczeniem do wartości całkowitych
      correct: true
  explanation: |
    :int to ograniczenie trasy (route constraint) - gdy wartość nie jest liczbą, trasa nie pasuje.
    Parametr opcjonalny zapisuje się jako `{id?}`, query `string` to osobny mechanizm, a GUID wymaga ograniczenia :guid.

- id: 214
  question: W którym folderze projektu ASP.NET Core domyślnie znajdują się pliki statyczne?
  answers:
    - text: Properties
      correct: false
    - text: Content
      correct: false
    - text: wwwroot
      correct: true
    - text: "`App_Data`"
      correct: false
  explanation: |
    Middleware plików statycznych serwuje domyślnie zawartość wwwroot.
    Content i `App_Data` to foldery z klasycznego ASP.NET MVC, a Properties zawiera `m.in`. `launchSettings.json`.

- id: 215
  question: Czy pliki statyczne serwowane przez `UseStaticFiles` są domyślnie chronione autoryzacją?
  answers:
    - text: Tak - wymagają zalogowania, tak jak kontrolery oznaczone atrybutem `[Authorize]`
      correct: false
    - text: Nie - są dostępne dla każdego, więc nie umieszcza się tam niczego poufnego
      correct: true
    - text: Tak, ale tylko pliki JavaScript
      correct: false
    - text: Tak, jeśli w aplikacji wywołano `UseAuthorization` przed `UseStaticFiles`
      correct: false
  explanation: |
    Middleware plików statycznych zwykle stoi przed autoryzacją i obsługuje żądanie bez jej sprawdzania.
    Pliki wymagające kontroli dostępu trzeba serwować przez akcję zwracającą plik lub odpowiednio skonfigurowane endpointy.

- id: 216
  question: Do czego służy plik `launchSettings.json`?
  answers:
    - text: Do przechowywania connection stringów i sekretów używanych w środowisku produkcyjnym
      correct: false
    - text: Do konfiguracji produkcyjnej aplikacji wdrażanej w Kubernetes i Azure App Service
      correct: false
    - text: Do definiowania zależności NuGet i wersji frameworka docelowego
      correct: false
    - text: "Do lokalnych profili uruchomieniowych: portów, zmiennych, trybu startu"
      correct: true
  explanation: |
    `launchSettings.json` czyta tylko narzędzie (Visual Studio, `dotnet run`) podczas uruchamiania lokalnego - w produkcji nie jest używany.
    Konfiguracja produkcyjna pochodzi z appsettings, zmiennych środowiskowych i Key Vault, a zależności definiuje plik `.csproj`.

- id: 217
  question: Które źródło konfiguracji domyślnie nadpisuje wartości z `appsettings.json`?
  answers:
    - text: Atrybuty na klasach
      correct: false
    - text: Plik `web.config`
      correct: false
    - text: Plik `launchSettings.json` w produkcji
      correct: false
    - text: Zmienne środowiskowe
      correct: true
  explanation: |
    Domyślny builder ładuje kolejno `appsettings.json`, `appsettings.{Environment}.json`, User Secrets (w Development), zmienne środowiskowe i argumenty wiersza poleceń - późniejsze nadpisują wcześniejsze.
    `launchSettings.json` nie działa w produkcji, `web.config` nie jest providerem konfiguracji ASP.NET Core, a atrybuty nie są źródłem konfiguracji.

- id: 218
  question: Dlaczego przeglądarka blokuje odczyt odpowiedzi z innej domeny bez nagłówków CORS?
  answers:
    - text: Bo serwer API domyślnie odrzuca każde żądanie wysłane z kodu JavaScript w przeglądarce
      correct: false
    - text: Bo bez nagłówków CORS przeglądarka nie potrafi zdekompresować odpowiedzi z innej domeny
      correct: false
    - text: Bo protokół HTTPS nie pozwala na żądania między domenami bez wspólnego certyfikatu
      correct: false
    - text: Ze względu na Same-Origin Policy, chroniącą sesję użytkownika
      correct: true
  explanation: |
    Same-Origin Policy uniemożliwia skryptom z jednej domeny odczyt danych z innej bez zgody serwera wyrażonej nagłówkami CORS.
    Serwer obsługuje żądania z JS, HTTPS nie blokuje żądań między domenami, a CORS nie ma związku z wydajnością.

- id: 219
  question: Która kombinacja w konfiguracji CORS jest niedozwolona?
  answers:
    - text: "`WithOrigins` razem z `AllowCredentials`"
      correct: false
    - text: "`AllowAnyMethod` razem z `AllowAnyHeader`"
      correct: false
    - text: "`AllowAnyOrigin` razem z `AllowCredentials`"
      correct: true
    - text: "`WithOrigins` razem z `AllowAnyHeader`"
      correct: false
  explanation: |
    Specyfikacja CORS zabrania wildcard `*` w `Access-Control-Allow-Origin` przy żądaniach z poświadczeniami - ASP.NET Core zgłasza wtedy błąd.
    Konkretne originy z poświadczeniami oraz dowolne metody i nagłówki są poprawną konfiguracją.

- id: 220
  question: Czym różni się `IMemoryCache` od `IDistributedCache`?
  answers:
    - text: "`IMemoryCache` jest współdzielony przez wszystkie instancje aplikacji, a `IDistributedCache` jest lokalny dla procesu"
      correct: false
    - text: Nie ma różnic poza nazwą
      correct: false
    - text: "`IDistributedCache` działa tylko z SQL Server jako magazynem danych"
      correct: false
    - text: "`IMemoryCache` trzyma dane w pamięci procesu, a `IDistributedCache` w zewnętrznym magazynie współdzielonym przez instancje"
      correct: true
  explanation: |
    Cache w pamięci jest najszybszy, ale każda instancja ma własny i dane giną przy restarcie.
    Cache rozproszony (Redis, SQL Server, inne) jest wspólny dla wielu instancji i przetrwa restart aplikacji.

- id: 221
  question: Jaki standard zwracania błędów zaleca się dla API w ASP.NET Core?
  answers:
    - text: "`ProblemDetails` (RFC 9457, dawniej RFC 7807)"
      correct: true
    - text: Zwykły tekst z treścią wyjątku i stack trace
      correct: false
    - text: Przekierowanie na stronę HTML z błędem
      correct: false
    - text: Kod 200 z polem error w JSON
      correct: false
  explanation: |
    `ProblemDetails` to ustandaryzowany format JSON z polami type, title, status i detail, wspierany przez `AddProblemDetails`.
    Stack trace w odpowiedzi ujawnia szczegóły implementacji, kod 200 dla błędów myli klientów, a przekierowanie na HTML nie pasuje do API.

- id: 222
  question: Czym charakteryzują się Razor Pages?
  answers:
    - text: Są kompilowane do WebAssembly i wykonywane w przeglądarce, bez udziału serwera
      correct: false
    - text: Wymagają osobnego kontrolera dla każdej strony, który zwraca jej `PageModel`
      correct: false
    - text: Nie obsługują formularzy ani handlerów dla żądań `POST`
      correct: false
    - text: Każda strona ma `PageModel` z `OnGet` i `OnPost`, bez kontrolerów
      correct: true
  explanation: |
    Razor Pages to model zorientowany na strony - routing wynika ze struktury folderu Pages, a logika jest w `PageModel`.
    W przeglądarce przez WebAssembly działa Blazor, Razor Pages świetnie obsługują formularze i nie potrzebują kontrolerów.

- id: 223
  question: Czym różnią się zasady SOLID od wzorców projektowych?
  answers:
    - text: Wzorce projektowe są częścią specyfikacji języka C#
      correct: false
    - text: SOLID to katalog 23 wzorców Gang of Four, a wzorce to zasady pisania czytelnego kodu
      correct: false
    - text: SOLID to ogólne zasady projektowania, a wzorce to konkretne, sprawdzone rozwiązania typowych problemów
      correct: true
    - text: SOLID dotyczy projektowania baz danych, a wzorce projektowe - wyłącznie warstwy interfejsu użytkownika
      correct: false
  explanation: |
    SOLID mówi, jak projektować, a wzorce dają gotowe schematy, często realizujące te zasady (np. Strategy wspiera OCP).
    Katalog 23 wzorców to Gang of Four, a nie SOLID; żadne z nich nie jest częścią specyfikacji C# ani nie ogranicza się do baz danych czy UI.

- id: 224
  question: Co mówi zasada pojedynczej odpowiedzialności (SRP)?
  answers:
    - text: W aplikacji powinna istnieć tylko jedna instancja każdej klasy
      correct: false
    - text: Klasa powinna mieć tylko jedną metodę publiczną
      correct: false
    - text: Każda klasa powinna implementować dokładnie jeden interfejs
      correct: false
    - text: Klasa powinna mieć tylko jeden powód do zmiany
      correct: true
  explanation: |
    SRP dotyczy odpowiedzialności - klasa Invoice nie powinna jednocześnie liczyć sum, zapisywać do bazy i generować PDF.
    Liczba metod czy interfejsów nie jest miarą SRP, a jedna instancja klasy to wzorzec Singleton.

- id: 225
  question: Jak najlepiej zastosować zasadę otwarte-zamknięte (OCP) przy dodawaniu nowej metody płatności?
  answers:
    - text: Skopiować klasę obsługi płatności i zmienić jej nazwę
      correct: false
    - text: Dopisać kolejny `case` w istniejącym switchu obsługującym płatności
      correct: false
    - text: Dodać parametr `bool` do istniejącej metody Pay
      correct: false
    - text: Dodać nową klasę implementującą interfejs `IPaymentMethod`
      correct: true
  explanation: |
    OCP mówi, by rozszerzać zachowanie przez nowy kod, a nie modyfikować działający.
    Dopisywanie case'ów i flag `bool` zmienia istniejącą klasę przy każdej nowej płatności, a kopiowanie klas prowadzi do duplikacji.

- id: 226
  question: Który przykład narusza zasadę podstawienia Liskov (LSP)?
  answers:
    - text: Klasa `SavingsAccount` rozszerzająca Account o naliczanie odsetek bez zmiany kontraktu bazy
      correct: false
    - text: Klasa Circle implementująca interfejs `IShape` i zwracająca poprawne pole w metodzie Area
      correct: false
    - text: Klasa `FileLogger` implementująca `ILogger`
      correct: false
    - text: Square dziedziczący po Rectangle, gdzie ustawienie szerokości zmienia też wysokość
      correct: true
  explanation: |
    Kod oczekujący prostokąta zakłada, że szerokość i wysokość ustawia się niezależnie - kwadrat łamie to założenie, więc nie da się go bezpiecznie podstawić.
    Pozostałe przykłady zachowują kontrakt typu bazowego.

- id: 227
  question: Co mówi zasada segregacji interfejsów (ISP)?
  answers:
    - text: Klienci nie powinni zależeć od metod, których nie używają
      correct: true
    - text: Każdy interfejs powinien mieć dokładnie jedną implementację w tym samym assembly
      correct: false
    - text: Interfejsy powinny być umieszczane w osobnym assembly, oddzielonym od ich implementacji
      correct: false
    - text: Interfejs nie może dziedziczyć po innym interfejsie, by nie łączyć odpowiedzialności
      correct: false
  explanation: |
    Zamiast "grubego" interfejsu z wieloma metodami lepiej rozdzielić go np. na `IReader` i `IWriter`, by implementacje nie rzucały `NotImplementedException`.
    Liczba implementacji, umiejscowienie w assembly i dziedziczenie interfejsów nie są tematem ISP.

- id: 228
  question: Co mówi zasada odwrócenia zależności (DIP)?
  answers:
    - text: Moduły niskiego poziomu powinny bezpośrednio zależeć od modułów wysokiego poziomu
      correct: false
    - text: Zależności należy tworzyć przez `new` w konstruktorze klasy, która ich używa
      correct: false
    - text: Moduły obu poziomów powinny zależeć od abstrakcji
      correct: true
    - text: Klasy nie powinny mieć żadnych zależności
      correct: false
  explanation: |
    `OrderService` powinien zależeć od `IOrderRepository`, a `SqlOrderRepository` implementuje tę abstrakcję - w praktyce realizuje to DI.
    Odwrócenie kierunku bez abstrakcji nie jest DIP, tworzenie zależności przez `new` to właśnie silne powiązanie, a klasy bez zależności są w praktyce rzadkością.

- id: 229
  question: Jakie jest główne ryzyko nadgorliwego stosowania zasady DRY?
  answers:
    - text: Powstanie zbyt wielu kopii tej samej logiki w różnych miejscach kodu
      correct: false
    - text: Złączenie przypadkowo podobnego kodu w złą abstrakcję
      correct: true
    - text: Brak możliwości pisania testów jednostkowych dla współdzielonych metod
      correct: false
    - text: Spowolnienie kompilacji
      correct: false
  explanation: |
    Kod podobny wizualnie, ale zmieniający się z różnych powodów, po połączeniu tworzy sztuczne zależności - zła abstrakcja bywa gorsza od duplikacji.
    Wiele kopii logiki to problem, który DRY rozwiązuje, a nie skutek jej nadużywania; kompilacja i testy nie są tu istotne.

- id: 230
  question: Do której kategorii należy wzorzec Decorator?
  answers:
    - text: Behawioralnych
      correct: false
    - text: Kreacyjnych
      correct: false
    - text: Strukturalnych
      correct: true
    - text: Architektonicznych
      correct: false
  explanation: |
    Decorator opisuje składanie obiektów - opakowanie obiektu w inny z tym samym interfejsem, by dodać zachowanie.
    Wzorce kreacyjne dotyczą tworzenia obiektów, behawioralne - komunikacji, a architektoniczne (np. MVC) nie są kategorią Gang of Four.

- id: 231
  question: Który wzorzec należy do kategorii kreacyjnych?
  answers:
    - text: Adapter
      correct: false
    - text: Observer
      correct: false
    - text: Builder
      correct: true
    - text: Strategy
      correct: false
  explanation: |
    Builder pozwala tworzyć złożony obiekt krok po kroku, więc dotyczy procesu tworzenia.
    Observer i Strategy są behawioralne, a Adapter - strukturalny.

- id: 232
  question: Który wzorzec jest behawioralny?
  answers:
    - text: Observer
      correct: true
    - text: Composite
      correct: false
    - text: Facade
      correct: false
    - text: Singleton
      correct: false
  explanation: |
    Observer definiuje zależność jeden-do-wielu, w której zmiana stanu obiektu powiadamia subskrybentów - to wzorzec komunikacji.
    Facade i Composite są strukturalne, a Singleton - kreacyjny.

- id: 233
  question: Dlaczego w aplikacji z DI zamiast ręcznego singletona lepiej użyć `AddSingleton`?
  answers:
    - text: Bo `AddSingleton` automatycznie czyni zarejestrowaną klasę bezpieczną wątkowo
      correct: false
    - text: Bo ręczny Singleton nie działa w .NET Core
      correct: false
    - text: Bo `AddSingleton` tworzy nową instancję przy każdym żądaniu HTTP do aplikacji
      correct: false
    - text: Bo kontener zarządza jedyną instancją, a zależność można podmienić w testach
      correct: true
  explanation: |
    Rejestracja w kontenerze daje jedną instancję bez statycznego globalnego dostępu, więc konsument zależy od abstrakcji i jest testowalny.
    `AddSingleton` nie tworzy instancji per żądanie, klasyczny Singleton działa w .NET Core, a bezpieczeństwo wątkowe trzeba zapewnić samemu.

- id: 234
  question: Który sposób implementacji Singletona jest bezpieczny wątkowo i zalecany w C#?
  answers:
    - text: Utworzenie instancji w finalizatorze
      correct: false
    - text: "`Lazy<T>` w statycznym polu `readonly`"
      correct: true
    - text: Sprawdzenie if (`_instance == null`) `_instance = new` ... bez blokady
      correct: false
    - text: Publiczny konstruktor z licznikiem instancji
      correct: false
  explanation: |
    `Lazy<T>` gwarantuje leniwe i bezpieczne wątkowo utworzenie instancji.
    Sprawdzenie `null` bez blokady może utworzyć kilka instancji przy równoległym dostępie, publiczny konstruktor przeczy idei Singletona, a finalizator wykonuje się przy sprzątaniu obiektu.

- id: 235
  question: Jaki problem rozwiązuje wzorzec Factory?
  answers:
    - text: Ukrywa logikę tworzenia obiektów, więc klient nie zależy od konkretnych klas
      correct: true
    - text: Zapewnia jedną instancję klasy w całej aplikacji i globalny punkt dostępu
      correct: false
    - text: Dodaje nowe zachowanie do istniejącego obiektu bez dziedziczenia po jego klasie
      correct: false
    - text: Dopasowuje niezgodne interfejsy
      correct: false
  explanation: |
    Fabryka centralizuje decyzję, który typ utworzyć, np. `NotificationFactory.Create("email")` zwraca `INotification`.
    Jedna instancja to Singleton, dopasowanie interfejsów - Adapter, a dodawanie zachowania - Decorator.

- id: 236
  question: Czym Abstract Factory różni się od Factory Method?
  answers:
    - text: Abstract Factory zawsze jest klasą statyczną, a Factory Method metodą instancyjną
      correct: false
    - text: Nie ma różnic - to dwie nazwy tego samego wzorca
      correct: false
    - text: Abstract Factory tworzy rodziny obiektów, Factory Method jeden produkt w podklasie
      correct: true
    - text: Factory Method tworzy całą rodzinę obiektów naraz, a Abstract Factory zawsze tylko jeden produkt
      correct: false
  explanation: |
    Abstract Factory (np. `IUiFactory` z `CreateButton` i `CreateCheckbox`) gwarantuje, że produkty jednej rodziny do siebie pasują.
    Factory Method deleguje utworzenie jednego produktu do podklas.
    Fabryka abstrakcyjna nie musi być statyczna, a pozostałe odpowiedzi odwracają lub zacierają różnice.

- id: 237
  question: Jaka jest złożoność obliczeniowa wyszukiwania binarnego?
  answers:
    - text: "`O(n)`"
      correct: false
    - text: "`O(1)`"
      correct: false
    - text: "`O(n log n)`"
      correct: false
    - text: "`O(log n)`"
      correct: true
  explanation: |
    Każdy krok odrzuca połowę zakresu, więc liczba kroków rośnie logarytmicznie.
    `O(n)` to wyszukiwanie liniowe, `O(n log n)` - typowe wydajne sortowanie, a `O(1)` - dostęp po indeksie lub w tablicy haszującej.

- id: 238
  question: Jaki warunek musi być spełniony, by użyć wyszukiwania binarnego?
  answers:
    - text: Tablica musi być posortowana
      correct: true
    - text: Tablica musi mieć parzystą liczbę elementów
      correct: false
    - text: Elementy muszą być unikalne
      correct: false
    - text: Tablica musi mieć rozmiar będący potęgą dwójki
      correct: false
  explanation: |
    Wyszukiwanie binarne porównuje środkowy element i decyduje, w której połowie szukać - ma to sens tylko w posortowanych danych.
    Parzysta liczba elementów, potęga dwójki ani unikalność nie są wymagane.

- id: 239
  question: Jaka jest pesymistyczna złożoność sortowania bąbelkowego?
  answers:
    - text: "`O(log n)`"
      correct: false
    - text: "`O(n)`"
      correct: false
    - text: "`O(n²)`"
      correct: true
    - text: "`O(n log n)`"
      correct: false
  explanation: |
    Sortowanie bąbelkowe porównuje sąsiednie pary w zagnieżdżonych pętlach, więc w najgorszym przypadku wykonuje rzędu n² operacji.
    `O(n)` osiąga tylko w najlepszym przypadku (już posortowana tablica z flagą swapped), a `O(n log n)` mają np. merge sort i quicksort (średnio).

- id: 240
  question: "Ile wynosi `a` i `i` po wykonaniu: `int i = 5; int a = i++;`?"
  answers:
    - text: "`a = 6`, `i = 6`"
      correct: false
    - text: "`a = 5`, `i = 5`"
      correct: false
    - text: "`a = 6`, `i = 5`"
      correct: false
    - text: "`a = 5`, `i = 6`"
      correct: true
  explanation: |
    Postinkrementacja zwraca starą wartość, a dopiero potem zwiększa zmienną.
    Wynik `a = 6` dałaby preinkrementacja ++i, a i zawsze zostaje zwiększone do 6.

- id: 241
  question: Jaki algorytm wyznacza NWD dwóch liczb w czasie logarytmicznym?
  answers:
    - text: Algorytm Dijkstry
      correct: false
    - text: Sito Eratostenesa
      correct: false
    - text: Algorytm Euklidesa
      correct: true
    - text: Sortowanie przez scalanie
      correct: false
  explanation: |
    Algorytm Euklidesa powtarza `NWD(a, b)` `= NWD(b`, a mod b), aż b będzie zerem, w `O(log(min(a, b)))`.
    Sito Eratostenesa wyznacza liczby pierwsze, Dijkstra - najkrótsze ścieżki w grafie, a merge sort sortuje.

- id: 242
  question: Do jakiej wartości wystarczy sprawdzać dzielniki, aby stwierdzić, czy n jest liczbą pierwszą?
  answers:
    - text: Do `n / 2`, bo większy dzielnik nie może istnieć
      correct: false
    - text: Do pierwiastka kwadratowego z n
      correct: true
    - text: Do logarytmu z n
      correct: false
    - text: Do n - 1, sprawdzając każdą liczbę po kolei
      correct: false
  explanation: |
    Jeśli n ma dzielnik większy od pierwiastka, to ma też odpowiadający mu dzielnik mniejszy od pierwiastka, więc wystarczy sprawdzić do `sqrt(n)`.
    `n / 2` i n - 1 dają poprawny wynik, ale niepotrzebnie wolniej, a log n jest za małą granicą.

- id: 243
  question: Czym różnią się anagramy od palindromów?
  answers:
    - text: Anagram ma te same litery w innej kolejności, palindrom czyta się tak samo od tyłu
      correct: true
    - text: To dwie nazwy tego samego pojęcia - słowa, które czyta się tak samo od tyłu
      correct: false
    - text: Anagram czyta się tak samo od przodu i od tyłu, a palindrom ma te same litery w innej kolejności
      correct: false
    - text: Anagram to słowo z samych samogłosek, a palindrom z samych spółgłosek
      correct: false
  explanation: |
    "kot" i "tok" to anagramy, a "kajak" jest palindromem.
    Zamiana definicji jest błędna, samogłoski nie mają tu znaczenia, a pojęcia nie są synonimami.

- id: 244
  question: Jaka jest najprostsza współczesna składnia zamiany wartości dwóch zmiennych w C#?
  answers:
    - text: (a, b) `=` (b, a);
      correct: true
    - text: "`swap(a, b)`;"
      correct: false
    - text: "`a <=> b;`"
      correct: false
    - text: "`Interlocked.Swap(a, b)`;"
      correct: false
  explanation: |
    Krotki pozwalają zamienić wartości bez zmiennej tymczasowej w jednej linii.
    C# nie ma wbudowanej funkcji `swap` ani operatora `<=>`, a klasa `Interlocked` oferuje `Exchange` (atomową zamianę z polem), a nie `Swap` dwóch zmiennych lokalnych.

- id: 245
  question: Która metoda LINQ najprościej sprawdzi, czy dwie tablice mają te same elementy w tej samej kolejności?
  answers:
    - text: Equals
      correct: false
    - text: "`SequenceEqual`"
      correct: true
    - text: Contains
      correct: false
    - text: Intersect
      correct: false
  explanation: |
    `arr1.SequenceEqual(arr2)` porównuje elementy parami.
    Equals na tablicach porównuje referencje, Intersect zwraca część wspólną bez względu na kolejność, a Contains sprawdza pojedynczy element.

- id: 246
  question: Dlaczego przy liczeniu średniej z tablicy `int` rzutuje się sumę na `double`?
  answers:
    - text: Bo typ `int` nie może przechowywać sumy większej niż 32 767
      correct: false
    - text: Aby uniknąć dzielenia całkowitego, które obcina część ułamkową
      correct: true
    - text: Bo dzielenie `int` przez `int` rzuca wyjątek, gdy wynik nie jest całkowity
      correct: false
    - text: Bo metoda Length zwraca `double`
      correct: false
  explanation: |
    `7 / 2` dla intów daje 3, a `(double)7 / 2` - 3.5.
    `int` ma zakres do ok. 2,1 miliarda, Length zwraca `int`, a dzielenie intów nie rzuca wyjątku (poza dzieleniem przez zero).

- id: 247
  question: Czym różni się struktura od klasy w C#?
  answers:
    - text: Struktury mogą dziedziczyć po innych strukturach, a klasy tylko implementować interfejsy
      correct: false
    - text: Struktury nie mogą mieć metod
      correct: false
    - text: Struktura jest typem referencyjnym przechowywanym na stercie, a klasa wartościowym na stosie
      correct: false
    - text: Struktura jest typem wartościowym kopiowanym przy przypisaniu, klasa - typem referencyjnym
      correct: true
  explanation: |
    Przypisanie struktury kopiuje całą wartość, a przypisanie klasy - tylko referencję do tego samego obiektu.
    Struktury nie wspierają dziedziczenia (poza implementacją interfejsów) i mogą mieć metody, właściwości oraz konstruktory.

- id: 248
  question: Jak definiuje się przeciążony operator `+` dla typu Money?
  answers:
    - text: "`public override` Money `Add(Money a, Money b)`"
      correct: false
    - text: "`public static` Money operator +(Money a, Money b)"
      correct: true
    - text: "`[Operator(\"+\")] public` Money `Plus(Money b)`"
      correct: false
    - text: "`public` Money operator +(Money other)"
      correct: false
  explanation: |
    Operatory przeciąża się jako publiczne metody statyczne ze słowem operator.
    Wersja instancyjna się nie skompiluje, `override` Add nie przeciąża operatora, a atrybut `[Operator]` nie istnieje.

- id: 249
  question: Które operatory trzeba w C# przeciążać parami?
  answers:
    - text: "`*` i `/`"
      correct: false
    - text: "`++ i --`"
      correct: false
    - text: "`== i !=` oraz `<` i `>`"
      correct: true
    - text: "`+` i -"
      correct: false
  explanation: |
    Kompilator wymaga, by przeciążenie `==` szło w parze z `!=`, a `<` z `>` (podobnie `<=` z `>=`).
    Operatory arytmetyczne i inkrementacji można przeciążać niezależnie.

- id: 250
  question: Jak wywołać metodę klasy bazowej bez tworzenia jakiejkolwiek instancji?
  answers:
    - text: Każdą metodę instancyjną można wywołać bez instancji przez refleksję bez obiektu
      correct: false
    - text: Przez `base.Metoda()` w dowolnym miejscu kodu
      correct: false
    - text: Tylko jeśli metoda jest statyczna - przez `NazwaKlasy.Metoda()`
      correct: true
    - text: Przez `this.Metoda()` w klasie statycznej
      correct: false
  explanation: |
    Metody statyczne nie wymagają instancji.
    `base.Metoda()` działa tylko w metodach instancyjnych klasy pochodnej (instancja wtedy istnieje), `this` nie istnieje w kontekście statycznym, a refleksja dla metod instancyjnych też potrzebuje obiektu.

- id: 251
  question: Jaki jest odpowiednik funkcji czysto wirtualnej z C++ w C#?
  answers:
    - text: Metoda `abstract`
      correct: true
    - text: Metoda `static`
      correct: false
    - text: Metoda `virtual`
      correct: false
    - text: Metoda `sealed`
      correct: false
  explanation: |
    Funkcja czysto wirtualna (`= 0`) nie ma implementacji i musi zostać nadpisana - w C# to metoda `abstract`.
    `virtual` ma implementację, którą można nadpisać, `sealed` blokuje dalsze nadpisywanie, a `static` nie bierze udziału w polimorfizmie instancyjnym.

- id: 252
  question: Które wiązanie występuje przy wywołaniu metody `virtual` przez referencję typu bazowego?
  answers:
    - text: Wiązanie statyczne przez kompilator JIT podczas instalacji
      correct: false
    - text: Nie ma żadnego wiązania
      correct: false
    - text: Wczesne wiązanie w czasie kompilacji
      correct: false
    - text: Późne (dynamiczne) wiązanie w czasie wykonania
      correct: true
  explanation: |
    Dla metod wirtualnych faktyczna implementacja jest wybierana na podstawie typu obiektu w czasie wykonania.
    Wczesne wiązanie dotyczy metod niewirtualnych i przeciążeń, a JIT nie działa przy instalacji aplikacji.

- id: 253
  question: Czy blok `finally` wykona się, jeśli w bloku `try` znajduje się instrukcja `return`?
  answers:
    - text: Tylko jeśli `return` nie zwraca żadnej wartości
      correct: false
    - text: Nie - `return` natychmiast kończy metodę i pomija pozostały kod
      correct: false
    - text: Tylko w trybie Debug
      correct: false
    - text: Tak - `finally` wykona się przed faktycznym wyjściem z metody
      correct: true
  explanation: |
    `finally` wykonuje się zawsze przy opuszczaniu bloku `try`, także przez `return`, `break` czy wyjątek.
    Nie wykona się tylko w skrajnych sytuacjach, np. `Environment.FailFast` albo zabicie procesu.
    Wartość zwracana i konfiguracja kompilacji nie mają znaczenia.

- id: 254
  question: Gdzie przechowywany jest wyjątek, który był pierwotną przyczyną innego wyjątku?
  answers:
    - text: We właściwości Source
      correct: false
    - text: We właściwości HResult
      correct: false
    - text: We właściwości `StackTrace`
      correct: false
    - text: We właściwości `InnerException`
      correct: true
  explanation: |
    Opakowując wyjątek (`throw new OrderException("...", ex)`), przekazuje się go jako `InnerException`, co zachowuje przyczynę.
    `StackTrace` to ślad wywołań, Source - nazwa aplikacji lub obiektu, który spowodował błąd, a HResult - kod liczbowy.

- id: 255
  question: Który wyjątek rzuci odwołanie do składowej obiektu, który jest `null`?
  answers:
    - text: "`NullReferenceException`"
      correct: true
    - text: "`ArgumentNullException`"
      correct: false
    - text: "`InvalidOperationException`"
      correct: false
    - text: "`NotImplementedException`"
      correct: false
  explanation: |
    Dereferencja `null` zawsze kończy się `NullReferenceException`.
    `ArgumentNullException` rzuca się jawnie przy walidacji argumentów, `InvalidOperationException` oznacza niewłaściwy stan obiektu, a `NotImplementedException` - brak implementacji.

- id: 256
  question: Według jakiej zasady działa `Stack<T>`?
  answers:
    - text: FIFO - pierwszy wstawiony element wychodzi pierwszy
      correct: false
    - text: LIFO - ostatni wstawiony element wychodzi pierwszy
      correct: true
    - text: Elementy są zwracane losowo
      correct: false
    - text: Elementy są zwracane w kolejności posortowanej
      correct: false
  explanation: |
    Stos działa jak stos talerzy: Push kładzie na wierzch, Pop zdejmuje ostatnio położony.
    FIFO to zasada kolejki `Queue<T>`, sortowanie zapewnia np. `PriorityQueue` lub `SortedSet`, a zwracanie losowe nie jest cechą żadnej z nich.

- id: 257
  question: Czym jest tablica postrzępiona (jagged array)?
  answers:
    - text: Tablicą prostokątną z równą długością wierszy, np. `int[,]`
      correct: false
    - text: Tablicą, która automatycznie zmienia rozmiar przy dodawaniu wierszy
      correct: false
    - text: Tablicą elementów typu `object`, w której każdy element może mieć inny typ
      correct: false
    - text: Tablicą tablic, w której każdy wiersz może mieć inną długość, np. `int[][]`
      correct: true
  explanation: |
    `int[][]` to tablica, której elementami są osobne tablice o dowolnych długościach.
    `int[,]` to tablica wielowymiarowa (prostokątna), zmiana rozmiaru to cecha `List<T>`, a typ elementów nie definiuje tablicy postrzępionej.

- id: 258
  question: Jak pobrać rozmiar drugiego wymiaru tablicy `int[,]` matrix?
  answers:
    - text: "`matrix.GetLength(1)`"
      correct: true
    - text: "`matrix.Size.Y`"
      correct: false
    - text: "`matrix.Length[1]`"
      correct: false
    - text: "`matrix.Count(1)`"
      correct: false
  explanation: |
    `GetLength(wymiar)` zwraca rozmiar podanego wymiaru, liczonego od zera.
    Length zwraca łączną liczbę elementów i nie przyjmuje indeksu, a `Count(1)` i `Size.Y` nie istnieją dla tablic.

- id: 259
  question: Jak definiuje się indekser w klasie C#?
  answers:
    - text: "`public` T `this[int index] { get { ... } set { ... } }`"
      correct: true
    - text: "`[Indexer] public` T `Get(int index)` `{ get { ... } set { ... } }`"
      correct: false
    - text: "`public` T `Index(int index)` `{ ... }`"
      correct: false
    - text: "`public static` T operator `[](MyClass obj, int index)` `{ ... }`"
      correct: false
  explanation: |
    Indekser ma składnię właściwości ze słowem `this` i parametrem w nawiasach kwadratowych.
    Zwykła metoda nie daje składni `obj[index]`, operatora `[]` nie przeciąża się w C# jak w C++, a atrybut `[Indexer]` nie istnieje.

- id: 260
  question: Czym różni się `Array.Clone()` od `Array.CopyTo()`?
  answers:
    - text: "`Clone()` tworzy nową tablicę, `CopyTo()` kopiuje do istniejącej"
      correct: true
    - text: "`CopyTo()` tworzy nową tablicę, a `Clone()` wymaga tablicy docelowej"
      correct: false
    - text: "`Clone()` działa tylko dla tablic typów wartościowych, a `CopyTo()` dla każdych"
      correct: false
    - text: "`Clone()` wykonuje głęboką kopię elementów, a `CopyTo()` kopię płytką"
      correct: false
  explanation: |
    `Clone()` zwraca nową tablicę jako `object`, a `CopyTo(dest, index)` wypełnia podaną tablicę od wskazanego indeksu.
    Obie wykonują płytką kopię, role nie są odwrócone, a `Clone()` działa dla każdego typu elementów.

- id: 261
  question: Który z poniższych typów jest typem referencyjnym?
  answers:
    - text: "`string`"
      correct: true
    - text: "`decimal`"
      correct: false
    - text: "`int`"
      correct: false
    - text: "`DateTime`"
      correct: false
  explanation: |
    `string` jest klasą, choć zachowuje się jak wartość dzięki niemutowalności.
    `int`, `DateTime` i `decimal` to struktury, czyli typy wartościowe.

- id: 262
  question: Czy można nadpisać prywatną metodę wirtualną?
  answers:
    - text: Tak, przez słowo `new`
      correct: false
    - text: Tak, w klasie zagnieżdżonej
      correct: false
    - text: Nie - metoda `virtual` nie może być prywatna
      correct: true
    - text: Tak, jeśli klasa pochodna jest w tym samym pliku
      correct: false
  explanation: |
    Kompilator nie pozwala zadeklarować prywatnej metody `virtual`, bo klasa pochodna i tak by jej nie widziała.
    `new` nie nadpisuje, tylko ukrywa metodę, a zagnieżdżenie klasy czy ten sam plik nie zmieniają reguły.

- id: 263
  question: Czy cykliczne referencje między obiektami powodują wycieki pamięci w .NET?
  answers:
    - text: Tak - GC używa zliczania referencji i nie potrafi usunąć cykli
      correct: false
    - text: Tak, ale tylko dla obiektów większych niż 85 KB, które trafiają na Large Object Heap
      correct: false
    - text: Tak, chyba że cykl zostanie przerwany ręcznym wywołaniem `GC.Collect()`
      correct: false
    - text: Nie - GC śledzi osiągalność od korzeni, więc nieosiągalne cykle są zwalniane
      correct: true
  explanation: |
    Algorytm mark-and-sweep usuwa wszystko, co jest nieosiągalne od korzeni, także cykle.
    Zliczanie referencji to inny mechanizm (stosowany np. w CPythonie), ręczne `GC.Collect` nie jest potrzebne, a rozmiar obiektu nie ma znaczenia.
    Cykle bywają problemem przy serializacji JSON, a nie przy GC.

- id: 264
  question: Do czego służy `ArrayPool<T>`?
  answers:
    - text: Do przechowywania dużych tablic w bazie danych zamiast w pamięci
      correct: false
    - text: Do ponownego używania buforów tablic, by zmniejszyć presję na GC
      correct: true
    - text: Do automatycznego sortowania tablic przy dodawaniu nowych elementów
      correct: false
    - text: Do równoległego przetwarzania dużych tablic na wielu wątkach z puli
      correct: false
  explanation: |
    `ArrayPool.Shared.Rent` wypożycza bufor, a Return oddaje go do puli - przydaje się w kodzie o wysokiej wydajności.
    Nie sortuje, nie zrównolegla przetwarzania i nie ma związku z bazą danych.

- id: 265
  question: Który generyczny delegat zwraca wartość?
  answers:
    - text: "`Predicate<T>` zwracający `void`"
      correct: false
    - text: "`Action<T>`"
      correct: false
    - text: "`Func<T, TResult>`"
      correct: true
    - text: "`EventHandler`"
      correct: false
  explanation: |
    Func przyjmuje parametry i zwraca wynik, którego typ jest ostatnim parametrem generycznym.
    Action zwraca `void`, Predicate zwraca `bool` (a nie `void`), a `EventHandler` to delegat zdarzeń zwracający `void`.

- id: 266
  question: Jaki typ zwraca `Predicate<T>`?
  answers:
    - text: "`void`"
      correct: false
    - text: "`bool`"
      correct: true
    - text: T
      correct: false
    - text: "`object`"
      correct: false
  explanation: |
    `Predicate<T>` reprezentuje warunek - przyjmuje jeden argument i zwraca `true` lub `false`, np. w `List<T>.FindAll`.
    Zwracanie T to `Func<T, T>`, `void` zwraca `Action<T>`, a `object` nie jest typem wyniku predykatu.

- id: 267
  question: Czy w .NET Core i .NET 5+ można wywołać delegat asynchronicznie przez `BeginInvoke`?
  answers:
    - text: Tak, ale tylko na Windows
      correct: false
    - text: Tak, działa tak samo jak w .NET Framework, ale wymaga wywołania `EndInvoke`
      correct: false
    - text: Nie - rzuca `PlatformNotSupportedException`; używa się `Task.Run`
      correct: true
    - text: Tak, jeśli delegat zwraca `Task`, bo wtedy `BeginInvoke` jest automatycznie zamieniany na `Task.Run`
      correct: false
  explanation: |
    Model APM z `BeginInvoke/EndInvoke` na delegatach nie jest wspierany w nowym .NET.
    Asynchroniczne wywołanie realizuje się przez `Task.Run(() => del())` lub delegaty zwracające `Task` z `await`.

- id: 268
  question: Jaki efekt daje prefiks `@` przed literałem `string`, np. `@"C:\temp\new"`?
  answers:
    - text: Tworzy `string` dosłowny, bez interpretacji sekwencji ucieczki
      correct: true
    - text: Szyfruje zawartość stringa przechowywanego w pamięci procesu
      correct: false
    - text: Zamienia literał `string` na tablicę `char[]` przy kompilacji
      correct: false
    - text: Włącza interpolację wartości w nawiasach klamrowych, tak jak `$`
      correct: false
  explanation: |
    W stringu dosłownym backslash jest zwykłym znakiem, więc ścieżki nie wymagają podwajania backslashy.
    Interpolację włącza prefiks `$`, a `@` nie szyfruje ani nie zmienia typu literału.

- id: 269
  question: Co zrobić, by wyrażenie regularne na danych od użytkownika nie zawiesiło aplikacji?
  answers:
    - text: Używać wyłącznie metody Split zamiast Match, bo nie wykonuje backtrackingu
      correct: false
    - text: Ustawić timeout dopasowania (`matchTimeout`) w konstruktorze Regex
      correct: true
    - text: Zawsze używać `RegexOptions.IgnoreCase`, które wyłącza backtracking
      correct: false
    - text: Wywoływać Regex w bloku `finally`
      correct: false
  explanation: |
    Złośliwie dobrany tekst może spowodować katastrofalny backtracking (ReDoS) - timeout przerywa takie dopasowanie wyjątkiem `RegexMatchTimeoutException`.
    Wybór metody, ignorowanie wielkości liter czy miejsce wywołania nie chronią przed tym problemem.

- id: 270
  question: Dlaczego nie blokuje się na `this` lub na stringach w instrukcji `lock`?
  answers:
    - text: Bo inny kod może zablokować ten sam obiekt, grozi to deadlockiem
      correct: true
    - text: Bo `lock` działa tylko na typie `int`
      correct: false
    - text: Bo `this` i stringi nie są typami referencyjnymi, więc `lock` je kopiuje
      correct: false
    - text: Bo kompilator nie pozwala blokować na `this` ani na żadnym typie `string`
      correct: false
  explanation: |
    `this` jest widoczne na zewnątrz klasy, a stringi są internowane i współdzielone, więc inny kod może przypadkiem zablokować ten sam obiekt.
    Dlatego blokuje się na prywatnym obiekcie (lub typie Lock od .NET 9).
    `lock` wymaga typu referencyjnego (`int` jest wartościowy), a blokowanie na `this` kompiluje się, choć jest złą praktyką.

- id: 271
  question: Czego nie da się użyć wewnątrz bloku `lock`?
  answers:
    - text: wywołań innych metod
      correct: false
    - text: instrukcji if
      correct: false
    - text: "`await`"
      correct: true
    - text: zmiennych lokalnych
      correct: false
  explanation: |
    Kompilator nie pozwala na `await` w `lock`, bo kontynuacja mogłaby wykonać się na innym wątku, który nie jest właścicielem blokady.
    W kodzie `async` używa się `SemaphoreSlim.WaitAsync`.
    Wywołania metod, zmienne i warunki są w `lock` dozwolone.

- id: 272
  question: Do czego służy słowo kluczowe `extern`?
  answers:
    - text: Do oznaczania metody jako przestarzałej, która zostanie usunięta w kolejnej wersji
      correct: false
    - text: Do eksportowania metody, aby była widoczna w innych assembly i projektach
      correct: false
    - text: Do deklarowania metody z natywnej biblioteki DLL (P/Invoke)
      correct: true
    - text: Do deklarowania zmiennej globalnej widocznej we wszystkich plikach projektu
      correct: false
  explanation: |
    `extern` razem z `[DllImport]` lub `[LibraryImport]` pozwala wywołać funkcję natywną, np. z WinAPI.
    Widoczność dla innych assembly określa `public`, przestarzałość - `[Obsolete]`, a C# nie ma zmiennych globalnych.

- id: 273
  question: Ile zwraca `sizeof(int)`?
  answers:
    - text: "8"
      correct: false
    - text: Zależy od architektury procesora
      correct: false
    - text: "2"
      correct: false
    - text: "4"
      correct: true
  explanation: |
    `int` w C# to zawsze `System.Int32`, czyli 4 bajty, niezależnie od platformy.
    2 bajty ma `short`, 8 - `long`, a od architektury zależy rozmiar nint (`IntPtr`).

- id: 274
  question: Czy można użyć `this` wewnątrz metody statycznej?
  answers:
    - text: Tak, jeśli klasa jest zapieczętowana
      correct: false
    - text: Nie - metoda statyczna nie jest związana z żadną instancją
      correct: true
    - text: Tak, `this` wskazuje wtedy na typ klasy, podobnie jak `typeof`
      correct: false
    - text: Tak, ale tylko do odczytu pól statycznych tej samej klasy
      correct: false
  explanation: |
    Kompilator zgłosi błąd, bo w kontekście statycznym nie ma bieżącego obiektu.
    `this` nie wskazuje typu (do tego służy `typeof`), a ani tryb odczytu, ani `sealed` nie zmieniają tej reguły.

- id: 275
  question: Z jakiego języka pochodzą operatory CType i `DirectCast`?
  answers:
    - text: Z Visual Basic .NET
      correct: true
    - text: Z C#
      correct: false
    - text: Z F#
      correct: false
    - text: Z T-SQL
      correct: false
  explanation: |
    CType i `DirectCast` to operatory konwersji w VB.NET.
    W C# odpowiednikiem `DirectCast` jest rzutowanie `(T)obj`, a CType - metody klasy Convert; F# i T-SQL mają własne mechanizmy konwersji.

- id: 276
  question: Co dzieje się pod spodem przy łączeniu stringów operatorem `+`?
  answers:
    - text: Stringi są łączone w miejscu, bez tworzenia nowego obiektu
      correct: false
    - text: Kompilator tworzy zawsze `StringBuilder`
      correct: false
    - text: Wywoływana jest metoda `string.Join` z pustym separatorem
      correct: false
    - text: Kompilator zamienia to na wywołanie `string.Concat`
      correct: true
  explanation: |
    Konkatenacja przez `+` jest kompilowana do `string.Concat`, który tworzy nowy `string`.
    `StringBuilder` nie jest używany automatycznie (poza interpolacją w nowszych wersjach przez handlery), a stringi są niemutowalne, więc nie łączy się ich w miejscu.

- id: 277
  question: Która metoda bezpiecznie parsuje datę z tekstu, nie rzucając wyjątku przy błędnym formacie?
  answers:
    - text: "`DateTime.Parse`"
      correct: false
    - text: "`DateTime.ParseExact`"
      correct: false
    - text: "`DateTime.TryParse`"
      correct: true
    - text: "`Convert.ToDateTime`"
      correct: false
  explanation: |
    `TryParse` zwraca `bool` i wynik przez parametr `out`, więc błędne dane nie powodują wyjątku.
    Parse, `Convert.ToDateTime` i `ParseExact` rzucają `FormatException` przy niepoprawnym tekście (istnieje też `TryParseExact`).

- id: 278
  question: Jaki warunek musi być spełniony, aby klasa `partial` była poprawna?
  answers:
    - text: Każda część musi być w osobnym assembly, a kompilator łączy je przy ładowaniu
      correct: false
    - text: Części muszą być w tym samym pliku, oddzielone dyrektywą `#region`
      correct: false
    - text: Tylko jedna z części może mieć metody, a pozostałe mogą zawierać wyłącznie pola
      correct: false
    - text: Każda część musi mieć `partial` i być w tym samym assembly i namespace
      correct: true
  explanation: |
    Kompilator łączy wszystkie deklaracje `partial` w jedną klasę, więc muszą należeć do tego samego assembly i namespace.
    Części mogą zawierać dowolne składowe i zwykle są w różnych plikach, np. kod generowany i ręczny.

- id: 279
  question: Które stwierdzenie o typach anonimowych jest prawdziwe?
  answers:
    - text: Są typami wartościowymi
      correct: false
    - text: Można po nich dziedziczyć i rozszerzać je o nowe właściwości
      correct: false
    - text: Mają właściwości tylko do odczytu, a nazwę typu generuje kompilator
      correct: true
    - text: Ich właściwości można modyfikować po utworzeniu, ale nie można dodawać nowych
      correct: false
  explanation: |
    `new { Name = "Jan", Age = 30 }` tworzy niemutowalny typ referencyjny z nazwą nadaną przez kompilator.
    Nie można po nich dziedziczyć, ich właściwości są tylko do odczytu i są klasami, a nie strukturami.

- id: 280
  question: Co pozwala zrobić akcesor `init`?
  answers:
    - text: Ustawić wartość w dowolnym momencie życia obiektu, ale tylko jeden raz
      correct: false
    - text: Ustawić wartość właściwości tylko podczas inicjalizacji obiektu
      correct: true
    - text: Wywołać kod inicjalizujący przy pierwszym odczycie właściwości
      correct: false
    - text: Zainicjalizować właściwość statyczną
      correct: false
  explanation: |
    `init` pozwala na przypisanie w konstruktorze lub inicjalizatorze obiektu (`new` User `{ Name = "Jan" }`), a potem właściwość jest tylko do odczytu.
    Nie da się jej ustawić później, nie jest to leniwe ładowanie i nie dotyczy właściwości statycznych.

- id: 281
  question: Dlaczego `IEnumerable<string>` można przypisać do `IEnumerable<object>`?
  answers:
    - text: Bo `IEnumerable<T>` jest kontrawariantny
      correct: false
    - text: Bo `string` dziedziczy po `IEnumerable`
      correct: false
    - text: Bo kompilator wykonuje niejawny boxing elementów
      correct: false
    - text: Bo `IEnumerable<out T>` jest kowariantny
      correct: true
  explanation: |
    Modyfikator `out` oznacza kowariancję - typ bardziej szczegółowy może być użyty tam, gdzie oczekiwany jest ogólniejszy.
    Kontrawariancja (`in`) działa odwrotnie, np. dla `Action<T>`.
    Nie ma tu boxingu (`string` jest typem referencyjnym), a to, że `string` implementuje `IEnumerable<char>`, nie ma związku.

- id: 282
  question: Kiedy JIT kompiluje metodę do kodu maszynowego?
  answers:
    - text: Przy pierwszym wywołaniu metody w czasie działania programu
      correct: true
    - text: Podczas budowania projektu w Visual Studio, razem z generowaniem IL
      correct: false
    - text: Przy instalacji aplikacji na serwerze
      correct: false
    - text: Przy każdym wywołaniu metody od nowa, bez zapamiętywania wyniku
      correct: false
  explanation: |
    JIT kompiluje IL metody leniwie, gdy jest potrzebna, i cache'uje wynik (z tiered compilation może ją później zoptymalizować ponownie).
    Budowanie projektu generuje IL, a nie kod maszynowy; kompilacja przy instalacji to raczej `ReadyToRun` lub AOT, a nie JIT przy każdym wywołaniu.

- id: 283
  question: Co oznacza skrót CIL (dawniej MSIL)?
  answers:
    - text: Compiled Instruction Library - biblioteka skompilowanych instrukcji
      correct: false
    - text: Common Interface Layer - warstwa interfejsów systemowych
      correct: false
    - text: Central Integration Logic - logika integracji modułów
      correct: false
    - text: Common Intermediate Language - kod pośredni .NET
      correct: true
  explanation: |
    Wszystkie języki .NET kompilują się do CIL, który JIT zamienia na kod maszynowy.
    Pozostałe rozwinięcia są zmyślone.

- id: 284
  question: Czym jest kod niezarządzany?
  answers:
    - text: Kodem działającym poza kontrolą CLR, np. C/C++ lub COM
      correct: true
    - text: Kodem, który nie jest objęty testami jednostkowymi ani przeglądem
      correct: false
    - text: Kodem C# bez komentarzy XML i dokumentacji
      correct: false
    - text: Kodem C# skompilowanym w trybie Release, bez symboli debugowania
      correct: false
  explanation: |
    Kod niezarządzany sam zarządza pamięcią i jest wywoływany z .NET przez P/Invoke lub COM Interop.
    Komentarze, testy i tryb kompilacji nie decydują o tym, czy kod jest zarządzany.

- id: 285
  question: Jaka jest relacja między przestrzenią nazw a assembly?
  answers:
    - text: Assembly może mieć wiele namespace'ów, a namespace być w wielu assembly
      correct: true
    - text: Każda przestrzeń nazw jest kompilowana do osobnego assembly o tej samej nazwie
      correct: false
    - text: Każde assembly może mieć tylko jedną przestrzeń nazw, zgodną z nazwą projektu
      correct: false
    - text: Przestrzeń nazw i assembly to to samo - namespace to po prostu nazwa pliku `.dll`
      correct: false
  explanation: |
    Namespace to grupowanie logiczne, a assembly - fizyczne, i są od siebie niezależne.
    Na przykład `System.Collections.Generic` jest rozłożona na kilka assembly frameworka.

- id: 286
  question: Gdzie zapisana jest wersja assembly?
  answers:
    - text: W nazwie folderu, w którym leży plik
      correct: false
    - text: W rejestrze systemu Windows
      correct: false
    - text: W pliku README projektu
      correct: false
    - text: W manifeście assembly
      correct: true
  explanation: |
    Manifest zawiera nazwę, wersję, kulturę i zależności assembly, a wersję ustawia się w pliku projektu (Version, `AssemblyVersion`).
    README, rejestr i nazwa folderu nie są źródłem wersji dla CLR.

- id: 287
  question: Ile domen aplikacji (`AppDomain`) ma proces w .NET Core i .NET 5+?
  answers:
    - text: Jedną na każde załadowane assembly
      correct: false
    - text: Jedną
      correct: true
    - text: Jedną na każdy wątek
      correct: false
    - text: Dowolną liczbę, tworzoną przez `AppDomain.CreateDomain`
      correct: false
  explanation: |
    Nowy .NET obsługuje tylko jedną `AppDomain` na proces - `CreateDomain` rzuca `PlatformNotSupportedException`.
    Izolację zapewniają procesy i kontenery, a ładowanie i wyładowywanie kodu - `AssemblyLoadContext`.

- id: 288
  question: Czy Code Access Security (CAS) jest wspierany w .NET Core?
  answers:
    - text: Tak, ale tylko na Windows
      correct: false
    - text: Tak, w pełnej wersji z .NET Framework 2.0, z politykami ustalanymi przez administratora
      correct: false
    - text: Nie - granicą bezpieczeństwa są uprawnienia procesu i systemu operacyjnego
      correct: true
    - text: Tak, jest włączony domyślnie i ogranicza uprawnienia kodu pobranego z internetu
      correct: false
  explanation: |
    CAS był mechanizmem .NET Framework do ograniczania uprawnień częściowo zaufanego kodu i nie przeniesiono go do nowego .NET.
    Za izolację odpowiadają system operacyjny, kontenery i konta z ograniczonymi uprawnieniami.

- id: 289
  question: Która właściwość wątku sprawia, że nie blokuje on zakończenia procesu?
  answers:
    - text: "`ManagedThreadId = 0`"
      correct: false
    - text: Priority `=` Highest
      correct: false
    - text: "`IsBackground = true`"
      correct: true
    - text: "`IsAlive = false`"
      correct: false
  explanation: |
    Proces kończy się, gdy zakończą się wszystkie wątki pierwszoplanowe - wątki tła są wtedy przerywane.
    Priority wpływa na harmonogram, `IsAlive` jest tylko do odczytu, a `ManagedThreadId` to identyfikator.

- id: 290
  question: W jakim stanie jest wątek czekający na `lock`, Sleep lub Join?
  answers:
    - text: Running
      correct: false
    - text: "`WaitSleepJoin`"
      correct: true
    - text: Stopped
      correct: false
    - text: Unstarted
      correct: false
  explanation: |
    `WaitSleepJoin` oznacza, że wątek jest zablokowany w oczekiwaniu.
    Unstarted to wątek przed `Start()`, Stopped - zakończony, a Running - wykonujący kod.

- id: 291
  question: Która przestrzeń nazw zawiera klasy Thread, Monitor i Interlocked?
  answers:
    - text: "`System.Threading.Tasks`"
      correct: false
    - text: "`System.Threading`"
      correct: true
    - text: "`System.Collections.Concurrent`"
      correct: false
    - text: "`System.Diagnostics`"
      correct: false
  explanation: |
    Podstawowe mechanizmy wątków i synchronizacji są w `System.Threading`.
    `Task` i Parallel są w `System.Threading.Tasks`, kolekcje współbieżne w `System.Collections.Concurrent`, a Process czy Stopwatch w `System.Diagnostics`.

- id: 292
  question: Który mechanizm synchronizacji może działać między różnymi procesami?
  answers:
    - text: Nazwany Mutex
      correct: true
    - text: "`lock`"
      correct: false
    - text: "`SemaphoreSlim`"
      correct: false
    - text: Monitor
      correct: false
  explanation: |
    Mutex to obiekt systemowy - nazwany Mutex pozwala synchronizować wiele procesów.
    `lock` i Monitor działają w obrębie procesu, a `SemaphoreSlim` jest lekką, wewnątrzprocesową wersją semafora.

- id: 293
  question: Czego używać zamiast `Thread.Sleep` w kodzie asynchronicznym?
  answers:
    - text: "`Thread.Yield()` w pętli"
      correct: false
    - text: "`await Task.Delay()`"
      correct: true
    - text: "`while` z pustą pętlą"
      correct: false
    - text: "`Thread.SpinWait()`"
      correct: false
  explanation: |
    `Task.Delay` nie blokuje wątku - zwalnia go na czas oczekiwania.
    `Thread.Sleep`, `SpinWait`, pusta pętla i Yield w pętli blokują wątek lub marnują CPU.

- id: 294
  question: Dlaczego metody `Thread.Suspend` i `Thread.Resume` są przestarzałe?
  answers:
    - text: Bo zużywały dużo pamięci przy każdym zawieszeniu wątku
      correct: false
    - text: Bo zastąpiły je nowsze metody `Thread.Pause` i `Thread.Continue`
      correct: false
    - text: Bo działały tylko na procesorach jednordzeniowych
      correct: false
    - text: Bo zawieszony wątek mógł trzymać blokadę i powodować deadlock
      correct: true
  explanation: |
    Zawieszenie wątku w dowolnym momencie mogło zostawić zablokowane zasoby, przez co cały program się zakleszczał.
    Zastąpiono je sygnalizacją (`ManualResetEvent`, `SemaphoreSlim`, `CancellationToken`) - `Thread.Pause` i `Thread.Continue` nie istnieją.

- id: 295
  question: Jaki jest zalecany sposób zatrzymania długo działającej operacji w tle?
  answers:
    - text: Zabicie bieżącego procesu przez `Process.GetCurrentProcess().Kill()`
      correct: false
    - text: Kooperacyjne anulowanie przez `CancellationToken`
      correct: true
    - text: Ustawienie priorytetu wątku na Lowest, aż system go wstrzyma
      correct: false
    - text: "`Thread.Abort()`"
      correct: false
  explanation: |
    Operacja sprawdza token (np. `ThrowIfCancellationRequested`) i kończy się w bezpiecznym miejscu.
    `Thread.Abort` nie działa w .NET Core, zabicie procesu kończy całą aplikację, a niższy priorytet nie zatrzymuje operacji.

- id: 296
  question: Jak najprościej uruchomić pracę na wątku z puli w nowoczesnym C#?
  answers:
    - text: "`new Thread(DoWork).Start()` zawsze, bo jest szybsze"
      correct: false
    - text: "`ThreadPool.Create(DoWork)`"
      correct: false
    - text: "`Task.Run(() => DoWork())`"
      correct: true
    - text: "`Parallel.Start(DoWork)`"
      correct: false
  explanation: |
    `Task.Run` kolejkuje pracę w `ThreadPool` i zwraca `Task`, na który można poczekać.
    Nowy Thread jest droższy w tworzeniu, a `ThreadPool.Create` i `Parallel.Start` nie istnieją (są `ThreadPool.QueueUserWorkItem` i `Parallel.For/ForEach/Invoke`).

- id: 297
  question: Jak atomowo zwiększyć licznik współdzielony między wątkami?
  answers:
    - text: counter `+= 1` w zmiennej `volatile`
      correct: false
    - text: "`Thread.MemoryBarrier()`; counter++;"
      correct: false
    - text: "`Interlocked.Increment(ref counter)`"
      correct: true
    - text: counter++
      correct: false
  explanation: |
    `Interlocked.Increment` wykonuje odczyt, zwiększenie i zapis jako jedną atomową operację.
    counter++ i counter `+= 1` to trzy osobne kroki, a `volatile` i bariery pamięci nie czynią ich atomowymi.

- id: 298
  question: Czym livelock różni się od deadlocka?
  answers:
    - text: W livelocku wątki działają, ale nie robią postępu; w deadlocku czekają zablokowane
      correct: true
    - text: Livelock to inna nazwa race condition
      correct: false
    - text: Livelock występuje tylko w bazach danych, a deadlock wyłącznie w kodzie wielowątkowym
      correct: false
    - text: W livelocku jeden wątek trwale blokuje wszystkie pozostałe, a w deadlocku wątki ciągle zmieniają stan
      correct: false
  explanation: |
    Livelock przypomina dwie osoby ustępujące sobie w korytarzu w tę samą stronę - zużywa CPU, ale nic się nie dzieje.
    Nie jest ograniczony do baz danych, nie polega na trwałym zablokowaniu (to deadlock) i nie jest race condition.

- id: 299
  question: Dlaczego obiekty niemutowalne są bezpieczne wątkowo?
  answers:
    - text: Bo ich stan się nie zmienia, więc odczyty nie wymagają synchronizacji
      correct: true
    - text: Bo CLR automatycznie zakłada blokadę przy każdym dostępie do takiego obiektu
      correct: false
    - text: Bo są zawsze przechowywane na stosie wątku, który je utworzył
      correct: false
    - text: Bo mogą być używane tylko przez wątek, który je utworzył
      correct: false
  explanation: |
    Skoro nikt nie może zmodyfikować obiektu, nie ma wyścigów przy zapisie.
    Miejsce przechowywania nie ma znaczenia, CLR nie zakłada blokad, a obiekty niemutowalne mogą być swobodnie współdzielone przez wiele wątków.

- id: 300
  question: Po jakiej klasie zaleca się dziedziczyć przy tworzeniu własnych wyjątków?
  answers:
    - text: "`ApplicationException`"
      correct: false
    - text: Object
      correct: false
    - text: "`SystemException`"
      correct: false
    - text: "`Exception`"
      correct: true
  explanation: |
    Microsoft zaleca dziedziczenie bezpośrednio po `Exception` - `ApplicationException` nie wnosi wartości.
    `SystemException` jest przeznaczony dla wyjątków środowiska, a dziedziczenie po `object` nie da się rzucić przez `throw`.

- id: 301
  question: Do czego służy XSD?
  answers:
    - text: Do kompresji plików XML
      correct: false
    - text: Do opisu struktury dokumentów XML i ich walidacji
      correct: true
    - text: Do stylowania i transformacji dokumentów XML w przeglądarce
      correct: false
    - text: Do wykonywania zapytań na dokumentach XML
      correct: false
  explanation: |
    XSD (XML Schema Definition) definiuje elementy, atrybuty, typy i ograniczenia, z którymi dokument musi być zgodny.
    Stylowanie i transformacje to XSLT, zapytania - XPath i XQuery, a kompresja nie jest rolą XSD.

- id: 302
  question: W którym assembly zdefiniowany jest klasyczny ASP.NET MVC (.NET Framework)?
  answers:
    - text: "`System.Web.UI.dll`"
      correct: false
    - text: "`Microsoft.AspNetCore.Mvc.dll`"
      correct: false
    - text: "`System.Mvc.Core.dll`"
      correct: false
    - text: "`System.Web.Mvc.dll`"
      correct: true
  explanation: |
    Klasyczny MVC 5 jest w `System.Web.Mvc`.
    `Microsoft.AspNetCore.Mvc` należy do ASP.NET Core, `System.Web.UI` to przestrzeń nazw Web Forms (zawarta w `System.Web.dll`), a `System.Mvc.Core` nie istnieje.

- id: 303
  question: W którym folderze umieszcza się widok współdzielony przez wiele kontrolerów?
  answers:
    - text: wwwroot/views
      correct: false
    - text: "`App_Data/Views`"
      correct: false
    - text: Views/Shared
      correct: true
    - text: Views/Common
      correct: false
  explanation: |
    Silnik widoków szuka widoku najpierw w folderze kontrolera, a potem w Views/Shared.
    Folder Common nie jest przeszukiwany domyślnie, wwwroot służy do plików statycznych, a `App_Data` do danych.

- id: 304
  question: Gdzie w klasycznym ASP.NET MVC rejestruje się trasy konwencjonalne?
  answers:
    - text: W widoku `_Layout.cshtml`
      correct: false
    - text: W pliku `launchSettings.json`, w sekcji routes
      correct: false
    - text: W `App_Start/RouteConfig.cs`, wołanym z `Global.asax`
      correct: true
    - text: W pliku `appsettings.json`, w sekcji Routing:Routes
      correct: false
  explanation: |
    `RouteConfig.RegisterRoutes` dodaje trasy do `RouteTable.Routes` przy starcie aplikacji.
    `appsettings.json` i `launchSettings.json` pochodzą z ASP.NET Core i nie definiują tras, a layout to widok.

- id: 305
  question: Co wyświetla helper `ValidationSummary`?
  answers:
    - text: Statystyki wydajności walidacji dla wszystkich formularzy
      correct: false
    - text: Liczbę poprawnie wypełnionych pól
      correct: false
    - text: Zbiorczą listę błędów walidacji z `ModelState`
      correct: true
    - text: Podsumowanie wartości wszystkich pól formularza przed wysłaniem
      correct: false
  explanation: |
    `ValidationSummary` pokazuje w jednym miejscu wszystkie błędy (lub tylko błędy na poziomie modelu z opcją `ModelOnly`).
    Nie pokazuje pól formularza ani statystyk.

- id: 306
  question: Która cecha odróżnia silnik Razor od ASPX?
  answers:
    - text: Razor używa tagów `<% %>` i nie koduje wyjścia
      correct: false
    - text: Razor nie obsługuje pętli ani warunków
      correct: false
    - text: ASPX jest jedynym silnikiem widoków dostępnym w ASP.NET Core
      correct: false
    - text: Razor ma zwięzłą składnię z `@` i domyślnie koduje HTML
      correct: true
  explanation: |
    Razor ma czytelną składnię `@Model.Name` i automatycznie koduje HTML, co chroni przed XSS.
    Tagi `<% %>` należą do ASPX, który w ASP.NET Core nie istnieje, a Razor obsługuje `@if`, `@foreach` i inne konstrukcje.

- id: 307
  question: Jak w Razor wypisać znak `@` jako zwykły tekst?
  answers:
    - text: "&at;"
      correct: false
    - text: "`@{\"@\"}` to jedyny sposób"
      correct: false
    - text: \@
      correct: false
    - text: "`@@`"
      correct: true
  explanation: |
    Podwójny `@@` w Razor oznacza dosłowny znak `@`.
    Backslash nie jest sekwencją ucieczki w Razor, a encja HTML `&at;` nie istnieje (jest `&#64;`).
    Wyrażenie w bloku kodu zadziała, ale nie jest jedynym ani najprostszym sposobem.

- id: 308
  question: Jak wypisać w Razor surowy HTML bez kodowania?
  answers:
    - text: "`@(wartość)` z nawiasami"
      correct: false
    - text: "`@Html.Encode(wartość)`"
      correct: false
    - text: "`@Html.Raw(wartość)`"
      correct: true
    - text: "`@wartość`"
      correct: false
  explanation: |
    `Html.Raw` wyłącza automatyczne kodowanie - należy go używać tylko dla zaufanych danych.
    `@wartość` i `@(wartość)` są kodowane, a `Html.Encode` jawnie koduje treść.

- id: 309
  question: Która metoda ustawia ciasteczko uwierzytelniające w klasycznym Forms Authentication?
  answers:
    - text: "`HttpContext.SignInAsync(userName)` wywoływane w MVC 5"
      correct: false
    - text: "`Session.Login(userName)`"
      correct: false
    - text: "`FormsAuthentication.SetAuthCookie(userName, rememberMe)`"
      correct: true
    - text: "`Response.Authenticate(userName, persistent: true)`"
      correct: false
  explanation: |
    `SetAuthCookie` wystawia ciasteczko z biletem uwierzytelniającym, a `SignOut` je usuwa.
    `Session.Login` i `Response.Authenticate` nie istnieją, a `HttpContext.SignInAsync` to mechanizm ASP.NET Core.

- id: 310
  question: Jak rejestruje się wszystkie areas w klasycznym MVC?
  answers:
    - text: "`AreaRegistration.RegisterAllAreas()` w `Application_Start`"
      correct: true
    - text: Atrybutem `[RegisterArea]` nad każdym kontrolerem
      correct: false
    - text: Areas rejestrują się automatycznie bez żadnego kodu
      correct: false
    - text: "`services.AddAreas()` w `Program.cs`"
      correct: false
  explanation: |
    `RegisterAllAreas` wyszukuje klasy dziedziczące po `AreaRegistration` i wywołuje ich `RegisterArea`.
    `AddAreas` nie istnieje, a `[RegisterArea]` nie jest atrybutem MVC; w Core kontrolery oznacza się `[Area("Nazwa")]` i dodaje trasę z `{area:exists}`.

- id: 311
  question: Co umożliwiały Display Modes w MVC 4?
  answers:
    - text: Przełączanie motywu jasnego i ciemnego zależnie od ustawień systemu
      correct: false
    - text: Debugowanie widoków w przeglądarce
      correct: false
    - text: Serwowanie innych widoków zależnie od urządzenia, np. `Index.Mobile.cshtml`
      correct: true
    - text: Wyświetlanie widoków w trybie pełnoekranowym na tabletach i telefonach
      correct: false
  explanation: |
    Display Modes wybierały wariant widoku na podstawie żądania, np. User-Agent.
    Dziś zamiast tego stosuje się responsywny CSS; motywy i debugowanie to inne mechanizmy.

- id: 312
  question: Co się stanie, gdy wartość parametru nie spełnia ograniczenia trasy, np. `{id:int}` dla "abc"?
  answers:
    - text: Zostanie rzucony `FormatException` w akcji
      correct: false
    - text: Trasa nie zostanie dopasowana, zwykle będzie 404
      correct: true
    - text: Framework automatycznie przekonwertuje "abc" na liczbę
      correct: false
    - text: Parametr id otrzyma wartość 0
      correct: false
  explanation: |
    Ograniczenia tras są sprawdzane podczas dopasowania - niespełnione oznacza brak dopasowania.
    Akcja się nie wykona, więc nie dostanie 0 ani nie rzuci wyjątku, a konwersja "abc" na liczbę jest niemożliwa.

- id: 313
  question: Który folder zastępuje w ASP.NET Core foldery Content i Scripts z klasycznego MVC?
  answers:
    - text: Assets
      correct: false
    - text: Static
      correct: false
    - text: Public
      correct: false
    - text: wwwroot
      correct: true
  explanation: |
    W ASP.NET Core pliki statyczne domyślnie trafiają do wwwroot.
    Static, Public i Assets to konwencje innych frameworków lub dowolne nazwy, które trzeba by skonfigurować ręcznie.

- id: 314
  question: Która metoda kontrolera w klasycznym MVC obsługuje nieobsłużone wyjątki ze wszystkich jego akcji?
  answers:
    - text: Nadpisana metoda `OnException`
      correct: true
    - text: Metoda Dispose
      correct: false
    - text: Konstruktor kontrolera
      correct: false
    - text: Metoda `OnActionExecuting` z blokiem `try/catch`
      correct: false
  explanation: |
    Nadpisanie `OnException` pozwala zalogować błąd, ustawić `ExceptionHandled = true` i zwrócić widok błędu.
    Dispose zwalnia zasoby, `OnActionExecuting` wykonuje się przed akcją, a konstruktor tworzy kontroler.

- id: 315
  question: Co zwykle zawiera plik `_ViewStart.cshtml`?
  answers:
    - text: Definicje modeli (`@model`) wspólne dla wszystkich widoków w folderze
      correct: false
    - text: Ustawienie wspólnego layoutu, np. `@{ Layout = "_Layout"; }`
      correct: true
    - text: Konfigurację tras
      correct: false
    - text: Kod JavaScript ładowany na każdej stronie przed renderowaniem widoku
      correct: false
  explanation: |
    `_ViewStart` wykonuje się przed każdym widokiem w folderze, więc nie trzeba podawać layoutu w każdym z nich.
    Modele są w klasach, trasy w konfiguracji, a skrypty zwykle w layoucie.

- id: 316
  question: Jak w ASP.NET Core skonfigurować własne strony błędów dla kodów statusu, np. 404?
  answers:
    - text: "`customErrors mode=\"On\"` z `defaultRedirect` w `web.config`"
      correct: false
    - text: "`app.UseStatusCodePagesWithReExecute(\"/Error/{0}\")`"
      correct: true
    - text: Atrybut `[HandleError(View = "Error")]` na każdym kontrolerze
      correct: false
    - text: "`app.UseDeveloperExceptionPage()` w produkcji"
      correct: false
  explanation: |
    `UseStatusCodePagesWithReExecute` ponownie uruchamia pipeline dla wskazanej ścieżki z kodem statusu.
    `customErrors` i `[HandleError]` to mechanizmy klasycznego MVC, a strona deweloperska nie powinna być używana w produkcji.

- id: 317
  question: Dlaczego walidacja po stronie serwera jest obowiązkowa, nawet jeśli istnieje walidacja kliencka?
  answers:
    - text: Bo walidację kliencką łatwo ominąć, wysyłając żądanie bezpośrednio
      correct: true
    - text: Bo walidacja kliencka nie obsługuje pól wymaganych ani zakresów
      correct: false
    - text: Bo walidacja kliencka działa tylko w przeglądarce Edge
      correct: false
    - text: Bo walidacja serwerowa jest szybsza i nie obciąża przeglądarki
      correct: false
  explanation: |
    Każdy może wyłączyć JavaScript lub wysłać żądanie np. przez curl, więc serwer musi samodzielnie sprawdzić dane.
    Walidacja kliencka działa w każdej przeglądarce i obsługuje pola wymagane, a jej zaletą jest szybki feedback dla użytkownika, a nie bezpieczeństwo.

- id: 318
  question: Do czego służy atrybut `[Remote]` w MVC?
  answers:
    - text: Do zdalnego wywołania procedury składowanej na serwerze bazy danych
      correct: false
    - text: Do oznaczenia akcji dostępnej tylko przez połączenie VPN lub sieć firmową
      correct: false
    - text: Do walidacji pola przez akcję serwera, np. sprawdzenia zajętości loginu
      correct: true
    - text: Do pobierania danych do widoku z zewnętrznego API przez `HttpClient`
      correct: false
  explanation: |
    Remote validation wysyła wartość pola do akcji zwracającej JSON `true/false`, więc użytkownik dostaje informację bez wysyłania formularza.
    Nie wywołuje procedur, nie integruje z API i nie dotyczy sieci VPN; nie zastępuje też walidacji przy zapisie.

- id: 319
  question: Jak w widoku zdefiniować treść sekcji Scripts renderowanej przez layout?
  answers:
    - text: "`@section Scripts { ... }`"
      correct: true
    - text: "`<section name=\"Scripts\">` ... `</section>`"
      correct: false
    - text: "`@RenderSection(\"Scripts\")`"
      correct: false
    - text: "`@Html.Section(\"Scripts\")`"
      correct: false
  explanation: |
    Widok definiuje sekcję przez `@section`, a layout renderuje ją przez `@RenderSection("Scripts", required: false)`.
    Zwykły znacznik HTML `<section>` nie jest sekcją Razor, a `Html.Section` nie istnieje.

- id: 320
  question: Co oznacza atrybut `[NonAction]` na publicznej metodzie kontrolera?
  answers:
    - text: Metoda jest asynchroniczna
      correct: false
    - text: Metoda nie jest dostępna jako akcja przez URL
      correct: true
    - text: Metoda może być wywołana tylko przez administratora
      correct: false
    - text: Metoda wykonuje się przed każdą akcją
      correct: false
  explanation: |
    Domyślnie każda publiczna metoda kontrolera jest akcją - `[NonAction]` to wyłącza.
    Kod przed akcjami realizują filtry, asynchroniczność wynika z sygnatury, a uprawnienia określa `[Authorize]`.

- id: 321
  question: W jakiej kolejności sprawdzane są trasy w `RouteTable`?
  answers:
    - text: Od najbardziej szczegółowej, sortowane automatycznie
      correct: false
    - text: Alfabetycznie według nazwy trasy
      correct: false
    - text: Losowo
      correct: false
    - text: W kolejności dodania - pierwsza pasująca wygrywa
      correct: true
  explanation: |
    Klasyczny routing sprawdza trasy po kolei, więc bardziej szczegółowe muszą być dodane przed ogólnymi.
    Automatyczne sortowanie według szczegółowości występuje w routingu atrybutowym i endpoint routingu ASP.NET Core, ale nie w klasycznym `RouteTable`.

- id: 322
  question: Które dwa miejsca konfigurują działanie routingu w klasycznym ASP.NET MVC?
  answers:
    - text: "`_Layout.cshtml` i `_ViewStart.cshtml`"
      correct: false
    - text: "`packages.config` i `AssemblyInfo.cs`"
      correct: false
    - text: "`Web.config` i `Global.asax` (rejestracja tras)"
      correct: true
    - text: "`appsettings.json` (sekcja Routes) i `Program.cs`"
      correct: false
  explanation: |
    `Web.config` rejestruje `UrlRoutingModule` w pipeline IIS, a `Application_Start` w `Global.asax` wywołuje `RouteConfig.RegisterRoutes`.
    `appsettings.json` i `Program.cs` to ASP.NET Core, widoki nie konfigurują routingu, a `packages.config` i `AssemblyInfo.cs` dotyczą zależności i metadanych.

- id: 323
  question: Która metoda dodaje trasę w aplikacji Web Forms, mapując URL na plik `.aspx`?
  answers:
    - text: "`routes.MapRoute`"
      correct: false
    - text: "`routes.MapControllerRoute`"
      correct: false
    - text: "`routes.MapAspx`"
      correct: false
    - text: "`routes.MapPageRoute`"
      correct: true
  explanation: |
    `MapPageRoute` kieruje URL do fizycznej strony `.aspx`.
    `MapRoute` mapuje na kontroler i akcję w MVC, `MapControllerRoute` to odpowiednik w ASP.NET Core, a `MapAspx` nie istnieje.

- id: 324
  question: Jak w obrębie jednego typu filtrów zmienić domyślną kolejność globalne - kontroler - akcja?
  answers:
    - text: Nie da się jej zmienić
      correct: false
    - text: Ustawiając właściwość Order filtra
      correct: true
    - text: Dziedzicząc filtr po innym filtrze
      correct: false
    - text: Zmieniając kolejność `using` na początku pliku
      correct: false
  explanation: |
    Właściwość Order pozwala jawnie ustalić kolejność filtrów tego samego typu.
    Dyrektywy `using` i dziedziczenie nie wpływają na kolejność wykonania, a zmiana jest jak najbardziej możliwa.

- id: 325
  question: Na których poziomach można zastosować filtr w ASP.NET MVC?
  answers:
    - text: Tylko na poziomie akcji
      correct: false
    - text: Na poziomie akcji, kontrolera lub globalnie
      correct: true
    - text: Tylko na poziomie widoku, przez dyrektywę `@filter`
      correct: false
    - text: Tylko globalnie, przez rejestrację w sekcji filters pliku `web.config`
      correct: false
  explanation: |
    Filtr można dodać atrybutem na metodzie, na klasie kontrolera lub zarejestrować globalnie (`GlobalFilters` lub `options.Filters` w Core).
    Filtrów nie konfiguruje się w `web.config` ani na widokach.

- id: 326
  question: Po której klasie bazowej najczęściej dziedziczy własny filtr akcji w MVC?
  answers:
    - text: "`ActionResult` z metodą `ExecuteResult`"
      correct: false
    - text: "`ActionFilterAttribute`"
      correct: true
    - text: Controller
      correct: false
    - text: "`DelegatingHandler` z metodą `SendAsync`"
      correct: false
  explanation: |
    `ActionFilterAttribute` pozwala nadpisać `OnActionExecuting`, `OnActionExecuted` i metody filtrów wyników.
    Controller to baza kontrolerów, `ActionResult` - wyników akcji, a `DelegatingHandler` - handlerów `HttpClient` lub Web API.

- id: 327
  question: Jak w filtrze akcji przerwać wykonanie i nie uruchamiać akcji?
  answers:
    - text: Wywołać `Environment.Exit()`
      correct: false
    - text: Ustawić `context.Result` na wynik, np. `ForbidResult` lub `RedirectResult`
      correct: true
    - text: Rzucić `StackOverflowException`, który framework przechwyci jako sygnał przerwania
      correct: false
    - text: Zwrócić `null` z metody `OnActionExecuting`, co anuluje wykonanie akcji
      correct: false
  explanation: |
    Ustawienie Result w filtrze powoduje short-circuit - akcja i kolejne filtry się nie wykonują, a zwracany jest podany wynik.
    `StackOverflowException` zabija proces, `Environment.Exit` kończy aplikację, a `OnActionExecuting` zwraca `void`.

- id: 328
  question: Jak zapisuje się blok kodu w widoku Razor?
  answers:
    - text: "`{{ ... }}`"
      correct: false
    - text: "`<?cs ... ?>`"
      correct: false
    - text: "`<% ... %>`"
      correct: false
    - text: "`@{ ... }`"
      correct: true
  explanation: |
    `@{ }` otwiera blok kodu C# w Razor.
    `<% %>` to składnia ASPX, `{{ }}` - interpolacja w Angularze czy Handlebars, a `<?cs ?>` nie istnieje.

- id: 329
  question: Jak w widoku ASPX wypisać wartość z automatycznym kodowaniem HTML?
  answers:
    - text: "`<%# wartość %>`"
      correct: false
    - text: "`<%: wartość %>`"
      correct: true
    - text: "`<%= wartość %>`"
      correct: false
    - text: "`<%@ wartość %>`"
      correct: false
  explanation: |
    `<%: %>` (od ASP.NET 4) koduje HTML przy wypisywaniu.
    `<%= %>` wypisuje bez kodowania, `<%# %>` to data binding, a `<%@ %>` to dyrektywa strony.

- id: 330
  question: Jakie rozszerzenie mają widoki Razor pisane w C#?
  answers:
    - text: "`.razor`"
      correct: false
    - text: "`.vbhtml`"
      correct: false
    - text: "`.cshtml`"
      correct: true
    - text: "`.aspx`"
      correct: false
  explanation: |
    Widoki i strony Razor w C# mają rozszerzenie `.cshtml`.
    `.razor` to komponenty Blazor, `.aspx` - strony Web Forms, a `.vbhtml` - widoki Razor w Visual Basic.

- id: 331
  question: Jak zapisać komentarz w Razor, który nie trafi do wygenerowanego HTML?
  answers:
    - text: // komentarz poza blokiem kodu
      correct: false
    - text: "`<!-- komentarz -->`"
      correct: false
    - text: "`@* komentarz *@`"
      correct: true
    - text: "`<%-- komentarz --%>`"
      correct: false
  explanation: |
    Komentarz Razor jest usuwany na serwerze.
    Komentarz HTML trafia do przeglądarki, `//` działa tylko wewnątrz bloku kodu C#, a `<%-- --%>` to składnia ASPX.

- id: 332
  question: Czy ASP.NET Core wspiera Web Forms?
  answers:
    - text: Tak, ale tylko w trybie in-process w IIS
      correct: false
    - text: Tak, po instalacji pakietu `Microsoft.AspNetCore.WebForms`
      correct: false
    - text: Nie - Web Forms istnieje tylko w .NET Framework
      correct: true
    - text: Tak, w pełni
      correct: false
  explanation: |
    Web Forms opiera się na `System.Web` i nie zostało przeniesione do ASP.NET Core.
    Nie ma oficjalnego pakietu przywracającego Web Forms, a tryb hostingu nie ma znaczenia.
    Migruje się je zwykle do Razor Pages lub Blazor.

- id: 333
  question: Jaką korzyść daje `ViewModel` względem przekazywania encji bazy prosto do widoku?
  answers:
    - text: Zawiera dokładnie dane potrzebne widokowi i chroni przed over-postingiem
      correct: true
    - text: Automatycznie generuje migracje
      correct: false
    - text: Przyspiesza zapytania do bazy danych, bo EF pobiera wtedy mniej kolumn automatycznie
      correct: false
    - text: Eliminuje potrzebę walidacji, bo dane z widoku trafiają bezpośrednio do encji
      correct: false
  explanation: |
    `ViewModel` łączy dane z wielu źródeł, dodaje pola pomocnicze i wystawia tylko te właściwości, które formularz może zmienić.
    Nie wpływa na wydajność zapytań, nie generuje migracji i wręcz jest miejscem na reguły walidacji formularza.

- id: 334
  question: Kiedy w MVC 4/5 działa minifikacja paczek z `BundleConfig`?
  answers:
    - text: Gdy debug jest wyłączony w `web.config` lub ustawiono `BundleTable.EnableOptimizations = true`
      correct: true
    - text: Tylko po ręcznym uruchomieniu zewnętrznego narzędzia minifikującego w procesie budowania
      correct: false
    - text: Zawsze, niezależnie od konfiguracji kompilacji i ustawień w `web.config`
      correct: false
    - text: Tylko w trybie Debug
      correct: false
  explanation: |
    W trybie debug pliki są serwowane osobno i bez minifikacji, co ułatwia debugowanie.
    Optymalizacje włącza tryb release (compilation `debug="false"`) lub jawne `EnableOptimizations`, bez dodatkowych narzędzi.

- id: 335
  question: Ile żądań przetrwa wartość w `TempData`, jeśli nie zostanie odczytana?
  answers:
    - text: Tylko do końca bieżącego żądania
      correct: false
    - text: Do momentu odczytu, potem jest oznaczana do usunięcia
      correct: true
    - text: Zawsze dokładnie jedno kolejne żądanie, niezależnie od tego, czy wartość została odczytana
      correct: false
    - text: Przez cały czas trwania sesji użytkownika, także po odczytaniu wartości
      correct: false
  explanation: |
    `TempData` usuwa wartość dopiero po jej odczytaniu - Keep i Peek pozwalają ją zachować.
    Nie żyje do końca sesji po odczycie, a dane tylko na bieżące żądanie to `ViewData` lub `ViewBag`.

- id: 336
  question: Co robi `TempData.Keep()`?
  answers:
    - text: Oznacza odczytane wartości do zachowania na kolejne żądanie
      correct: true
    - text: Blokuje `TempData` przed odczytem w innych żądaniach tego samego użytkownika
      correct: false
    - text: Zapisuje wartości `TempData` na stałe w bazie danych powiązanej z sesją
      correct: false
    - text: Usuwa wszystkie wartości z `TempData`
      correct: false
  explanation: |
    `Keep()` (lub `Keep("klucz")`) anuluje oznaczenie do usunięcia po odczycie.
    Do czyszczenia służy `Clear()`, `TempData` nie jest zapisywane w bazie przez Keep, a odczytu nie da się zablokować.

- id: 337
  question: Czym różni się `TempData.Peek("klucz")` od zwykłego odczytu `TempData["klucz"]`?
  answers:
    - text: Peek usuwa wartość od razu, jeszcze przed końcem żądania
      correct: false
    - text: Peek odczytuje wartość bez oznaczania jej do usunięcia
      correct: true
    - text: Peek zwraca wartość zapisaną w poprzedniej sesji użytkownika
      correct: false
    - text: Peek działa tylko dla wartości liczbowych
      correct: false
  explanation: |
    Peek to odczyt połączony z Keep dla danego klucza, więc wartość będzie dostępna także w kolejnym żądaniu.
    Nie usuwa wartości, nie sięga do innych sesji i działa dla dowolnego typu.

- id: 338
  question: Co zastąpiło child actions (`[ChildActionOnly]`) w ASP.NET Core?
  answers:
    - text: View components
      correct: true
    - text: Partial views z kontrolerem
      correct: false
    - text: Middleware
      correct: false
    - text: Tag helpery bez logiki
      correct: false
  explanation: |
    View components renderują fragment strony z własną logiką, np. menu lub koszyk.
    Partial view nie ma własnej logiki pobierania danych, middleware działa na poziomie pipeline'u HTTP, a tag helpery służą głównie do generowania znaczników.

- id: 339
  question: Która biblioteka służy do mockowania zależności w testach .NET?
  answers:
    - text: Moq
      correct: true
    - text: FluentAssertions
      correct: false
    - text: Selenium
      correct: false
    - text: xUnit
      correct: false
  explanation: |
    Moq (podobnie jak NSubstitute czy FakeItEasy) tworzy atrapy interfejsów.
    xUnit to framework testowy, FluentAssertions - biblioteka asercji, a Selenium - narzędzie do testów przeglądarkowych.

- id: 340
  question: Czy kod Razor zadziała w zewnętrznym pliku `.js` dołączonym do strony?
  answers:
    - text: Nie - Razor przetwarza tylko `.cshtml`, a `.js` jest serwowany statycznie
      correct: true
    - text: Tak, jeśli znacznik script dołączający plik ma atrybut `type="razor"`
      correct: false
    - text: Tak, ale tylko w trybie Debug, gdy Razor runtime compilation jest włączony
      correct: false
    - text: Tak, Razor przetwarza wszystkie pliki w wwwroot przed wysłaniem ich do przeglądarki
      correct: false
  explanation: |
    Razor można użyć w skrypcie osadzonym w widoku, ale pliki `.js` są wysyłane bez przetwarzania.
    Dane do zewnętrznego skryptu przekazuje się np. przez atrybuty `data-*` lub zmienną JSON w widoku.

- id: 341
  question: Jak zwrócić zwykły tekst z akcji MVC?
  answers:
    - text: "`return Json(\"tekst\")`;"
      correct: false
    - text: "`return View(\"tekst\")`;"
      correct: false
    - text: "`return Content(\"tekst\")`;"
      correct: true
    - text: "`return File(\"tekst\")`;"
      correct: false
  explanation: |
    Content zwraca `ContentResult` z tekstem i opcjonalnym typem MIME.
    View szukałby widoku o nazwie "tekst", Json zwróciłby JSON z cudzysłowami, a File zwraca plik.

- id: 342
  question: Co trzeba dodać w klasycznym MVC, aby akcja zwracała JSON dla żądań `GET`?
  answers:
    - text: "Nagłówek Content-Type: text/html w odpowiedzi akcji"
      correct: false
    - text: Atrybut `[HttpPost]` na akcji zwracającej JSON
      correct: false
    - text: Nic - JSON dla `GET` jest zawsze dozwolony
      correct: false
    - text: "`JsonRequestBehavior.AllowGet` w wywołaniu `Json()`"
      correct: true
  explanation: |
    Klasyczny MVC domyślnie blokował JSON dla `GET` (ochrona przed JSON hijacking), więc wymagał `AllowGet`.
    `[HttpPost]` zmienia dozwoloną metodę, a nie pozwala na `GET`; text/html to zły typ treści, a w ASP.NET Core to ograniczenie już nie istnieje.

- id: 343
  question: Który atrybut jest wbudowanym filtrem autoryzacji w MVC?
  answers:
    - text: "`[OutputCache]`"
      correct: false
    - text: "`[HttpGet]`"
      correct: false
    - text: "`[ValidateInput]`"
      correct: false
    - text: "`[Authorize]`"
      correct: true
  explanation: |
    `[Authorize]` sprawdza, czy użytkownik jest zalogowany i ma wymagane role lub polityki.
    `[HttpGet]` ogranicza metodę HTTP, `[ValidateInput]` dotyczy walidacji danych wejściowych (np. HTML), a `[OutputCache]` - cache'owania.

- id: 344
  question: Który atrybut Data Annotations porównuje wartość pola z innym polem, np. potwierdzenie hasła?
  answers:
    - text: "`[Compare(\"Password\")]`"
      correct: true
    - text: "`[Required]`"
      correct: false
    - text: "`[Range]`"
      correct: false
    - text: "`[StringLength]`"
      correct: false
  explanation: |
    `[Compare]` sprawdza, czy dwie właściwości mają tę samą wartość.
    `[Range]` sprawdza zakres liczbowy, `[Required]` obecność wartości, a `[StringLength]` długość tekstu.

- id: 345
  question: Czego NIE wychwyci filtr wyjątków MVC?
  answers:
    - text: Wyjątku rzuconego w akcji kontrolera
      correct: false
    - text: Wyjątku rzuconego podczas model bindingu w akcji
      correct: false
    - text: Wyjątku rzuconego w filtrze akcji
      correct: false
    - text: Wyjątku rzuconego w middleware poza pipeline MVC
      correct: true
  explanation: |
    Filtry wyjątków działają wewnątrz pipeline'u MVC - błędy z middleware, routingu czy plików statycznych obsługuje middleware obsługi wyjątków.
    Wyjątki z akcji, filtrów akcji i wiązania modelu są w zasięgu filtra.

- id: 346
  question: Dlaczego ASP.NET MVC lepiej wspiera TDD niż Web Forms?
  answers:
    - text: Bo MVC nie korzysta z obiektów HTTP, więc nie trzeba ich mockować
      correct: false
    - text: Bo kontrolery to zwykłe klasy testowalne z mockami
      correct: true
    - text: Bo MVC automatycznie generuje testy jednostkowe dla każdego kontrolera
      correct: false
    - text: Bo Web Forms nie pozwalają pisać kodu C#, tylko znaczniki deklaratywne
      correct: false
  explanation: |
    Logika w kontrolerach jest oddzielona od widoku i cyklu życia strony, więc łatwo ją testować.
    MVC nie generuje testów, Web Forms używają C# (code-behind), a MVC jak najbardziej opiera się na HTTP.

- id: 347
  question: Czym `Response.Output.Write` różni się od `Response.Write`?
  answers:
    - text: "`Response.Output.Write` wspiera formatowanie jak `string.Format`"
      correct: true
    - text: "`Response.Write` działa tylko w MVC, a `Response.Output.Write` w Web Forms"
      correct: false
    - text: "`Response.Output.Write` zapisuje tekst do pliku logu zamiast do odpowiedzi"
      correct: false
    - text: "`Response.Output.Write` wysyła odpowiedź w formacie JSON"
      correct: false
  explanation: |
    `Response.Output` to `TextWriter`, więc `Write("Suma: {0}", total)` formatuje tekst.
    Nie zapisuje do logu ani nie serializuje JSON, a `Response.Write` był używany głównie w Web Forms.

- id: 348
  question: W której fazie cyklu strony Web Forms ładowany jest `ViewState`?
  answers:
    - text: W Render, tuż przed wysłaniem HTML do przeglądarki
      correct: false
    - text: W `PreInit`, zanim kontrolki zostaną utworzone
      correct: false
    - text: Po Init, w fazie `LoadViewState`, przed Load
      correct: true
    - text: W Unload
      correct: false
  explanation: |
    `ViewState` jest odtwarzany po inicjalizacji kontrolek, więc jest dostępny od `PreLoad` i Load.
    W `PreInit` kontrolki jeszcze nie istnieją w pełni, a Render i Unload są na końcu cyklu (`ViewState` zapisuje się przed Render w `SaveViewState`).

- id: 349
  question: Po jakiej klasie dziedziczą strony Web Forms?
  answers:
    - text: "`System.Web.UI.Page`"
      correct: true
    - text: "`System.Web.Mvc.Controller`"
      correct: false
    - text: "`System.Windows.Forms.Form`"
      correct: false
    - text: "`Microsoft.AspNetCore.Mvc.RazorPages.PageModel`"
      correct: false
  explanation: |
    Każda strona `.aspx` dziedziczy po `System.Web.UI.Page`.
    Controller to baza kontrolerów MVC, Form - okien WinForms, a `PageModel` - Razor Pages w ASP.NET Core.

- id: 350
  question: Którego walidatora Web Forms użyć do sprawdzenia, czy hasło i jego potwierdzenie są identyczne?
  answers:
    - text: "`RegularExpressionValidator`"
      correct: false
    - text: "`RangeValidator`"
      correct: false
    - text: "`CompareValidator`"
      correct: true
    - text: "`RequiredFieldValidator`"
      correct: false
  explanation: |
    `CompareValidator` porównuje `ControlToValidate` z `ControlToCompare`.
    `RangeValidator` sprawdza zakres, `RequiredFieldValidator` - wypełnienie pola, a `RegularExpressionValidator` - zgodność ze wzorcem.

- id: 351
  question: Jaki jest główny koszt korzystania z `ViewState`?
  answers:
    - text: Obciążenie bazy danych, bo `ViewState` jest zapisywany w tabeli przy każdym żądaniu
      correct: false
    - text: Brak możliwości używania JavaScriptu na stronie
      correct: false
    - text: Utrata wszystkich danych użytkowników przy każdym restarcie serwera aplikacji
      correct: false
    - text: Większy rozmiar strony, bo stan wędruje przy każdym postbacku
      correct: true
  explanation: |
    `ViewState` jest zakodowany w ukrytym polu, więc duży stan znacząco zwiększa ruch sieciowy.
    Nie trafia do bazy, nie zależy od restartu serwera (jest po stronie klienta) i nie blokuje JavaScriptu.

- id: 352
  question: Jak długo istnieją dane w `ViewState`?
  answers:
    - text: Do restartu aplikacji
      correct: false
    - text: Tylko w obrębie danej strony, przez kolejne postbacki
      correct: true
    - text: Przez 20 minut, niezależnie od nawigacji między stronami
      correct: false
    - text: Do końca sesji użytkownika, także po przejściu na inne strony
      correct: false
  explanation: |
    `ViewState` jest związany z konkretną stroną - po przejściu na inną stronę jest tracony.
    Dane na czas sesji przechowuje Session, a 20 minut to domyślny timeout sesji, nie `ViewState`.

- id: 353
  question: Który walidator Web Forms pozwala na własną logikę walidacji?
  answers:
    - text: "`ValidationSummary`"
      correct: false
    - text: "`RequiredFieldValidator`"
      correct: false
    - text: "`CustomValidator`"
      correct: true
    - text: "`CompareValidator`"
      correct: false
  explanation: |
    `CustomValidator` wywołuje własną funkcję po stronie serwera (`ServerValidate`) i opcjonalnie klienta.
    `CompareValidator` porównuje wartości, `ValidationSummary` tylko wyświetla błędy, a `RequiredFieldValidator` sprawdza wypełnienie pola.

- id: 354
  question: Jaką sygnaturę ma typowy handler zdarzenia kontrolki Web Forms?
  answers:
    - text: "`void Handler(object sender, EventArgs e)`"
      correct: true
    - text: "`IActionResult Handler(HttpContext context)`"
      correct: false
    - text: "`Task Handler()`"
      correct: false
    - text: "`void Handler(int id)`"
      correct: false
  explanation: |
    Wzorzec zdarzeń .NET przekazuje nadawcę i argumenty zdarzenia.
    `IActionResult` zwracają akcje MVC, a pozostałe sygnatury nie pasują do delegata `EventHandler`.

- id: 355
  question: Czy aplikacja ASP.NET Core wymaga pliku `web.config`?
  answers:
    - text: Nie - `web.config` jest potrzebny tylko przy hostowaniu w IIS i generuje go publikacja
      correct: true
    - text: Tak, bo tylko w nim można przechowywać connection stringi i ustawienia aplikacji
      correct: false
    - text: Tak, ale tylko w środowisku Development, gdzie konfiguruje Kestrela
      correct: false
    - text: Tak, zawsze
      correct: false
  explanation: |
    ASP.NET Core konfiguruje się przez `appsettings.json` i inne providery, a `web.config` jedynie konfiguruje ASP.NET Core Module w IIS.
    Connection stringi trzyma się w appsettings, zmiennych środowiskowych lub Key Vault.

- id: 356
  question: Dlaczego w folderze `App_Code` domyślnie nie można mieszać plików C# i VB.NET?
  answers:
    - text: Bo `App_Code` akceptuje wyłącznie pliki widoków `.cshtml` i `.aspx`
      correct: false
    - text: Bo VB.NET nie jest obsługiwany przez ASP.NET
      correct: false
    - text: Bo pliki źródłowe VB.NET muszą być umieszczone w folderze bin
      correct: false
    - text: Bo cały folder kompiluje się do jednego assembly w jednym języku
      correct: true
  explanation: |
    `App_Code` jest kompilowany do jednego assembly, więc pliki w różnych językach trzeba rozdzielić do podfolderów zarejestrowanych w `codeSubDirectories`.
    VB.NET jest wspierany, `App_Code` zawiera kod klas, a folder bin to miejsce na skompilowane assembly.

- id: 357
  question: Jakim narzędziem szyfruje się sekcje `web.config` w ramach protected configuration?
  answers:
    - text: "`dotnet user-secrets`"
      correct: false
    - text: sqlcmd
      correct: false
    - text: "`aspnet_regiis`"
      correct: true
    - text: certutil
      correct: false
  explanation: |
    `aspnet_regiis` -pe szyfruje wybraną sekcję providerem DPAPI lub RSA.
    `dotnet user-secrets` przechowuje sekrety deweloperskie w ASP.NET Core, sqlcmd to klient SQL Server, a certutil zarządza certyfikatami.

- id: 358
  question: Którą bibliotekę Microsoft zaleca zamiast przestarzałego `SmtpClient` do wysyłki e-maili?
  answers:
    - text: Polly
      correct: false
    - text: MailKit
      correct: true
    - text: "`Newtonsoft.Json`"
      correct: false
    - text: "`System.Net.WebClient`"
      correct: false
  explanation: |
    Dokumentacja `SmtpClient` wskazuje MailKit (lub zewnętrzne usługi) jako nowoczesną alternatywę.
    `WebClient` służy do HTTP i jest przestarzały, `Newtonsoft.Json` to serializacja, a Polly - polityki odporności.

- id: 359
  question: Które nagłówki odpowiedzi zapobiegają cache'owaniu strony przez przeglądarkę?
  answers:
    - text: "Accept-Encoding: gzip, deflate"
      correct: false
    - text: "Content-Type: text/html"
      correct: false
    - text: "Connection: keep-alive, Keep-Alive: `timeout=0`"
      correct: false
    - text: "Cache-Control: no-cache, no-store"
      correct: true
  explanation: |
    no-store zabrania przechowywania odpowiedzi, a no-cache wymusza ponowną walidację u serwera.
    Content-Type określa format, Accept-Encoding to nagłówek żądania o kompresji, a Connection steruje połączeniem TCP.

- id: 360
  question: Który handler w `Global.asax` obsługuje nieobsłużone wyjątki aplikacji?
  answers:
    - text: "`Application_Start`"
      correct: false
    - text: "`Application_Error`"
      correct: true
    - text: "`Application_BeginRequest`"
      correct: false
    - text: "`Session_End`"
      correct: false
  explanation: |
    `Application_Error` jest wywoływany dla każdego nieobsłużonego wyjątku i pozwala go zalogować.
    `Application_Start` uruchamia się przy starcie, `Session_End` przy końcu sesji (tylko `InProc`), a `BeginRequest` na początku każdego żądania.

- id: 361
  question: Jakiego protokołu używają klasyczne usługi ASMX do komunikacji?
  answers:
    - text: gRPC z Protobuf przez HTTP/2
      correct: false
    - text: MQTT
      correct: false
    - text: SOAP przesyłanego przez HTTP
      correct: true
    - text: WebSocket z formatem JSON
      correct: false
  explanation: |
    Usługi ASMX wymieniają komunikaty SOAP w XML.
    gRPC to nowoczesny protokół RPC, WebSocket służy do dwukierunkowej komunikacji w czasie rzeczywistym, a MQTT to protokół IoT.

- id: 362
  question: Jak w ASP.NET sprawdzić w kodzie, czy użytkownik należy do roli Admin?
  answers:
    - text: "`Session[\"Role\"] == \"Admin\"` jako jedyny sposób"
      correct: false
    - text: "`Roles.Exists(\"Admin\")`"
      correct: false
    - text: "`Request.Headers[\"Admin\"]`"
      correct: false
    - text: "`User.IsInRole(\"Admin\")`"
      correct: true
  explanation: |
    `IsInRole` sprawdza role z tożsamości uwierzytelnionego użytkownika.
    Sesja nie jest źródłem prawdy o rolach, nagłówek może podać każdy klient, a `Roles.Exists` sprawdza, czy rola istnieje, a nie czy użytkownik do niej należy.

- id: 363
  question: W którym zdarzeniu strony można programowo ustawić motyw (Theme) w Web Forms?
  answers:
    - text: "`Page_Load`"
      correct: false
    - text: "`Page_PreInit`"
      correct: true
    - text: "`Page_PreRender`"
      correct: false
    - text: "`Page_Unload`"
      correct: false
  explanation: |
    Motyw musi być ustawiony, zanim kontrolki zostaną utworzone i otrzymają skórki, więc tylko w `PreInit`.
    W Load i późniejszych zdarzeniach jest już za późno - próba zmiany rzuca wyjątek.

- id: 364
  question: Jaki kod statusu HTTP zwraca `Response.RedirectPermanent`?
  answers:
    - text: 302 Found
      correct: false
    - text: 404 Not Found
      correct: false
    - text: 307 Temporary Redirect
      correct: false
    - text: 301 Moved Permanently
      correct: true
  explanation: |
    `RedirectPermanent` informuje przeglądarki i wyszukiwarki, że zasób przeniesiono na stałe, więc SEO przechodzi na nowy adres.
    Zwykły `Response.Redirect` zwraca 302, 307 to przekierowanie tymczasowe z zachowaniem metody, a 404 oznacza brak zasobu.

- id: 365
  question: Co zastąpiło uwierzytelnianie Microsoft Passport?
  answers:
    - text: Basic Authentication
      correct: false
    - text: Konto Microsoft i protokoły jak OpenID Connect
      correct: true
    - text: Windows Authentication
      correct: false
    - text: Forms Authentication z ciasteczkiem uwierzytelniającym
      correct: false
  explanation: |
    Passport był usługą SSO Microsoftu, z której wyrosło konto Microsoft (dawniej Windows Live ID), a współcześnie stosuje się OpenID Connect i OAuth 2.0.
    Forms, Windows i Basic Authentication to osobne, starsze mechanizmy, a nie następcy Passport.

- id: 366
  question: Jaka była główna zaleta uwierzytelniania Passport?
  answers:
    - text: Automatyczne tworzenie kont w Active Directory
      correct: false
    - text: Szyfrowanie bazy danych aplikacji kluczem dostarczanym przez Microsoft
      correct: false
    - text: Brak potrzeby połączenia z internetem przy logowaniu użytkownika
      correct: false
    - text: Jedno logowanie do wielu witryn (SSO) bez trzymania haseł
      correct: true
  explanation: |
    Strona delegowała logowanie do Passport i otrzymywała bilet, więc nie zarządzała hasłami.
    Wymagał internetu, nie szyfrował baz danych i nie tworzył kont w AD.

- id: 367
  question: Która kontrolka Web Forms wyświetla różną treść dla zalogowanych i anonimowych użytkowników?
  answers:
    - text: "`LoginName`"
      correct: false
    - text: "`ChangePassword`"
      correct: false
    - text: "`LoginStatus`"
      correct: false
    - text: "`LoginView`"
      correct: true
  explanation: |
    `LoginView` ma szablony `AnonymousTemplate` i `LoggedInTemplate`.
    `LoginStatus` pokazuje link zaloguj/wyloguj, `LoginName` - nazwę użytkownika, a `ChangePassword` - formularz zmiany hasła.

- id: 368
  question: Jak zarejestrować skrypt JavaScript, który wykona się po załadowaniu strony Web Forms?
  answers:
    - text: "`ViewState[\"Script\"] = \"...\"`"
      correct: false
    - text: "`Server.Execute(\"script.js\")`"
      correct: false
    - text: "`Page.ClientScript.RegisterStartupScript`"
      correct: true
    - text: "`Response.Redirect(\"script.js\")`"
      correct: false
  explanation: |
    `RegisterStartupScript` wstawia skrypt na koniec formularza, więc wykonuje się po załadowaniu kontrolek (przy `UpdatePanel` używa się `ScriptManager.RegisterStartupScript`).
    Redirect przekierowuje przeglądarkę, `Server.Execute` wykonuje stronę serwerową, a `ViewState` nie uruchamia skryptów.

- id: 369
  question: Który język jest przykładem słabego typowania?
  answers:
    - text: C#, gdzie `"5" + 1` daje 6
      correct: false
    - text: JavaScript, gdzie `"5" + 1` daje "51"
      correct: true
    - text: Java, gdzie `"5" + 1` rzuca wyjątek
      correct: false
    - text: Python, gdzie `"5" + 1` daje "51"
      correct: false
  explanation: |
    JavaScript niejawnie konwertuje typy, więc łączy liczbę ze stringiem bez błędu.
    W C# i Javie `"5" + 1` daje `string` "51" (konkatenacja, nie 6), a Python rzuca `TypeError` - jest silnie typowany.
    Odpowiedzi przypisujące C#, Pythonowi i Javie inne wyniki są więc fałszywe.

- id: 370
  question: Który szablon kontrolki Repeater jest wymagany?
  answers:
    - text: "`SeparatorTemplate`"
      correct: false
    - text: "`HeaderTemplate`"
      correct: false
    - text: "`ItemTemplate`"
      correct: true
    - text: "`AlternatingItemTemplate`"
      correct: false
  explanation: |
    `ItemTemplate` definiuje wygląd każdego elementu i bez niego Repeater nic nie wyrenderuje.
    `HeaderTemplate`, `SeparatorTemplate` i `AlternatingItemTemplate` są opcjonalne.

- id: 371
  question: Który wbudowany obiekt ASP.NET udostępnia metodę `MapPath`?
  answers:
    - text: Server
      correct: true
    - text: Application
      correct: false
    - text: Request
      correct: false
    - text: Session
      correct: false
  explanation: |
    `Server.MapPath` zamienia ścieżkę wirtualną na fizyczną na dysku.
    Request zawiera dane żądania, Session - stan użytkownika, a Application - stan wspólny aplikacji.

- id: 372
  question: Jak odczytać wartość z sekcji `appSettings` w `web.config` w klasycznym ASP.NET?
  answers:
    - text: "`Session[\"Klucz\"]`"
      correct: false
    - text: "`ConfigurationManager.AppSettings[\"Klucz\"]`"
      correct: true
    - text: "`builder.Configuration[\"Klucz\"]`"
      correct: false
    - text: "`Environment.GetEnvironmentVariable(\"Klucz\")`"
      correct: false
  explanation: |
    `ConfigurationManager` z `System.Configuration` czyta `appSettings` jako stringi.
    `builder.Configuration` to ASP.NET Core, zmienne środowiskowe to inne źródło, a sesja nie zawiera konfiguracji.

- id: 373
  question: Która przestrzeń nazw zawiera klasę `CultureInfo`?
  answers:
    - text: "`System.Resources`"
      correct: false
    - text: "`System.Globalization`"
      correct: true
    - text: "`System.Text`"
      correct: false
    - text: "`System.Threading`"
      correct: false
  explanation: |
    `CultureInfo` i formatowanie zależne od kultury są w `System.Globalization`.
    `System.Resources` zawiera `ResourceManager`, `System.Threading` - wątki (choć kulturę wątku ustawia się przez `CultureInfo`), a `System.Text` - kodowania i `StringBuilder`.

- id: 374
  question: Czym różni się ciasteczko trwałe od sesyjnego?
  answers:
    - text: Ciasteczko trwałe nie może mieć flagi `HttpOnly`, więc zawsze jest dostępne dla skryptów JavaScript na stronie
      correct: false
    - text: Ciasteczko sesyjne jest przechowywane na serwerze, a trwałe w przeglądarce użytkownika
      correct: false
    - text: Ciasteczko trwałe ma datę wygaśnięcia i przetrwa zamknięcie przeglądarki, sesyjne znika po jej zamknięciu
      correct: true
    - text: Nie ma różnic
      correct: false
  explanation: |
    Atrybut Expires lub Max-Age sprawia, że przeglądarka zapisuje ciasteczko na dysku.
    Oba rodzaje są przechowywane po stronie klienta i oba mogą mieć `HttpOnly`, Secure i `SameSite`.

- id: 375
  question: Jakie rozszerzenie ma plik klasycznej usługi ASP.NET Web Service?
  answers:
    - text: "`.asmx`"
      correct: true
    - text: "`.svc`"
      correct: false
    - text: "`.axd`"
      correct: false
    - text: "`.ashx`"
      correct: false
  explanation: |
    Usługi ASMX mają rozszerzenie `.asmx`.
    `.svc` to usługi WCF, `.ashx` - generyczne handlery, a `.axd` - zasoby obsługiwane przez handlery systemowe ASP.NET.

- id: 376
  question: Czy aplikacja ASP.NET może mieć kilka plików `web.config`?
  answers:
    - text: Tak, ale wszystkie muszą być umieszczone w folderze `App_Data` z unikalnymi nazwami
      correct: false
    - text: Tak - `web.config` w podfolderze nadpisuje lub rozszerza ustawienia folderu nadrzędnego
      correct: true
    - text: Nie - dozwolony jest tylko jeden w katalogu głównym
      correct: false
    - text: Tak, ale tylko plik w katalogu głównym może zawierać sekcję `connectionStrings`
      correct: false
  explanation: |
    Konfiguracja jest hierarchiczna - np. folder Admin może mieć własne reguły autoryzacji.
    Pliki umieszcza się w folderach, których dotyczą, a nie w `App_Data`, a `connectionStrings` mogą występować na różnych poziomach.

- id: 377
  question: Jaki zakres mają ustawienia w `machine.config`?
  answers:
    - text: Tylko bieżąca aplikacja
      correct: false
    - text: Wszystkie aplikacje .NET na danym serwerze (dla danej wersji frameworka)
      correct: true
    - text: Tylko bieżący użytkownik Windows, w którego profilu zapisany jest plik
      correct: false
    - text: Tylko folder aplikacji, w którym plik został umieszczony
      correct: false
  explanation: |
    `machine.config` to globalna konfiguracja maszyny, którą `web.config` aplikacji może nadpisywać.
    Ustawienia aplikacji i folderów zawierają pliki `web.config`, a konfiguracja per użytkownik to inny mechanizm.

- id: 378
  question: Jak na stronie docelowej odczytać stronę źródłową przy cross-page posting?
  answers:
    - text: Przez `ViewState` strony docelowej
      correct: false
    - text: Przez `Session["PreviousPage"]`
      correct: false
    - text: Przez właściwość `Page.PreviousPage`
      correct: true
    - text: Przez `Request.UrlReferrer.Page`
      correct: false
  explanation: |
    Przy przycisku z `PostBackUrl` strona docelowa ma dostęp do poprzedniej przez `PreviousPage`, a jej kontrolki - przez `FindControl`.
    `UrlReferrer` zawiera tylko adres, sesja nie przechowuje strony automatycznie, a `ViewState` strony docelowej nie zawiera danych źródłowej.

- id: 379
  question: Co dzieje się z połączeniem `SqlConnection` po wywołaniu `Close()` lub `Dispose()`, gdy włączony jest connection pooling?
  answers:
    - text: Wraca do puli i może zostać ponownie użyte, zamiast zostać fizycznie zamknięte
      correct: true
    - text: Jest fizycznie zamykane, a kolejne `Open()` zawsze nawiązuje nowe połączenie TCP
      correct: false
    - text: Pozostaje otwarte i zablokowane dla innych wątków do czasu zakończenia procesu
      correct: false
    - text: Jest zapisywane do pliku na dysku
      correct: false
  explanation: |
    Pula utrzymuje otwarte połączenia per unikalny connection `string`, więc kolejne `Open()` jest bardzo szybkie.
    Fizyczne zamknięcie następuje dopiero po czasie bezczynności lub przy czyszczeniu puli, a połączenie nie jest blokowane ani zapisywane na dysku.

- id: 380
  question: Jaki jest typowy skutek niezamykania połączeń `SqlConnection` w aplikacji?
  answers:
    - text: Natychmiastowy restart usługi SQL Server po przekroczeniu limitu połączeń
      correct: false
    - text: Automatyczne zwiększenie wydajności, bo połączenia są ponownie używane bez zamykania
      correct: false
    - text: Wyczerpanie puli połączeń i timeouty przy kolejnych próbach `Open()`
      correct: true
    - text: Utrata danych w tabelach
      correct: false
  explanation: |
    Gdy wszystkie połączenia z puli (domyślnie Max Pool `Size = 100`) są zajęte, nowe żądania czekają i kończą się błędem timeoutu.
    Nie przyspiesza to bazy, nie powoduje utraty danych i nie restartuje serwera - dlatego połączenia otwiera się w `using`.

- id: 381
  question: Czym `DataSet` różni się od `DataReader`?
  answers:
    - text: "`DataSet` to rozłączona kopia w pamięci, `DataReader` - strumień tylko do odczytu"
      correct: true
    - text: "`DataReader` pozwala edytować wczytane wiersze i zapisywać zmiany do bazy przez metodę Update"
      correct: false
    - text: "`DataSet` wymaga stale otwartego połączenia, a `DataReader` pracuje na kopii w pamięci"
      correct: false
    - text: "`DataReader` przechowuje w pamięci wiele tabel z relacjami, a `DataSet` czyta dane strumieniowo"
      correct: false
  explanation: |
    `DataReader` jest lekki i szybki do jednorazowego odczytu, a `DataSet` bardziej elastyczny, ale cięższy.
    Pozostałe odpowiedzi przypisują jednemu cechy drugiego.

- id: 382
  question: Który komponent ADO.NET wypełnia `DataSet` danymi i zapisuje zmiany do bazy?
  answers:
    - text: "`DataAdapter`"
      correct: true
    - text: "`DataReader`"
      correct: false
    - text: Parameter
      correct: false
    - text: Connection
      correct: false
  explanation: |
    `DataAdapter` wykonuje `SelectCommand` przez Fill oraz `Insert/Update/DeleteCommand` przez Update.
    `DataReader` tylko odczytuje, Connection zapewnia połączenie, a Parameter reprezentuje parametr polecenia.

- id: 383
  question: Czy jeden `DataSet` może zawierać wiele tabel?
  answers:
    - text: Tak - ma kolekcję Tables i może definiować relacje między nimi
      correct: true
    - text: Nie - `DataSet` zawsze reprezentuje jedną tabelę
      correct: false
    - text: Tak, ale bez możliwości definiowania relacji między nimi
      correct: false
    - text: Tak, ale tylko jeśli wszystkie mają identyczną strukturę kolumn
      correct: false
  explanation: |
    `DataSet` to rozłączona "baza w pamięci" z wieloma `DataTable` i obiektami `DataRelation`.
    Jedną tabelę reprezentuje `DataTable`, a tabele w `DataSet` mogą mieć różne struktury i być połączone relacjami.

- id: 384
  question: Który dostawca ADO.NET jest obecnie zalecany dla SQL Server?
  answers:
    - text: "`System.Data.OracleClient`"
      correct: false
    - text: "`Microsoft.Data.SqlClient`"
      correct: true
    - text: "`System.Data.Odbc`"
      correct: false
    - text: "`System.Data.OleDb`"
      correct: false
  explanation: |
    `Microsoft.Data.SqlClient` to aktywnie rozwijany następca `System.Data.SqlClient`, wspierający nowe funkcje SQL Server i Azure SQL.
    `OleDb` i Odbc są ogólnymi mostkami do starszych źródeł, a `OracleClient` to przestarzały dostawca dla Oracle.

- id: 385
  question: Co zwraca `ExecuteScalar`, gdy zapytanie nie zwróci żadnego wiersza?
  answers:
    - text: Rzuca wyjątek `InvalidOperationException`
      correct: false
    - text: Pusty `string`
      correct: false
    - text: "0"
      correct: false
    - text: "`null`"
      correct: true
  explanation: |
    `ExecuteScalar` zwraca pierwszą kolumnę pierwszego wiersza albo `null` przy braku wyniku (`DBNull.Value`, gdy wartość w kolumnie to `NULL`).
    Nie zwraca 0 ani pustego stringa i nie rzuca wyjątku.

- id: 386
  question: Czym jest denormalizacja bazy danych?
  answers:
    - text: Celowym wprowadzeniem redundancji dla szybszych odczytów
      correct: true
    - text: Podziałem tabel na mniejsze, powiązane kluczami, aby wyeliminować redundancję danych
      correct: false
    - text: Zaszyfrowaniem danych w tabelach w celu ochrony przed nieuprawnionym odczytem
      correct: false
    - text: Usunięciem wszystkich kluczy obcych z bazy w celu przyspieszenia zapisów
      correct: false
  explanation: |
    Denormalizacja ogranicza JOIN-y, np. przez przechowywanie nazwy klienta w tabeli zamówień, i jest typowa dla raportowania.
    Podział tabel w celu usunięcia redundancji to normalizacja, a usuwanie kluczy obcych i szyfrowanie to inne operacje.

- id: 387
  question: Co wymaga trzecia postać normalna (3NF)?
  answers:
    - text: Spełnienia 2NF i braku zależności przechodnich
      correct: true
    - text: Klucza głównego złożonego z co najmniej trzech kolumn w każdej tabeli
      correct: false
    - text: Wyłącznie atomowych wartości w kolumnach i braku powtarzających się grup
      correct: false
    - text: Co najmniej trzech tabel w bazie
      correct: false
  explanation: |
    W 3NF atrybut niekluczowy zależy tylko od klucza, a nie od innego atrybutu niekluczowego (np. miasto nie powinno zależeć od kodu pocztowego w tabeli klientów).
    Atomowość to 1NF, a liczba kolumn klucza czy tabel nie ma związku z 3NF.

- id: 388
  question: Jak realizuje się relację wiele do wielu w bazie relacyjnej?
  answers:
    - text: Przez dwa klucze główne w jednej tabeli
      correct: false
    - text: Przez tabelę pośrednią z kluczami obcymi do obu tabel
      correct: true
    - text: Relacji wiele do wielu nie da się zrealizować w bazie relacyjnej
      correct: false
    - text: Przez kolumnę z listą identyfikatorów rozdzielonych przecinkami
      correct: false
  explanation: |
    Np. tabela `StudentCourses` z kolumnami `StudentId` i `CourseId` łączy studentów i kursy.
    Lista identyfikatorów w kolumnie łamie 1NF i uniemożliwia więzy integralności, a tabela może mieć tylko jeden klucz główny.

- id: 389
  question: Który operator jest używany z podzapytaniem wielowierszowym?
  answers:
    - text: "`=`"
      correct: false
    - text: "`BETWEEN`"
      correct: false
    - text: "`IN`"
      correct: true
    - text: "`LIKE`"
      correct: false
  explanation: |
    `IN` sprawdza, czy wartość należy do zbioru zwróconego przez podzapytanie (podobnie `ANY` i `ALL`).
    `=` wymaga podzapytania skalarnego, `LIKE` dopasowuje wzorce tekstowe, a `BETWEEN` - zakresy.

- id: 390
  question: Czym są wartości zaczynające się od `@@` w SQL Server, np. `@@ROWCOUNT`?
  answers:
    - text: Nazwami tabel tymczasowych
      correct: false
    - text: Wbudowanymi funkcjami systemowymi, potocznie nazywanymi zmiennymi globalnymi
      correct: true
    - text: Parametrami wyjściowymi procedur składowanych
      correct: false
    - text: Zmiennymi lokalnymi zadeklarowanymi przez `DECLARE` i widocznymi w całej sesji
      correct: false
  explanation: |
    `@@ROWCOUNT`, `@@ERROR` czy `@@VERSION` zwracają informacje systemowe i nie da się tworzyć własnych "zmiennych globalnych".
    Zmienne lokalne i parametry zaczynają się od pojedynczego `@`, a tabele tymczasowe od `#`.

- id: 391
  question: Który rodzaj integralności zapewnia klucz obcy?
  answers:
    - text: Integralność domenową
      correct: false
    - text: Integralność fizyczną
      correct: false
    - text: Integralność encji
      correct: false
    - text: Integralność referencyjną
      correct: true
  explanation: |
    Klucz obcy gwarantuje, że odwołania między tabelami wskazują na istniejące wiersze.
    Integralność encji zapewniają klucze główne, a domenową - typy, `CHECK` i `NOT NULL`; "integralność fizyczna" dotyczy raczej uszkodzeń nośnika.

- id: 392
  question: Jaki schemat danych jest typowy dla hurtowni danych?
  answers:
    - text: Pojedyncza tabela z kolumnami JSON
      correct: false
    - text: Model klucz-wartość z jedną tabelą na każdy wymiar
      correct: false
    - text: Schemat gwiazdy z tabelą faktów i tabelami wymiarów
      correct: true
    - text: Ściśle znormalizowany schemat w piątej postaci normalnej
      correct: false
  explanation: |
    Hurtownie danych używają zdenormalizowanych schematów gwiazdy lub płatka śniegu, zoptymalizowanych pod zapytania analityczne.
    Silna normalizacja jest typowa dla OLTP, a JSON i model klucz-wartość nie są standardem hurtowni.

- id: 393
  question: Ile wierszy zwróci `CROSS JOIN` tabeli z 10 wierszami i tabeli z 5 wierszami?
  answers:
    - text: "15"
      correct: false
    - text: "10"
      correct: false
    - text: "50"
      correct: true
    - text: "5"
      correct: false
  explanation: |
    `CROSS JOIN` tworzy iloczyn kartezjański - każdy wiersz pierwszej tabeli z każdym wierszem drugiej, czyli 10 x 5.
    15 byłoby sumą, a 10 i 5 to liczby wierszy pojedynczych tabel.

- id: 394
  question: Co oznacza collation `Polish_CI_AS`?
  answers:
    - text: Kodowanie znaków UTF-8 dla języka polskiego
      correct: false
    - text: Polskie reguły sortowania, bez rozróżniania wielkości liter, z rozróżnianiem akcentów
      correct: true
    - text: Polskie reguły sortowania, z rozróżnianiem wielkości liter, bez rozróżniania akcentów
      correct: false
    - text: Ustawienie strefy czasowej na Polskę
      correct: false
  explanation: |
    CI to Case Insensitive, a `AS` - Accent Sensitive, więc `"Ala" = "ala"`, ale "ą" ≠ "a".
    Odwrócone znaczenia skrótów są błędne, collation nie jest kodowaniem (choć wariant `_UTF8` może je określać) ani strefą czasową.

- id: 395
  question: Która wrażliwość collation dotyczy rozróżniania małych i wielkich liter?
  answers:
    - text: Width (WS)
      correct: false
    - text: Accent (AS/AI)
      correct: false
    - text: Kana (KS)
      correct: false
    - text: Case (CS/CI)
      correct: true
  explanation: |
    CS rozróżnia wielkość liter, a CI ją ignoruje.
    AS/AI dotyczy akcentów, KS - japońskich znaków kana, a WS - szerokości znaków.

- id: 396
  question: Która z poniższych jest zaletą procedur składowanych?
  answers:
    - text: Niezależność logiki od konkretnego silnika bazy danych i jego dialektu SQL
      correct: false
    - text: Brak potrzeby testowania logiki w nich zawartej, bo SQL Server ją weryfikuje
      correct: false
    - text: Łatwe wersjonowanie logiki razem z kodem aplikacji w każdej sytuacji
      correct: false
    - text: Ponowne użycie planów i uprawnienia do procedury zamiast tabel
      correct: true
  explanation: |
    Procedury pozwalają ograniczyć dostęp do tabel i ograniczają ruch sieciowy.
    Ich wadą jest wręcz trudniejsze wersjonowanie i testowanie oraz związanie z konkretnym dialektem SQL.

- id: 397
  question: Czym charakteryzują się systemy OLTP?
  answers:
    - text: Długimi zapytaniami analitycznymi na dużych zbiorach danych historycznych
      correct: false
    - text: Wieloma krótkimi transakcjami i znormalizowanym schematem
      correct: true
    - text: Przechowywaniem danych wyłącznie w plikach CSV zamiast w tabelach
      correct: false
    - text: Brakiem zapisów - wyłącznie odczyty
      correct: false
  explanation: |
    OLTP obsługuje bieżącą działalność, np. zamówienia czy fakturowanie, z wieloma równoległymi zapisami.
    Analityka na danych historycznych to OLAP, a OLTP z definicji intensywnie zapisuje dane w bazach transakcyjnych.

- id: 398
  question: Jaki jest maksymalny poziom zagnieżdżenia wywołań procedur w SQL Server?
  answers:
    - text: "100"
      correct: false
    - text: "32"
      correct: true
    - text: Nie ma limitu
      correct: false
    - text: "8"
      correct: false
  explanation: |
    SQL Server pozwala na 32 poziomy zagnieżdżenia procedur, funkcji i triggerów.
    100 to domyślny limit rekurencji CTE (MAXRECURSION), a limit zagnieżdżenia istnieje.

- id: 399
  question: Jaki jest odpowiednik operatora MINUS z Oracle w SQL Server?
  answers:
    - text: "`UNION ALL`"
      correct: false
    - text: "`NOT JOIN`"
      correct: false
    - text: "`EXCEPT`"
      correct: true
    - text: "`INTERSECT`"
      correct: false
  explanation: |
    `EXCEPT` zwraca wiersze pierwszego zapytania, których nie ma w drugim.
    `INTERSECT` zwraca część wspólną, `UNION ALL` łączy wyniki z duplikatami, a `NOT JOIN` nie istnieje.

- id: 400
  question: Kiedy alias tabeli jest niezbędny?
  answers:
    - text: Zawsze przy zapytaniu do jednej tabeli z klauzulą `WHERE`
      correct: false
    - text: Tylko przy użyciu `ORDER BY`
      correct: false
    - text: Przy self-joinie, aby odróżnić dwa wystąpienia tej samej tabeli
      correct: true
    - text: Nigdy - aliasy służą wyłącznie poprawie czytelności zapytania
      correct: false
  explanation: |
    W self-joinie bez aliasów nie dałoby się wskazać, o które wystąpienie tabeli chodzi.
    Przy jednej tabeli i `ORDER BY` alias jest opcjonalny, a w self-joinie i kolumnach wyliczanych pełni realną funkcję.

- id: 401
  question: Co kopiuje zapytanie `SELECT * INTO NewTable FROM OldTable WHERE 1 = 0`?
  answers:
    - text: Strukturę kolumn, bez danych, indeksów i constraintów
      correct: true
    - text: Strukturę kolumn, wszystkie dane, indeksy i klucze obce
      correct: false
    - text: Tylko indeksy i statystyki tabeli, bez kolumn
      correct: false
    - text: Nic - zapytanie zwraca błąd składni z powodu warunku `1 = 0`
      correct: false
  explanation: |
    Warunek `1 = 0` nie zwraca wierszy, więc powstaje pusta tabela o tych samych kolumnach.
    `SELECT INTO` nie kopiuje indeksów, kluczy ani constraintów - pełną strukturę odtwarza się skryptem `CREATE TABLE`.

- id: 402
  question: Który operator zwraca wiersze wspólne dla dwóch zapytań?
  answers:
    - text: "`INTERSECT`"
      correct: true
    - text: "`CROSS JOIN`"
      correct: false
    - text: "`EXCEPT`"
      correct: false
    - text: "`UNION`"
      correct: false
  explanation: |
    `INTERSECT` zwraca tylko wiersze występujące w obu wynikach.
    `EXCEPT` zwraca różnicę, `UNION` sumę, a `CROSS JOIN` iloczyn kartezjański.

- id: 403
  question: Jak najprościej pobrać co drugi rekord z tabeli w SQL Server?
  answers:
    - text: Przez `ROW_NUMBER() OVER` (...) i warunek `rn % 2 = 0`
      correct: true
    - text: Przez klauzulę `SELECT * FROM` tabela SKIP 2
      correct: false
    - text: Przez `GROUP BY Id % 2` z `HAVING Id % 2 = 0`
      correct: false
    - text: Przez `SELECT TOP 50 PERCENT * FROM tabela ORDER BY Id`
      correct: false
  explanation: |
    Numerowanie wierszy funkcją okna i modulo pozwala wybrać wiersze parzyste lub nieparzyste.
    `TOP` 50 `PERCENT` zwraca pierwszą połowę wierszy, klauzula SKIP nie istnieje w T-SQL, a `GROUP BY` zredukowałby wynik do dwóch grup.

- id: 404
  question: Która funkcja zwraca pierwsze 5 znaków stringa w SQL Server?
  answers:
    - text: "`LEFT(Name, 5)`"
      correct: true
    - text: "`SUBSTR(Name, 5)`"
      correct: false
    - text: "`FIRST(Name, 5)`"
      correct: false
    - text: "`TOP(5, Name)`"
      correct: false
  explanation: |
    `LEFT` zwraca podaną liczbę znaków od lewej (alternatywnie `SUBSTRING(Name, 1, 5)`).
    SUBSTR to funkcja Oracle, a `TOP` i FIRST nie działają na stringach w ten sposób.

- id: 405
  question: Który rodzaj funkcji użytkownika w SQL Server jest zwykle najwydajniejszy?
  answers:
    - text: Skalarna funkcja wywołująca inne funkcje skalarne
      correct: false
    - text: Multi-statement table-valued function zwracająca zmienną tabelaryczną
      correct: false
    - text: Skalarna funkcja z pętlą WHILE przetwarzająca wiersze kolejno
      correct: false
    - text: Inline table-valued function (oparta na jednym `SELECT`)
      correct: true
  explanation: |
    Funkcja inline jest wklejana do planu zapytania jak widok z parametrami, więc optymalizator może ją dobrze zoptymalizować.
    Funkcje wielowyrażeniowe i skalarne (poza przypadkami scalar UDF inlining) bywają wykonywane wiersz po wierszu ze złymi szacunkami.

- id: 406
  question: Która funkcja jest funkcją agregującą?
  answers:
    - text: GETDATE
      correct: false
    - text: "`AVG`"
      correct: true
    - text: UPPER
      correct: false
    - text: LEN
      correct: false
  explanation: |
    `AVG` operuje na zbiorze wierszy i zwraca jedną wartość.
    UPPER i LEN działają na pojedynczym stringu, a GETDATE zwraca bieżącą datę - to funkcje skalarne.

- id: 407
  question: Dlaczego warunek `LIKE` '%tekst' jest wolny na dużej tabeli?
  answers:
    - text: Bo wiodący znak `%` uniemożliwia seek na indeksie
      correct: true
    - text: Bo `LIKE` zawsze blokuje całą tabelę
      correct: false
    - text: Bo `LIKE` wymaga indeksu pełnotekstowego, którego tabela nie ma
      correct: false
    - text: Bo symbol `%` działa tylko z kolumnami `NVARCHAR` i wymaga konwersji
      correct: false
  explanation: |
    Indeks B-drzewa jest posortowany od początku wartości, więc wzorzec z nieznanym początkiem wymaga skanowania.
    `LIKE` nie blokuje tabeli, działa z `VARCHAR` i `NVARCHAR` i nie wymaga indeksu pełnotekstowego (choć przy wyszukiwaniu fraz bywa on lepszy).

- id: 408
  question: Na czym polega wzorzec Prototype?
  answers:
    - text: Na tworzeniu obiektów przez klonowanie prototypu
      correct: true
    - text: Na tworzeniu złożonego obiektu krok po kroku przez płynny interfejs
      correct: false
    - text: Na zapewnieniu jednej instancji klasy
      correct: false
    - text: Na powiadamianiu zarejestrowanych subskrybentów o zmianach stanu obiektu
      correct: false
  explanation: |
    Prototype przydaje się, gdy utworzenie obiektu od zera jest kosztowne - w C# realizują go Clone lub wyrażenie `with` dla rekordów.
    Budowanie krok po kroku to Builder, jedna instancja - Singleton, a powiadamianie - Observer.

- id: 409
  question: Który przykład z .NET jest realizacją wzorca Builder?
  answers:
    - text: "`Lazy<T>` i `LazyInitializer`"
      correct: false
    - text: "`IEnumerable<T>` i `IEnumerator<T>`"
      correct: false
    - text: "`EventHandler`"
      correct: false
    - text: "`StringBuilder` i `WebApplicationBuilder`"
      correct: true
  explanation: |
    Oba budują złożony obiekt stopniowo, a na końcu wywołuje się `ToString()` lub `Build()`.
    `Lazy<T>` realizuje leniwe tworzenie, `IEnumerable` - iterator, a `EventHandler` - delegat zdarzeń.

- id: 410
  question: Jaki problem rozwiązuje wzorzec Adapter?
  answers:
    - text: Dopasowuje interfejs istniejącej klasy do interfejsu oczekiwanego przez klienta
      correct: true
    - text: Dodaje obiektowi nowe zachowanie przez opakowanie w obiekt z tym samym interfejsem
      correct: false
    - text: Ukrywa złożony podsystem wielu klas za jednym, prostym interfejsem
      correct: false
    - text: Kontroluje dostęp do obiektu
      correct: false
  explanation: |
    Adapter działa jak przejściówka - np. opakowuje zewnętrzne SDK w Twój interfejs `IPaymentGateway`.
    Upraszczanie podsystemu to Facade, dodawanie zachowania - Decorator, a kontrola dostępu - Proxy.

- id: 411
  question: Kiedy stosuje się wzorzec Bridge?
  answers:
    - text: Gdy abstrakcja i implementacja mają się zmieniać niezależnie
      correct: true
    - text: Gdy trzeba połączyć dwie bazy danych lub dwa niezależne systemy przez wspólny interfejs
      correct: false
    - text: Gdy w całej aplikacji potrzebna jest dokładnie jedna instancja klasy
      correct: false
    - text: Gdy obiekt ma zmieniać swoje zachowanie w zależności od bieżącego stanu wewnętrznego
      correct: false
  explanation: |
    Bridge rozdziela np. Shape i `IRenderer`, zamiast tworzyć klasy `RedCircle`, `BlueSquare` itd.
    Łączenie baz to nie wzorzec projektowy, jedna instancja to Singleton, a zmiana zachowania wg stanu - State.

- id: 412
  question: Który przykład najlepiej ilustruje wzorzec Composite?
  answers:
    - text: System plików, w którym foldery zawierają pliki i inne foldery, a oba mają wspólny interfejs
      correct: true
    - text: Klasa, która tworzy różne obiekty implementujące interfejs na podstawie parametru `string`
      correct: false
    - text: Klasa opakowująca zewnętrzne API
      correct: false
    - text: Klasa `OrderService`, która jedną metodą `PlaceOrder` koordynuje magazyn, płatności i wysyłkę
      correct: false
  explanation: |
    Composite pozwala traktować pojedyncze elementy i ich grupy jednakowo w strukturze drzewiastej.
    Jedna metoda koordynująca kilka podsystemów to Facade, fabryka to wzorzec kreacyjny, a opakowanie API to Adapter.

- id: 413
  question: Który przykład z .NET ilustruje wzorzec Decorator?
  answers:
    - text: Interfejs `IDisposable` z metodą Dispose
      correct: false
    - text: Słowo kluczowe `sealed` na klasie Stream
      correct: false
    - text: "`GZipStream` lub `BufferedStream` opakowujące Stream"
      correct: true
    - text: Klasa Math z metodami statycznymi Abs i Round
      correct: false
  explanation: |
    Strumienie mają ten sam interfejs Stream i dodają zachowanie (kompresję, buforowanie) do opakowanego strumienia.
    Math to klasa statyczna, `IDisposable` - kontrakt zwalniania zasobów, a `sealed` - modyfikator blokujący dziedziczenie.

- id: 414
  question: Co odróżnia wzorzec Facade od Adaptera?
  answers:
    - text: Facade upraszcza dostęp do złożonego podsystemu, a Adapter dopasowuje niezgodny interfejs
      correct: true
    - text: Facade dodaje nowe zachowanie do obiektu, a Adapter usuwa niepotrzebne metody z jego interfejsu
      correct: false
    - text: To dwie nazwy tego samego wzorca
      correct: false
    - text: Facade odpowiada za tworzenie obiektów podsystemu, a Adapter za ich niszczenie i zwalnianie zasobów
      correct: false
  explanation: |
    Facade (np. `OrderFacade.PlaceOrder`) koordynuje wiele klas za jedną metodą, a Adapter tłumaczy jeden interfejs na drugi.
    Dodawanie zachowania to Decorator, a tworzenie obiektów - wzorce kreacyjne.

- id: 415
  question: Na czym polega wzorzec Flyweight?
  answers:
    - text: Na leniwym ładowaniu ciężkich obiektów dopiero w momencie pierwszego użycia
      correct: false
    - text: Na tworzeniu lekkich wątków o małym rozmiarze stosu
      correct: false
    - text: Na współdzieleniu niezmiennego stanu między obiektami, by oszczędzić pamięć
      correct: true
    - text: Na przechowywaniu często używanych obiektów w pamięci podręcznej przeglądarki użytkownika
      correct: false
  explanation: |
    Flyweight oddziela stan wewnętrzny (współdzielony) od zewnętrznego - np. glify w edytorze tekstu.
    Leniwe ładowanie to raczej Proxy wirtualne lub `Lazy<T>`, a cache przeglądarki i lekkie wątki nie są tym wzorcem.

- id: 416
  question: Czym Proxy różni się od Decoratora?
  answers:
    - text: Proxy zawsze komunikuje się z obiektem zdalnym przez sieć, a Decorator działa wyłącznie lokalnie
      correct: false
    - text: Proxy kontroluje dostęp do obiektu, a Decorator dodaje funkcjonalność
      correct: true
    - text: Proxy zmienia interfejs opakowanego obiektu na inny, a Decorator zachowuje oryginalny interfejs
      correct: false
    - text: Nie ma między nimi żadnej różnicy, nawet w intencji
      correct: false
  explanation: |
    Oba mają ten sam interfejs co opakowany obiekt, ale różnią się celem.
    Proxy może być lokalne (np. lazy loading w EF Core), nie zmienia interfejsu (to robi Adapter), a różnica w intencji jest istotna.

- id: 417
  question: Czy ASP.NET Core Web API w pełni zastępuje możliwości WCF?
  answers:
    - text: Tak, ASP.NET Core Web API obsługuje wszystkie bindingi WCF, w tym `netTcpBinding`
      correct: false
    - text: Nie, bo WCF jest nadal zalecaną technologią dla nowych projektów w .NET 8
      correct: false
    - text: Nie w pełni - zastępuje je dla HTTP/REST, ale nie SOAP czy duplex
      correct: true
    - text: Tak, Web API ma wbudowaną obsługę SOAP, MSMQ i transakcji WS-AtomicTransaction
      correct: false
  explanation: |
    Web API wyparło WCF w usługach HTTP, ale nie oferuje SOAP, transakcji WS-\* czy named pipes.
    Nowe projekty używają Web API lub gRPC, a migracje WCF ułatwia projekt CoreWCF.

- id: 418
  question: Która biblioteka jest domyślnym serializatorem JSON w ASP.NET Core od wersji 3.0?
  answers:
    - text: "`Newtonsoft.Json`"
      correct: false
    - text: "`JavaScriptSerializer`"
      correct: false
    - text: "`System.Text.Json`"
      correct: true
    - text: "`DataContractJsonSerializer`"
      correct: false
  explanation: |
    `System.Text.Json` jest wydajny i wbudowany w framework, a `Newtonsoft.Json` można przywrócić przez `AddNewtonsoftJson`.
    `DataContractJsonSerializer` i `JavaScriptSerializer` to starsze serializatory .NET Framework.

- id: 419
  question: Jaki kod statusu zwraca domyślnie Web API przy nieobsłużonym wyjątku?
  answers:
    - text: 404 Not Found
      correct: false
    - text: 400 Bad Request
      correct: false
    - text: 500 Internal Server Error
      correct: true
    - text: 200 OK z opisem błędu w treści odpowiedzi
      correct: false
  explanation: |
    Nieobsłużony wyjątek oznacza błąd serwera.
    400 dotyczy błędnego żądania klienta, 404 - brakującego zasobu, a 200 dla błędu wprowadza klientów w błąd.

- id: 420
  question: Z jakich elementów składa się komunikat SOAP?
  answers:
    - text: Request, Response i Status
      correct: false
    - text: Head, Body i Footer
      correct: false
    - text: Envelope, Header i Body
      correct: true
    - text: Key, Value i Signature
      correct: false
  explanation: |
    Envelope opakowuje komunikat, Header zawiera metadane (np. bezpieczeństwo), a Body - właściwą treść lub Fault.
    Pozostałe zestawy nie opisują struktury SOAP.

- id: 421
  question: Jak w Web API ograniczyć akcję do obsługi tylko żądań `POST`?
  answers:
    - text: Atrybutem `[AcceptVerbs("ANY")]`
      correct: false
    - text: Atrybutem `[HttpPost]`
      correct: true
    - text: Atrybutem `[Route("POST")]`
      correct: false
    - text: Nazwą metody zaczynającą się od Delete
      correct: false
  explanation: |
    `[HttpPost]` dopuszcza wyłącznie metodę `POST`.
    Route definiuje ścieżkę, a nie metodę, "ANY" nie jest poprawnym czasownikiem, a prefiks Delete w konwencji nazewniczej Web API 2 dotyczy `DELETE`.

- id: 422
  question: Jak w Web API zwrócić widok HTML?
  answers:
    - text: Web API nie służy do zwracania widoków - zwraca dane
      correct: true
    - text: Przez `return View("Nazwa", model)` w kontrolerze dziedziczącym po `ApiController`
      correct: false
    - text: Przez atrybut `[ReturnsView("Nazwa")]` na akcji kontrolera API
      correct: false
    - text: "Przez wysłanie w żądaniu nagłówka Accept: text/razor, który włącza renderowanie widoku"
      correct: false
  explanation: |
    `ApiController` w Web API 2 nie ma metody View, a w Core `ControllerBase` też jej nie ma - jest w klasie Controller.
    Atrybut `[ReturnsView]` i typ text/razor nie istnieją.

- id: 423
  question: Kto może konsumować Web API?
  answers:
    - text: Tylko klienci w tej samej sieci lokalnej
      correct: false
    - text: Tylko aplikacje napisane w .NET, które korzystają z wygenerowanego proxy klienta
      correct: false
    - text: Tylko przeglądarki z włączonym JavaScriptem i obsługą CORS
      correct: false
    - text: Każdy klient obsługujący HTTP
      correct: true
  explanation: |
    Web API opiera się na HTTP i formatach jak JSON, więc jest niezależne od platformy klienta.
    Nie wymaga .NET ani przeglądarki i może być dostępne publicznie przez internet.

- id: 424
  question: Co oznacza interoperacyjność usług sieciowych?
  answers:
    - text: Szyfrowanie komunikacji między usługami napisanymi w tej samej technologii
      correct: false
    - text: Możliwość działania usługi bez połączenia z internetem, w trybie offline
      correct: false
    - text: Automatyczne skalowanie usługi na wiele serwerów przy dużym ruchu
      correct: false
    - text: Możliwość współpracy systemów z różnych technologii
      correct: true
  explanation: |
    Usługa .NET może być wywołana przez klienta w Javie czy PHP, bo komunikacja opiera się na HTTP, XML lub JSON.
    Praca offline, skalowanie i szyfrowanie to inne cechy systemów.

- id: 425
  question: Do czego służy WSDL?
  answers:
    - text: Do testowania obciążenia usług SOAP przed wdrożeniem
      correct: false
    - text: Do szyfrowania i podpisywania komunikatów SOAP przesyłanych przez sieć
      correct: false
    - text: "Do opisu interfejsu usługi SOAP: operacji, typów i adresu"
      correct: true
    - text: Do wyszukiwania i publikowania usług w globalnym rejestrze dostawców
      correct: false
  explanation: |
    Na podstawie WSDL narzędzia generują proxy klienta.
    Rejestrem usług było UDDI, szyfrowaniem zajmuje się WS-Security lub TLS, a testy obciążeniowe wykonuje się innymi narzędziami.

- id: 426
  question: Jaki był los rejestru UDDI?
  answers:
    - text: Jest podstawą wyszukiwania usług w Kubernetes i Service Mesh
      correct: false
    - text: Zastąpił DNS w internecie
      correct: false
    - text: Jest wymagany przez każdą usługę REST do rejestracji endpointów
      correct: false
    - text: Nie przyjął się w praktyce i jest dziś technologią historyczną
      correct: true
  explanation: |
    UDDI miał być "książką telefoniczną" usług sieciowych, ale publiczne rejestry wygaszono.
    Wyszukiwanie usług w Kubernetes opiera się na DNS klastra i Service, a REST nie wymaga żadnego rejestru.

- id: 427
  question: Co oznacza skrót ABC w konfiguracji WCF?
  answers:
    - text: Application, Behavior, Channel
      correct: false
    - text: Address, Binding, Contract
      correct: true
    - text: Authentication, Binding, Certificate
      correct: false
    - text: API, Backend, Client
      correct: false
  explanation: |
    Endpoint WCF definiuje adres (gdzie), binding (jak - protokół, kodowanie, bezpieczeństwo) i kontrakt (co - operacje usługi).
    Pozostałe rozwinięcia nie są terminologią WCF dla endpointu.

- id: 428
  question: Która cecha odróżnia WCF od usług ASMX?
  answers:
    - text: WCF może być hostowany wyłącznie w IIS, a ASMX także w usługach Windows i aplikacjach konsolowych
      correct: false
    - text: ASMX wspiera kontrakty duplex i transakcje WS-\*, a WCF nie
      correct: false
    - text: WCF obsługuje wiele protokołów i hostingów, ASMX tylko SOAP przez HTTP w IIS
      correct: true
    - text: ASMX obsługuje więcej protokołów niż WCF, w tym TCP, named pipes i MSMQ
      correct: false
  explanation: |
    WCF był znacznie bardziej elastyczny i wspierał standardy WS-\* oraz komunikację dwukierunkową.
    Pozostałe odpowiedzi odwracają możliwości obu technologii.

- id: 429
  question: Który schemat transportu WCF służy do komunikacji na tej samej maszynie?
  answers:
    - text: "`net.msmq`"
      correct: false
    - text: "`net.tcp`"
      correct: false
    - text: "`net.pipe` (named pipes)"
      correct: true
    - text: http
      correct: false
  explanation: |
    Named pipes są najszybszym transportem do komunikacji międzyprocesowej na jednym komputerze.
    `net.tcp` i http działają przez sieć, a `net.msmq` - przez kolejki komunikatów.

- id: 430
  question: Do czego służy WAS przy hostowaniu WCF?
  answers:
    - text: Do zdalnego debugowania usług WCF uruchomionych w IIS z poziomu Visual Studio
      correct: false
    - text: Do generowania proxy klienta na podstawie dokumentu WSDL usługi
      correct: false
    - text: Pozwala hostować w IIS usługi po TCP, named pipes i MSMQ
      correct: true
    - text: Do szyfrowania komunikatów WCF certyfikatem serwera IIS
      correct: false
  explanation: |
    Windows Process Activation Service rozszerza model aktywacji IIS poza HTTP.
    Szyfrowanie zapewnia binding i bezpieczeństwo transportu, proxy generuje svcutil, a debugowanie to funkcja IDE.

- id: 431
  question: Jaki jest prawidłowy format adresu usługi WCF przez TCP?
  answers:
    - text: "`net.tcp://localhost:8090/Service`"
      correct: true
    - text: "`tcp://localhost/Service.svc?wsdl`"
      correct: false
    - text: http+tcp://localhost:8090/Service
      correct: false
    - text: wcf://localhost:8090/Service
      correct: false
  explanation: |
    Adres WCF ma postać schemat://host:port/ścieżka, a schemat TCP to `net.tcp`.
    Pozostałe schematy nie są obsługiwane przez WCF.

- id: 432
  question: Co pozwala zrobić kontrakt duplex w WCF?
  answers:
    - text: Usłudze wywoływać metody na kliencie przez kontrakt callbacku
      correct: true
    - text: Zduplikować usługę na dwóch serwerach dla wysokiej dostępności
      correct: false
    - text: Wywołać dwie usługi jednym żądaniem
      correct: false
    - text: Wysłać ten sam komunikat dwukrotnie dla zapewnienia dostarczenia
      correct: false
  explanation: |
    Kontrakt duplex definiuje `CallbackContract`, który implementuje klient, więc usługa może wysyłać mu powiadomienia.
    Nie dotyczy to wywoływania wielu usług, replikacji ani ponawiania komunikatów.

- id: 433
  question: Który tryb instancji WCF zapewnia najlepszą skalowalność?
  answers:
    - text: "`PerCall` - nowa instancja dla każdego wywołania"
      correct: true
    - text: Static - instancja statyczna
      correct: false
    - text: Single - jedna instancja dla wszystkich klientów
      correct: false
    - text: "`PerSession` - jedna instancja na sesję klienta"
      correct: false
  explanation: |
    `PerCall` nie przechowuje stanu między wywołaniami, więc dobrze się skaluje i nie trzyma zasobów dla nieaktywnych klientów.
    `PerSession` trzyma instancję przez całą sesję, Single wymaga synchronizacji dostępu, a trybu Static nie ma.

- id: 434
  question: Co oznacza skrót SOA?
  answers:
    - text: Service-Oriented Architecture - architektura zorientowana na usługi
      correct: true
    - text: Secure Online Application - bezpieczna aplikacja dostępna przez internet
      correct: false
    - text: Single Origin Access - dostęp z jednego źródła
      correct: false
    - text: Simple Object Access - prosty dostęp do obiektów zdalnych
      correct: false
  explanation: |
    SOA to architektura, w której system składa się z luźno powiązanych usług komunikujących się przez kontrakty.
    "Simple Object Access" to część nazwy protokołu SOAP, a pozostałe rozwinięcia są zmyślone.

- id: 435
  question: Który kontrakt WCF opisuje błędy zwracane klientowi?
  answers:
    - text: "`FaultContract`"
      correct: true
    - text: "`OperationContract`"
      correct: false
    - text: "`MessageContract`"
      correct: false
    - text: "`DataContract`"
      correct: false
  explanation: |
    `[FaultContract]` deklaruje typy błędów SOAP, które operacja może zwrócić.
    `DataContract` opisuje dane, `MessageContract` - strukturę całego komunikatu, a `OperationContract` - samą operację usługi.

- id: 436
  question: Który menedżer transakcji WCF obsługuje transakcje rozproszone między wieloma maszynami?
  answers:
    - text: Kernel Transaction Manager (KTM)
      correct: false
    - text: Entity Framework Change Tracker z `SaveChanges`
      correct: false
    - text: Distributed Transaction Coordinator (DTC)
      correct: true
    - text: Lightweight Transaction Manager (LTM)
      correct: false
  explanation: |
    DTC koordynuje transakcje obejmujące wiele zasobów i serwerów.
    LTM obsługuje transakcje w jednej domenie aplikacji z jednym zasobem, KTM - zasoby systemowe jak system plików, a change tracker EF nie jest menedżerem transakcji.

- id: 437
  question: Która przestrzeń nazw zawiera `ServiceHost` i `ChannelFactory`?
  answers:
    - text: "`System.ServiceModel`"
      correct: true
    - text: "`Microsoft.AspNetCore.Hosting`"
      correct: false
    - text: "`System.Web.Services`"
      correct: false
    - text: "`System.Net.Http`"
      correct: false
  explanation: |
    `System.ServiceModel` to główna przestrzeń nazw WCF.
    `System.Net.Http` zawiera `HttpClient`, `System.Web.Services` - usługi ASMX, a `Microsoft.AspNetCore.Hosting` - hosting ASP.NET Core.

- id: 438
  question: Za co odpowiada host w aplikacji ASP.NET Core?
  answers:
    - text: Za kompilację widoków Razor i plików C# w czasie budowania aplikacji
      correct: false
    - text: Wyłącznie za routing żądań do odpowiednich kontrolerów i endpointów
      correct: false
    - text: Za połączenie z bazą danych i zarządzanie pulą połączeń
      correct: false
    - text: Za DI, konfigurację, logowanie, serwer HTTP i cykl życia aplikacji
      correct: true
  explanation: |
    Host spina wszystkie elementy infrastruktury i zarządza startem oraz zatrzymaniem aplikacji, także usługami `IHostedService`.
    Routing to middleware, kompilację widoków wykonuje SDK, a połączenia z bazą obsługuje np. EF Core.

- id: 439
  question: Czym Generic Host różni się od Web Host?
  answers:
    - text: Generic Host nie obsługuje dependency injection ani konfiguracji, w przeciwieństwie do Web Host
      correct: false
    - text: Generic Host obsługuje każdy rodzaj aplikacji, Web Host tylko webowe
      correct: true
    - text: Web Host jest nowszy i od .NET 6 zastąpił Generic Host we wszystkich typach aplikacji
      correct: false
    - text: Generic Host działa tylko na Linuxie, a Web Host jest przeznaczony dla Windows i IIS
      correct: false
  explanation: |
    Od ASP.NET Core 3.0 Generic Host jest wspólną podstawą, a `WebApplicationBuilder` od .NET 6 opiera się na nim.
    Web Host jest starszy, Generic Host działa na wszystkich platformach i zapewnia DI, konfigurację i logowanie.

- id: 440
  question: Który serwer ASP.NET Core jest dostępny tylko na Windows i wspiera Windows Authentication bez IIS?
  answers:
    - text: HTTP.sys
      correct: true
    - text: Kestrel
      correct: false
    - text: YARP (Yet Another Reverse Proxy)
      correct: false
    - text: Nginx
      correct: false
  explanation: |
    HTTP.sys korzysta ze sterownika jądra Windows.
    Kestrel jest wieloplatformowy, Nginx to zewnętrzny reverse proxy, a YARP - biblioteka reverse proxy w .NET.

- id: 441
  question: Jak w konfiguracji ASP.NET Core zapisuje się klucz zagnieżdżony, np. Host w sekcji Smtp?
  answers:
    - text: "`\"Smtp.Host\"`"
      correct: false
    - text: "\"Smtp:Host\""
      correct: true
    - text: "\"Smtp/Host\""
      correct: false
    - text: "`\"Smtp->Host\"`"
      correct: false
  explanation: |
    `IConfiguration` używa dwukropka jako separatora poziomów, np. `configuration["Smtp:Host"]`.
    W zmiennych środowiskowych zamiast dwukropka stosuje się podwójne podkreślenie (`Smtp__Host`).

- id: 442
  question: Czym różni się `IOptionsSnapshot<T>` od `IOptions<T>`?
  answers:
    - text: "`IOptions` odświeża wartości przy każdym odczycie, a `IOptionsSnapshot` tylko przy restarcie"
      correct: false
    - text: "`IOptionsSnapshot` odświeża wartości per żądanie, `IOptions` czyta je raz"
      correct: true
    - text: "`IOptionsSnapshot` jest singletonem tworzonym przy starcie, a `IOptions` jest scoped"
      correct: false
    - text: "`IOptions` działa tylko z konfiguracją z plików XML, a `IOptionsSnapshot` z JSON"
      correct: false
  explanation: |
    `IOptionsSnapshot` jest scoped i widzi zmiany pliku konfiguracji w kolejnych żądaniach, a `IOptions` ma wartość ustaloną przy pierwszym użyciu.
    Powiadomienia o zmianach w czasie rzeczywistym daje `IOptionsMonitor`, a `IOptions` działa z każdym źródłem konfiguracji.

- id: 443
  question: Jakie jest domyślne środowisko ASP.NET Core, gdy zmienna `ASPNETCORE_ENVIRONMENT` nie jest ustawiona?
  answers:
    - text: Test
      correct: false
    - text: Staging
      correct: false
    - text: Development
      correct: false
    - text: Production
      correct: true
  explanation: |
    Domyślne ustawienie na Production jest bezpieczniejsze, bo nie ujawnia stron deweloperskich z błędami.
    Development jest zwykle ustawiane przez `launchSettings.json` lokalnie, a Staging i Test trzeba ustawić jawnie.

- id: 444
  question: Czego wymaga sesja w aplikacji ASP.NET Core skalowanej na wiele instancji?
  answers:
    - text: Rozproszonego cache (np. Redis) jako magazynu sesji
      correct: true
    - text: Wyłączenia HTTPS
      correct: false
    - text: Nic - sesja w pamięci jest automatycznie współdzielona
      correct: false
    - text: Przechowywania sesji w `ViewState`
      correct: false
  explanation: |
    `AddDistributedMemoryCache` trzyma sesję lokalnie w procesie, więc przy wielu instancjach potrzebny jest Redis lub inny `IDistributedCache` (albo sticky sessions).
    Pamięć procesu nie jest współdzielona, HTTPS nie ma związku, a `ViewState` nie istnieje w ASP.NET Core.

- id: 445
  question: Jaki rodzaj Dockerfile jest zalecany dla aplikacji ASP.NET Core?
  answers:
    - text: Jednoetapowy z obrazem SDK również w produkcji, żeby móc kompilować kod w kontenerze
      correct: false
    - text: Obraz z zainstalowanym Visual Studio
      correct: false
    - text: Obraz Windows Server Core, bo ASP.NET Core nie działa w kontenerach Linux
      correct: false
    - text: "Wieloetapowy: build w obrazie SDK, uruchomienie w lekkim obrazie aspnet runtime"
      correct: true
  explanation: |
    Obraz runtime nie zawiera kompilatora i narzędzi, więc jest mniejszy i bezpieczniejszy.
    SDK w produkcji zwiększa rozmiar i powierzchnię ataku, ASP.NET Core działa w kontenerach Linux, a Visual Studio w obrazie nie ma sensu.

- id: 446
  question: Czym response caching różni się od output caching w ASP.NET Core?
  answers:
    - text: Response caching przechowuje odpowiedzi w Redis, a output caching zapisuje je w przeglądarce
      correct: false
    - text: To dwie nazwy tego samego middleware, zmienione w .NET 7
      correct: false
    - text: Output caching działa tylko dla plików statycznych, a response caching dla kontrolerów
      correct: false
    - text: Response caching steruje nagłówkami HTTP, output caching trzyma odpowiedzi na serwerze
      correct: true
  explanation: |
    `[ResponseCache]` ustawia Cache-Control, a Output Caching (.NET 7+) zapisuje wygenerowaną odpowiedź na serwerze i pozwala ją unieważniać tagami.
    Nie są tym samym, a output caching obsługuje dowolne endpointy.

- id: 447
  question: Jakie są typowe ustawienia wygasania wpisu w `IMemoryCache`?
  answers:
    - text: Absolutne i przesuwne (sliding) wygasanie
      correct: true
    - text: Wygasanie po określonej liczbie odczytów
      correct: false
    - text: Tylko wygasanie po restarcie aplikacji
      correct: false
    - text: Wpisy nigdy nie wygasają
      correct: false
  explanation: |
    `AbsoluteExpiration` usuwa wpis po określonym czasie, a `SlidingExpiration` - po czasie bez użycia.
    Wpisy giną też przy restarcie, ale to nie jest ustawienie wygasania; liczba odczytów nie jest kryterium, a bez ustawień wpis może zostać usunięty przy presji pamięci.

- id: 448
  question: Jaki interfejs reprezentuje cache rozproszony w ASP.NET Core?
  answers:
    - text: "`IOutputCacheStore` jako jedyny"
      correct: false
    - text: "`ICacheProvider`"
      correct: false
    - text: "`IMemoryCache`"
      correct: false
    - text: "`IDistributedCache`"
      correct: true
  explanation: |
    `IDistributedCache` ma implementacje dla Redis, SQL Server i innych magazynów.
    `IMemoryCache` to cache lokalny w procesie, `IOutputCacheStore` służy do output cachingu, a `ICacheProvider` nie jest standardowym interfejsem ASP.NET Core.

- id: 449
  question: Dlaczego API uwierzytelniane tokenem Bearer w nagłówku nie jest podatne na klasyczny CSRF?
  answers:
    - text: Bo CORS całkowicie blokuje wysłanie każdego żądania z innej domeny
      correct: false
    - text: Bo przeglądarka sama nie dołącza nagłówka Authorization
      correct: true
    - text: Bo tokeny JWT są szyfrowane i nie da się ich podrobić na obcej stronie
      correct: false
    - text: Bo API uwierzytelniane tokenem nie obsługuje żądań `POST` z przeglądarki
      correct: false
  explanation: |
    CSRF wykorzystuje automatyczne dołączanie ciasteczek - token w nagłówku trzeba dodać jawnie w kodzie aplikacji.
    Szyfrowanie tokenu nie ma tu znaczenia, API obsługuje `POST`, a CORS blokuje odczyt odpowiedzi, ale nie zawsze samo wysłanie prostego żądania.

- id: 450
  question: Jak uzyskać dostęp do `HttpContext` w zwykłym serwisie ASP.NET Core?
  answers:
    - text: Przez statyczną właściwość `Environment.HttpContext` dostępną w każdej klasie
      correct: false
    - text: Przez wstrzyknięcie `IHttpContextAccessor`
      correct: true
    - text: Przez `new DefaultHttpContext()` utworzony w konstruktorze serwisu
      correct: false
    - text: Przez statyczną właściwość `HttpContext.Current` dostępną w każdej klasie
      correct: false
  explanation: |
    `IHttpContextAccessor` udostępnia bieżący kontekst żądania, choć lepiej przekazywać potrzebne dane jawnie.
    `HttpContext.Current` istniał w `System.Web`, `new HttpContext()` tworzy pusty, niezwiązany obiekt, a `Environment.HttpContext` nie istnieje.
