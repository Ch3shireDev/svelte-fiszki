    `StringBuilder` rozwiązuje ten problem, modyfikując wewnętrzny bufor.
    `String` nie ma limitu 256 znaków, a konkatenacja nie używa blokad ani refleksji.

- id: 43
  question: Kiedy użycie `StringBuilder` ma największy sens?
  answers:
