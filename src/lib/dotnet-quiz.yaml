    Metody prywatne nie są automatycznie statyczne i mogą mieć parametry.
    Klasa `sealed` nie może mieć metod abstrakcyjnych, więc te dwie rzeczy wzajemnie się wykluczają.

- id: 35
  question: Co oznacza modyfikator `protected internal`?
