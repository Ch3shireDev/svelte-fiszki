- id: 1
  text: Czym jest C#? Czym różni się C# od .NET?
  answer: |
    C# to statycznie typowany, obiektowy (z coraz większą domieszką funkcyjności) język programowania stworzony przez Microsoft.
    .NET to platforma, na której ten kod działa: środowisko uruchomieniowe CLR, biblioteka klas bazowych, kompilatory i narzędzia.
    Kod C# jest kompilowany do języka pośredniego IL, który CLR w trakcie działania kompiluje (JIT) do kodu maszynowego.
    W skrócie: C# to język, .NET to platforma - na .NET działają też F# i VB.NET.

- id: 2
  text: Jakie są zalety programowania obiektowego?
  answer: |
    OOP pozwala ponownie wykorzystywać kod dzięki dziedziczeniu i kompozycji.
    Polimorfizm daje elastyczność, bo kod wywołujący operuje na abstrakcjach, a nie konkretnych typach.
    Hermetyzacja chroni stan obiektu i wystawia tylko kontrolowane API.
    Modułowość ułatwia skalowanie, testowanie i debugowanie dużych systemów.

- id: 3
  text: Jakie są ograniczenia programowania obiektowego?
  answer: |
    OOP wymaga nakładu projektowego, więc przy małych skryptach i aplikacjach bywa przerostem formy nad treścią.
    Głębokie hierarchie dziedziczenia prowadzą do silnych powiązań i kruchego kodu.
    Alokacja obiektów i wywołania wirtualne mają pewien koszt wydajnościowy.
    Źle zastosowane OOP dodaje więcej złożoności, niż jej usuwa.

- id: 4
  text: Czym są klasy i obiekty?
  answer: |
    Klasa to szablon (blueprint) definiujący dane (pola, właściwości) i zachowanie (metody, zdarzenia) typu.
    Obiekt to konkretna instancja klasy, tworzona słowem `new` i przechowywana na stercie.
    Konstruktor wykonuje się przy tworzeniu obiektu, pole przechowuje dane, właściwość kontroluje odczyt i zapis pola, a metoda to blok instrukcji wykonujących akcję.
    Z jednej klasy można utworzyć wiele obiektów, każdy z własnym stanem.

- id: 5
  text: Jakie są rodzaje klas w C#?
  answer: |
    Podstawowe rodzaje to klasy zwykłe (konkretne), abstrakcyjne, zapieczętowane (`sealed`), statyczne i częściowe (`partial`).
    Klasy abstrakcyjnej nie da się zainstancjonować, po `sealed` nie da się dziedziczyć, a statyczna zawiera wyłącznie składowe statyczne.
    Klasy `partial` pozwalają rozbić definicję na kilka plików.
    Do tego dochodzą klasy zagnieżdżone, generyczne oraz rekordy (`record`) z porównywaniem wartościowym.

- id: 6
  text: Czy można w C# zablokować tworzenie obiektów klasy?
  answer: |
    Tak. Można oznaczyć klasę jako `abstract`, co blokuje bezpośrednie tworzenie instancji.
    Można zrobić ją `static` - wtedy instancji nie da się utworzyć w ogóle.
    Można też ustawić wszystkie konstruktory jako `private`, wtedy obiekty powstają tylko wewnątrz klasy (np. Singleton, metody fabrykujące).

- id: 7
  text: Czym jest właściwość (property)?
  answer: |
    Właściwość to składowa klasy udostępniająca wartość przez akcesory `get` i `set`, ukrywając pole pod spodem.
    Dla wywołującego wygląda jak pole, ale akcesory to w rzeczywistości metody, więc można dodać walidację lub logikę.
    Właściwości automatyczne (`public string` Name `{ get; set; }`) same generują pole wspierające.
    Akcesory mogą mieć różne poziomy dostępu, a akcesor `init` pozwala ustawić wartość tylko podczas inicjalizacji obiektu.

- id: 8
  text: Czym różni się właściwość od metody?
  answer: |
    Właściwość reprezentuje dane lub stan obiektu i odwołuje się do niej bez nawiasów, jak do pola.
    Metoda reprezentuje akcję i może przyjmować parametry.
    Właściwości powinny być tanie, bez zaskakujących efektów ubocznych i zwracać spójne wartości.
    Jeśli pobranie wartości jest kosztowne, ma efekty uboczne lub wymaga argumentów - to powinna być metoda.

- id: 9
  text: Czym są przestrzenie nazw (namespaces)?
  answer: |
    Przestrzeń nazw to logiczny kontener grupujący powiązane typy i zapobiegający kolizjom nazw.
    Dwie klasy Logger mogą istnieć obok siebie, jeśli są w różnych przestrzeniach nazw.
    Importuje się je dyrektywą `using`, a od C# 10 są file-scoped namespaces i global `using`.
    Przestrzenie nazw są czysto logiczne - nie zależą od assembly ani struktury katalogów, choć zwykle ją odzwierciedlają.

- id: 10
  text: Czym jest dziedziczenie? Kiedy go używać?
  answer: |
    Dziedziczenie pozwala klasie pochodnej przejąć i rozszerzyć składowe klasy bazowej (składnia `class` B : A).
    Modeluje relację "jest" (is-a), np. `SavingsAccount` jest Account.
    Używaj go, gdy istnieje prawdziwa relacja is-a i wspólne zachowanie, które klasy pochodne specjalizują.
    Jeśli chcesz tylko ponownie użyć kodu, wybierz kompozycję - dziedziczenie mocno wiąże klasy.

- id: 11
  text: Jakie są rodzaje dziedziczenia?
  answer: |
    Pojedyncze - jedna klasa dziedziczy po jednej klasie bazowej.
    Wielopoziomowe - łańcuch, np. C dziedziczy po B, które dziedziczy po A.
    Hierarchiczne - kilka klas dziedziczy po tej samej klasie bazowej.
    Wielokrotne i hybrydowe dziedziczenie klas nie jest w C# wspierane, ale można je osiągnąć interfejsami.

- id: 12
  text: Czy C# wspiera wielokrotne dziedziczenie? Jak je zrealizować?
  answer: |
    C# nie wspiera wielokrotnego dziedziczenia klas, żeby uniknąć problemu diamentu i niejednoznaczności.
    Klasa może za to implementować dowolną liczbę interfejsów, np. `class` Duck : Animal, `IFlyable`, `ISwimmable`.
    Wspólną implementację można dodać przez domyślne metody interfejsów (C# 8) albo kompozycję.

- id: 13
  text: Jak zablokować dziedziczenie po klasie?
  answer: |
    Oznaczyć klasę słowem `sealed`, np. `public sealed class` Config.
    Klasy statyczne są niejawnie zapieczętowane.
    Po klasie z wyłącznie prywatnymi konstruktorami też nie da się dziedziczyć z zewnątrz.
    Pojedynczą nadpisaną metodę można zablokować przez `sealed override`.

- id: 14
  text: Czy prywatne składowe klasy są dziedziczone przez klasę pochodną?
  answer: |
    Technicznie tak - prywatne pola są częścią pamięci obiektu pochodnego.
    Nie są jednak dostępne z kodu klasy pochodnej.
    Jeśli klasa pochodna potrzebuje dostępu, składowa powinna być `protected` albo udostępniona przez chronione/publiczne właściwości lub metody.

- id: 15
  text: Czym jest abstrakcja? Jak ją stosować w prawdziwych aplikacjach?
  answer: |
    Abstrakcja to pokazywanie tylko istotnych cech czegoś i ukrywanie szczegółów implementacji.
    W C# realizuje się ją interfejsami i klasami abstrakcyjnymi, np. `IPaymentGateway` z metodą Pay.
    Kod korzysta z abstrakcji, a konkretne klasy (`StripeGateway`, `PayPalGateway`) ukrywają, jak to działa naprawdę.
    Dzięki temu implementację łatwo podmienić, zamockować w testach i zrozumieć.

- id: 16
  text: Czym jest hermetyzacja (enkapsulacja)? Jak ją stosować w prawdziwych aplikacjach?
  answer: |
    Hermetyzacja to łączenie danych z operującymi na nich metodami przy jednoczesnym ograniczeniu bezpośredniego dostępu do danych.
    W C# realizuje się ją prywatnymi polami, publicznymi właściwościami/metodami i modyfikatorami dostępu.
    Przykład: `BankAccount` wystawia metody Deposit i Withdraw z walidacją zamiast publicznego settera Balance.
    Chroni to niezmienniki - obiekt nie może zostać z zewnątrz wprowadzony w nieprawidłowy stan.

- id: 17
  text: Czym różni się abstrakcja od hermetyzacji?
  answer: |
    Abstrakcja dotyczy projektu - decyduje, co obiekt robi i jakie cechy wystawia.
    Hermetyzacja dotyczy implementacji - ukrywa stan wewnętrzny i kontroluje dostęp do niego.
    Abstrakcję realizują interfejsy i klasy abstrakcyjne, hermetyzację modyfikatory dostępu i właściwości.
    W skrócie: abstrakcja ukrywa złożoność, hermetyzacja ukrywa dane.

- id: 18
  text: Czym jest polimorfizm i jakie są jego rodzaje? Kiedy go używać?
  answer: |
    Polimorfizm ("wiele form") oznacza, że to samo wywołanie zachowuje się różnie w zależności od typu obiektu.
    Polimorfizm czasu kompilacji (statyczny) to przeciążanie metod i operatorów.
    Polimorfizm czasu wykonania (dynamiczny) to metody wirtualne, nadpisywanie i interfejsy.
    Używaj go, gdy różne typy dzielą kontrakt, ale realizują go inaczej, np. lista obiektów Shape, z których każdy liczy swoje pole.

- id: 19
  text: Czym jest przeciążanie metod? Na ile sposobów można przeciążyć metodę?
  answer: |
    Przeciążanie to definiowanie wielu metod o tej samej nazwie, ale różnych sygnaturach.
    Metodę można przeciążyć inną liczbą parametrów, innymi typami parametrów lub inną kolejnością typów.
    Może też różnić się modyfikatorem parametru (`ref/out/in` kontra brak), ale nie tylko `ref` kontra `out`.
    Sam typ zwracany nie należy do sygnatury, więc nie służy do przeciążania.

- id: 20
  text: Kiedy używać przeciążania metod w prawdziwych aplikacjach?
  answer: |
    Gdy ta sama logiczna operacja przyjmuje różne dane wejściowe, np. `Log(string message)` i `Log(Exception ex)`.
    Poprawia to czytelność API, bo nie trzeba pamiętać wielu różnych nazw.
    Klasyczny przykład to `Console.WriteLine` z przeciążeniami dla wielu typów.
    Nie przeciążaj metod robiących koncepcyjnie różne rzeczy; czasem parametry opcjonalne są czystszą alternatywą.

- id: 21
  text: Co się stanie, jeśli dwie metody różnią się tylko typem zwracanym?
  answer: |
    Nie są przeciążone - dostaniesz błąd kompilacji CS0111 (typ już definiuje składową o tych samych typach parametrów).
    Typ zwracany nie jest częścią sygnatury metody w C#.
    Kompilator nie miałby jak wybrać metody, zwłaszcza gdy wynik jest ignorowany.

- id: 22
  text: Czym różni się przeciążanie (overloading) od nadpisywania (overriding)?
  answer: |
    Przeciążanie to ta sama nazwa z różnymi parametrami, zwykle w tej samej klasie; rozstrzygane w czasie kompilacji.
    Nadpisywanie to nowa implementacja metody `virtual/abstract` w klasie pochodnej z identyczną sygnaturą; rozstrzygane w czasie wykonania.
    Przeciążanie nie wymaga słów kluczowych, nadpisywanie wymaga `virtual/abstract` w bazie i `override` w pochodnej.
    Przeciążanie to polimorfizm statyczny, nadpisywanie - dynamiczny.

- id: 23
  text: Do czego służy nadpisywanie metod? Kiedy je stosować w prawdziwych aplikacjach?
  answer: |
    Nadpisywanie pozwala klasie pochodnej zmienić lub rozszerzyć zachowanie metody bazowej, zachowując ten sam kontrakt.
    Używa się go, gdy podklasy potrzebują wyspecjalizowanego zachowania, np. inne `CalculateDiscount` dla klienta zwykłego i VIP.
    Często nadpisuje się też metody frameworka: `ToString`, Equals, `GetHashCode` albo haki wzorca Template Method.
    Implementację bazową można wywołać przez `base.Metoda()` i dodać logikę wokół niej.

- id: 24
  text: Czy metodę oznaczoną jako `virtual` trzeba nadpisać w klasie pochodnej?
  answer: |
    Nie. Nadpisanie metody wirtualnej jest opcjonalne - bez niego klasa pochodna dziedziczy implementację bazową.
    Obowiązkowo trzeba nadpisać tylko metody `abstract` w nieabstrakcyjnej klasie pochodnej.
    `virtual` znaczy "można nadpisać", `abstract` znaczy "trzeba nadpisać".

- id: 25
  text: Czym różni się nadpisywanie metody od jej ukrywania (method hiding)?
  answer: |
    Nadpisywanie (`virtual + override`) zastępuje implementację bazową - wywoła się metoda pochodna nawet przez referencję typu bazowego.
    Ukrywanie (słowo `new`) tworzy niezwiązaną metodę o tej samej nazwie, która tylko przesłania bazową.
    Przy ukrywaniu decyduje typ referencji: zmienna typu Base wywoła metodę Base, zmienna typu Derived - metodę Derived.
    Ukrywanie rzadko jest tym, czego się chce, i zwykle świadczy o problemie projektowym.

- id: 26
  text: Czym różni się klasa abstrakcyjna od interfejsu (podaj co najmniej 4 różnice)?
  answer: |
    Klasa może dziedziczyć tylko po jednej klasie abstrakcyjnej, ale implementować wiele interfejsów.
    Klasa abstrakcyjna może mieć pola, konstruktory i stan; interfejs nie może mieć pól instancji ani konstruktorów.
    Składowe klasy abstrakcyjnej mogą mieć dowolne modyfikatory dostępu, składowe interfejsu są domyślnie publiczne.
    Klasa abstrakcyjna to baza "jest" ze wspólną implementacją, interfejs to kontrakt/zdolność ("potrafi"); domyślne metody interfejsów z C# 8 zmniejszyły tę różnicę, ale jej nie usunęły.

- id: 27
  text: Kiedy używać interfejsu, a kiedy klasy abstrakcyjnej?
  answer: |
    Interfejsu używaj do zdefiniowania kontraktu, który mogą realizować niezwiązane klasy, np. `ILogger`, `IRepository`, `IDisposable`.
    Interfejsy to domyślny wybór dla dependency injection i mockowania w testach.
    Klasy abstrakcyjnej używaj, gdy powiązane klasy dzielą wspólny stan lub implementację, np. `BaseController`.
    Często łączy się oba: interfejs jako kontrakt i abstrakcyjna klasa bazowa z wspólną logiką.

- id: 28
  text: Po co tworzyć interfejsy w prawdziwych aplikacjach?
  answer: |
    Interfejsy oddzielają kod od konkretnych implementacji, więc implementację można podmienić bez zmiany konsumentów.
    Umożliwiają testy jednostkowe, bo zależności można zastąpić mockami.
    Są fundamentem dependency injection w ASP.NET Core.
    Pozwalają klasie pełnić wiele ról, czego pojedyncze dziedziczenie klas nie umożliwia.

- id: 29
  text: Czy metody interfejsu mogą mieć ciało? Kiedy to stosować?
  answer: |
    Tak, od C# 8 interfejsy mogą mieć domyślne implementacje metod (default interface methods).
    Główne zastosowanie to rozwijanie publicznego interfejsu - dodanie metody bez psucia istniejących implementacji.
    Interfejsy mogą też mieć składowe statyczne, a od C# 11 statyczne abstrakcyjne (np. generic math).
    W zwykłym kodzie aplikacji lepiej trzymać interfejsy jako czyste kontrakty.

- id: 30
  text: Czy można utworzyć instancję klasy abstrakcyjnej lub interfejsu?
  answer: |
    Nie, żadnego z nich nie można bezpośrednio utworzyć przez `new`.
    Instancje tworzy się z klas konkretnych dziedziczących po klasie abstrakcyjnej lub implementujących interfejs.
    Można natomiast mieć zmienną typu abstrakcyjnego lub interfejsu, np. `IShape s = new Circle()`.

- id: 31
  text: Czy interfejs może mieć konstruktor?
  answer: |
    Nie, interfejs nie może mieć konstruktorów instancyjnych, bo nie ma instancji ani stanu.
    Od C# 8 może mieć konstruktor statyczny do inicjalizacji składowych statycznych.
    Logika konstrukcji zawsze należy do klasy implementującej.

- id: 32
  text: Czy klasa abstrakcyjna może mieć konstruktory?
  answer: |
    Tak. Klasa abstrakcyjna może mieć konstruktory, mimo że nie da się jej bezpośrednio zainstancjonować.
    Są wywoływane przy tworzeniu klasy pochodnej przez łańcuch konstruktorów (`base(...)`).
    Zwykle inicjalizują wspólne pola; dobrą praktyką jest oznaczać je jako `protected`.

- id: 33
  text: Czym różni się abstrakcja od klasy abstrakcyjnej?
  answer: |
    Abstrakcja to ogólna koncepcja OOP - ukrywanie szczegółów i wystawianie tylko tego, co istotne.
    Klasa abstrakcyjna to konkretna konstrukcja języka C#, jedno z narzędzi do osiągnięcia abstrakcji.
    Abstrakcję można osiągnąć też interfejsami, delegatami czy po prostu dobrze nazwanymi metodami.

- id: 34
  text: Czy klasa abstrakcyjna może być `sealed` lub `static`?
  answer: |
    Nie. Klasa abstrakcyjna istnieje po to, by po niej dziedziczyć, a `sealed` tego zabrania - to sprzeczność i błąd kompilacji.
    Nie może być też `static`, bo klasy statycznej nie da się dziedziczyć ani instancjonować.
    Może jednak zawierać składowe statyczne i metody `sealed override`.

- id: 35
  text: Czy metody abstrakcyjne mogą być prywatne?
  answer: |
    Nie. Metoda abstrakcyjna musi zostać nadpisana w klasie pochodnej, a prywatna składowa jest dla niej niewidoczna.
    Kompilator zgłasza błąd CS0621 (składowe `virtual` i `abstract` nie mogą być prywatne).
    Metody abstrakcyjne są zwykle `public` lub `protected`.

- id: 36
  text: Czy klasa abstrakcyjna wspiera wielokrotne dziedziczenie?
  answer: |
    Nie. Klasa może dziedziczyć tylko po jednej klasie, abstrakcyjnej czy nie.
    Klasa abstrakcyjna sama może dziedziczyć po jednej klasie i implementować wiele interfejsów.
    Do zachowań z wielu źródeł służą interfejsy.

- id: 37
  text: Czym są modyfikatory dostępu?
  answer: |
    Modyfikatory dostępu określają widoczność typów i składowych.
    C# ma: `public`, `private`, `protected`, `internal`, `protected internal` i `private protected`.
    `public` - wszędzie, `private` - tylko w typie, `protected` - w typie i pochodnych, `internal` - w tym samym assembly.
    `protected internal` to pochodne LUB to samo assembly, `private protected` to pochodne ORAZ to samo assembly.

- id: 38
  text: Czym jest modyfikator `internal`? Pokaż przykład.
  answer: |
    `internal` ogranicza dostęp do typu lub składowej do tego samego assembly (projektu).
    Przydaje się do ukrywania szczegółów implementacji przed użytkownikami biblioteki.
    Przykład: `internal class PriceCalculator { internal decimal Calculate() => 42m; }`
    Innemu assembly można dać dostęp atrybutem `[InternalsVisibleTo("MyProject.Tests")]`, typowo dla testów.

- id: 39
  text: Jaki jest domyślny modyfikator dostępu w klasie?
  answer: |
    Składowe klasy (pola, metody, właściwości) są domyślnie `private`.
    Klasy najwyższego poziomu są domyślnie `internal`.
    Typy zagnieżdżone są domyślnie `private`, a składowe interfejsu domyślnie `public`.

- id: 40
  text: Czym jest boxing i unboxing? Gdzie występuje w prawdziwych aplikacjach?
  answer: |
    Boxing to konwersja typu wartościowego (np. `int`) na `object` lub interfejs - wartość jest kopiowana do nowego obiektu na stercie.
    Unboxing to wyciągnięcie wartości z obiektu przez jawne rzutowanie, np. `int i = (int)obj`.
    Występuje niejawnie przy kolekcjach niegenerycznych (`ArrayList`), `string.Format` z typami wartościowymi czy przekazywaniu struktur jako interfejsów.
    W praktyce należy go raczej unikać niż stosować - po to istnieją generyki.

- id: 41
  text: Który jest jawny - boxing czy unboxing?
  answer: |
    Unboxing jest jawny - wymaga rzutowania, np. `int x = (int)obj`.
    Boxing jest niejawny, np. `object obj = 5`;
    Unboxing do złego typu rzuca `InvalidCastException` w czasie wykonania.

- id: 42
  text: Czy boxing i unboxing są dobre dla wydajności?
  answer: |
    Nie. Boxing alokuje nowy obiekt na stercie i kopiuje wartość, co zwiększa obciążenie GC.
    Unboxing wymaga sprawdzenia typu i kopiowania.
    W gorących ścieżkach (pętle, duże kolekcje) koszt się sumuje, dlatego `List<int>` wygrywa z `ArrayList`.

- id: 43
  text: Jakie są podstawowe operacje na stringach w C#?
  answer: |
    Łączenie (`+`, `string.Concat`, `string.Join`), interpolacja i formatowanie (`string.Format`).
    Wyszukiwanie: Contains, `IndexOf`, `StartsWith`, `EndsWith`.
    Przekształcanie: Substring, Replace, `ToUpper`, `ToLower`, Trim, `PadLeft`, Split.
    Porównywanie: Equals, Compare, `==` - a stringi są niemutowalne, więc każda operacja zwraca nowy `string`.

- id: 44
  text: Czym różni się `String` od `StringBuilder`?
  answer: |
    `String` jest niemutowalny - każda modyfikacja tworzy nowy obiekt w pamięci.
    `StringBuilder` jest mutowalny - modyfikuje wewnętrzny bufor bez alokowania nowego obiektu za każdym razem.
    Dzięki temu `StringBuilder` jest znacznie szybszy przy wielu kolejnych modyfikacjach.
    `String` jest w System, `StringBuilder` w `System.Text`.

- id: 45
  text: Kiedy używać `String`, a kiedy `StringBuilder`?
  answer: |
    `String` do stałego tekstu i niewielu konkatenacji - jest prostszy, a kompilator optymalizuje proste przypadki.
    `StringBuilder` przy budowaniu tekstu w pętli lub wieloma dopisaniami, np. generowanie CSV, raportów, dużego HTML.
    Zasada orientacyjna: konkatenacja w pętli albo więcej niż kilka razy - `StringBuilder`.

- id: 46
  text: Czym jest interpolacja stringów w C#?
  answer: |
    To składnia osadzania wyrażeń bezpośrednio w literale tekstowym z prefiksem `$`.
    Przykład: `$"Cześć {name}, masz {age} lat"`.
    Obsługuje formatowanie (`{price:C2}`) i wyrównanie, jest czytelniejsza niż `string.Format`.
    Od C# 10 interpolated `string` handlers czynią ją wydajną, a raw literals (`$""" ... """`) ułatwiają tekst wielolinijkowy.

- id: 47
  text: Jakie są rodzaje pętli w C#? Kiedy której używać?
  answer: |
    `for` - gdy znasz liczbę iteracji lub potrzebujesz indeksu.
    `foreach` - do iterowania po kolekcji; najczytelniejsza i domyślna.
    `while` - gdy pętla działa do zmiany warunku, a liczba iteracji jest nieznana, np. czytanie strumienia.
    do-while - gdy ciało musi wykonać się co najmniej raz, np. ponawianie próby lub menu.

- id: 48
  text: Czym różni się `continue` od `break`?
  answer: |
    `break` kończy całą pętlę (lub `switch`), a wykonanie przechodzi za nią.
    `continue` pomija resztę bieżącej iteracji i przechodzi do następnej.
    Przykład: `continue` pomija liczby nieparzyste, `break` zatrzymuje pętlę na pierwszej liczbie ujemnej.

- id: 49
  text: Jakie są alternatywy dla if-else? Kiedy czego używać?
  answer: |
    Operator trójargumentowy (warunek ? a : b) - proste przypisanie zależne od jednego warunku.
    `switch` lub `switch` expression z pattern matchingiem - wiele dyskretnych przypadków dla jednej wartości.
    Operatory ??, `??= i` ?. - obsługa nulli.
    Przy złożonym rozgałęzianiu po typach polimorfizm lub słownik handlerów bywa czystszy niż długi łańcuch if-else.

- id: 50
  text: Jak zaimplementować obsługę wyjątków w C#?
  answer: |
    Ryzykowny kod umieszcza się w `try`, konkretne wyjątki obsługuje w `catch`, a sprzątanie w `finally`.
    Łap najpierw najbardziej szczegółowe wyjątki i nie połykaj ich po cichu.
    Do ponownego rzucenia używaj `throw;` (zachowuje stack trace), do błędów domenowych - własnych klas wyjątków.
    W ASP.NET Core stosuje się globalną obsługę przez middleware zamiast `try/catch` w każdej akcji.

- id: 51
  text: Czy można wykonać wiele bloków `catch`?
  answer: |
    Można zdefiniować wiele bloków `catch`, ale dla danego wyjątku wykona się tylko jeden - pierwszy pasujący.
    Dlatego wyjątki szczegółowe muszą być przed ogólnymi, jak `Exception`.
    Filtry wyjątków (`catch` (`Exception` ex) `when` (...)) pozwalają na precyzyjniejsze dopasowanie.

- id: 52
  text: Kiedy używać `finally` w prawdziwych aplikacjach?
  answer: |
    Do kodu sprzątającego, który musi się wykonać niezależnie od wystąpienia wyjątku.
    Typowe przykłady: zamykanie plików i połączeń, zwalnianie locków, zatrzymywanie timerów, logowanie końca operacji.
    Dla zasobów `IDisposable using` jest krótszym odpowiednikiem `try/finally`.

- id: 53
  text: Czy może istnieć blok `try` bez `catch`?
  answer: |
    Tak, `try` może iść w parze z samym `finally` (try-finally).
    Stosuje się to, gdy chcemy gwarantowanego sprzątania, ale wyjątek ma polecieć wyżej.
    Sam `try` bez `catch` i bez `finally` się nie skompiluje.

- id: 54
  text: Czym różni się `finally` od Finalize?
  answer: |
    `finally` to blok obsługi wyjątków, który zawsze wykonuje się po `try/catch`.
    Finalize to metoda (zapisywana jako destruktor `~NazwaKlasy`) wywoływana przez GC przed zwolnieniem obiektu.
    `finally` działa deterministycznie w znanym momencie, Finalize w nieprzewidywalnym momencie wybranym przez GC.

- id: 55
  text: Czym różni się `throw ex` od `throw`? Którego używać?
  answer: |
    `throw;` ponownie rzuca bieżący wyjątek i zachowuje oryginalny stack trace.
    `throw ex;` rzuca ten sam obiekt, ale resetuje stack trace do bieżącego miejsca, tracąc informację, gdzie był błąd.
    W praktyce używaj `throw;` - albo opakuj wyjątek w nowy, przekazując oryginał jako `InnerException`.

- id: 56
  text: Czym są generyki w C#? Kiedy i po co ich używać?
  answer: |
    Generyki pozwalają pisać klasy i metody z parametrami typu, np. `List<T>` czy `Repository<TEntity>`.
    Dają bezpieczeństwo typów w czasie kompilacji, eliminują rzutowania i boxing typów wartościowych.
    Używa się ich w komponentach wielokrotnego użytku: kolekcjach, repozytoriach, wrapperach wyników, cache.
    Ograniczenia (`where` T : `class`, `new()`, `IEntity`) zawężają dopuszczalne typy.

- id: 57
  text: Czym są kolekcje w C# i jakie są ich rodzaje?
  answer: |
    Kolekcje to klasy do przechowywania i zarządzania grupami obiektów o dynamicznym rozmiarze.
    Generyczne (`System.Collections.Generic`): `List<T>`, `Dictionary<TKey,TValue>`, `HashSet<T>`, `Queue<T>`, `Stack<T>`, `LinkedList<T>`.
    Niegeneryczne (`System.Collections`): `ArrayList`, Hashtable - dziś przestarzałe.
    Do tego współbieżne (`ConcurrentDictionary`, `BlockingCollection`) i niemutowalne (`ImmutableList`, `FrozenDictionary`).

- id: 58
  text: Czym różni się tablica od `ArrayList` (co najmniej 2 różnice)?
  answer: |
    Tablica ma stały rozmiar ustalany przy tworzeniu, `ArrayList` rośnie dynamicznie.
    Tablica jest silnie typowana, `ArrayList` przechowuje `object`, więc wymaga rzutowania i powoduje boxing.
    Tablica jest szybsza i bezpieczniejsza typowo; `ArrayList` jest przestarzała - zamiast niej używa się `List<T>`.

- id: 59
  text: Czym różni się `ArrayList` od Hashtable?
  answer: |
    `ArrayList` to lista elementów dostępnych po indeksie liczbowym.
    Hashtable przechowuje pary klucz-wartość, dostęp jest po kluczu z wykorzystaniem hashowania.
    Obie są niegeneryczne i przechowują `object`; nowoczesne odpowiedniki to `List<T>` i `Dictionary<TKey,TValue>`.

- id: 60
  text: Czym różni się List od Dictionary?
  answer: |
    `List<T>` to uporządkowana kolekcja elementów dostępnych po indeksie; wyszukiwanie po wartości jest `O(n)`.
    `Dictionary<TKey,TValue>` przechowuje pary klucz-wartość z wyszukiwaniem po kluczu średnio `O(1)`.
    Klucze w słowniku muszą być unikalne, lista może zawierać duplikaty.
    List do sekwencji, Dictionary do szybkich wyszukiwań po identyfikatorze.

- id: 61
  text: Czym jest `IEnumerable` w C#?
  answer: |
    `IEnumerable<T>` to interfejs reprezentujący sekwencję, po której można iterować (np. `foreach`).
    Ma jedną metodę `GetEnumerator` zwracającą `IEnumerator<T>`.
    Jest podstawą LINQ to Objects i wspiera leniwe wykonanie - elementy są produkowane w trakcie iteracji.
    Implementują go wszystkie standardowe kolekcje.

- id: 62
  text: Czym różni się `IEnumerable` od `IEnumerator`?
  answer: |
    `IEnumerable` to "coś, po czym można iterować" - zwraca enumerator metodą `GetEnumerator`.
    `IEnumerator` to "kursor" przechodzący po sekwencji: `MoveNext`, Current i Reset.
    `IEnumerator` utrzymuje stan iteracji, dlatego każdy `foreach` dostaje nowy enumerator.
    Na co dzień używa się `IEnumerable`, a enumerator obsługuje `foreach` pod spodem.

- id: 63
  text: Czym różni się `IEnumerable` od `IQueryable`? Dlaczego `IQueryable` w zapytaniach SQL?
  answer: |
    `IEnumerable` wykonuje operacje LINQ w pamięci na obiektach (delegaty Func).
    `IQueryable` buduje drzewo wyrażeń (Expression), które provider (np. EF Core) tłumaczy na SQL.
    Z `IQueryable` filtry, sortowanie i stronicowanie wykonują się w bazie, więc pobierane są tylko potrzebne wiersze.
    Rzutowanie na `IEnumerable` zbyt wcześnie oznacza ściągnięcie całej tabeli do pamięci i filtrowanie w C#.

- id: 64
  text: Czym jest konstruktor? Kiedy go używać?
  answer: |
    Konstruktor to specjalna metoda o nazwie klasy, bez typu zwracanego, wywoływana przy tworzeniu obiektu.
    Służy do inicjalizacji stanu i zapewnienia, że obiekt od początku jest poprawny.
    W prawdziwych aplikacjach przez konstruktor wstrzykuje się zależności (constructor injection) i waliduje wymagane parametry.
    Od C# 12 klasy mogą mieć primary constructors.

- id: 65
  text: Jakie są rodzaje konstruktorów?
  answer: |
    Domyślny (bezparametrowy), parametryzowany, kopiujący, statyczny i prywatny.
    Konstruktory można przeciążać i łączyć łańcuchowo przez `this(...)` oraz `base(...)`.
    W nowszym C# dochodzą primary constructors w klasach i strukturach.

- id: 66
  text: Czym jest konstruktor domyślny?
  answer: |
    To konstruktor bez parametrów.
    Jeśli klasa nie definiuje żadnego konstruktora, kompilator generuje publiczny konstruktor domyślny.
    Gdy zdefiniujesz jakikolwiek konstruktor z parametrami, domyślny przestaje być generowany automatycznie.

- id: 67
  text: Czym jest konstruktor parametryzowany?
  answer: |
    To konstruktor przyjmujący parametry, którymi inicjalizuje stan obiektu.
    Pozwala wymusić podanie wymaganych danych przy tworzeniu, np. `new User(email, name)`.
    Jest podstawą constructor injection w ASP.NET Core.

- id: 68
  text: Czym jest konstruktor statyczny? Do czego służy?
  answer: |
    Konstruktor statyczny inicjalizuje składowe statyczne klasy i wykonuje się automatycznie raz, przed pierwszym użyciem typu.
    Nie da się go wywołać ręcznie i nie wiadomo dokładnie, kiedy się wykona - tylko że przed pierwszym dostępem.
    Używa się go do jednorazowej inicjalizacji, np. wczytania konfiguracji, przygotowania cache lub tabel lookup.
    Wyjątek w nim powoduje `TypeInitializationException` i typ staje się bezużyteczny.

- id: 69
  text: Czy konstruktor statyczny może mieć parametry lub modyfikator dostępu?
  answer: |
    Nie. Konstruktor statyczny nie może mieć parametrów ani modyfikatora dostępu.
    Wywołuje go środowisko uruchomieniowe, więc nie ma jak przekazać argumentów.
    Klasa może mieć tylko jeden konstruktor statyczny.

- id: 70
  text: Czym jest konstruktor kopiujący?
  answer: |
    To konstruktor przyjmujący obiekt tej samej klasy i kopiujący z niego stan, np. `public Person(Person other)`.
    C# nie generuje go automatycznie - trzeba go napisać ręcznie.
    Trzeba uważać na płytką i głęboką kopię pól referencyjnych.
    Rekordy mają wbudowany mechanizm kopiowania przez wyrażenie `with`.

- id: 71
  text: Czym jest konstruktor prywatny? Do czego służy?
  answer: |
    Konstruktor prywatny uniemożliwia tworzenie instancji spoza klasy.
    Stosuje się go we wzorcu Singleton, w klasach z metodami fabrykującymi (np. `Order.Create(...)`) i w klasach z samymi stałymi.
    Pozwala kontrolować sposób tworzenia obiektów i wymuszać walidację.

- id: 72
  text: Czym jest przeciążanie konstruktorów?
  answer: |
    To definiowanie kilku konstruktorów o różnych listach parametrów w jednej klasie.
    Pozwala tworzyć obiekt na różne sposoby, np. z samą nazwą lub z nazwą i ceną.
    Żeby nie powielać logiki, konstruktory łączy się przez : `this(...)`.

- id: 73
  text: Czym jest destruktor?
  answer: |
    Destruktor (`~NazwaKlasy`) to metoda wywoływana przez GC przed zwolnieniem obiektu - kompilowana do Finalize.
    Nie ma parametrów ani modyfikatorów, nie da się go wywołać ręcznie i nie wiadomo, kiedy się wykona.
    Używa się go tylko jako zabezpieczenia przy zasobach niezarządzanych, zwykle razem ze wzorcem Dispose.
    Obiekty z finalizatorem żyją dłużej i obciążają GC, więc dodaje się je rzadko.

- id: 74
  text: Czy można utworzyć obiekt klasy z prywatnym konstruktorem?
  answer: |
    Z zewnątrz klasy - nie, kompilator na to nie pozwoli.
    Wewnątrz klasy - tak, np. w statycznej metodzie fabrykującej lub właściwości Instance singletona.
    Teoretycznie da się też przez refleksję (`Activator.CreateInstance` z `nonPublic`), ale to obejście.

- id: 75
  text: Który konstruktor wykona się pierwszy przy tworzeniu obiektu klasy pochodnej?
  answer: |
    Najpierw wykonuje się konstruktor klasy bazowej, potem pochodnej.
    Kolejność to od góry hierarchii w dół, bo klasa pochodna musi dostać zainicjalizowaną część bazową.
    Inicjalizatory pól klasy pochodnej wykonują się jednak jeszcze przed konstruktorem bazowym.

- id: 76
  text: Czym jest metoda w C#?
  answer: |
    Metoda to blok kodu wykonujący określoną akcję, zdefiniowany wewnątrz klasy lub struktury.
    Ma modyfikator dostępu, typ zwracany (lub `void`), nazwę i listę parametrów.
    Metody mogą być instancyjne lub statyczne, synchroniczne lub `async`, generyczne, a od C# 6 zapisywane jako expression-bodied (`=>`).

- id: 77
  text: Czym różni się przekazywanie parametrów przez wartość od przekazywania przez referencję?
  answer: |
    Przy przekazaniu przez wartość metoda dostaje kopię - dla typów wartościowych kopię wartości, dla referencyjnych kopię referencji.
    Zmiana parametru wewnątrz metody nie wpływa wtedy na zmienną wywołującego (choć stan obiektu referencyjnego można zmodyfikować).
    Przy przekazaniu przez referencję (`ref`, `out`, `in`) metoda operuje na samej zmiennej wywołującego.
    Dzięki temu może przypisać jej zupełnie nową wartość lub nowy obiekt.

- id: 78
  text: Jak zwrócić więcej niż jedną wartość z metody w C#?
  answer: |
    Najczystszy sposób to krotki: (`int` min, `int` max) `GetRange()` i dekonstrukcja `var` (min, max) `= GetRange()`.
    Można zwrócić własną klasę, strukturę lub rekord - najlepsze dla publicznego API.
    Można użyć parametrów `out`, np. `int.TryParse`.
    `Tuple<T1,T2>` i `ref` też działają, ale krotki wartościowe i rekordy są dziś standardem.

- id: 79
  text: Czym różnią się parametry `out` i `ref`?
  answer: |
    `ref` wymaga, by zmienna była zainicjalizowana przed przekazaniem; metoda może ją czytać i modyfikować.
    `out` nie wymaga inicjalizacji, ale metoda musi przypisać wartość przed zakończeniem.
    `ref` służy do modyfikacji istniejącej wartości, `out` do zwracania dodatkowych wyników (wzorzec `TryXxx`).
    Istnieje też `in` - przekazanie przez referencję tylko do odczytu.

- id: 80
  text: Czym jest słowo kluczowe `params`? Kiedy go używać?
  answer: |
    `params` pozwala przekazać zmienną liczbę argumentów, które trafiają do tablicy (od C# 13 także do innych kolekcji, np. Span).
    Przykład: `int Sum(params int[] numbers)` można wywołać `Sum(1, 2, 3)`.
    Musi być ostatnim parametrem i może wystąpić tylko raz.
    Przydaje się w metodach pomocniczych jak `string.Format`, `Path.Combine` czy własne loggery.

- id: 81
  text: Czym są parametry opcjonalne?
  answer: |
    To parametry z domyślną wartością, np. `void Send(string to, bool urgent = false)`.
    Przy wywołaniu można je pominąć - zostanie użyta wartość domyślna.
    Muszą być po parametrach wymaganych, a wartość domyślna musi być stałą czasu kompilacji.
    Wartość domyślna jest wkompilowywana w miejsce wywołania, co ma znaczenie przy zmianach w bibliotekach.

- id: 82
  text: Czym są parametry nazwane?
  answer: |
    Pozwalają przekazać argument przez nazwę parametru, np. `Send(to: "a@b.pl", urgent: true)`.
    Kolejność nazwanych argumentów może być dowolna.
    Poprawiają czytelność przy wielu parametrach typu `bool` lub liczbowych i świetnie łączą się z parametrami opcjonalnymi.

- id: 83
  text: Czym są metody rozszerzające? Kiedy ich używać?
  answer: |
    Metody rozszerzające pozwalają "dodać" metody do istniejącego typu bez modyfikowania go ani dziedziczenia.
    Definiuje się je jako statyczne metody w statycznej klasie, z `this` przed pierwszym parametrem.
    Używa się ich do typów, których nie kontrolujesz (`string`, `IEnumerable`, `IServiceCollection`), np. `services.AddMyModule()`.
    Cały LINQ to metody rozszerzające; nie nadużywaj ich do logiki biznesowej.

- id: 84
  text: Czym są delegaty w C#? Kiedy ich używać?
  answer: |
    Delegat to typ reprezentujący referencję do metody o określonej sygnaturze - bezpieczny typowo wskaźnik na funkcję.
    Pozwala przekazywać metody jako parametry i wywoływać je później.
    Używa się ich do callbacków, zdarzeń, strategii i LINQ (Func, Action, Predicate).
    Dziś najczęściej używa się gotowych Func/Action zamiast własnych typów delegatów.

- id: 85
  text: Czym są delegaty multicast?
  answer: |
    To delegaty wskazujące na wiele metod naraz, dodawanych operatorem `+= i` usuwanych `-=`.
    Wywołanie delegata wywołuje wszystkie metody po kolei.
    Gdy delegat zwraca wartość, wynikiem jest wartość z ostatniej metody.
    Na nich opiera się mechanizm zdarzeń.

- id: 86
  text: Czym są anonimowe delegaty w C#?
  answer: |
    To delegaty zdefiniowane w miejscu użycia bez nazwanej metody, składnią `delegate(int x)` `{ return x * 2; }`.
    Wprowadzono je w C# 2.0 i dziś praktycznie zastąpiły je wyrażenia lambda (x `=> x * 2`).
    Mogą przechwytywać zmienne z otaczającego zakresu (domknięcia).

- id: 87
  text: Czym różnią się zdarzenia od delegatów?
  answer: |
    Zdarzenie (`event`) to opakowanie delegata, ograniczające co mogą z nim robić klasy zewnętrzne.
    Z zewnątrz można się tylko subskrybować (`+=`) i odsubskrybować (`-=`); wywołać i nadpisać zdarzenie może tylko klasa-właściciel.
    Publiczne pole delegata pozwala każdemu je wywołać lub nadpisać (`=`), kasując innych subskrybentów.
    Zdarzenia implementują wzorzec publish/subscribe, typowo z sygnaturą (`object` sender, `EventArgs` e).

- id: 88
  text: Czym jest słowo kluczowe `this`? Kiedy go używać?
  answer: |
    `this` to referencja do bieżącej instancji klasy.
    Używa się go do rozróżnienia pól od parametrów o tej samej nazwie (`this.name = name`).
    Służy też do łańcuchowania konstruktorów (: `this(...)`), przekazania bieżącego obiektu i definiowania metod rozszerzających oraz indekserów.
    Nie da się go użyć w metodach statycznych.

- id: 89
  text: Do czego służy słowo kluczowe `using` w C#?
  answer: |
    Jako dyrektywa (`using System.Text`;) importuje przestrzeń nazw, a `using static` importuje składowe statyczne.
    Jako instrukcja (`using var conn = ...`) gwarantuje wywołanie Dispose na końcu zakresu - to skrót `try/finally`.
    Można też tworzyć aliasy typów: `using Json = System.Text.Json.JsonSerializer`;
    Od C# 10 istnieje global `using` dla całego projektu.

- id: 90
  text: Czy `using` można stosować z innymi klasami niż połączenie z bazą?
  answer: |
    Tak - z każdym typem implementującym `IDisposable` (a `await using` z `IAsyncDisposable`).
    Typowe przykłady: `FileStream`, `StreamReader`, `HttpResponseMessage`, `SqlCommand`, Timer, transakcje.
    Można też pisać własne klasy `IDisposable`, np. do pomiaru czasu lub zwalniania locka.

- id: 91
  text: Czym różnią się operatory `is` i `as`?
  answer: |
    `is` sprawdza zgodność typu i zwraca `bool`; z pattern matchingiem od razu rzutuje: if (obj `is` User u).
    `as` próbuje rzutować i zwraca `null`, zamiast rzucić wyjątek, gdy się nie da.
    `as` działa tylko dla typów referencyjnych i nullowalnych.
    Dziś `is` z deklaracją zmiennej jest preferowany jako czytelniejszy.

- id: 92
  text: Czym różnią się `readonly` i `const` (co najmniej 3 różnice)?
  answer: |
    `const` musi mieć wartość w miejscu deklaracji, `readonly` można ustawić także w konstruktorze.
    `const` jest wartością czasu kompilacji i wkompilowuje się w miejsce użycia; `readonly` jest ustalane w czasie wykonania.
    `const` jest niejawnie statyczne, `readonly` może być instancyjne lub statyczne.
    `const` działa tylko dla typów prostych i `string`, `readonly` dla dowolnego typu.

- id: 93
  text: Czym jest klasa statyczna? Kiedy jej używać?
  answer: |
    Klasa statyczna zawiera wyłącznie składowe statyczne, nie da się jej zainstancjonować ani po niej dziedziczyć.
    Używa się jej do bezstanowych funkcji pomocniczych (Math, Path), metod rozszerzających i stałych.
    Nie nadaje się do logiki z zależnościami, bo utrudnia testowanie i DI.

- id: 94
  text: Czym różni się `var` od `dynamic` w C#?
  answer: |
    `var` to typowanie niejawne - typ ustala kompilator i jest on statyczny; to tylko skrót zapisu.
    `dynamic` wyłącza sprawdzanie typów w czasie kompilacji; wywołania rozstrzygane są w czasie wykonania (DLR).
    Błędy z `var` wychodzą przy kompilacji, z `dynamic` - dopiero jako `RuntimeBinderException`.
    `var` jest bezpieczny i używany wszędzie, `dynamic` rzadko - np. przy COM czy dynamicznych językach.

- id: 95
  text: Do czego służy słowo kluczowe `enum`?
  answer: |
    `enum` definiuje typ wyliczeniowy - zbiór nazwanych stałych liczbowych, np. `enum` Status `{ Active, Blocked }`.
    Domyślnie typem bazowym jest `int`, a wartości startują od 0.
    Poprawia czytelność i bezpieczeństwo typów w porównaniu z "magicznymi liczbami".
    Atrybut `[Flags]` pozwala łączyć wartości operacjami bitowymi.

- id: 96
  text: Czy można dziedziczyć po `enum`?
  answer: |
    Nie. Enumy są niejawnie zapieczętowane i dziedziczą po `System.Enum`.
    Nie można ani dziedziczyć po enumie, ani rozszerzyć go o nowe wartości przez dziedziczenie.
    Można za to dodać metody rozszerzające lub użyć wzorca "smart enum" z klasą.

- id: 97
  text: Do czego służy słowo kluczowe `yield`?
  answer: |
    `yield return` pozwala zwracać elementy sekwencji jeden po drugim, bez budowania całej kolekcji w pamięci.
    Kompilator generuje maszynę stanów implementującą `IEnumerable/IEnumerator`.
    Wykonanie jest leniwe - kod uruchamia się dopiero podczas iteracji.
    `yield break` kończy sekwencję; przydaje się przy dużych zbiorach, strumieniach i nieskończonych sekwencjach.

- id: 98
  text: Czym jest LINQ? Kiedy go używać?
  answer: |
    LINQ (Language Integrated Query) to zestaw metod i składni do zapytań na kolekcjach, bazach, XML itd.
    Zapewnia jednolity, deklaratywny sposób filtrowania, sortowania, grupowania i projekcji danych.
    Używa się go do operacji na kolekcjach w pamięci i do zapytań do bazy przez EF Core.
    Ma składnię metod (Where, Select) i składnię zapytań (from ... `where` ... select).

- id: 99
  text: Jakie są zalety i wady LINQ?
  answer: |
    Zalety: czytelny, deklaratywny kod, sprawdzanie typów przy kompilacji, jednolite API dla różnych źródeł, mniej kodu.
    Wady: narzut wydajnościowy przy gorących ścieżkach (alokacje, delegaty), trudniejszy debugging długich łańcuchów.
    Przy EF łatwo wygenerować nieoptymalny SQL lub przypadkowo pobrać za dużo danych.
    Leniwe wykonanie potrafi zaskoczyć wielokrotnym wykonaniem tego samego zapytania.

- id: 100
  text: Czym są wyrażenia lambda? Do czego służą?
  answer: |
    Lambda to zwięzły zapis anonimowej funkcji, np. `x => x * 2` lub (a, b) `=> a + b`.
    Może być przekształcona w delegat (Func, Action) albo drzewo wyrażeń (Expression), z którego korzysta EF.
    Używa się ich w LINQ, callbackach, konfiguracji (options `=> ...`), zdarzeniach i minimal API.
    Mogą przechwytywać zmienne z otoczenia (domknięcia).

- id: 101
  text: Czym różni się First od `FirstOrDefault` w LINQ?
  answer: |
    First zwraca pierwszy element i rzuca `InvalidOperationException`, gdy sekwencja jest pusta.
    `FirstOrDefault` zwraca wtedy wartość domyślną (`null` dla typów referencyjnych, 0 dla `int`).
    First, gdy brak elementu to błąd; `FirstOrDefault`, gdy brak to normalna sytuacja.
    Analogicznie działają `Single/SingleOrDefault`, które dodatkowo wymagają dokładnie jednego elementu.

- id: 102
  text: Jakie są najważniejsze komponenty .NET Framework?
  answer: |
    CLR (Common Language Runtime) - środowisko uruchomieniowe: JIT, GC, bezpieczeństwo typów, obsługa wyjątków.
    FCL/BCL - biblioteka klas bazowych (kolekcje, IO, sieć, wątki).
    CTS i CLS - wspólny system typów i specyfikacja zapewniająca współpracę języków.
    Do tego frameworki aplikacyjne: ASP.NET, ADO.NET, WinForms, WPF, WCF.

- id: 103
  text: Czym jest assembly? Jakie są rodzaje assembly w .NET?
  answer: |
    Assembly to podstawowa jednostka wdrożenia i wersjonowania w .NET - plik `.dll` lub `.exe` z kodem IL, metadanymi i manifestem.
    Prywatne assembly są używane przez jedną aplikację i leżą w jej katalogu.
    Współdzielone (shared) są podpisane silną nazwą i instalowane w GAC (.NET Framework).
    Są też satelickie assembly z zasobami lokalizacyjnymi.

- id: 104
  text: Czym jest GAC?
  answer: |
    GAC (Global Assembly Cache) to systemowe repozytorium współdzielonych assembly w .NET Framework.
    Assembly musi mieć silną nazwę (strong name), żeby trafić do GAC.
    Pozwala współistnieć wielu wersjom tej samej biblioteki.
    W .NET Core/.NET 5+ GAC nie istnieje - zależności dostarcza się przez NuGet.

- id: 105
  text: Czym jest refleksja?
  answer: |
    Refleksja (`System.Reflection`) to mechanizm odczytywania metadanych typów i manipulowania nimi w czasie wykonania.
    Pozwala sprawdzać właściwości, metody i atrybuty, tworzyć obiekty i wywoływać metody dynamicznie.
    Korzystają z niej serializatory, ORM-y, kontenery DI i frameworki testowe.
    Jest wolna i omija sprawdzanie typów, więc w gorących ścieżkach zastępuje się ją source generatorami.

- id: 106
  text: Czym jest serializacja i deserializacja? Jakie są rodzaje serializacji?
  answer: |
    Serializacja to zamiana obiektu na format do zapisu lub przesłania (tekst, bajty), deserializacja to proces odwrotny.
    Rodzaje: JSON (`System.Text.Json`, Newtonsoft), XML (`XmlSerializer`, `DataContractSerializer`) i binarna (Protobuf, `MessagePack`).
    `BinaryFormatter` jest przestarzały i niebezpieczny - został usunięty z nowego .NET.
    Używa się jej w API, kolejkach, cache i zapisie stanu.

- id: 107
  text: Czym jest globalizacja i lokalizacja?
  answer: |
    Globalizacja to projektowanie aplikacji tak, by obsługiwała różne kultury: formaty dat, liczb, walut, sortowanie.
    Lokalizacja to dostosowanie aplikacji do konkretnej kultury, głównie tłumaczenie tekstów przez pliki zasobów (`.resx`).
    W .NET kluczowe są `CultureInfo`, `CurrentCulture` i `CurrentUICulture`.
    W ASP.NET Core służą do tego `RequestLocalizationMiddleware` i `IStringLocalizer`.

- id: 108
  text: Czym są usługi Windows (Windows Services)?
  answer: |
    To długo działające procesy uruchamiane w tle przez Service Control Manager, bez interfejsu użytkownika.
    Mogą startować wraz z systemem i działać bez zalogowanego użytkownika.
    W .NET Framework dziedziczyło się po `ServiceBase`, w nowym .NET używa się Worker Service z `BackgroundService` i `UseWindowsService()`.
    Typowe zastosowania: przetwarzanie kolejek, harmonogramy, monitoring.

- id: 109
  text: Czym jest Garbage Collector (GC)?
  answer: |
    GC to automatyczny mechanizm zarządzania pamięcią w .NET, zwalniający obiekty, do których nie ma już referencji.
    Śledzi obiekty od korzeni (zmienne lokalne, pola statyczne), oznacza żywe, usuwa martwe i kompaktuje stertę.
    Eliminuje wycieki pamięci i błędy typu dangling pointer znane z C/C++.
    Nie zarządza zasobami niezarządzanymi - te zwalnia się przez `IDisposable`.

- id: 110
  text: Czym są generacje w garbage collectorze?
  answer: |
    Sterta zarządzana jest podzielona na generacje 0, 1 i 2 według wieku obiektów.
    Nowe obiekty trafiają do generacji 0, sprzątanej najczęściej i najtaniej.
    Obiekty, które przeżyją sprzątanie, awansują do 1, a potem 2 (długo żyjące).
    Dodatkowo istnieje Large Object Heap (obiekty od 85 KB), sprzątany razem z generacją 2.

- id: 111
  text: Czym różni się Dispose od Finalize?
  answer: |
    Dispose (`IDisposable`) wywołuje programista, jawnie lub przez `using` - zwalnia zasoby deterministycznie.
    Finalize wywołuje GC w nieokreślonym czasie - to zabezpieczenie, gdy Dispose nie został wywołany.
    Dispose może zwalniać zasoby zarządzane i niezarządzane, finalizator tylko niezarządzane.
    We wzorcu Dispose wywołuje się `GC.SuppressFinalize(this)`, żeby pominąć finalizację.

- id: 112
  text: Czy można wymusić uruchomienie garbage collectora?
  answer: |
    Tak, przez `GC.Collect()`, opcjonalnie z `GC.WaitForPendingFinalizers()`.
    W praktyce prawie nigdy nie należy tego robić - GC sam lepiej wie, kiedy sprzątać.
    Wymuszanie zakłóca heurystyki generacji i może pogorszyć wydajność.
    Wyjątki to testy, benchmarki lub moment po zwolnieniu ogromnej ilości danych.

- id: 113
  text: Czym różni się proces od wątku?
  answer: |
    Proces to uruchomiona instancja programu z własną, izolowaną przestrzenią adresową i zasobami.
    Wątek to jednostka wykonania wewnątrz procesu; wątki procesu dzielą pamięć.
    Tworzenie procesu jest kosztowne, wątku tańsze; komunikacja między wątkami jest prostsza, ale wymaga synchronizacji.
    Awaria procesu nie wpływa na inne procesy, a nieobsłużony wyjątek w wątku zwykle zabija cały proces.

- id: 114
  text: Czym jest wielowątkowość?
  answer: |
    Wielowątkowość to równoczesne wykonywanie wielu wątków w ramach jednego procesu.
    Pozwala wykorzystać wiele rdzeni CPU i nie blokować np. UI podczas długich operacji.
    W .NET realizuje się ją przez Thread, `ThreadPool`, `Task`, Parallel i PLINQ.
    Wymaga synchronizacji dostępu do współdzielonych danych (`lock`, Interlocked, kolekcje współbieżne), żeby uniknąć race condition i deadlocków.

- id: 115
  text: Czym różni się programowanie synchroniczne od asynchronicznego? Jaka jest rola `Task`?
  answer: |
    W kodzie synchronicznym każda operacja blokuje wątek, dopóki się nie zakończy.
    W kodzie asynchronicznym wątek jest zwalniany podczas oczekiwania na I/O (baza, sieć, plik) i może obsłużyć inne zadania.
    `Task` reprezentuje operację, która zakończy się w przyszłości - można na nią poczekać, pobrać wynik lub obsłużyć wyjątek.
    W ASP.NET Core asynchroniczność zwiększa przepustowość, bo serwer obsługuje więcej żądań tą samą liczbą wątków.

- id: 116
  text: Czym różnią się wątki od tasków? Jakie są zalety tasków?
  answer: |
    Thread to niskopoziomowy wątek systemowy, `Task` to wysokopoziomowa abstrakcja operacji, zwykle wykonywana na `ThreadPool`.
    Taski reużywają wątki z puli zamiast tworzyć nowe, co jest tańsze.
    Taski zwracają wyniki (`Task<T>`), propagują wyjątki, wspierają anulowanie (`CancellationToken`), łańcuchowanie i `async/await`.
    Bezpośrednio z Thread korzysta się dziś rzadko, np. dla długo żyjących wątków dedykowanych.

- id: 117
  text: Jaka jest rola `async` i `await`?
  answer: |
    `async` oznacza metodę, w której można użyć `await`; kompilator przerabia ją na maszynę stanów.
    `await` zawiesza metodę do czasu zakończenia taska, nie blokując wątku, a potem wznawia ją w tym miejscu.
    Dzięki temu kod asynchroniczny wygląda jak synchroniczny.
    Unikaj `async void` (poza handlerami zdarzeń) oraz `.Result/.Wait()`, które mogą powodować deadlocki.

- id: 118
  text: Czym różni się DBMS od RDBMS?
  answer: |
    DBMS to ogólnie system do zarządzania bazą danych - dane mogą być przechowywane w dowolnej formie (pliki, hierarchie, dokumenty).
    RDBMS to DBMS oparty na modelu relacyjnym: dane w tabelach powiązanych kluczami.
    RDBMS wspiera normalizację, więzy integralności, transakcje ACID i SQL.
    Przykłady RDBMS: SQL Server, PostgreSQL, Oracle, MySQL.

- id: 119
  text: Czym jest constraint w SQL? Jakie są rodzaje constraintów?
  answer: |
    Constraint to reguła nałożona na kolumnę lub tabelę, pilnująca poprawności danych.
    Rodzaje: `PRIMARY KEY`, `FOREIGN KEY`, `UNIQUE`, `NOT NULL`, `CHECK` i `DEFAULT`.
    Baza odrzuca operacje, które naruszają constraint.
    To ostatnia linia obrony integralności - niezależnie od walidacji w aplikacji.

- id: 120
  text: Czym różni się klucz główny od klucza unikalnego?
  answer: |
    Tabela może mieć jeden klucz główny, ale wiele kluczy unikalnych.
    Klucz główny nie dopuszcza `NULL`, klucz unikalny w SQL Server dopuszcza jeden `NULL`.
    W SQL Server klucz główny domyślnie tworzy indeks klastrowany, unikalny - nieklastrowany.
    Klucz główny identyfikuje wiersz i jest celem kluczy obcych.

- id: 121
  text: Czym są triggery i jakie są ich rodzaje?
  answer: |
    Trigger to procedura uruchamiana automatycznie w odpowiedzi na zdarzenie w bazie.
    DML triggers reagują na `INSERT`, `UPDATE`, `DELETE` i występują jako `AFTER` lub `INSTEAD OF`.
    DDL triggers reagują na `CREATE`, `ALTER`, `DROP`, a logon triggers na logowanie.
    Służą do audytu i wymuszania reguł, ale ukryta logika utrudnia debugowanie i wydajność.

- id: 122
  text: Czym jest widok (view)?
  answer: |
    Widok to wirtualna tabela zdefiniowana zapytaniem `SELECT`, która nie przechowuje danych (poza widokami indeksowanymi).
    Upraszcza złożone zapytania, ukrywa szczegóły struktury i ogranicza dostęp do kolumn lub wierszy.
    Przez proste widoki można też modyfikować dane bazowej tabeli.
    Widok indeksowany (materialized) przechowuje wynik fizycznie i przyspiesza odczyt agregatów.

- id: 123
  text: Czym różni się klauzula `HAVING` od `WHERE`?
  answer: |
    `WHERE` filtruje pojedyncze wiersze przed grupowaniem.
    `HAVING` filtruje grupy po `GROUP BY` i może używać funkcji agregujących (np. `HAVING COUNT(*) > 5`).
    W `WHERE` nie da się użyć agregatów.
    Kolejność logiczna: `FROM`, `WHERE`, `GROUP BY`, `HAVING`, `SELECT`, `ORDER BY`.

- id: 124
  text: Czym jest podzapytanie (zagnieżdżone, wewnętrzne)?
  answer: |
    Podzapytanie to zapytanie `SELECT` osadzone w innym zapytaniu - w `WHERE`, `FROM`, `SELECT` lub `HAVING`.
    Może zwracać pojedynczą wartość, listę (`IN`, `EXISTS`) lub tabelę.
    Skorelowane podzapytanie odwołuje się do zewnętrznego zapytania i wykonuje logicznie dla każdego wiersza.
    Często można je zastąpić JOIN-em lub CTE dla czytelności.

- id: 125
  text: Czym jest kolumna `IDENTITY` (autoinkrementacja) w SQL Server?
  answer: |
    `IDENTITY(seed, increment)` automatycznie generuje kolejne wartości liczbowe dla nowych wierszy, np. `IDENTITY(1,1)`.
    Zwykle stosuje się ją dla kluczy głównych.
    Wartości mogą mieć luki (rollbacki, restart serwera) i nie da się ich wstawić ręcznie bez `SET IDENTITY_INSERT ON`.
    Alternatywą jest `SEQUENCE`, współdzielona między tabelami.

- id: 126
  text: Czym są JOIN-y w SQL?
  answer: |
    `JOIN` łączy wiersze z dwóch lub więcej tabel na podstawie powiązanych kolumn, zwykle klucza obcego.
    Pozwala pobrać dane rozproszone przez normalizację, np. zamówienia z danymi klientów.
    Warunek złączenia podaje się w klauzuli `ON`.

- id: 127
  text: Jakie są rodzaje JOIN-ów w SQL Server?
  answer: |
    `INNER JOIN` - tylko wiersze z dopasowaniem po obu stronach.
    `LEFT/RIGHT OUTER JOIN` - wszystkie wiersze z lewej/prawej tabeli i `NULL` tam, gdzie brak dopasowania.
    `FULL OUTER JOIN` - wszystkie wiersze z obu tabel.
    `CROSS JOIN` - iloczyn kartezjański; dodatkowo self join oraz `CROSS/OUTER APPLY`.

- id: 128
  text: Czym jest self-join?
  answer: |
    To złączenie tabeli z samą sobą przy użyciu dwóch aliasów.
    Klasyczny przykład: tabela Employees z kolumną `ManagerId` - łączymy pracownika z jego przełożonym.
    `SELECT e.Name, m.Name FROM Employees e LEFT JOIN Employees m ON e.ManagerId = m.Id`

- id: 129
  text: Czym są indeksy w SQL Server?
  answer: |
    Indeks to struktura danych (B-drzewo) przyspieszająca wyszukiwanie wierszy, jak skorowidz w książce.
    Bez indeksu SQL Server musi skanować całą tabelę.
    Indeksy przyspieszają odczyt, ale spowalniają `INSERT/UPDATE/DELETE` i zajmują miejsce.
    Główne rodzaje to klastrowane i nieklastrowane, plus filtrowane, columnstore i z `INCLUDE`.

- id: 130
  text: Czym jest indeks klastrowany?
  answer: |
    Indeks klastrowany określa fizyczną kolejność przechowywania wierszy - liście B-drzewa to same dane.
    Tabela może mieć tylko jeden taki indeks.
    Domyślnie tworzy go klucz główny.
    Świetnie sprawdza się przy zapytaniach zakresowych i sortowaniu po kluczu.

- id: 131
  text: Czym jest indeks nieklastrowany?
  answer: |
    To osobna struktura z posortowanymi wartościami kolumn kluczowych i wskaźnikami do wierszy (klucz klastrowany lub RID).
    Tabela może mieć wiele takich indeksów (do 999).
    Jeśli zapytanie potrzebuje kolumn spoza indeksu, wykonuje się key lookup.
    Kolumny dodane przez `INCLUDE` pozwalają stworzyć indeks pokrywający i uniknąć lookupów.

- id: 132
  text: Czym różni się indeks klastrowany od nieklastrowanego?
  answer: |
    Klastrowany przechowuje same dane w kolejności klucza, nieklastrowany to osobna struktura ze wskaźnikami do danych.
    Klastrowany może być jeden na tabelę, nieklastrowanych wiele.
    Klastrowany nie wymaga lookupu, nieklastrowany może go potrzebować.
    Klastrowany jest dobry do zakresów, nieklastrowane do selektywnych wyszukiwań po innych kolumnach.

- id: 133
  text: Jak utworzyć indeks klastrowany i nieklastrowany?
  answer: |
    `CREATE CLUSTERED INDEX IX_Orders_Date ON Orders(OrderDate)`;
    `CREATE NONCLUSTERED INDEX IX_Orders_Customer ON Orders(CustomerId) INCLUDE (Total)`;
    Indeks klastrowany powstaje też automatycznie przy `PRIMARY KEY`, a nieklastrowany przy `UNIQUE`.

- id: 134
  text: Na której kolumnie założyć indeks, żeby przyspieszyć zapytanie `SELECT id, class FROM student WHERE name = 'happy'`?
  answer: |
    Na kolumnie name, bo to po niej filtruje `WHERE`.
    Najlepiej indeks nieklastrowany na name z `INCLUDE` (`class`) - wtedy jest pokrywający.
    Jeśli id jest kluczem klastrowanym, i tak jest zawarte w indeksie nieklastrowanym.
    `CREATE INDEX IX_Student_Name ON student(name) INCLUDE (class)`;

- id: 135
  text: Czym różni się procedura składowana od funkcji (co najmniej 3 różnice)?
  answer: |
    Funkcja musi zwracać wartość (skalar lub tabelę), procedura nie musi i może zwracać wiele zestawów wyników.
    Funkcji można użyć w `SELECT`, `WHERE` czy `JOIN`, procedurę wywołuje się przez `EXEC`.
    W funkcji nie można modyfikować danych (`INSERT/UPDATE/DELETE` na tabelach) ani używać transakcji; w procedurze tak.
    Procedura może mieć parametry `OUTPUT` i obsługę `TRY/CATCH`, funkcja nie.

- id: 136
  text: Jak zoptymalizować procedurę składowaną lub zapytanie SQL?
  answer: |
    Przeanalizuj plan wykonania i dodaj brakujące indeksy, zwłaszcza pokrywające.
    Wybieraj tylko potrzebne kolumny (bez `SELECT *`), pisz warunki SARGable (bez funkcji na kolumnach w `WHERE`).
    Unikaj kursorów i pętli na rzecz operacji zbiorowych; używaj `SET NOCOUNT ON` i `EXISTS` zamiast `COUNT`.
    Pilnuj aktualnych statystyk i uważaj na parameter sniffing.

- id: 137
  text: Czym jest kursor? Dlaczego należy go unikać?
  answer: |
    Kursor pozwala przetwarzać wynik zapytania wiersz po wierszu.
    SQL Server jest zoptymalizowany pod operacje zbiorowe, więc kursory są wolne (RBAR - row by agonizing row).
    Zużywają pamięć, trzymają blokady i komplikują kod.
    Prawie zawsze można je zastąpić `UPDATE` z `JOIN`, CTE, funkcjami okna lub `MERGE`.

- id: 138
  text: Czym różni się `SCOPE_IDENTITY()` od `@@IDENTITY`?
  answer: |
    Obie zwracają ostatnio wygenerowaną wartość `IDENTITY` w bieżącej sesji.
    `SCOPE_IDENTITY()` ogranicza się do bieżącego zakresu (procedury, batcha).
    `@@IDENTITY` uwzględnia wszystkie zakresy, więc trigger wstawiający do innej tabeli może zwrócić niewłaściwą wartość.
    Dlatego używa się `SCOPE_IDENTITY()` lub klauzuli `OUTPUT inserted.Id`.

- id: 139
  text: Czym jest CTE w SQL Server?
  answer: |
    CTE (Common Table Expression) to nazwany, tymczasowy zestaw wyników zdefiniowany przez `WITH` i dostępny w jednym zapytaniu.
    Poprawia czytelność, zastępując zagnieżdżone podzapytania.
    Rekurencyjne CTE pozwalają przetwarzać hierarchie, np. drzewo pracowników i przełożonych.
    CTE nie jest materializowane - to bardziej nazwane podzapytanie niż tabela tymczasowa.

- id: 140
  text: Czym różnią się `DELETE`, `TRUNCATE` i `DROP`?
  answer: |
    `DELETE` usuwa wybrane wiersze (z `WHERE`), loguje każdy wiersz, uruchamia triggery i nie resetuje `IDENTITY`.
    `TRUNCATE` usuwa wszystkie wiersze, jest minimalnie logowany i szybki, resetuje `IDENTITY` i nie działa przy kluczach obcych wskazujących na tabelę.
    `DROP` usuwa całą tabelę ze strukturą, indeksami i uprawnieniami.
    W SQL Server zarówno `DELETE`, jak i `TRUNCATE` można wycofać w transakcji.

- id: 141
  text: Jak pobrać N-tą najwyższą pensję pracownika?
  answer: |
    Najczytelniej funkcją okna:
    `SELECT Salary FROM (SELECT Salary, DENSE_RANK() OVER (ORDER BY Salary DESC) AS` rnk `FROM Employees) t WHERE rnk = @N`;
    `DENSE_RANK` poprawnie obsługuje duplikaty pensji.
    Alternatywa: `ORDER BY` Salary `DESC OFFSET @N-1 ROWS FETCH NEXT` 1 `ROWS ONLY` na zbiorze `DISTINCT`.

- id: 142
  text: Czym są właściwości ACID?
  answer: |
    Atomicity (atomowość) - transakcja wykonuje się w całości albo wcale.
    Consistency (spójność) - transakcja przeprowadza bazę z jednego poprawnego stanu w inny, zachowując więzy.
    Isolation (izolacja) - równoległe transakcje nie widzą swoich niezatwierdzonych zmian (zależnie od poziomu izolacji).
    Durability (trwałość) - zatwierdzone zmiany przetrwają awarię dzięki logowi transakcji.

- id: 143
  text: Czym są magiczne tabele (magic tables) w SQL Server?
  answer: |
    To wirtualne tabele inserted i deleted dostępne w triggerach DML i klauzuli `OUTPUT`.
    inserted zawiera nowe wartości (`INSERT`, `UPDATE`), deleted stare (`DELETE`, `UPDATE`).
    `UPDATE` to logicznie deleted ze starymi i inserted z nowymi danymi.
    Używa się ich do audytu i porównywania zmian.

- id: 144
  text: Czym jest MVC? Opisz cykl życia MVC.
  answer: |
    MVC (Model-View-Controller) to wzorzec rozdzielający dane (Model), prezentację (View) i obsługę żądań (Controller).
    Cykl życia: żądanie trafia do routingu, który wybiera kontroler i akcję.
    Następnie tworzony jest kontroler, wykonuje się model binding, filtry i sama akcja.
    Akcja zwraca `ActionResult`, który jest wykonywany - np. renderowany jest widok - a odpowiedź wraca do klienta.

- id: 145
  text: Jakie są zalety MVC nad Web Forms (co najmniej 3)?
  answer: |
    Wyraźna separacja odpowiedzialności, więc kod jest czytelniejszy i łatwiejszy w utrzymaniu.
    Lepsza testowalność - kontrolery można testować jednostkowo bez serwera.
    Pełna kontrola nad HTML i brak ciężkiego `ViewState`.
    Przyjazne adresy URL dzięki routingowi i naturalna zgodność z bezstanowością HTTP oraz frameworkami JS.

- id: 146
  text: Jakie typy może zwracać akcja kontrolera?
  answer: |
    Bazowo `ActionResult` (w Core `IActionResult`) i typy pochodne.
    `ViewResult`, `PartialViewResult`, `JsonResult`, `ContentResult`, `FileResult`, `RedirectResult`, `RedirectToActionResult`.
    Do tego kody statusu: `StatusCodeResult`, `NotFound`, `BadRequest`, Ok.
    Akcja może też zwrócić typ prosty lub `ActionResult<T>`, a wersje `async` - `Task<IActionResult>`.

- id: 147
  text: Czym są filtry w MVC i jakie są ich rodzaje?
  answer: |
    Filtry pozwalają uruchomić kod przed lub po określonych etapach przetwarzania żądania (cross-cutting concerns).
    Rodzaje: autoryzacji, akcji, wyników i wyjątków; w ASP.NET Core także resource filters.
    Stosuje się je do logowania, autoryzacji, cache, walidacji i obsługi błędów.
    Można je przypiąć do akcji, kontrolera lub globalnie.

- id: 148
  text: Czym jest uwierzytelnianie i autoryzacja w ASP.NET MVC?
  answer: |
    Uwierzytelnianie (authentication) ustala, kim jest użytkownik - np. login i hasło, token, Windows.
    Autoryzacja (authorization) ustala, do czego użytkownik ma dostęp.
    Uwierzytelnianie zawsze poprzedza autoryzację.
    W MVC autoryzację deklaruje się atrybutem `[Authorize]` z rolami lub politykami, a `[AllowAnonymous]` ją wyłącza.

- id: 149
  text: Jakie są rodzaje uwierzytelniania w ASP.NET MVC?
  answer: |
    Forms Authentication `/` cookie authentication - formularz logowania i ciasteczko.
    Windows Authentication - dla intranetu, z kontem domenowym.
    Uwierzytelnianie zewnętrzne przez OAuth/OpenID Connect (Google, Microsoft, Entra ID).
    Uwierzytelnianie tokenowe (JWT), głównie dla API; dawniej też Passport.

- id: 150
  text: Czym jest output caching w MVC? Jak go zaimplementować?
  answer: |
    Output caching przechowuje wygenerowaną odpowiedź akcji, żeby kolejne żądania nie wykonywały jej ponownie.
    W klasycznym MVC dodaje się atrybut `[OutputCache(Duration = 60, VaryByParam = "id")]`.
    W ASP.NET Core 7+ jest middleware Output Caching (`AddOutputCache`, `UseOutputCache`, `[OutputCache]`).
    Znacząco odciąża serwer przy rzadko zmieniających się danych.

- id: 151
  text: Czym jest routing w MVC?
  answer: |
    Routing mapuje adres URL żądania na kontroler i akcję.
    Wzorzec trasy, np. `{controller}/{action}/{id}`, określa, jak segmenty URL odpowiadają parametrom.
    Dzięki temu URL-e są czytelne i nie odpowiadają fizycznym plikom.
    Trasy można definiować konwencjonalnie (w konfiguracji) lub atrybutami.

- id: 152
  text: Czym jest routing oparty na atrybutach w MVC?
  answer: |
    Routing atrybutowy definiuje trasy bezpośrednio na kontrolerach i akcjach, np. `[Route("products/{id:int}")]`.
    W MVC 5 włącza się go przez `routes.MapMvcAttributeRoutes()`.
    Daje pełną kontrolę nad URL-em i ułatwia projektowanie REST API.
    Wspiera ograniczenia (constraints), prefiksy (`[RoutePrefix]`) i parametry opcjonalne.

- id: 153
  text: Czym różnią się `ViewData`, `ViewBag` i `TempData`?
  answer: |
    `ViewData` to słownik string-object, `ViewBag` to dynamiczne opakowanie tego samego słownika.
    Oba przekazują dane z kontrolera do widoku tylko w bieżącym żądaniu; `ViewData` wymaga rzutowania.
    `TempData` przechowuje dane do następnego żądania (np. po redirect) i opiera się na sesji lub ciasteczku.
    `TempData` nadaje się do komunikatów typu "zapisano" po wzorcu PRG.

- id: 154
  text: Jak przekazać dane z kontrolera do widoku w MVC?
  answer: |
    Najlepiej przez silnie typowany model: `return View(model)` i `@model` w widoku.
    Alternatywnie przez `ViewData`, `ViewBag` lub `TempData`.
    W ASP.NET Core także przez wstrzykiwanie serwisów (`@inject`) i view components.
    Silnie typowane ViewModele są zalecane, bo dają IntelliSense i sprawdzanie typów.

- id: 155
  text: Czym jest widok częściowy (`partial` view)?
  answer: |
    To fragment widoku wielokrotnego użytku, renderowany wewnątrz innych widoków.
    Wywołuje się go przez `Html.Partial`, `Html.RenderPartial` lub w Core przez `<partial name="_Item" />`.
    Nie ma własnego layoutu i zwykle nazywa się go z podkreślnikiem, np. `_ProductCard`.
    Pozwala unikać duplikacji HTML.

- id: 156
  text: Czym są Areas w MVC?
  answer: |
    Areas pozwalają podzielić dużą aplikację MVC na moduły z własnymi kontrolerami, widokami i modelami.
    Przykłady: Admin, Shop, Blog.
    Każdy obszar ma własną strukturę folderów i trasę z segmentem `{area}`.
    Kontrolery oznacza się atrybutem `[Area("Admin")]`.

- id: 157
  text: Jak działa walidacja w MVC? Czym są Data Annotations?
  answer: |
    Data Annotations to atrybuty na właściwościach modelu definiujące reguły walidacji: `[Required]`, `[StringLength]`, `[Range]`, `[EmailAddress]`.
    Podczas model bindingu MVC sprawdza reguły i wypełnia `ModelState`.
    W akcji sprawdza się `ModelState.IsValid`; błędy wyświetlają tag helpery lub `ValidationSummary`.
    Te same reguły generują walidację po stronie klienta (jQuery Unobtrusive Validation).

- id: 158
  text: Czym jest scaffolding w MVC?
  answer: |
    Scaffolding to automatyczne generowanie kodu kontrolerów i widoków na podstawie modelu.
    Typowo tworzy pełny CRUD: Index, Details, Create, Edit, Delete, często z EF.
    Przyspiesza prototypowanie, ale wygenerowany kod zwykle trzeba dostosować.

- id: 159
  text: Czym jest bundling i minifikacja w MVC?
  answer: |
    Bundling łączy wiele plików CSS lub JS w jeden, zmniejszając liczbę żądań HTTP.
    Minifikacja usuwa białe znaki, komentarze i skraca nazwy, zmniejszając rozmiar plików.
    W MVC 5 konfiguruje się to w `BundleConfig` (`System.Web.Optimization`).
    W ASP.NET Core robią to zewnętrzne narzędzia (Vite, webpack, `WebOptimizer`).

- id: 160
  text: Jak zabezpieczyć aplikację webową w MVC?
  answer: |
    Używaj uwierzytelniania i `[Authorize]`, wymuszaj HTTPS i HSTS.
    Chroń się przed CSRF tokenami antyforgery (`[ValidateAntiForgeryToken]`), przed XSS przez kodowanie wyjścia.
    Przed SQL Injection chronią zapytania parametryzowane i ORM.
    Waliduj dane wejściowe po stronie serwera, nie pokazuj szczegółów błędów i ustawiaj nagłówki bezpieczeństwa.

- id: 161
  text: Jakie są zdarzenia cyklu życia strony (Web Forms)? W którym kontrolki są w pełni załadowane?
  answer: |
    Główne zdarzenia: `PreInit`, Init, `InitComplete`, `PreLoad`, Load, zdarzenia kontrolek (postback), `LoadComplete`, `PreRender`, `SaveStateComplete`, Render, Unload.
    Kontrolki są w pełni załadowane w zdarzeniu `Page_Load`.
    `ViewState` jest odtworzony przed Load, a w `PreRender` można zrobić ostatnie zmiany przed renderowaniem.

- id: 162
  text: Czym różni się `Server.Transfer()` od `Response.Redirect()`?
  answer: |
    `Response.Redirect` wysyła do przeglądarki odpowiedź 302 i przeglądarka wykonuje nowe żądanie - URL się zmienia.
    `Server.Transfer` przekazuje przetwarzanie na serwerze do innej strony bez udziału przeglądarki - URL się nie zmienia.
    `Server.Transfer` jest szybszy, ale działa tylko w obrębie tej samej aplikacji.
    Redirect może przekierować na dowolny adres, także zewnętrzny.

- id: 163
  text: Jakie są rodzaje cache'owania?
  answer: |
    Output caching - cache całej wygenerowanej strony lub odpowiedzi.
    Fragment caching - cache fragmentu strony (np. kontrolki użytkownika).
    Data caching - cache obiektów i danych w pamięci (Cache, `IMemoryCache`) lub rozproszony (Redis).
    Do tego cache po stronie klienta i proxy przez nagłówki HTTP.

- id: 164
  text: Jakie są rodzaje zarządzania stanem?
  answer: |
    Po stronie klienta: `ViewState`, ciasteczka, query `string`, ukryte pola, control state.
    Po stronie serwera: Session, Application, Cache, a także baza danych.
    Stan po stronie klienta odciąża serwer, ale jest mniej bezpieczny i ograniczony rozmiarem.

- id: 165
  text: Gdzie przechowywany jest `ViewState` po postbacku?
  answer: |
    `ViewState` jest przechowywany po stronie klienta w ukrytym polu formularza `__VIEWSTATE`.
    Jest serializowany i kodowany Base64, opcjonalnie podpisany (MAC) i szyfrowany.
    Przy postbacku wraca na serwer i odtwarza stan kontrolek.
    Duży `ViewState` spowalnia stronę, bo jest przesyłany w obie strony.

- id: 166
  text: Jakie są sposoby przechowywania sesji w ASP.NET?
  answer: |
    `InProc` - w pamięci procesu serwera; najszybszy, ale ginie przy restarcie i nie działa w farmie bez sticky sessions.
    `StateServer` - w osobnej usłudze ASP.NET State Service.
    SQLServer - w bazie SQL Server; trwały i dobry dla farm serwerów.
    Custom - własny provider, np. Redis; Off wyłącza sesję.

- id: 167
  text: Czym jest sesja bez ciasteczek (cookieless session)?
  answer: |
    Identyfikator sesji jest przekazywany w URL zamiast w ciasteczku, np. `/(S(abc123))/Default.aspx`.
    Włącza się ją w `web.config` przez `sessionState cookieless="true"`.
    Działa u użytkowników z wyłączonymi ciasteczkami, ale jest mniej bezpieczna (ryzyko przejęcia sesji z URL).

- id: 168
  text: Jak wymusić uruchomienie wszystkich kontrolek walidacji na stronie Web Forms?
  answer: |
    Wywołać `Page.Validate()` po stronie serwera, a potem sprawdzić `Page.IsValid`.
    Można też walidować tylko określoną grupę przez `Page.Validate("NazwaGrupy")`.
    Po stronie klienta służy do tego funkcja JavaScript `Page_ClientValidate()`.

- id: 169
  text: Jakie są główne komponenty ADO.NET?
  answer: |
    Connection - połączenie z bazą (`SqlConnection`).
    Command - polecenie SQL lub procedura (`SqlCommand`).
    `DataReader` - szybki, jednokierunkowy odczyt tylko do przodu.
    `DataAdapter`, `DataSet` i `DataTable` - praca w trybie rozłączonym na kopii danych w pamięci.

- id: 170
  text: Czym jest architektura połączona i rozłączona?
  answer: |
    W architekturze połączonej połączenie jest otwarte przez cały czas odczytu - typowo `DataReader`.
    W architekturze rozłączonej `DataAdapter` pobiera dane do `DataSet`, zamyka połączenie, a zmiany zapisuje później.
    Połączona jest szybsza i lżejsza, rozłączona wygodniejsza do edycji danych offline i wiązania z UI.

- id: 171
  text: Jakie są metody Execute w ADO.NET?
  answer: |
    `ExecuteNonQuery` - wykonuje INSERT/UPDATE/DELETE/DDL i zwraca liczbę zmienionych wierszy.
    `ExecuteScalar` - zwraca pierwszą kolumnę pierwszego wiersza, np. `COUNT(*)`.
    `ExecuteReader` - zwraca `DataReader` do odczytu wielu wierszy.
    `ExecuteXmlReader` (SQL Server) - zwraca `XmlReader`; wszystkie mają wersje Async.

- id: 172
  text: Jakie są metody uwierzytelniania przy łączeniu się z SQL Server?
  answer: |
    Windows Authentication (Integrated Security) - logowanie kontem Windows/domenowym, bez hasła w connection stringu.
    SQL Server Authentication - login i hasło zdefiniowane w SQL Server (wymaga trybu mieszanego).
    W Azure dochodzi Microsoft Entra ID, w tym managed identity.
    Zalecane jest uwierzytelnianie zintegrowane lub managed identity zamiast haseł w konfiguracji.

- id: 173
  text: Czym jest ORM? Jakie są rodzaje ORM?
  answer: |
    ORM (Object-Relational Mapper) mapuje tabele bazy danych na klasy i pozwala operować obiektami zamiast SQL.
    Pełne ORM-y: Entity Framework Core, NHibernate - śledzenie zmian, migracje, LINQ.
    Micro-ORM-y: Dapper - tylko mapowanie wyników SQL na obiekty, bardzo szybkie.
    Wybór to kompromis między wygodą a kontrolą i wydajnością.

- id: 174
  text: Czym jest Entity Framework?
  answer: |
    Entity Framework to ORM Microsoftu dla .NET; aktualna wersja to Entity Framework Core.
    Pozwala pisać zapytania w LINQ, które są tłumaczone na SQL.
    Oferuje śledzenie zmian, migracje schematu, relacje, lazy/eager loading i obsługę wielu baz.
    Znacznie redukuje ilość kodu dostępu do danych.

- id: 175
  text: Czym różni się ADO.NET od Entity Framework?
  answer: |
    ADO.NET to niskopoziomowe API - ręcznie piszesz SQL i mapujesz wyniki na obiekty.
    EF to warstwa ORM zbudowana na ADO.NET - pracujesz na obiektach i LINQ.
    ADO.NET daje pełną kontrolę i maksymalną wydajność, EF szybszy rozwój i mniej kodu.
    EF zapewnia migracje i śledzenie zmian, ADO.NET nie.

- id: 176
  text: Jak działa Entity Framework? Jak go skonfigurować?
  answer: |
    Instaluje się pakiet providera, np. `Microsoft.EntityFrameworkCore.SqlServer`.
    Tworzy się klasy encji i klasę dziedziczącą po `DbContext` z właściwościami `DbSet<T>`.
    Rejestruje się kontekst: `builder.Services.AddDbContext<AppDbContext>(o => o.UseSqlServer(connStr))`.
    EF buduje model z konwencji, atrybutów i Fluent API, a migracje (`dotnet ef migrations add`) tworzą schemat.

- id: 177
  text: Czym są `DbContext` i `DbSet`?
  answer: |
    `DbContext` to główna klasa EF - reprezentuje sesję z bazą, zarządza połączeniem, śledzeniem zmian i transakcjami.
    `DbSet<T>` reprezentuje kolekcję encji danego typu, zwykle tabelę, i służy do zapytań oraz dodawania/usuwania.
    `SaveChanges()` zapisuje wszystkie śledzone zmiany w jednej transakcji.
    `DbContext` jest krótkożyjący - w ASP.NET Core rejestrowany jako scoped.

- id: 178
  text: Jakie podejścia do tworzenia aplikacji stosuje się z EF?
  answer: |
    Database First - model generowany z istniejącej bazy (w EF Core przez scaffolding).
    Model First - model rysowany w designerze, z którego powstaje baza (tylko stary EF).
    Code First - najpierw klasy C#, a schemat bazy tworzą migracje; to obecnie standard.

- id: 179
  text: Czym różni się LINQ to SQL od Entity Framework?
  answer: |
    LINQ to SQL działa tylko z SQL Server i mapuje tabele 1:1 na klasy.
    EF wspiera wiele baz danych, złożone mapowania, dziedziczenie, migracje i różne podejścia projektowe.
    LINQ to SQL jest porzucony przez Microsoft, EF Core jest aktywnie rozwijany.

- id: 180
  text: Czym jest Web API? Do czego służy?
  answer: |
    ASP.NET Web API to framework do budowania usług HTTP, zwykle RESTowych, konsumowanych przez różnych klientów.
    Zwraca dane (JSON, XML), a nie widoki.
    Służy do komunikacji z frontendem SPA, aplikacjami mobilnymi, innymi serwisami i integracjami.
    W ASP.NET Core Web API i MVC są połączone w jeden framework.

- id: 181
  text: Jakie są zalety Web API nad WCF i usługami ASMX?
  answer: |
    Web API opiera się wprost na HTTP i jest lekkie - bez ciężkiej konfiguracji i SOAP.
    Natywnie wspiera JSON, content negotiation, semantykę metod HTTP i routing.
    Łatwo je konsumować z przeglądarki, JS i aplikacji mobilnych.
    Jest prostsze w testowaniu, hostowaniu i jest rozwijane, a WCF/ASMX to technologie schyłkowe.

- id: 182
  text: Czym są metody (czasowniki) HTTP?
  answer: |
    `GET` - pobiera zasób, bez efektów ubocznych.
    `POST` - tworzy zasób lub wykonuje akcję; `PUT` - zastępuje zasób w całości; `PATCH` - modyfikuje częściowo.
    `DELETE` - usuwa zasób; do tego `HEAD` i `OPTIONS` (np. preflight CORS).
    `GET`, `PUT` i `DELETE` są idempotentne, `POST` nie.

- id: 183
  text: Czym różni się REST API od Web API?
  answer: |
    REST to styl architektoniczny z zasadami (bezstanowość, zasoby, jednolity interfejs).
    Web API to ogólnie dowolne API dostępne przez sieć - a ASP.NET Web API to konkretny framework.
    Web API może, ale nie musi spełniać zasad REST.
    REST API to Web API spełniające ograniczenia REST.

- id: 184
  text: Jakie są zasady REST? Czym różni się REST od RESTful?
  answer: |
    Zasady REST: architektura klient-serwer, bezstanowość, cache'owalność, jednolity interfejs, system warstwowy, opcjonalnie code on demand.
    Zasoby identyfikuje się URI, operacje wyrażają metody HTTP, a reprezentacje to np. JSON.
    REST to sam styl architektoniczny, RESTful to usługa, która go faktycznie implementuje.

- id: 185
  text: Czy WCF może działać jako usługa RESTful?
  answer: |
    Tak, przez `webHttpBinding` i atrybuty `[WebGet]/[WebInvoke]` z `UriTemplate`.
    Jest to jednak niewygodne i ma ograniczenia w porównaniu z Web API.
    Do REST w .NET używa się dziś ASP.NET Core Web API.

- id: 186
  text: Jak konsumować Web API z aplikacji .NET MVC?
  answer: |
    Używa się `HttpClient`: `GetAsync`, `PostAsJsonAsync` itd. i deserializacji odpowiedzi do modelu.
    W ASP.NET Core `HttpClient` tworzy się przez `IHttpClientFactory` (`AddHttpClient`), najlepiej jako typed client.
    Unika się tworzenia `new HttpClient()` na każde żądanie, bo grozi to wyczerpaniem socketów.
    Wygodne są też biblioteki jak Refit generujące klienta z interfejsu.

- id: 187
  text: Czym różni się kontroler Web API od kontrolera MVC?
  answer: |
    Kontroler MVC zwraca zwykle widoki (HTML), kontroler Web API dane (JSON/XML).
    W klasycznym ASP.NET dziedziczyły po Controller i `ApiController`, w Core oba po `ControllerBase/Controller`.
    W Core kontrolery API oznacza się `[ApiController]`, co daje automatyczną walidację i wiązanie z body.
    Web API wspiera content negotiation, MVC renderuje Razor.

- id: 188
  text: Jakie są metody uwierzytelniania w Web API?
  answer: |
    Basic Authentication, API Key, uwierzytelnianie tokenowe (JWT Bearer), OAuth 2.0 `/` OpenID Connect.
    Także Windows Authentication, ciasteczka i certyfikaty klienta (mTLS).
    Dla publicznych API standardem jest OAuth 2.0 z tokenami JWT.

- id: 189
  text: Czym jest Basic Authentication w Web API?
  answer: |
    Klient wysyła nagłówek Authorization: Basic z loginem i hasłem zakodowanymi w Base64.
    Base64 to nie szyfrowanie, więc metoda wymaga HTTPS.
    Jest prosta, ale dane uwierzytelniające lecą przy każdym żądaniu i nie ma mechanizmu wylogowania.
    Nadaje się głównie do prostych integracji system-system.

- id: 190
  text: Czym jest uwierzytelnianie kluczem API?
  answer: |
    Klient przesyła stały klucz w nagłówku (np. X-API-Key) lub w query stringu.
    Serwer sprawdza klucz w bazie lub konfiguracji i identyfikuje klienta.
    Jest proste i dobre do integracji maszyna-maszyna oraz limitowania ruchu.
    Klucz identyfikuje aplikację, a nie użytkownika, i trzeba go chronić oraz rotować.

- id: 191
  text: Czym jest uwierzytelnianie tokenowe?
  answer: |
    Użytkownik loguje się raz i dostaje token, który przesyła w kolejnych żądaniach zamiast hasła.
    Serwer weryfikuje token zamiast sesji, więc API pozostaje bezstanowe i łatwo się skaluje.
    Tokeny mają czas ważności, a refresh tokeny pozwalają je odnawiać.
    Najpopularniejszym formatem jest JWT.

- id: 192
  text: Czym jest uwierzytelnianie JWT?
  answer: |
    JWT (JSON Web Token) to podpisany token zawierający informacje o użytkowniku (claims).
    Serwer po zalogowaniu generuje token i podpisuje go kluczem; klient wysyła go w nagłówku Authorization.
    API weryfikuje podpis i ważność bez zaglądania do bazy.
    W ASP.NET Core konfiguruje się to przez `AddAuthentication().AddJwtBearer()`.

- id: 193
  text: Z jakich części składa się token JWT?
  answer: |
    Header - typ tokenu i algorytm podpisu (np. HS256, RS256).
    Payload - claims, np. sub, exp, role.
    Signature - podpis headera i payloadu, chroniący przed modyfikacją.
    Części są kodowane Base64Url i rozdzielone kropkami; payload nie jest szyfrowany, więc nie wkłada się tam sekretów.

- id: 194
  text: Gdzie w żądaniu znajduje się token JWT?
  answer: |
    Standardowo w nagłówku Authorization w formacie Bearer, a po nim sam token.
    Czasem przechowuje się go w ciasteczku `HttpOnly`, co chroni przed kradzieżą przez XSS.
    Przekazywanie tokenu w query stringu jest niezalecane (trafia do logów), wyjątkiem bywa SignalR/WebSockets.

- id: 195
  text: Jak testować Web API? Jakie są narzędzia?
  answer: |
    Ręcznie: Postman, Insomnia, Swagger UI, pliki `.http` w Visual Studio/Rider, curl.
    Testy jednostkowe kontrolerów i serwisów: xUnit, NUnit, MSTest z Moq lub NSubstitute.
    Testy integracyjne: `WebApplicationFactory` i `TestServer`, często z Testcontainers dla bazy.
    Testy obciążeniowe: k6, JMeter, NBomber.

- id: 196
  text: Jakie są główne typy zwracane w Web API?
  answer: |
    `void` - zwraca 204 No Content.
    `HttpResponseMessage` - pełna kontrola nad odpowiedzią.
    `IHttpActionResult` (Web API 2) lub `IActionResult/ActionResult<T>` w Core - czytelne wyniki typu `Ok()`, `NotFound()`.
    Typ domenowy - serializowany i zwracany z kodem 200.

- id: 197
  text: Czym różni się `HttpResponseMessage` od `IHttpActionResult`?
  answer: |
    `HttpResponseMessage` to bezpośrednia reprezentacja odpowiedzi HTTP - ręcznie ustawiasz status, nagłówki i treść.
    `IHttpActionResult` (Web API 2) to interfejs fabryki odpowiedzi, który tworzy `HttpResponseMessage` asynchronicznie.
    `IHttpActionResult` daje czystszy, łatwiejszy do testowania kod (`Ok()`, `NotFound()`, `BadRequest()`).

- id: 198
  text: Czym różni się `IActionResult` od `IHttpActionResult`?
  answer: |
    `IHttpActionResult` pochodzi z ASP.NET Web API 2 (`System.Web.Http`).
    `IActionResult` pochodzi z ASP.NET MVC/Core i w Core obsługuje zarówno MVC, jak i API.
    W ASP.NET Core używa się `IActionResult` lub `ActionResult<T>`; `IHttpActionResult` tam nie istnieje.

- id: 199
  text: Czym jest content negotiation w Web API?
  answer: |
    To mechanizm wyboru formatu odpowiedzi na podstawie żądania klienta.
    Klient wysyła nagłówek Accept (np. application/json lub application/xml), a serwer dobiera formatter.
    Dzięki temu ta sama akcja zwraca różne formaty bez zmian w kodzie.
    Jeśli serwer nie wspiera formatu, zwraca domyślny lub 406 Not Acceptable (gdy tak skonfigurowano).

- id: 200
  text: Czym jest klasa `MediaTypeFormatter` w Web API?
  answer: |
    `MediaTypeFormatter` to bazowa klasa w Web API 2 odpowiedzialna za serializację i deserializację treści dla typów MIME.
    Wbudowane formattery to `JsonMediaTypeFormatter`, `XmlMediaTypeFormatter` i `FormUrlEncodedMediaTypeFormatter`.
    Można napisać własny, np. dla CSV.
    W ASP.NET Core jego rolę pełnią `InputFormatter` i `OutputFormatter`.

- id: 201
  text: Jakie są kody odpowiedzi w Web API?
  answer: |
    1xx - informacyjne, 2xx - sukces (200 OK, 201 Created, 204 No Content).
    3xx - przekierowania (301, 302, 304 Not Modified).
    4xx - błędy klienta (400 Bad Request, 401 Unauthorized, 403 Forbidden, 404 Not Found, 409 Conflict, 422).
    5xx - błędy serwera (500 Internal Server Error, 502, 503 Service Unavailable).

- id: 202
  text: Czym jest .NET Core?
  answer: |
    .NET Core to wieloplatformowa, open-source'owa i modułowa implementacja .NET, działająca na Windows, Linux i macOS.
    Jest szybsza od .NET Framework, wspiera kontenery i wdrożenia self-contained.
    Od wersji 5 nazywa się po prostu .NET (.NET 5, 6, 8, 10...).

- id: 203
  text: Czym jest .NET Standard?
  answer: |
    .NET Standard to formalna specyfikacja API, które musi wspierać każda implementacja .NET.
    Biblioteka celująca w .NET Standard 2.0 działa na .NET Framework, .NET Core, Xamarin i Unity.
    Od .NET 5 nowy kod celuje w `net8.0` itd., a .NET Standard jest używany głównie dla zgodności ze starym Frameworkiem.

- id: 204
  text: Jakie są zalety .NET Core nad .NET Framework?
  answer: |
    Wieloplatformowość - Linux, macOS, kontenery Docker.
    Znacznie wyższa wydajność i nowoczesne API (Span, `async` wszędzie).
    Modułowość przez NuGet, instalacje side-by-side i wdrożenia self-contained.
    Open source, wbudowane DI, konfiguracja, logowanie i aktywny rozwój - Framework jest już tylko utrzymywany.

- id: 205
  text: Jaka jest rola pliku `Program.cs` w ASP.NET Core?
  answer: |
    `Program.cs` to punkt wejścia aplikacji.
    Tworzy `WebApplicationBuilder`, rejestruje serwisy w kontenerze DI i konfiguruje źródła konfiguracji oraz logowanie.
    Następnie buduje aplikację, konfiguruje pipeline middleware i endpointy, a na końcu wywołuje `app.Run()`.
    Od .NET 6 (minimal hosting) zastępuje on dawny podział na Program i Startup.

- id: 206
  text: Jaka jest rola metody `ConfigureServices`?
  answer: |
    `ConfigureServices` w klasie Startup służyła do rejestracji serwisów w kontenerze DI.
    Dodawało się tam MVC, `DbContext`, uwierzytelnianie, własne serwisy i opcje.
    Od .NET 6 to samo robi się przez `builder.Services` w `Program.cs`.

- id: 207
  text: Jaka jest rola metody Configure?
  answer: |
    Configure w klasie Startup służyła do budowy pipeline'u przetwarzania żądań HTTP.
    Dodawało się tam middleware: `UseExceptionHandler`, `UseHttpsRedirection`, `UseRouting`, `UseAuthentication`, `UseAuthorization`, `MapControllers`.
    Kolejność wywołań ma kluczowe znaczenie.
    Od .NET 6 robi się to bezpośrednio na obiekcie app w `Program.cs`.

- id: 208
  text: Opisz pełny pipeline przetwarzania żądania w ASP.NET Core MVC.
  answer: |
    Żądanie trafia do serwera (Kestrel), który tworzy `HttpContext` i przekazuje go do łańcucha middleware.
    Middleware kolejno obsługują `m.in`. wyjątki, HTTPS, pliki statyczne, routing, CORS, uwierzytelnianie i autoryzację.
    Routing wybiera endpoint, a dla MVC tworzony jest kontroler, wykonują się filtry, model binding, walidacja i akcja.
    Wynik akcji jest wykonywany (widok lub JSON), a odpowiedź wraca przez middleware w odwrotnej kolejności.

- id: 209
  text: Czym różni się .NET Core od .NET 5?
  answer: |
    .NET 5 to bezpośredni następca .NET Core 3.1 - pominięto numer 4, by nie mylić z .NET Framework `4.x`.
    Z nazwy usunięto "Core", bo to ma być jedna, zunifikowana platforma .NET.
    .NET 5 przyniósł C# 9, poprawki wydajności i unifikację; parzyste wersje (6, 8, 10) są LTS.

- id: 210
  text: Czym jest metapakiet? Jak nazywa się metapakiet ASP.NET Core?
  answer: |
    Metapakiet to pakiet NuGet bez własnego kodu, który grupuje zestaw innych pakietów.
    W ASP.NET Core 2.0 był to `Microsoft.AspNetCore.All`, od 2.1 `Microsoft.AspNetCore.App`.
    Od 3.0 jest to shared framework referencjonowany przez `Sdk="Microsoft.NET.Sdk.Web"`, a nie zwykły pakiet.

- id: 211
  text: Czym jest Dependency Injection?
  answer: |
    Dependency Injection to technika, w której obiekt dostaje zależności z zewnątrz zamiast tworzyć je sam.
    Realizuje zasadę odwrócenia zależności (DIP) i luźne powiązanie.
    Zależności wstrzykuje się zwykle przez konstruktor, rzadziej przez właściwość lub metodę.
    Kontener DI zarządza tworzeniem i czasem życia obiektów.

- id: 212
  text: Jak zaimplementować Dependency Injection w .NET Core?
  answer: |
    Definiujesz interfejs i implementację, np. `IEmailSender` i `SmtpEmailSender`.
    Rejestrujesz je w `Program.cs`: `builder.Services.AddScoped<IEmailSender, SmtpEmailSender>()`;
    W klasie konsumenta przyjmujesz `IEmailSender` w konstruktorze - kontener sam go dostarczy.
    W minimal API zależności można przyjmować bezpośrednio jako parametry handlera.

- id: 213
  text: Jakie są zalety Dependency Injection w .NET Core?
  answer: |
    Luźne powiązania - klasy zależą od abstrakcji, nie od implementacji.
    Łatwe testowanie, bo zależności zastępuje się mockami.
    Centralne zarządzanie czasem życia obiektów i konfiguracją.
    Wbudowany kontener w ASP.NET Core sprawia, że nie potrzeba zewnętrznych bibliotek.

- id: 214
  text: Jak używać Dependency Injection w widokach ASP.NET Core?
  answer: |
    W widoku Razor używa się dyrektywy `@inject`, np. `@inject IConfiguration` Config.
    Wstrzyknięty serwis jest dostępny jak właściwość widoku.
    Przydaje się do lokalizacji, konfiguracji czy serwisów pomocniczych, ale logika biznesowa powinna zostać poza widokiem.

- id: 215
  text: Jakie są czasy życia serwisów w ASP.NET Core?
  answer: |
    Singleton - jedna instancja na całą aplikację.
    Scoped - jedna instancja na żądanie HTTP (zakres).
    Transient - nowa instancja przy każdym pobraniu z kontenera.
    Nie wstrzykuj scoped do singletona (captive dependency) - walidacja zakresów w Development to wykryje.

- id: 216
  text: Czym są `AddSingleton`, `AddScoped` i `AddTransient`?
  answer: |
    To metody rejestrujące serwis w kontenerze z odpowiednim czasem życia.
    `AddSingleton` - do bezstanowych lub drogich w tworzeniu, bezpiecznych wątkowo serwisów (cache, konfiguracja).
    `AddScoped` - do serwisów związanych z żądaniem, np. `DbContext`, Unit of Work.
    `AddTransient` - do lekkich, bezstanowych serwisów tworzonych za każdym razem.

- id: 217
  text: Czym jest middleware w ASP.NET Core? Czym jest własny middleware?
  answer: |
    Middleware to komponent w pipeline, który obsługuje żądanie i decyduje, czy przekazać je dalej.
    Każdy middleware może wykonać kod przed i po wywołaniu następnego (`await next()`).
    Własny middleware to klasa z konstruktorem przyjmującym `RequestDelegate` i metodą `InvokeAsync(HttpContext)`, rejestrowana przez `app.UseMiddleware<T>()`.
    Typowe zastosowania: logowanie, obsługa błędów, nagłówki, correlation ID.

- id: 218
  text: Czym różni się middleware ASP.NET Core od `HttpModule`?
  answer: |
    `HttpModule` działał w IIS i `System.Web`, reagując na zdarzenia cyklu życia żądania.
    Middleware to prosty, liniowy łańcuch funkcji, niezależny od IIS i działający na każdym hoście.
    Kolejność middleware jest jawnie określona kolejnością rejestracji, w `HttpModule` zależała od zdarzeń.
    Middleware jest lżejsze, łatwiejsze do testowania i konfiguracji w kodzie zamiast `web.config`.

- id: 219
  text: Czym jest `RequestDelegate` w .NET Core?
  answer: |
    `RequestDelegate` to delegat o sygnaturze `Task` (`HttpContext` context), reprezentujący obsługę żądania.
    Każdy middleware dostaje `RequestDelegate` wskazujący na kolejny element pipeline'u.
    Pipeline to w praktyce złożenie tych delegatów w łańcuch.

- id: 220
  text: Czym są metody `Run()`, `Use()` i `Map()`?
  answer: |
    `Use()` dodaje middleware, który może wykonać kod i przekazać żądanie dalej przez `next()`.
    `Run()` dodaje middleware końcowy (terminal) - nie wywołuje kolejnego.
    `Map()` rozgałęzia pipeline na podstawie ścieżki żądania, np. `app.Map("/health", ...)`.
    Istnieje też `MapWhen` i `UseWhen` do rozgałęzień warunkowych.

- id: 221
  text: Jakie są rodzaje hostingu w ASP.NET Core? Czym jest hosting in-process i out-of-process?
  answer: |
    Aplikację można hostować w IIS, jako samodzielny Kestrel, za reverse proxy (Nginx, Apache), w kontenerze lub jako usługę.
    In-process - aplikacja działa wewnątrz procesu IIS (`w3wp.exe`) z serwerem `IISHttpServer`; jest szybsza.
    Out-of-process - aplikacja działa na Kestrelu w osobnym procesie, a IIS przekazuje do niej żądania jako reverse proxy.
    Przełączanie obsługuje ASP.NET Core Module (ANCM).

- id: 222
  text: Czym jest Kestrel? Czym różni się od IIS?
  answer: |
    Kestrel to wbudowany, wieloplatformowy i bardzo szybki serwer HTTP ASP.NET Core.
    IIS to pełny serwer WWW tylko dla Windows, z zarządzaniem procesami, wieloma aplikacjami i funkcjami administracyjnymi.
    Kestrel może działać samodzielnie lub za reverse proxy (IIS, Nginx, YARP).
    W kontenerach i na Linuksie Kestrel jest standardem.

- id: 223
  text: Czym jest routing? Opisz routing atrybutowy w ASP.NET Core.
  answer: |
    Routing dopasowuje URL żądania do endpointu - akcji kontrolera, strony Razor lub handlera minimal API.
    W ASP.NET Core działa przez `UseRouting` i mapowanie endpointów.
    Routing atrybutowy definiuje trasy atrybutami: `[Route("api/[controller]")]`, `[HttpGet("{id:int}")]`.
    Tokeny `[controller]` i `[action]` oraz ograniczenia typu :int czy :guid ułatwiają spójne API.

- id: 224
  text: Opisz domyślną strukturę projektu ASP.NET Core.
  answer: |
    `Program.cs` - punkt wejścia i konfiguracja; plik `.csproj` - zależności i ustawienia projektu.
    `appsettings.json` (i `appsettings.Development.json`) - konfiguracja; `Properties/launchSettings.json` - profile uruchomieniowe.
    wwwroot - pliki statyczne.
    W MVC dochodzą foldery Controllers, Models, Views, w Razor Pages - Pages.

- id: 225
  text: Jak ASP.NET Core serwuje pliki statyczne?
  answer: |
    Przez middleware Static Files - `app.UseStaticFiles()` (lub `MapStaticAssets` w .NET 9+).
    Domyślnie serwowane są pliki z folderu wwwroot.
    Można dodać inne katalogi przez `StaticFileOptions` i `PhysicalFileProvider`.
    Pliki statyczne są dostępne bez autoryzacji, więc nie umieszcza się tam niczego poufnego.

- id: 226
  text: Jaka jest rola plików `appsettings.json` i `launchSettings.json`?
  answer: |
    `appsettings.json` przechowuje konfigurację aplikacji: connection stringi, ustawienia logowania, własne opcje.
    Pliki `appsettings.{Environment}.json` nadpisują ją dla konkretnego środowiska.
    `launchSettings.json` zawiera profile uruchomieniowe dla lokalnego developmentu: porty, zmienne środowiskowe, sposób uruchomienia.
    `launchSettings.json` nie jest używany w produkcji.

- id: 227
  text: Jakie są sposoby przechowywania konfiguracji w ASP.NET Core?
  answer: |
    Pliki JSON (appsettings), zmienne środowiskowe i argumenty wiersza poleceń.
    User Secrets w developmencie oraz Azure Key Vault lub Azure App Configuration w produkcji.
    Pliki XML/INI, konfiguracja w pamięci i własne providery (np. z bazy).
    Źródła są nakładane warstwowo - późniejsze nadpisują wcześniejsze.

- id: 228
  text: Czym jest CORS? Dlaczego jest potrzebny? Jak naprawić błąd CORS?
  answer: |
    CORS (Cross-Origin Resource Sharing) to mechanizm pozwalający serwerowi zezwolić na żądania z innej domeny.
    Przeglądarka domyślnie blokuje takie żądania (Same-Origin Policy), żeby złośliwa strona nie korzystała z sesji użytkownika w innym serwisie.
    Naprawia się go po stronie serwera: `AddCors` z polityką (`WithOrigins`, `AllowAnyHeader`, `AllowAnyMethod`) i `app.UseCors()`.
    Nie używaj `AllowAnyOrigin` razem z `AllowCredentials`.

- id: 229
  text: Czym jest cache w pamięci i cache rozproszony?
  answer: |
    Cache w pamięci (`IMemoryCache`) trzyma dane w pamięci procesu - jest najszybszy, ale lokalny dla instancji.
    Cache rozproszony (`IDistributedCache`) przechowuje dane w zewnętrznym magazynie: Redis, SQL Server.
    Rozproszony jest współdzielony między instancjami i przetrwa restart aplikacji.
    .NET 9 wprowadził `HybridCache` łączący oba poziomy.

- id: 230
  text: Jak obsługiwać błędy w ASP.NET Core?
  answer: |
    W developmencie `UseDeveloperExceptionPage` pokazuje szczegóły błędu.
    W produkcji `UseExceptionHandler` przekierowuje do strony lub handlera błędów, a od .NET 8 można użyć `IExceptionHandler`.
    Dla API standardem jest `ProblemDetails` (`AddProblemDetails`), a `UseStatusCodePages` obsługuje odpowiedzi 404 itp.
    Wyjątki loguje się przez `ILogger`, a lokalnie obsługuje `try/catch` lub filtrami wyjątków.

- id: 231
  text: Czym są Razor Pages w .NET Core?
  answer: |
    Razor Pages to model programowania stron, w którym każda strona (`.cshtml`) ma własny model strony (`PageModel`).
    Handlery, np. `OnGet` i `OnPost`, obsługują żądania bezpośrednio na stronie, bez osobnych kontrolerów.
    Routing wynika ze struktury folderu Pages.
    Są prostsze niż MVC dla aplikacji zorientowanych na strony, np. formularzy i paneli administracyjnych.

- id: 232
  text: Czym są zasady SOLID? Czym różnią się od wzorców projektowych?
  answer: |
    SOLID to pięć zasad projektowania obiektowego: SRP, OCP, LSP, ISP i DIP.
    Ich celem jest kod łatwy do utrzymania, rozszerzania i testowania.
    Zasady SOLID to ogólne wytyczne ("jak projektować"), a wzorce projektowe to konkretne, sprawdzone rozwiązania typowych problemów.
    Wzorce często są sposobem realizacji zasad SOLID, np. Strategy wspiera OCP.

- id: 233
  text: Czym jest zasada pojedynczej odpowiedzialności (SRP)?
  answer: |
    Klasa powinna mieć tylko jeden powód do zmiany - jedną odpowiedzialność.
    Przykład: klasa Invoice nie powinna jednocześnie liczyć sum, zapisywać do bazy i generować PDF.
    Rozdzielenie odpowiedzialności daje mniejsze, łatwiejsze do testowania klasy.

- id: 234
  text: Czym jest zasada otwarte-zamknięte (OCP)?
  answer: |
    Kod powinien być otwarty na rozszerzenia, ale zamknięty na modyfikacje.
    Nowe zachowanie dodaje się przez nowe klasy (np. nową implementację interfejsu), a nie przez edytowanie istniejących.
    Przykład: nowy sposób płatności to nowa klasa `IPaymentMethod` zamiast kolejnego case'a w switchu.

- id: 235
  text: Czym jest zasada podstawienia Liskov (LSP)?
  answer: |
    Obiekty klasy pochodnej muszą dać się używać wszędzie tam, gdzie klasy bazowej, bez psucia poprawności programu.
    Klasa pochodna nie może zaostrzać warunków wejściowych, osłabiać gwarancji ani rzucać nieoczekiwanych wyjątków.
    Klasyczny kontrprzykład: Square dziedziczący po Rectangle, gdzie ustawienie szerokości zmienia wysokość.

- id: 236
  text: Czym jest zasada segregacji interfejsów (ISP)?
  answer: |
    Klienci nie powinni być zmuszani do zależności od metod, których nie używają.
    Zamiast jednego "grubego" interfejsu lepiej mieć kilka małych, wyspecjalizowanych, np. `IReader` i `IWriter`.
    Zapobiega to implementacjom rzucającym `NotImplementedException`.

- id: 237
  text: Czym jest zasada odwrócenia zależności (DIP)?
  answer: |
    Moduły wysokiego poziomu nie powinny zależeć od modułów niskiego poziomu - oba powinny zależeć od abstrakcji.
    Abstrakcje nie powinny zależeć od szczegółów, tylko szczegóły od abstrakcji.
    Przykład: `OrderService` zależy od `IOrderRepository`, a nie od `SqlOrderRepository`.
    W praktyce realizuje się to przez Dependency Injection.

- id: 238
  text: Czym jest zasada DRY?
  answer: |
    DRY (Don't Repeat Yourself) mówi, że każda wiedza w systemie powinna mieć jedną, jednoznaczną reprezentację.
    Powielona logika oznacza, że zmianę trzeba wprowadzać w wielu miejscach, co rodzi błędy.
    Nie należy jednak na siłę łączyć kodu, który tylko przypadkowo wygląda podobnie - zła abstrakcja bywa gorsza od duplikacji.

- id: 239
  text: Czym są wzorce projektowe i jakie problemy rozwiązują?
  answer: |
    Wzorce projektowe to sprawdzone, wielokrotnego użytku rozwiązania powtarzających się problemów projektowych.
    Dają wspólny słownik dla programistów ("tu jest fabryka", "to dekorator").
    Rozwiązują problemy tworzenia obiektów, struktury powiązań i komunikacji między obiektami.
    Klasyczny katalog to 23 wzorce Gang of Four.

- id: 240
  text: Jakie są rodzaje wzorców projektowych?
  answer: |
    Kreacyjne - dotyczą tworzenia obiektów (Singleton, Factory Method, Abstract Factory, Builder, Prototype).
    Strukturalne - dotyczą składania klas i obiektów (Adapter, Bridge, Composite, Decorator, Facade, Flyweight, Proxy).
    Behawioralne - dotyczą komunikacji i odpowiedzialności (Strategy, Observer, Command, State, Template Method i inne).

- id: 241
  text: Czym są kreacyjne wzorce projektowe?
  answer: |
    To wzorce abstrahujące proces tworzenia obiektów.
    Pozwalają oddzielić kod od konkretnych klas, które tworzy.
    Należą do nich Singleton, Factory Method, Abstract Factory, Builder i Prototype.

- id: 242
  text: Czym są strukturalne wzorce projektowe?
  answer: |
    To wzorce opisujące, jak składać klasy i obiekty w większe struktury.
    Pomagają dopasować niezgodne interfejsy, dodawać zachowanie i upraszczać złożone systemy.
    Należą do nich Adapter, Bridge, Composite, Decorator, Facade, Flyweight i Proxy.

- id: 243
  text: Czym są behawioralne wzorce projektowe?
  answer: |
    To wzorce opisujące komunikację między obiektami i podział odpowiedzialności.
    Należą do nich Strategy, Observer, Command, State, Template Method, Chain of Responsibility, Mediator, Iterator, Visitor, Memento.
    Pomagają uelastycznić zachowanie bez sztywnych zależności.

- id: 244
  text: Czym jest wzorzec Singleton?
  answer: |
    Singleton gwarantuje, że klasa ma tylko jedną instancję i zapewnia do niej globalny punkt dostępu.
    Implementuje się go prywatnym konstruktorem i statyczną właściwością Instance.
    Przykłady użycia: konfiguracja, logger, cache.
    W aplikacjach z DI zamiast ręcznego singletona rejestruje się serwis przez `AddSingleton` - jest testowalny.

- id: 245
  text: Jak zrobić wątkowo bezpieczny Singleton?
  answer: |
    Najprościej przez `Lazy<T>`: `private static readonly Lazy<Config> _instance = new(() => new Config())`;
    Można użyć statycznego pola `readonly` inicjalizowanego w deklaracji - CLR gwarantuje bezpieczną inicjalizację typu.
    Klasyczna metoda to double-checked locking z `lock` i `volatile`.
    `Lazy<T>` jest zalecany jako czytelny i poprawny.

- id: 246
  text: Czym jest wzorzec Factory? Po co go używać?
  answer: |
    Fabryka hermetyzuje logikę tworzenia obiektów - klient prosi o obiekt, nie wiedząc, która konkretna klasa powstanie.
    Przykład: `NotificationFactory.Create("email")` zwraca `EmailNotification` jako `INotification`.
    Oddziela kod klienta od konkretnych klas i centralizuje decyzję, co utworzyć.
    Ułatwia dodawanie nowych typów i testowanie.

- id: 247
  text: Jak zaimplementować wzorzec Factory Method?
  answer: |
    Definiujesz abstrakcyjną klasę twórcy z abstrakcyjną metodą fabrykującą, np. `abstract ILogger CreateLogger()`.
    Klasy pochodne nadpisują ją i zwracają konkretne produkty, np. `FileLoggerCreator` zwraca `FileLogger`.
    Logika w klasie bazowej korzysta z produktu przez interfejs, nie znając jego typu.
    Dzięki temu nowy produkt dodaje się nową podklasą, zgodnie z OCP.

- id: 248
  text: Czym jest wzorzec Abstract Factory?
  answer: |
    Abstract Factory dostarcza interfejs do tworzenia rodzin powiązanych obiektów bez wskazywania konkretnych klas.
    Przykład: `IUiFactory` z metodami `CreateButton` i `CreateCheckbox`, implementowany przez `WindowsUiFactory` i `MacUiFactory`.
    Gwarantuje, że produkty z jednej rodziny pasują do siebie.
    Różnica względem Factory Method: tworzy całą rodzinę obiektów, a nie jeden produkt.

- id: 249
  text: Jakie są niezbędne podstawy do rozwiązywania prostych zadań programistycznych?
  answer: |
    Znajomość typów danych, zmiennych, operatorów i instrukcji warunkowych.
    Pętle, tablice, stringi i podstawowe kolekcje (List, Dictionary, `HashSet`).
    Pisanie funkcji, rekurencja i podstawy złożoności obliczeniowej (notacja O).
    Podstawowe algorytmy: wyszukiwanie liniowe i binarne, sortowanie, dwa wskaźniki.

- id: 250
  text: Jakie są kroki rozwiązywania zadań programistycznych?
  answer: |
    Zrozum problem - doprecyzuj wejście, wyjście i ograniczenia, przejdź ręcznie przez przykłady.
    Rozważ przypadki brzegowe: pusta tablica, `null`, jeden element, duplikaty, liczby ujemne.
    Zaplanuj rozwiązanie (najpierw proste, potem optymalne) i oceń złożoność.
    Zaimplementuj, przetestuj na przykładach i przypadkach brzegowych, a na koniec zoptymalizuj i uporządkuj kod.

- id: 251
  text: Napisz funkcję obliczającą sumę elementów tablicy.
  answer: |
    Przechodzimy pętlą po tablicy i dodajemy elementy do akumulatora; złożoność `O(n)`.
    W praktyce można też użyć LINQ: `arr.Sum()`.
    ```csharp
    int Sum(int[] arr)
    {
        int sum = 0;
        foreach (var x in arr) sum += x;
        return sum;
    }
    ```

- id: 252
  text: Napisz funkcję obliczającą średnią z tablicy liczb.
  answer: |
    Sumujemy elementy i dzielimy przez liczbę elementów, rzutując na `double`, żeby uniknąć dzielenia całkowitego.
    Pusta tablica to przypadek brzegowy - trzeba go obsłużyć.
    ```csharp
    double Average(int[] arr)
    {
        if (arr.Length == 0) throw new ArgumentException("Pusta tablica");
        long sum = 0;
        foreach (var x in arr) sum += x;
        return (double)sum / arr.Length;
    }
    ```

- id: 253
  text: Napisz funkcję znajdującą najmniejszą liczbę w tablicy.
  answer: |
    Zakładamy, że minimum to pierwszy element, i porównujemy z resztą; złożoność `O(n)`.
    Alternatywa LINQ: `arr.Min()`.
    ```csharp
    int Min(int[] arr)
    {
        int min = arr[0];
        for (int i = 1; i < arr.Length; i++)
            if (arr[i] < min) min = arr[i];
        return min;
    }
    ```

- id: 254
  text: Napisz funkcję znajdującą największą liczbę w tablicy.
  answer: |
    Analogicznie do minimum - zapamiętujemy największy dotąd element; złożoność `O(n)`.
    Alternatywa LINQ: `arr.Max()`.
    ```csharp
    int Max(int[] arr)
    {
        int max = arr[0];
        for (int i = 1; i < arr.Length; i++)
            if (arr[i] > max) max = arr[i];
        return max;
    }
    ```

- id: 255
  text: Napisz funkcję znajdującą drugą największą liczbę w tablicy.
  answer: |
    W jednym przejściu śledzimy największą i drugą największą wartość, pomijając duplikaty maksimum.
    Złożoność `O(n)`, bez sortowania.
    ```csharp
    int? SecondLargest(int[] arr)
    {
        int? first = null, second = null;
        foreach (var x in arr)
        {
            if (first == null || x > first) { second = first; first = x; }
            else if (x != first && (second == null || x > second)) second = x;
        }
        return second;
    }
    ```

- id: 256
  text: Jakie jest 5 najważniejszych funkcji tablicowych używanych w zadaniach?
  answer: |
    Length - rozmiar tablicy.
    `Array.Sort` - sortowanie w miejscu; `Array.Reverse` - odwrócenie kolejności.
    `Array.IndexOf / Array.Exists` - wyszukiwanie elementu.
    `Array.Copy` (lub Clone) - kopiowanie; do tego często LINQ: Max, Min, Sum, Distinct.

- id: 257
  text: Napisz funkcję sprawdzającą, czy dwie tablice są takie same.
  answer: |
    Najpierw porównujemy długości, potem elementy na tych samych pozycjach.
    W praktyce: `arr1.SequenceEqual(arr2)`.
    ```csharp
    bool AreEqual(int[] a, int[] b)
    {
        if (a.Length != b.Length) return false;
        for (int i = 0; i < a.Length; i++)
            if (a[i] != b[i]) return false;
        return true;
    }
    ```

- id: 258
  text: Napisz funkcję sprawdzającą, czy tablica jest posortowana rosnąco.
  answer: |
    Wystarczy sprawdzić, czy każdy element jest nie mniejszy niż poprzedni; złożoność `O(n)`.
    ```csharp
    bool IsSorted(int[] arr)
    {
        for (int i = 1; i < arr.Length; i++)
            if (arr[i] < arr[i - 1]) return false;
        return true;
    }
    ```

- id: 259
  text: Napisz funkcję łączącą dwie tablice w jedną posortowaną.
  answer: |
    Jeśli wejściowe tablice są posortowane, używamy dwóch wskaźników - złożoność `O(n + m)`.
    Dla nieposortowanych najprościej je połączyć i posortować: `a.Concat(b).OrderBy(x => x).ToArray()`.
    ```csharp
    int[] Merge(int[] a, int[] b)
    {
        var result = new int[a.Length + b.Length];
        int i = 0, j = 0, k = 0;
        while (i < a.Length && j < b.Length)
            result[k++] = a[i] <= b[j] ? a[i++] : b[j++];
        while (i < a.Length) result[k++] = a[i++];
        while (j < b.Length) result[k++] = b[j++];
        return result;
    }
    ```

- id: 260
  text: Napisz funkcję usuwającą konkretny element z tablicy.
  answer: |
    Tablica ma stały rozmiar, więc tworzymy nową bez danego elementu.
    Alternatywa LINQ: `arr.Where(x => x != value).ToArray()`.
    ```csharp
    int[] Remove(int[] arr, int value)
    {
        var list = new List<int>();
        foreach (var x in arr)
            if (x != value) list.Add(x);
        return list.ToArray();
    }
    ```

- id: 261
  text: Napisz funkcję liczącą znaki w stringu.
  answer: |
    Najprościej użyć właściwości Length; jeśli chodzi o wystąpienia każdego znaku, używamy słownika.
    ```csharp
    Dictionary<char, int> CountChars(string s)
    {
        var counts = new Dictionary<char, int>();
        foreach (var c in s)
            counts[c] = counts.GetValueOrDefault(c) + 1;
        return counts;
    }
    ```

- id: 262
  text: Jak iterować po stringu?
  answer: |
    `String` implementuje `IEnumerable<char>`, więc najprościej przez `foreach` (`var` c `in` s).
    Gdy potrzebny jest indeks, używamy `for` z `s[i]` i `s.Length`.
    Można też użyć LINQ lub `ToCharArray()`; dla wydajności - `ReadOnlySpan<char>` przez `s.AsSpan()`.

- id: 263
  text: Napisz funkcję odwracającą `string`.
  answer: |
    Zamieniamy `string` na tablicę znaków, odwracamy i tworzymy nowy `string`.
    Alternatywnie dwa wskaźniki zamieniające znaki od końców.
    ```csharp
    string Reverse(string s)
    {
        var chars = s.ToCharArray();
        Array.Reverse(chars);
        return new string(chars);
    }
    ```

- id: 264
  text: Napisz funkcję sprawdzającą, czy `string` jest palindromem.
  answer: |
    Porównujemy znaki od początku i końca, przesuwając wskaźniki do środka; złożoność `O(n)`.
    Często normalizuje się wielkość liter i usuwa spacje.
    ```csharp
    bool IsPalindrome(string s)
    {
        int i = 0, j = s.Length - 1;
        while (i < j)
            if (char.ToLower(s[i++]) != char.ToLower(s[j--])) return false;
        return true;
    }
    ```

- id: 265
  text: Jakie są najważniejsze metody klasy `String`?
  answer: |
    Wyszukiwanie: Contains, `IndexOf`, `LastIndexOf`, `StartsWith`, `EndsWith`.
    Przekształcanie: Substring, Replace, `ToUpper`, `ToLower`, Trim, Insert, Remove, `PadLeft`.
    Dzielenie i łączenie: Split, `string.Join`, `string.Concat`.
    Porównywanie i sprawdzanie: Equals, Compare, `string.IsNullOrEmpty`, `string.IsNullOrWhiteSpace`.

- id: 266
  text: Napisz funkcję zwracającą najdłuższe słowo w zdaniu.
  answer: |
    Dzielimy zdanie na słowa i wybieramy najdłuższe; przy remisie zwracamy pierwsze.
    ```csharp
    string LongestWord(string sentence)
    {
        var words = sentence.Split(' ', StringSplitOptions.RemoveEmptyEntries);
        string longest = "";
        foreach (var w in words)
            if (w.Length > longest.Length) longest = w;
        return longest;
    }
    ```

- id: 267
  text: Napisz funkcję usuwającą wszystkie białe znaki ze stringa.
  answer: |
    Przechodzimy po znakach i pomijamy te, dla których `char.IsWhiteSpace` zwraca `true`.
    Alternatywnie `Regex.Replace(s, @"\s+", "")`.
    ```csharp
    string RemoveWhitespace(string s)
    {
        var sb = new StringBuilder();
        foreach (var c in s)
            if (!char.IsWhiteSpace(c)) sb.Append(c);
        return sb.ToString();
    }
    ```

- id: 268
  text: Napisz funkcję liczącą samogłoski w stringu.
  answer: |
    Sprawdzamy, czy każdy znak (po zmianie na małą literę) należy do zbioru samogłosek.
    ```csharp
    int CountVowels(string s)
    {
        const string vowels = "aeiouy";
        int count = 0;
        foreach (var c in s.ToLower())
            if (vowels.Contains(c)) count++;
        return count;
    }
    ```

- id: 269
  text: Napisz funkcję sprawdzającą, czy dwa stringi są anagramami.
  answer: |
    Anagramy mają te same znaki w tej samej liczbie; porównujemy liczniki znaków - złożoność `O(n)`.
    Prostsza wersja to porównanie posortowanych znaków, ale ma złożoność `O(n log n)`.
    ```csharp
    bool AreAnagrams(string a, string b)
    {
        if (a.Length != b.Length) return false;
        var counts = new Dictionary<char, int>();
        foreach (var c in a) counts[c] = counts.GetValueOrDefault(c) + 1;
        foreach (var c in b)
        {
            if (!counts.TryGetValue(c, out var n) || n == 0) return false;
            counts[c] = n - 1;
        }
        return true;
    }
    ```

- id: 270
  text: Napisz funkcję obliczającą silnię liczby.
  answer: |
    Iteracyjnie mnożymy liczby od 1 do n; wersja iteracyjna nie grozi przepełnieniem stosu.
    Używamy `long`, bo silnia szybko rośnie (dla bardzo dużych n - `BigInteger`).
    ```csharp
    long Factorial(int n)
    {
        long result = 1;
        for (int i = 2; i <= n; i++) result *= i;
        return result;
    }
    ```

- id: 271
  text: Czym różni się ++i od i++?
  answer: |
    ++i (preinkrementacja) najpierw zwiększa wartość, a potem zwraca nową.
    i++ (postinkrementacja) zwraca starą wartość, a dopiero potem zwiększa zmienną.
    Przykład: `int i = 5; int a = i++;` daje `a = 5`, `i = 6`; `int b = ++i;` daje `b = 7`.
    Jako samodzielna instrukcja (np. w pętli `for`) obie działają tak samo.

- id: 272
  text: Napisz funkcję sprawdzającą, czy liczba jest pierwsza.
  answer: |
    Liczba pierwsza ma dokładnie dwa dzielniki; wystarczy sprawdzać dzielniki do pierwiastka z n.
    Złożoność `O(sqrt(n))`.
    ```csharp
    bool IsPrime(int n)
    {
        if (n < 2) return false;
        for (int i = 2; (long)i * i <= n; i++)
            if (n % i == 0) return false;
        return true;
    }
    ```

- id: 273
  text: Jak zamienić miejscami dwie liczby w C#?
  answer: |
    Klasycznie przez zmienną tymczasową: `var temp = a; a = b; b = temp;`
    Nowocześnie przez krotki: (a, b) `=` (b, a);
    Bez zmiennej tymczasowej: `a = a + b`; `b = a` - b; `a = a` - b; (ryzyko przepełnienia) lub przez XOR.

- id: 274
  text: Napisz funkcję obliczającą NWD (GCD) dwóch liczb.
  answer: |
    Używamy algorytmu Euklidesa: `NWD(a, b)` `= NWD(b`, a mod b), aż b będzie zerem.
    Złożoność `O(log(min(a, b)))`.
    ```csharp
    int Gcd(int a, int b)
    {
        while (b != 0) (a, b) = (b, a % b);
        return Math.Abs(a);
    }
    ```

- id: 275
  text: Napisz funkcję sumującą cyfry liczby.
  answer: |
    Bierzemy ostatnią cyfrę (`n % 10`), dodajemy do sumy i usuwamy ją (`n /= 10`), aż liczba będzie zerem.
    ```csharp
    int SumDigits(int n)
    {
        n = Math.Abs(n);
        int sum = 0;
        while (n > 0) { sum += n % 10; n /= 10; }
        return sum;
    }
    ```

- id: 276
  text: Napisz funkcję generującą ciąg Fibonacciego do zadanej liczby.
  answer: |
    Każdy wyraz to suma dwóch poprzednich; generujemy wyrazy iteracyjnie, póki nie przekroczą limitu.
    Wersja iteracyjna jest `O(n)`, naiwna rekurencja byłaby wykładnicza.
    ```csharp
    List<long> Fibonacci(long limit)
    {
        var result = new List<long>();
        long a = 0, b = 1;
        while (a <= limit)
        {
            result.Add(a);
            (a, b) = (b, a + b);
        }
        return result;
    }
    ```

- id: 277
  text: Napisz funkcję sortującą tablicę rosnąco (sortowanie bąbelkowe).
  answer: |
    Porównujemy sąsiednie elementy i zamieniamy je, jeśli są w złej kolejności; największe "wypływają" na koniec.
    Flaga swapped pozwala zakończyć wcześniej, gdy tablica jest już posortowana; złożoność `O(n²)`.
    ```csharp
    void BubbleSort(int[] arr)
    {
        for (int i = 0; i < arr.Length - 1; i++)
        {
            bool swapped = false;
            for (int j = 0; j < arr.Length - 1 - i; j++)
            {
                if (arr[j] > arr[j + 1])
                {
                    (arr[j], arr[j + 1]) = (arr[j + 1], arr[j]);
                    swapped = true;
                }
            }
            if (!swapped) break;
        }
    }
    ```

- id: 278
  text: Napisz funkcję wyszukującą element w tablicy (wyszukiwanie binarne).
  answer: |
    Wyszukiwanie binarne działa tylko na posortowanej tablicy - za każdym razem odrzucamy połowę zakresu.
    Złożoność `O(log n)`; zwracamy indeks lub -1.
    ```csharp
    int BinarySearch(int[] arr, int target)
    {
        int left = 0, right = arr.Length - 1;
        while (left <= right)
        {
            int mid = left + (right - left) / 2;
            if (arr[mid] == target) return mid;
            if (arr[mid] < target) left = mid + 1;
            else right = mid - 1;
        }
        return -1;
    }
    ```

- id: 279
  text: Czym różni się klasa od struktury?
  answer: |
    Klasa jest typem referencyjnym (sterta), struktura typem wartościowym (zwykle stos lub wewnątrz obiektu).
    Przypisanie struktury kopiuje całą wartość, przypisanie klasy kopiuje tylko referencję.
    Struktury nie wspierają dziedziczenia (mogą implementować interfejsy) i nie mogą być `null` (bez Nullable).
    Struktury stosuje się dla małych, niemutowalnych wartości, np. Point, `DateTime`, Money.

- id: 280
  text: Czym jest przeciążanie operatorów?
  answer: |
    To definiowanie własnego zachowania operatorów (`+`, -, `==`, `<` itd.) dla własnych typów.
    Definiuje się je jako `public static` metody ze słowem operator, np. `public static` Money operator +(Money a, Money b).
    Niektóre operatory trzeba przeciążać parami (`== i !=`, `<` i `>`).
    Stosuje się to dla typów matematycznych lub wartościowych, gdzie operator jest intuicyjny.

- id: 281
  text: Czy można wywołać metodę klasy bazowej bez tworzenia instancji?
  answer: |
    Tak, jeśli metoda jest statyczna - wywołuje się ją przez nazwę klasy, np. `BaseClass.Method()`.
    Metodę instancyjną bazy można wywołać z klasy pochodnej przez `base.Method()`, ale wtedy instancja (pochodna) istnieje.
    Metod instancyjnych nie da się wywołać bez jakiejkolwiek instancji.

- id: 282
  text: Czym są funkcje wirtualne i czysto wirtualne?
  answer: |
    Funkcja wirtualna (`virtual`) ma implementację, którą klasa pochodna może nadpisać.
    Funkcja czysto wirtualna to pojęcie z C++ (`= 0`) - nie ma implementacji i musi zostać nadpisana.
    W C# odpowiednikiem funkcji czysto wirtualnej jest metoda `abstract`.

- id: 283
  text: Która koncepcja OOP udostępnia wywołującym tylko niezbędne informacje?
  answer: |
    Abstrakcja - wystawia tylko istotne operacje i ukrywa szczegóły implementacji.
    Wspiera ją hermetyzacja, która technicznie ogranicza dostęp do danych przez modyfikatory dostępu.

- id: 284
  text: Czy zawsze trzeba tworzyć obiekty z klasy?
  answer: |
    Nie. Składowe statyczne wywołuje się bez tworzenia obiektu.
    Klasy statyczne i abstrakcyjne w ogóle nie pozwalają na tworzenie instancji.
    Obiekt jest potrzebny tylko do korzystania ze składowych instancyjnych.

- id: 285
  text: Czym jest wczesne i późne wiązanie?
  answer: |
    Wczesne (statyczne) wiązanie - metoda jest wybierana w czasie kompilacji, np. przy przeciążaniu i wywołaniach niewirtualnych.
    Późne (dynamiczne) wiązanie - metoda jest wybierana w czasie wykonania na podstawie faktycznego typu obiektu, np. metody `virtual/override`.
    Późne wiązanie występuje też przy `dynamic` i refleksji.
    Wczesne jest szybsze, późne daje elastyczność (polimorfizm).

- id: 286
  text: Która koncepcja OOP służy jako mechanizm ponownego użycia kodu?
  answer: |
    Dziedziczenie - klasa pochodna przejmuje składowe klasy bazowej.
    Ponowne użycie zapewnia też kompozycja, która w praktyce jest często lepszym wyborem.

- id: 287
  text: Czy blok `finally` wykona się, jeśli w `try` jest `return`?
  answer: |
    Tak. `finally` wykonuje się zawsze, także po `return` w `try` lub `catch`.
    Wartość zwracana jest ustalana przed `finally`, a sam `finally` wykonuje się tuż przed wyjściem z metody.
    `finally` nie wykona się tylko w skrajnych przypadkach: `Environment.FailFast`, zabicie procesu, `StackOverflowException`.

- id: 288
  text: Czym jest wyjątek wewnętrzny (inner exception)?
  answer: |
    To wyjątek, który był pierwotną przyczyną innego wyjątku, przechowywany we właściwości `InnerException`.
    Ustawia się go, opakowując wyjątek: `throw new OrderException("Nie udało się", ex)`;
    Pozwala dodać kontekst na wyższym poziomie bez gubienia informacji o przyczynie.
    `AggregateException` przechowuje wiele wyjątków w `InnerExceptions`.

- id: 289
  text: Wymień kilka typowych wyjątków.
  answer: |
    `NullReferenceException`, `ArgumentException`, `ArgumentNullException`, `ArgumentOutOfRangeException`.
    `InvalidOperationException`, `NotImplementedException`, `NotSupportedException`.
    `IndexOutOfRangeException`, `InvalidCastException`, `FormatException`, `DivideByZeroException`, `OverflowException`.
    IOException, `FileNotFoundException`, `TimeoutException`, `OperationCanceledException`, `OutOfMemoryException`.

- id: 290
  text: Czym różni się stos (Stack) od kolejki (Queue)?
  answer: |
    Stack działa według zasady LIFO - ostatni wstawiony wychodzi pierwszy (Push, Pop, Peek).
    Queue działa według zasady FIFO - pierwszy wstawiony wychodzi pierwszy (Enqueue, Dequeue, Peek).
    Stos stosuje się np. przy undo i parsowaniu wyrażeń, kolejkę przy przetwarzaniu zadań w kolejności.

- id: 291
  text: Czym są tablice postrzępione (jagged arrays)?
  answer: |
    To tablice tablic - każdy wiersz może mieć inną długość.
    Deklaracja: `int[][] jagged = new int[3][]`; `jagged[0] = new int[2]`; `jagged[1] = new int[5]`;
    Są elastyczne i często szybsze niż tablice wielowymiarowe.

- id: 292
  text: Czym są tablice wielowymiarowe?
  answer: |
    To prostokątne tablice o wielu wymiarach, w których każdy wiersz ma tę samą długość.
    Deklaracja: `int[,] matrix = new int[3, 4]`; dostęp przez `matrix[1, 2]`.
    Rozmiary wymiarów pobiera się metodą `GetLength(wymiar)`.
    Stosuje się je np. do macierzy i plansz gier.

- id: 293
  text: Czym są indeksery?
  answer: |
    Indeksery pozwalają odwoływać się do obiektu jak do tablicy, przez `obj[index]`.
    Definiuje się je jak właściwość ze słowem `this`: `public string this[int i] { get => _items[i]; set => _items[i] = value; }`
    Mogą przyjmować różne typy indeksów, np. `string`, i być przeciążane.
    Używają ich np. `List<T>` i `Dictionary<TKey,TValue>`.

- id: 294
  text: Czym różni się `System.Array.Clone()` od `System.Array.CopyTo()`?
  answer: |
    `Clone()` tworzy nową tablicę i zwraca ją jako `object` (trzeba rzutować).
    `CopyTo()` kopiuje elementy do istniejącej tablicy docelowej od podanego indeksu.
    Obie metody wykonują płytką kopię - dla typów referencyjnych kopiowane są referencje, nie obiekty.

- id: 295
  text: Czym są typy wartościowe i referencyjne?
  answer: |
    Typy wartościowe (`int`, `double`, `bool`, `struct`, `enum`) przechowują dane bezpośrednio; przypisanie kopiuje wartość.
    Typy referencyjne (`class`, `string`, tablice, delegaty, interfejsy) przechowują referencję do obiektu na stercie.
    Przypisanie typu referencyjnego sprawia, że dwie zmienne wskazują ten sam obiekt.
    Typy wartościowe dziedziczą po `System.ValueType` i domyślnie nie mogą być `null`.

- id: 296
  text: Czy można nadpisać prywatną metodę wirtualną?
  answer: |
    Nie. Metoda wirtualna nie może być prywatna - kompilator zgłosi błąd.
    Prywatna metoda jest niewidoczna dla klasy pochodnej, więc nadpisanie nie ma sensu.

- id: 297
  text: Czym jest referencja cykliczna?
  answer: |
    To sytuacja, gdy obiekty odwołują się do siebie nawzajem w cyklu (A wskazuje B, B wskazuje A).
    GC w .NET radzi sobie z cyklami, bo śledzi osiągalność od korzeni, a nie liczy referencji.
    Problemem bywa przy serializacji (nieskończona pętla) - JSON wymaga `ReferenceHandler.IgnoreCycles` lub DTO.
    Na poziomie projektów cykliczne zależności między assembly są zabronione.

- id: 298
  text: Czym jest pula obiektów (`object` pool)?
  answer: |
    Pula obiektów przechowuje gotowe, wielokrotnego użytku instancje zamiast tworzyć i niszczyć je za każdym razem.
    Obiekt pobiera się z puli, używa i zwraca.
    Stosuje się ją dla obiektów drogich w tworzeniu lub generujących presję na GC, np. buforów, `StringBuilderów`.
    W .NET są `ArrayPool<T>` i `Microsoft.Extensions.ObjectPool`.

- id: 299
  text: Jakie są rodzaje delegatów?
  answer: |
    Delegaty pojedyncze (single-cast) - wskazują jedną metodę.
    Delegaty multicast - wskazują wiele metod.
    Delegaty generyczne - Func, Action, Predicate.
    Można też tworzyć własne typy delegatów oraz anonimowe delegaty i lambdy.

- id: 300
  text: Jakie są trzy rodzaje generycznych delegatów?
  answer: |
    `Func<T, TResult>` - przyjmuje parametry i zwraca wartość (ostatni parametr generyczny to typ wyniku).
    `Action<T>` - przyjmuje parametry i nic nie zwraca (`void`).
    `Predicate<T>` - przyjmuje jeden parametr i zwraca `bool`.

- id: 301
  text: Do czego używa się delegatów?
  answer: |
    Do callbacków - przekazania metody, która ma zostać wywołana później.
    Do obsługi zdarzeń i wzorca Observer.
    Do przekazywania logiki jako parametru (LINQ, strategie, sortowanie z komparatorem).
    Do konfiguracji w ASP.NET Core (options `=> ...`) i budowy pipeline'ów (middleware).

- id: 302
  text: Czy można używać delegatów do asynchronicznych wywołań metod?
  answer: |
    W .NET Framework delegaty miały `BeginInvoke/EndInvoke` do wywołań asynchronicznych (wzorzec APM).
    W .NET Core/.NET 5+ `BeginInvoke` nie jest wspierany i rzuca `PlatformNotSupportedException`.
    Dziś zamiast tego używa się `Task.Run` i `async/await`, a delegaty mogą zwracać `Task` (`Func<Task>`).

- id: 303
  text: Czym jest sekwencja ucieczki (escape sequence)? Podaj przykłady w C#.
  answer: |
    To kombinacja znaków zaczynająca się od backslasha, reprezentująca znak specjalny w stringu.
    Przykłady: \n (nowa linia), \t (tabulator), \\ (backslash), \" (cudzysłów), \r (powrót karetki), \0 (`null`), \u0041 (znak Unicode).
    Stringi dosłowne (`@"..."`) i raw literals ignorują sekwencje ucieczki.

- id: 304
  text: Czym są wyrażenia regularne?
  answer: |
    Wyrażenia regularne to wzorce do wyszukiwania, walidacji i przekształcania tekstu.
    W .NET służy do tego klasa Regex (`System.Text.RegularExpressions`): `IsMatch`, Match, Matches, Replace, Split.
    Przykładowe zastosowania: walidacja e-maila, wyciąganie numerów, zamiana formatów.
    Dla wydajności używa się `RegexOptions.Compiled` lub źródłowo generowanych regexów (`[GeneratedRegex]`), a przy danych z zewnątrz ustawia się timeout.

- id: 305
  text: Po co używać instrukcji `lock`?
  answer: |
    `lock` zapewnia, że tylko jeden wątek naraz wykonuje dany fragment kodu (sekcję krytyczną).
    Chroni współdzielone dane przed race condition.
    Blokuje się na prywatnym obiekcie, np. `private readonly object _sync = new()`; (od .NET 9 jest typ Lock).
    Nie blokuje się na `this`, typach ani stringach; w kodzie `async lock` nie działa - używa się `SemaphoreSlim`.

- id: 306
  text: Czym jest słowo kluczowe `extern`?
  answer: |
    `extern` oznacza metodę zaimplementowaną poza kodem zarządzanym, zwykle w natywnej bibliotece DLL.
    Używa się go z atrybutem `[DllImport]` (lub `[LibraryImport]`) w P/Invoke, np. do wywołania funkcji WinAPI.
    Istnieje też `extern` alias do rozróżniania assembly z tymi samymi nazwami typów.

- id: 307
  text: Czym jest operator `sizeof`?
  answer: |
    `sizeof` zwraca rozmiar typu wartościowego w bajtach, np. `sizeof(int)` to 4.
    Dla typów wbudowanych działa w zwykłym kodzie, dla struktur użytkownika wymaga kontekstu unsafe.
    Do rozmiaru struktur w interop używa się też `Marshal.SizeOf`.

- id: 308
  text: Czy można używać `this` wewnątrz metody statycznej?
  answer: |
    Nie. Metoda statyczna nie jest związana z żadną instancją, więc `this` nie istnieje.
    Użycie `this` w metodzie statycznej powoduje błąd kompilacji.
    W metodzie statycznej dostępne są tylko składowe statyczne lub przekazane obiekty.

- id: 309
  text: Czym różni się CType od `DirectCast`?
  answer: |
    To operatory konwersji z Visual Basic .NET, nie z C#.
    CType wykonuje konwersję, także między różnymi typami (np. `string` na `int`), korzystając z reguł konwersji VB.
    `DirectCast` wymaga relacji dziedziczenia lub implementacji między typami - jest szybszy, ale bardziej restrykcyjny.
    W C# odpowiednikiem `DirectCast` jest rzutowanie `(T)obj`, a CType - metody Convert.

- id: 310
  text: Która metoda klasy `String` służy do łączenia dwóch stringów?
  answer: |
    `String.Concat`, np. `string.Concat(a, b)`.
    Operator `+` jest kompilowany do `string.Concat`.
    Do łączenia kolekcji z separatorem służy `string.Join`, a przy wielu operacjach `StringBuilder`.

- id: 311
  text: Czym jest parsowanie? Jak sparsować `string` z datą?
  answer: |
    Parsowanie to zamiana tekstu na wartość danego typu, np. "42" na `int`.
    Datę parsuje się przez `DateTime.Parse`, a bezpieczniej przez `DateTime.TryParse`, które nie rzuca wyjątku.
    Dla konkretnego formatu: `DateTime.ParseExact("19.10.2026", "dd.MM.yyyy", CultureInfo.InvariantCulture)`.
    Zawsze warto jawnie podać kulturę i rozważyć `DateTimeOffset` lub `DateOnly`.

- id: 312
  text: Czym jest klasa częściowa (`partial class`)?
  answer: |
    Klasa `partial` może być podzielona na kilka plików, które kompilator łączy w jedną klasę.
    Wszystkie części muszą mieć słowo `partial` i być w tym samym assembly i przestrzeni nazw.
    Stosuje się ją przy kodzie generowanym (designery, source generatory, EF scaffolding), by oddzielić go od ręcznego.
    Istnieją też metody `partial`.

- id: 313
  text: Czym jest typ anonimowy?
  answer: |
    To typ tworzony w locie bez jawnej deklaracji klasy: `var p = new { Name = "Jan", Age = 30 }`;
    Jego właściwości są tylko do odczytu, a nazwę typu generuje kompilator.
    Używa się ich głównie w projekcjach LINQ (Select) w obrębie jednej metody.
    Nie nadają się do zwracania z publicznych metod - wtedy lepsze są rekordy lub krotki.

- id: 314
  text: Czym są akcesory `get` i `set` właściwości?
  answer: |
    `get` zwraca wartość właściwości, `set` ją przypisuje (z niejawnym parametrem value).
    Mogą zawierać logikę: walidację, leniwe ładowanie, powiadamianie o zmianach.
    Mogą mieć różne poziomy dostępu, np. `public get` i `private set`.
    `init` pozwala ustawić wartość tylko przy inicjalizacji, a od C# 13/14 dostępne jest słowo field dla pola wspierającego.

- id: 315
  text: Czym jest kowariancja w C#?
  answer: |
    Kowariancja pozwala używać bardziej szczegółowego typu tam, gdzie oczekiwany jest bardziej ogólny.
    Przykład: `IEnumerable<string>` można przypisać do `IEnumerable<object>`, bo `IEnumerable<out T>` jest kowariantny.
    Oznacza się ją słowem `out` w generycznych interfejsach i delegatach.
    Kontrawariancja (`in`) działa odwrotnie, np. `Action<object>` można przypisać do `Action<string>`.

- id: 316
  text: Czym jest JIT?
  answer: |
    JIT (Just-In-Time compiler) kompiluje kod IL do kodu maszynowego w czasie wykonania, gdy metoda jest wywoływana po raz pierwszy.
    Pozwala optymalizować kod pod konkretny procesor.
    .NET używa kompilacji wielopoziomowej (tiered compilation) i PGO - najpierw szybko, potem optymalnie.
    Alternatywą jest kompilacja AOT (Native AOT, `ReadyToRun`).

- id: 317
  text: Czym jest MSIL?
  answer: |
    MSIL (Microsoft Intermediate Language), dziś CIL lub po prostu IL, to niezależny od procesora kod pośredni.
    Kompilatory C#, F# i VB.NET kompilują kod do IL, który trafia do assembly.
    W czasie wykonania JIT tłumaczy IL na kod maszynowy.
    Dzięki IL języki .NET mogą ze sobą współpracować.

- id: 318
  text: Czym jest kod zarządzany i niezarządzany?
  answer: |
    Kod zarządzany działa pod kontrolą CLR - ma automatyczne zarządzanie pamięcią (GC), bezpieczeństwo typów i obsługę wyjątków.
    Kod niezarządzany działa bezpośrednio na systemie operacyjnym, np. C/C++, COM, WinAPI.
    Komunikację między nimi zapewniają P/Invoke i COM Interop.
    Zasoby niezarządzane trzeba zwalniać ręcznie (`IDisposable`).

- id: 319
  text: Czym różni się przestrzeń nazw od assembly?
  answer: |
    Przestrzeń nazw to logiczne grupowanie typów, służące organizacji kodu i unikaniu kolizji nazw.
    Assembly to fizyczna jednostka wdrożenia (plik `.dll/.exe`) z kodem IL i metadanymi.
    Jedno assembly może zawierać wiele przestrzeni nazw, a jedna przestrzeń nazw może być rozproszona po wielu assembly.

- id: 320
  text: Czym jest manifest?
  answer: |
    Manifest to metadane assembly opisujące je samo.
    Zawiera nazwę, wersję, kulturę, klucz publiczny (dla silnych nazw), listę plików i referencje do innych assembly.
    CLR używa manifestu do ładowania assembly i rozwiązywania zależności.

- id: 321
  text: Gdzie przechowywana jest informacja o wersji assembly?
  answer: |
    W manifeście assembly.
    Ustawia się ją w pliku projektu (Version, `AssemblyVersion`, `FileVersion`) lub dawniej w `AssemblyInfo.cs` przez atrybuty.
    Odczytać ją można przez refleksję: `Assembly.GetName().Version`.

- id: 322
  text: Czy wersjonowanie dotyczy prywatnych assembly?
  answer: |
    W .NET Framework CLR nie sprawdza wersji prywatnych assembly bez silnej nazwy - ładuje to, co leży w katalogu aplikacji.
    Wersjonowanie jest egzekwowane dla assembly z silną nazwą, np. w GAC.
    W nowym .NET wersjami zależności zarządza NuGet i plik `deps.json`.

- id: 323
  text: Czym jest domena aplikacji (`AppDomain`)?
  answer: |
    `AppDomain` w .NET Framework to izolowana jednostka wewnątrz procesu, w której działa aplikacja.
    Pozwalała uruchamiać wiele odizolowanych aplikacji w jednym procesie i wyładowywać assembly.
    W .NET Core/.NET 5+ istnieje tylko jedna `AppDomain` na proces.
    Do izolacji służą procesy i kontenery, a do wyładowywania kodu `AssemblyLoadContext`.

- id: 324
  text: Czym jest CAS (Code Access Security)?
  answer: |
    CAS to mechanizm .NET Framework ograniczający uprawnienia kodu na podstawie jego pochodzenia (np. z internetu, z lokalnego dysku).
    Pozwalał uruchamiać częściowo zaufany kod z ograniczonym dostępem do plików czy sieci.
    Był skomplikowany i w .NET Framework 4 znacznie uproszczony.
    W .NET Core nie jest wspierany - granicą bezpieczeństwa są uprawnienia procesu i systemu operacyjnego.

- id: 325
  text: Czym są operacje synchroniczne i asynchroniczne?
  answer: |
    Operacja synchroniczna blokuje wywołującego do czasu zakończenia.
    Operacja asynchroniczna zwraca sterowanie od razu, a wynik dostarcza później (`Task`, callback).
    Asynchroniczność jest kluczowa przy operacjach I/O, żeby nie marnować wątków na czekanie.
    W C# realizuje się ją przez `async/await` i `Task`.

- id: 326
  text: Czym jest wielozadaniowość (multi-tasking)?
  answer: |
    To zdolność systemu do wykonywania wielu zadań (procesów lub wątków) pozornie lub faktycznie równocześnie.
    Na jednym rdzeniu system przełącza zadania (podział czasu), na wielu rdzeniach wykonuje je równolegle.
    Wielozadaniowość może być oparta na procesach lub na wątkach.
    W .NET wspierają ją wątki, `Task` Parallel Library i `async/await`.

- id: 327
  text: Wymień kilka właściwości klasy Thread.
  answer: |
    Name - nazwa wątku; `ManagedThreadId` - identyfikator.
    `IsAlive` - czy wątek działa; `ThreadState` - stan wątku.
    `IsBackground` - czy wątek jest tłem (nie blokuje zakończenia procesu).
    Priority - priorytet; `CurrentThread` (statyczna) - bieżący wątek; `CurrentCulture`.

- id: 328
  text: Jakie są stany wątku?
  answer: |
    Unstarted - utworzony, ale niewystartowany; Running - działa.
    `WaitSleepJoin` - czeka (Sleep, Join, `lock`, Wait).
    Stopped - zakończony; Background - wątek tła.
    Dawniej także Suspended i `AbortRequested`, obecnie przestarzałe.

- id: 329
  text: Czy w jednej domenie aplikacji może działać wiele wątków?
  answer: |
    Tak. `AppDomain` (i proces) może mieć wiele wątków, które dzielą jej pamięć.
    Właśnie dlatego dostęp do współdzielonych danych wymaga synchronizacji.

- id: 330
  text: Która przestrzeń nazw zawiera obsługę wątków?
  answer: |
    `System.Threading` - Thread, `ThreadPool`, Monitor, Mutex, `SemaphoreSlim`, Interlocked, `CancellationToken`.
    `System.Threading.Tasks` - `Task`, `Task<T>`, Parallel.
    Kolekcje współbieżne są w `System.Collections.Concurrent`, a kanały w `System.Threading.Channels`.

- id: 331
  text: Czym są `lock`, Monitor i Mutex?
  answer: |
    `lock` to skrót składniowy dla `Monitor.Enter/Monitor.Exit` w `try/finally` - synchronizuje wątki w jednym procesie.
    Monitor daje więcej możliwości: `TryEnter` z timeoutem, Wait i Pulse do sygnalizacji.
    Mutex to obiekt systemowy, który może synchronizować także różne procesy (nazwany Mutex), ale jest wolniejszy.
    Jest też `Semaphore/SemaphoreSlim`, dopuszczający określoną liczbę wątków naraz.

- id: 332
  text: Czym jest `Thread.Sleep()`?
  answer: |
    `Thread.Sleep` wstrzymuje bieżący wątek na zadany czas, nie zużywając CPU.
    `Thread.Sleep(0)` oddaje resztę kwantu czasu innym wątkom.
    W kodzie asynchronicznym używa się `await Task.Delay()`, bo Sleep blokuje wątek z puli.

- id: 333
  text: Czym jest Suspend i Resume w wątkach?
  answer: |
    `Thread.Suspend` wstrzymywał wątek, a `Thread.Resume` go wznawiał.
    Metody są przestarzałe i niebezpieczne - zawieszony wątek mógł trzymać `lock` i spowodować deadlock.
    Nie są wspierane w .NET Core; zamiast nich używa się sygnalizacji: `ManualResetEvent`, `SemaphoreSlim`, `CancellationToken`.

- id: 334
  text: Jak zatrzymać długo działający wątek?
  answer: |
    Zalecany sposób to kooperacyjne anulowanie przez `CancellationToken` - wątek sprawdza token i kończy się sam.
    `Thread.Abort` jest przestarzały i nie działa w .NET Core.
    Można też użyć flagi `volatile` lub zdarzenia sygnalizacyjnego.

- id: 335
  text: Po co nam wielowątkowość w projekcie?
  answer: |
    Żeby UI pozostało responsywne podczas długich operacji.
    Żeby wykorzystać wiele rdzeni CPU do obliczeń równoległych.
    Żeby serwer obsługiwał wiele żądań jednocześnie i przetwarzał zadania w tle (kolejki, harmonogramy).
    Dla operacji I/O zwykle lepsza jest asynchroniczność niż dodatkowe wątki.

- id: 336
  text: Jak uruchomić wątek w C#?
  answer: |
    Tworzy się obiekt Thread z delegatem i wywołuje `Start()`: `var t = new Thread(DoWork)`; `t.Start()`;
    Można przekazać parametr przez `ParameterizedThreadStart` lub lambdę.
    W praktyce częściej używa się `Task.Run(() => DoWork())` lub `ThreadPool.QueueUserWorkItem`.

- id: 337
  text: Czym jest race condition (wyścig)?
  answer: |
    To sytuacja, gdy wynik działania zależy od nieprzewidywalnej kolejności wykonania wątków.
    Typowy przykład: dwa wątki jednocześnie robią counter++, które nie jest operacją atomową, i gubią inkrementacje.
    Zapobiega się mu przez `lock`, Interlocked, kolekcje współbieżne lub niemutowalne dane.

- id: 338
  text: Czym jest livelock?
  answer: |
    Livelock to sytuacja, w której wątki nie są zablokowane, ale ciągle reagują na siebie i nie robią postępu.
    Przypomina dwie osoby w korytarzu, które ustępują sobie w tę samą stronę w nieskończoność.
    W przeciwieństwie do deadlocka wątki są aktywne i zużywają CPU.
    Rozwiązuje się go losowymi opóźnieniami lub ustaloną kolejnością priorytetów.

- id: 339
  text: Czym jest obiekt niemutowalny?
  answer: |
    To obiekt, którego stanu nie da się zmienić po utworzeniu - każda "zmiana" tworzy nowy obiekt.
    Przykłady w .NET: `string`, `DateTime`, rekordy z właściwościami `init`, `ImmutableList`.
    Są z natury bezpieczne wątkowo, przewidywalne i dobrze nadają się na klucze słowników.
    Kosztem jest dodatkowa alokacja przy każdej zmianie.

- id: 340
  text: Jak wykonywany jest kod zarządzany?
  answer: |
    Kod źródłowy jest kompilowany do IL i zapisywany w assembly z metadanymi.
    Przy uruchomieniu CLR ładuje assembly, weryfikuje kod i przy pierwszym wywołaniu metody JIT kompiluje ją do kodu maszynowego.
    Kod działa pod kontrolą CLR, który zapewnia GC, obsługę wyjątków i bezpieczeństwo typów.

- id: 341
  text: Czym różnią się wyjątki systemowe od wyjątków aplikacyjnych?
  answer: |
    Wyjątki systemowe (`SystemException`) rzuca CLR i biblioteki .NET, np. `NullReferenceException`, `IndexOutOfRangeException`.
    Wyjątki aplikacyjne tworzy programista dla błędów biznesowych - historycznie dziedziczyły po `ApplicationException`.
    Obecnie Microsoft zaleca dziedziczenie własnych wyjątków bezpośrednio po `Exception`.

- id: 342
  text: Czym jest XSD?
  answer: |
    XSD (XML Schema Definition) to język opisu struktury dokumentów XML: elementów, atrybutów, typów i ograniczeń.
    Służy do walidacji, czy dokument XML jest zgodny z oczekiwanym formatem.
    W .NET z XSD można generować klasy narzędziem `xsd.exe` i walidować XML przez `XmlReaderSettings`.

- id: 343
  text: W którym assembly zdefiniowany jest framework MVC?
  answer: |
    W klasycznym ASP.NET MVC to `System.Web.Mvc.dll`.
    W ASP.NET Core MVC jest częścią shared framework `Microsoft.AspNetCore.App` (`m.in`. `Microsoft.AspNetCore.Mvc.Core`).

- id: 344
  text: Czy można współdzielić widok między wieloma kontrolerami?
  answer: |
    Tak - umieszcza się go w folderze Views/Shared.
    Silnik widoków szuka widoku najpierw w folderze kontrolera, a potem w Shared.
    Można też podać pełną ścieżkę widoku: `return View("~/Views/Common/Info.cshtml")`.

- id: 345
  text: Czym jest trasa (route) w MVC? Jaka jest trasa domyślna?
  answer: |
    Trasa to wzorzec URL mapowany na kontroler, akcję i parametry.
    Domyślna trasa to `{controller}/{action}/{id}`, z wartościami domyślnymi Home, Index i opcjonalnym id.
    Dzięki temu adres `/` trafia do `HomeController.Index`, a `/Products/Details/5` do `ProductsController.Details(5)`.

- id: 346
  text: Gdzie definiuje się reguły routingu w aplikacji ASP.NET MVC?
  answer: |
    W klasycznym MVC w pliku `App_Start/RouteConfig.cs`, w metodzie `RegisterRoutes` wywoływanej z `Global.asax` (`Application_Start`).
    Routing atrybutowy definiuje się na kontrolerach i akcjach.
    W ASP.NET Core trasy definiuje się w `Program.cs` (`MapControllerRoute`) lub atrybutami.

- id: 347
  text: Czym jest `ValidationSummary` w MVC?
  answer: |
    To helper wyświetlający listę wszystkich błędów walidacji z `ModelState` w jednym miejscu.
    Wywołuje się go przez `@Html.ValidationSummary()` lub w Core przez tag helper div z asp-validation-summary.
    Można wyświetlić wszystkie błędy albo tylko te na poziomie modelu (`ModelOnly`).

- id: 348
  text: Czym różnią się silniki widoków Razor i ASPX?
  answer: |
    Razor używa zwięzłej składni ze znakiem `@`, ASPX - tagów `<% %>`.
    Razor jest czytelniejszy, domyślnie koduje wyjście (ochrona przed XSS) i ma lepsze wsparcie IntelliSense.
    Pliki Razor mają rozszerzenie `.cshtml/.vbhtml`, ASPX - `.aspx/.ascx/.master`.
    ASPX jest starszy i wolniejszy; w ASP.NET Core istnieje tylko Razor.

- id: 349
  text: Jakie są główne zasady składni Razor?
  answer: |
    Wyrażenia zaczynają się od `@`, np. `@Model.Name`, a bloki kodu od `@{ ... }`.
    Wyrażenia jawne zapisuje się w nawiasach `@(...)`, a instrukcje sterujące jako `@if`, `@foreach`, `@switch`.
    Wyjście jest domyślnie kodowane HTML; surowy HTML wypisuje się przez `@Html.Raw`.
    Komentarze to `@* ... *@`, a znak `@` wypisuje się jako `@@`.

- id: 350
  text: Jak zaimplementować Forms Authentication w MVC?
  answer: |
    W `web.config` ustawia się authentication `mode="Forms"` z adresem strony logowania.
    Po poprawnej weryfikacji danych wywołuje się `FormsAuthentication.SetAuthCookie(userName, rememberMe)`.
    Chronione akcje oznacza się `[Authorize]`, a wylogowanie to `FormsAuthentication.SignOut()`.
    W ASP.NET Core odpowiednikiem jest Cookie Authentication z `HttpContext.SignInAsync`.

- id: 351
  text: Jak zarejestrować area w ASP.NET MVC?
  answer: |
    Każda area ma klasę dziedziczącą po `AreaRegistration` z metodą `RegisterArea`, definiującą trasę.
    W `Application_Start` wywołuje się `AreaRegistration.RegisterAllAreas()`.
    W ASP.NET Core dodaje się trasę z `{area:exists}` i atrybut `[Area("Nazwa")]` na kontrolerach.

- id: 352
  text: Do czego służą Display Modes w MVC?
  answer: |
    Display Modes (MVC 4) pozwalają serwować różne widoki zależnie od urządzenia, np. `Index.Mobile.cshtml` dla telefonów.
    Wybór odbywa się na podstawie żądania, np. User-Agent.
    Dziś zamiast tego stosuje się responsywny design (CSS media queries).

- id: 353
  text: Czym są ograniczenia tras (route constraints) w MVC?
  answer: |
    Ograniczają, jakie wartości mogą przyjmować parametry trasy, np. id musi być liczbą.
    W routingu atrybutowym: `[Route("products/{id:int}")]`, także :guid, `:min(1)`, `:length(5)`, `:regex(...)`.
    W routingu konwencjonalnym podaje się je w parametrze constraints.
    Jeśli wartość nie spełnia ograniczenia, trasa nie pasuje i zwykle zwracany jest 404.

- id: 354
  text: Jakie foldery zawiera aplikacja MVC?
  answer: |
    Controllers, Models i Views (z podfolderem Shared).
    W klasycznym MVC także `App_Start`, `App_Data`, Content, Scripts oraz pliki `Global.asax` i `Web.config`.
    W ASP.NET Core zamiast Content/Scripts jest wwwroot, a konfiguracja jest w `Program.cs` i `appsettings.json`.

- id: 355
  text: Jakie są metody obsługi błędów w MVC?
  answer: |
    `try/catch` w akcjach dla błędów oczekiwanych.
    Atrybut `[HandleError]` i filtry wyjątków (`IExceptionFilter`) na poziomie akcji, kontrolera lub globalnie.
    Nadpisanie `OnException` w kontrolerze oraz `Application_Error` w `Global.asax`.
    `customErrors` w `web.config` dla stron błędów; w Core - `UseExceptionHandler` i `UseStatusCodePages`.

- id: 356
  text: Czym jest `_ViewStart`?
  answer: |
    `_ViewStart.cshtml` to plik wykonywany przed renderowaniem każdego widoku w danym folderze i podfolderach.
    Zwykle ustawia wspólny layout: `@{ Layout = "_Layout"; }`
    Dzięki temu nie trzeba podawać layoutu w każdym widoku.

- id: 357
  text: Jak zrobić własną stronę błędu w MVC?
  answer: |
    W klasycznym MVC ustawia się `customErrors mode="On"` w `web.config` ze stroną domyślną i error dla kodów statusu.
    Można dodać kontroler `ErrorController` z akcjami dla 404 i 500.
    W ASP.NET Core używa się `app.UseExceptionHandler("/Error")` i `app.UseStatusCodePagesWithReExecute("/Error/{0}")`.

- id: 358
  text: Czym jest walidacja po stronie serwera w MVC?
  answer: |
    To sprawdzanie danych na serwerze, po model bindingu, na podstawie Data Annotations, `IValidatableObject` lub własnej logiki.
    Wynik trafia do `ModelState`, a akcja sprawdza `ModelState.IsValid`.
    Walidacja serwerowa jest obowiązkowa - klienckiej można łatwo obejść.

- id: 359
  text: Do czego służy walidacja zdalna (remote validation) w MVC?
  answer: |
    Pozwala zwalidować pole po stronie klienta przez wywołanie akcji na serwerze, bez wysyłania całego formularza.
    Przykład: sprawdzenie, czy login lub e-mail jest już zajęty.
    Oznacza się właściwość atrybutem `[Remote("IsEmailAvailable", "Account")]`, a akcja zwraca JSON `true/false`.
    Nie zastępuje walidacji serwerowej przy zapisie.

- id: 360
  text: Czym jest `RenderSection` w MVC?
  answer: |
    `RenderSection` w layoucie definiuje miejsce, w które widoki mogą wstawić własną treść.
    W layoucie: `@RenderSection("Scripts", required: false)`, w widoku: `@section Scripts { ... }`.
    Typowo używa się go do skryptów lub stylów specyficznych dla strony.

- id: 361
  text: Jakie jest znaczenie atrybutu `NonAction`?
  answer: |
    `[NonAction]` oznacza publiczną metodę kontrolera, która nie ma być dostępna jako akcja przez URL.
    Domyślnie każda publiczna metoda kontrolera jest akcją.
    Lepszą praktyką jest jednak przeniesienie takiej logiki do serwisu lub oznaczenie metody jako `private`.

- id: 362
  text: Jak tworzona jest tablica tras w ASP.NET MVC?
  answer: |
    Przy starcie aplikacji (`Application_Start`) wywoływane jest `RouteConfig.RegisterRoutes(RouteTable.Routes)`.
    Metody `routes.MapRoute` dodają trasy do kolekcji `RouteTable.Routes`.
    Przy każdym żądaniu trasy są sprawdzane w kolejności dodania, więc bardziej szczegółowe muszą być wyżej.

- id: 363
  text: Aplikacja ASP.NET MVC korzysta z ustawień w 2 miejscach, aby routing działał poprawnie. Jakie to miejsca?
  answer: |
    Plik `Web.config` - rejestruje moduł routingu (`UrlRoutingModule`) i handler w pipeline IIS.
    Plik `Global.asax` (`Application_Start`) - wywołuje rejestrację tras w `RouteTable` (`RouteConfig.RegisterRoutes`).

- id: 364
  text: Do czego służy domyślna trasa `{controller}/{action}/{id}`?
  answer: |
    Mapuje adres URL na kontroler, akcję i opcjonalny parametr id.
    Wartości domyślne (`controller = Home`, `action = Index`, `id` opcjonalne) sprawiają, że adres główny trafia do `HomeController.Index`.
    Przykładowo `/Products/Edit/5` wywoła `ProductsController.Edit(5)`.
    Obsługuje większość standardowych scenariuszy bez definiowania dodatkowych tras.

- id: 365
  text: Czym różni się dodawanie tras w aplikacji Web Forms i MVC?
  answer: |
    W Web Forms trasa mapuje URL na fizyczny plik `.aspx` - używa się `routes.MapPageRoute`.
    W MVC trasa mapuje URL na kontroler i akcję - używa się `routes.MapRoute`.
    W Web Forms routing był dodatkiem, w MVC jest podstawowym mechanizmem.

- id: 366
  text: W jakiej kolejności wykonują się filtry, jeśli zaimplementowano ich kilka?
  answer: |
    Kolejność typów: autoryzacji, akcji (przed akcją), sama akcja, akcji (po akcji), wyników, a wyjątków przy błędzie.
    W ASP.NET Core dochodzą resource filters, wykonywane po autoryzacji, przed model bindingiem.
    W obrębie tego samego typu: globalne, potem kontrolera, potem akcji - chyba że ustawiono właściwość Order.

- id: 367
  text: Który filtr wykonuje się jako pierwszy w aplikacji ASP.NET MVC?
  answer: |
    Filtr autoryzacji - wykonuje się przed wszystkimi innymi filtrami i przed akcją.
    Jeśli autoryzacja się nie powiedzie, kolejne filtry i akcja nie są wykonywane.

- id: 368
  text: Na jakich poziomach można stosować filtry w ASP.NET MVC?
  answer: |
    Na poziomie akcji - atrybut na metodzie.
    Na poziomie kontrolera - atrybut na klasie, działa dla wszystkich akcji.
    Globalnie - rejestracja w `GlobalFilters.Filters` (`FilterConfig`) lub w Core w `options.Filters`.

- id: 369
  text: Czy można utworzyć własny filtr?
  answer: |
    Tak. Dziedziczy się po `ActionFilterAttribute` lub implementuje interfejs `IActionFilter`, `IAuthorizationFilter`, `IResultFilter` albo `IExceptionFilter`.
    W ASP.NET Core są też wersje `async` (`IAsyncActionFilter`).
    Własne filtry stosuje się do logowania, mierzenia czasu, walidacji czy audytu.

- id: 370
  text: Które filtry wykonują się na końcu?
  answer: |
    W normalnym przebiegu na końcu wykonują się filtry wyników (po wygenerowaniu wyniku - `OnResultExecuted`).
    Filtry wyjątków działają tylko wtedy, gdy wystąpi nieobsłużony wyjątek.

- id: 371
  text: Czy można przerwać wykonywanie filtrów?
  answer: |
    Tak. W filtrze akcji lub autoryzacji wystarczy ustawić `context.Result`, np. na `RedirectResult` lub `ForbidResult`.
    Wtedy akcja i kolejne filtry nie są wykonywane (short-circuit).
    Przykład: filtr sprawdzający uprawnienia zwraca 403 zamiast uruchamiać akcję.

- id: 372
  text: Jakiego typu filtrem jest `OutputCacheAttribute`?
  answer: |
    W klasycznym MVC `OutputCacheAttribute` jest filtrem akcji i filtrem wyników - dziedziczy po `ActionFilterAttribute`.
    Dzięki temu może zwrócić odpowiedź z cache przed akcją i zapisać wynik po jej wykonaniu.

- id: 373
  text: Jakie są 2 popularne silniki widoków ASP.NET MVC?
  answer: |
    Razor (`.cshtml`) i ASPX `/` Web Forms view engine (`.aspx`).
    Razor jest domyślny od MVC 3 i jedyny w ASP.NET Core.

- id: 374
  text: Jakim symbolem zaczyna się blok kodu w widokach Razor?
  answer: |
    Symbolem `@`, a blok kodu zapisuje się jako `@{ ... }`.
    Pojedyncze wyrażenie to `@wyrażenie` lub `@(wyrażenie)`.

- id: 375
  text: Jakim symbolem zaczyna się blok kodu w widokach ASPX?
  answer: |
    Blok kodu zapisuje się jako `<% ... %>`.
    Wyrażenie wypisywane do wyjścia to `<%= ... %>`, a z kodowaniem HTML `<%: ... %>`.

- id: 376
  text: Czym są sekcje w Razor?
  answer: |
    Sekcje to nazwane fragmenty treści definiowane w widoku i renderowane w określonym miejscu layoutu.
    W widoku: `@section Scripts { ... }`, w layoucie: `@RenderSection("Scripts", required: false)`.
    Pozwalają widokom wstrzykiwać skrypty, style lub dodatkowe elementy do layoutu.

- id: 377
  text: Jakie rozszerzenia mają pliki widoków Razor?
  answer: |
    `.cshtml` dla widoków w C# i `.vbhtml` dla widoków w Visual Basic.
    Komponenty Blazor używają rozszerzenia `.razor`.

- id: 378
  text: Jak zapisać komentarz w składni Razor?
  answer: |
    Komentarz Razor zapisuje się jako `@* komentarz *@`.
    Nie trafia on do wygenerowanego HTML, w przeciwieństwie do komentarza `<!-- -->`.
    W blokach `@{ }` można używać zwykłych komentarzy C#.

- id: 379
  text: Czy można połączyć ASP.NET Web Forms i ASP.NET MVC w jednej aplikacji?
  answer: |
    Tak, w klasycznym ASP.NET (.NET Framework) obie technologie działają na `System.Web` i mogą współistnieć w jednym projekcie.
    Wymaga to konfiguracji routingu, żeby trasy MVC nie przechwytywały plików `.aspx`.
    Stosuje się to przy stopniowej migracji ze starych Web Forms do MVC.
    ASP.NET Core nie wspiera Web Forms.

- id: 380
  text: Do czego służy `ViewModel` w MVC?
  answer: |
    `ViewModel` to klasa zawierająca dokładnie te dane, których potrzebuje konkretny widok.
    Pozwala połączyć dane z wielu encji i dodać pola pomocnicze (np. listy do dropdownów).
    Oddziela model domenowy od prezentacji i chroni przed over-postingiem.
    Na nim definiuje się walidację specyficzną dla formularza.

- id: 381
  text: Czym jest `BundleConfig` w MVC 4?
  answer: |
    `BundleConfig.cs` (w `App_Start`) definiuje paczki skryptów i stylów do bundlingu i minifikacji.
    Przykład: `bundles.Add(new ScriptBundle("~/bundles/jquery").Include("~/Scripts/jquery-{version}.js"))`;
    Rejestruje się go w `Application_Start`, a w widokach używa `Scripts.Render` i `Styles.Render`.
    Minifikacja działa, gdy debug jest wyłączony lub `BundleTable.EnableOptimizations = true`.

- id: 382
  text: Jak obsłużyć wyjątek na poziomie kontrolera w ASP.NET MVC?
  answer: |
    Nadpisując metodę `OnException` w kontrolerze - obsługuje wyjątki ze wszystkich jego akcji.
    Można też dodać atrybut `[HandleError]` lub własny filtr wyjątków na klasie kontrolera.
    W handlerze ustawia się `filterContext.ExceptionHandled = true` i wynik, np. widok błędu.

- id: 383
  text: Czy `TempData` przechowuje dane dla kolejnego żądania w ASP.NET MVC?
  answer: |
    Tak. `TempData` przechowuje dane do momentu ich odczytania - zwykle w następnym żądaniu, np. po przekierowaniu.
    Po odczycie wartość jest oznaczana do usunięcia na koniec żądania.
    Metody Keep i Peek pozwalają zachować dane na dłużej.

- id: 384
  text: Do czego służy metoda Keep w `TempData`?
  answer: |
    `Keep()` oznacza wartości `TempData` do zachowania na kolejne żądanie, mimo że zostały już odczytane.
    `TempData.Keep()` zachowuje wszystkie wartości, `TempData.Keep("klucz")` - tylko wskazaną.

- id: 385
  text: Do czego służy metoda Peek w `TempData`?
  answer: |
    `Peek("klucz")` odczytuje wartość z `TempData` bez oznaczania jej do usunięcia.
    Jest to odpowiednik odczytu i natychmiastowego wywołania Keep dla tego klucza.

- id: 386
  text: Czym są akcje potomne (child actions) w ASP.NET MVC?
  answer: |
    To akcje wywoływane z widoku przez `Html.Action` lub `Html.RenderAction`, renderujące fragment strony z własną logiką.
    Oznacza się je atrybutem `[ChildActionOnly]`, żeby nie były dostępne bezpośrednio przez URL.
    Przykład: menu lub koszyk na każdej stronie.
    W ASP.NET Core zastąpiły je view components.

- id: 387
  text: Jakie narzędzia służą do testów jednostkowych w ASP.NET MVC?
  answer: |
    Frameworki testowe: xUnit, NUnit, MSTest.
    Biblioteki do mockowania: Moq, NSubstitute, FakeItEasy.
    Asercje: FluentAssertions, Shouldly; do testów integracyjnych w Core - `WebApplicationFactory`.

- id: 388
  text: Czy można używać kodu Razor w JavaScript?
  answer: |
    Tak, wewnątrz widoku `.cshtml` Razor jest przetwarzany na serwerze przed wysłaniem do przeglądarki.
    Przykład: `var userId = @Model.Id`; lub `var data = @Html.Raw(Json.Serialize(Model))`; 
    Nie działa to w zewnętrznych plikach `.js`, bo nie są przetwarzane przez Razor.
    Trzeba uważać na poprawne kodowanie danych, żeby nie otworzyć drogi do XSS.

- id: 389
  text: Jak zwrócić `string` z akcji w ASP.NET MVC?
  answer: |
    Przez `ContentResult`: `return Content("Hello")`;
    Można też ustawić typ treści: `return Content("<b>Hi</b>", "text/html")`.
    Akcja może również zwrócić bezpośrednio typ `string`.

- id: 390
  text: Jak zwrócić JSON z akcji w ASP.NET MVC?
  answer: |
    Przez `JsonResult`: `return Json(data)`;
    W klasycznym MVC dla żądań `GET` trzeba dodać `JsonRequestBehavior.AllowGet`.
    W ASP.NET Core API zwykle zwraca się `Ok(data)` lub obiekt, a serializację robi `System.Text.Json`.

- id: 391
  text: Podaj przykład filtra autoryzacji w aplikacji ASP.NET MVC.
  answer: |
    Najpopularniejszy jest `[Authorize]`, np. `[Authorize(Roles = "Admin")]` na kontrolerze.
    Przeciwieństwem jest `[AllowAnonymous]`.
    Inne przykłady to `[RequireHttps]` i `[ValidateAntiForgeryToken]` oraz własne filtry implementujące `IAuthorizationFilter`.

- id: 392
  text: Czym są atrybuty walidacji Data Annotations w MVC?
  answer: |
    To atrybuty z `System.ComponentModel.DataAnnotations`: `[Required]`, `[StringLength]`, `[Range]`, `[RegularExpression]`, `[EmailAddress]`, `[Compare]`, `[MaxLength]`.
    Opisują reguły walidacji bezpośrednio na właściwościach modelu.
    Działają po stronie serwera i generują walidację po stronie klienta.
    Własny atrybut tworzy się, dziedzicząc po `ValidationAttribute`.

- id: 393
  text: Czym są filtry wyjątków w MVC?
  answer: |
    Filtry wyjątków (`IExceptionFilter`) obsługują nieobsłużone wyjątki rzucone w akcjach i innych filtrach.
    Wbudowany przykład w klasycznym MVC to `[HandleError]`.
    Pozwalają centralnie logować błędy i zwracać przyjazny widok lub odpowiedź.
    Nie łapią wyjątków spoza pipeline'u MVC - do tego służy middleware.

- id: 394
  text: Które podejście lepiej wspiera TDD - ASP.NET MVC czy Web Forms?
  answer: |
    ASP.NET MVC.
    Kontrolery to zwykłe klasy, które można testować jednostkowo bez serwera i z mockami zależności.
    Web Forms są silnie związane z cyklem życia strony i `HttpContext`, przez co testowanie jest bardzo trudne.

- id: 395
  text: Do czego służy `Response.Output.Write()`?
  answer: |
    Zapisuje sformatowany tekst do strumienia odpowiedzi HTTP, np. `Response.Output.Write("Suma: {0}", total)`.
    W przeciwieństwie do `Response.Write` wspiera formatowanie jak `string.Format`.
    Używane w klasycznym ASP.NET Web Forms.

- id: 396
  text: W którym zdarzeniu cyklu strony dostępny jest `ViewState`?
  answer: |
    `ViewState` jest ładowany po zdarzeniu Init (w fazie `LoadViewState`), więc jest dostępny od `PreLoad` i Load.
    Najczęściej korzysta się z niego w `Page_Load`.
    Zapisywany jest w fazie `SaveViewState`, po `PreRender`.

- id: 397
  text: Po jakiej klasie bazowej dziedziczą wszystkie formularze Web Forms?
  answer: |
    Po klasie `System.Web.UI.Page`.
    Page z kolei dziedziczy po `TemplateControl` i Control.

- id: 398
  text: Którego walidatora użyć, żeby sprawdzić, czy wartości w dwóch kontrolkach są takie same?
  answer: |
    `CompareValidator` - z właściwościami `ControlToValidate` i `ControlToCompare`.
    Typowy przykład to potwierdzenie hasła lub e-maila.

- id: 399
  text: Czym jest `ViewState`?
  answer: |
    `ViewState` to mechanizm Web Forms zachowujący stan kontrolek strony między postbackami.
    Jest serializowany i przechowywany w ukrytym polu `__VIEWSTATE` na stronie.
    Pozwala stronie "pamiętać" wartości mimo bezstanowości HTTP.
    Kosztem jest większy rozmiar strony - można go wyłączyć dla kontrolek (`EnableViewState = false`).

- id: 400
  text: Jak długo istnieją elementy w `ViewState`?
  answer: |
    Tylko w obrębie danej strony - przez kolejne postbacki tej samej strony.
    Po przejściu na inną stronę `ViewState` jest tracony.
    Nie ma czasu wygaśnięcia, bo jest przechowywany po stronie klienta.

- id: 401
  text: Jakie są walidatory w ASP.NET Web Forms?
  answer: |
    `RequiredFieldValidator` - pole wymagane.
    `CompareValidator` - porównanie z inną kontrolką lub wartością; `RangeValidator` - zakres wartości.
    `RegularExpressionValidator` - wzorzec; `CustomValidator` - własna logika.
    `ValidationSummary` - zbiorcze wyświetlanie błędów.

- id: 402
  text: Jak dodać obsługę zdarzenia (`event` handler)?
  answer: |
    W znacznikach kontrolki przez atrybut, np. `<asp:Button OnClick="btnSave_Click" runat="server" />`.
    W kodzie przez subskrypcję: `btnSave.Click += btnSave_Click`;
    Handler ma sygnaturę `void` (`object` sender, `EventArgs` e).

- id: 403
  text: Jakiego cache'owania użyć, by zapamiętać fragment strony zamiast całej?
  answer: |
    Fragment caching (partial page caching).
    Umieszcza się fragment w kontrolce użytkownika (`.ascx`) z dyrektywą `OutputCache`.
    Alternatywnie post-cache substitution pozwala cache'ować stronę z wyjątkiem dynamicznego fragmentu.

- id: 404
  text: Czy aplikacja webowa może działać bez pliku `web.config`?
  answer: |
    Tak. W klasycznym ASP.NET brak `web.config` oznacza użycie ustawień domyślnych z `machine.config` i głównego `web.config`.
    W ASP.NET Core `web.config` w ogóle nie jest wymagany - potrzebny jest tylko przy hostowaniu w IIS (generowany przy publikacji).

- id: 405
  text: Czy w folderze `App_Code` można umieścić pliki w różnych językach?
  answer: |
    Domyślnie nie - wszystkie pliki w `App_Code` są kompilowane do jednego assembly, więc muszą być w jednym języku.
    Można to obejść, tworząc podfoldery dla każdego języka i rejestrując je w `web.config` (`codeSubDirectories`).

- id: 406
  text: Czym jest protected configuration?
  answer: |
    To mechanizm szyfrowania wrażliwych sekcji `web.config`, np. `connectionStrings` czy `appSettings`.
    Szyfruje się je narzędziem `aspnet_regiis` z providerem DPAPI lub RSA.
    ASP.NET odszyfrowuje je automatycznie w czasie działania.
    W nowoczesnych aplikacjach sekrety trzyma się w Key Vault lub zmiennych środowiskowych.

- id: 407
  text: Napisz kod wysyłający e-mail z aplikacji ASP.NET.
  answer: |
    Klasycznie używa się `SmtpClient` i `MailMessage` z `System.Net.Mail`.
    Microsoft oznacza `SmtpClient` jako niezalecany dla nowych projektów - polecana jest biblioteka MailKit lub usługa (SendGrid, Azure Communication Services).
    ```csharp
    using var client = new SmtpClient("smtp.example.com", 587)
    {
        Credentials = new NetworkCredential("user", "password"),
        EnableSsl = true
    };
    var message = new MailMessage("from@example.com", "to@example.com", "Temat", "Treść wiadomości");
    await client.SendMailAsync(message);
    ```

- id: 408
  text: Jak zapobiec cache'owaniu strony ASPX przez przeglądarkę?
  answer: |
    Ustawić nagłówki odpowiedzi: `Response.Cache.SetCacheability(HttpCacheability.NoCache)` i `Response.Cache.SetNoStore()`.
    Można też ustawić datę wygaśnięcia w przeszłości: `Response.Cache.SetExpires(DateTime.UtcNow.AddMinutes(-1))`.
    Skutkuje to nagłówkami Cache-Control: no-cache, no-store.

- id: 409
  text: Jaka jest dobra praktyka implementacji walidacji na stronie ASPX?
  answer: |
    Łączyć walidację po stronie klienta (szybki feedback) z obowiązkową walidacją po stronie serwera.
    Używać kontrolek walidacji i grup walidacji (`ValidationGroup`) dla różnych sekcji formularza.
    Przed przetwarzaniem danych zawsze sprawdzać `Page.IsValid`.

- id: 410
  text: Jakie handlery zdarzeń można umieścić w pliku `Global.asax`?
  answer: |
    `Application_Start` i `Application_End` - start i koniec aplikacji.
    `Session_Start` i `Session_End` - start i koniec sesji.
    `Application_BeginRequest`, `Application_EndRequest` i `Application_AuthenticateRequest` - etapy żądania.
    `Application_Error` - nieobsłużone wyjątki.

- id: 411
  text: Jakiego protokołu używa się do wywołania usługi sieciowej (web service)?
  answer: |
    Klasyczne usługi ASMX i WCF używają SOAP przesyłanego zwykle po HTTP.
    Usługi REST używają bezpośrednio HTTP z JSON lub XML.

- id: 412
  text: Czym jest bezpieczeństwo oparte na rolach?
  answer: |
    To kontrola dostępu na podstawie ról przypisanych użytkownikowi, np. Admin, Editor, User.
    Uprawnienia przypisuje się rolom, a nie pojedynczym użytkownikom.
    W ASP.NET realizuje się to przez `[Authorize(Roles = "Admin")]` lub `User.IsInRole("Admin")`.
    W ASP.NET Core bardziej elastyczne są polityki i claims.

- id: 413
  text: Jak zastosować motywy (themes) w aplikacji ASP.NET?
  answer: |
    Tworzy się folder `App_Themes` z podfolderem motywu, zawierającym pliki `.skin` i `.css`.
    Motyw ustawia się w dyrektywie strony (`Theme="Dark"`), w `web.config` (pages theme) lub programowo w `Page_PreInit`.
    Pliki skin definiują domyślny wygląd kontrolek serwerowych.

- id: 414
  text: Czym jest `RedirectPermanent` w ASP.NET?
  answer: |
    `Response.RedirectPermanent` wykonuje przekierowanie z kodem 301 Moved Permanently.
    Informuje przeglądarki i wyszukiwarki, że zasób przeniesiono na stałe, więc SEO przechodzi na nowy adres.
    Zwykły `Response.Redirect` używa kodu 302 (tymczasowe przekierowanie).

- id: 415
  text: Jak działało uwierzytelnianie Passport?
  answer: |
    Passport to dawna usługa Microsoftu do jednokrotnego logowania (SSO) na wielu stronach.
    Użytkownik był przekierowywany na serwer Passport, logował się, a strona dostawała zaszyfrowany ticket w ciasteczku.
    Konfigurowało się je przez `<authentication mode="Passport">`.
    Usługa jest wycofana - jej następcą jest konto Microsoft i OpenID Connect.

- id: 416
  text: Jakie były zalety uwierzytelniania Passport?
  answer: |
    Jedno logowanie do wielu witryn (SSO).
    Strona nie musiała przechowywać haseł użytkowników ani zarządzać kontami.
    Centralne zarządzanie profilem użytkownika i wspólne dane.

- id: 417
  text: Jakie są kontrolki bezpieczeństwa w ASP.NET?
  answer: |
    Login - formularz logowania; `LoginView` - różna treść dla zalogowanych i anonimowych.
    `LoginStatus` - link zaloguj/wyloguj; `LoginName` - nazwa zalogowanego użytkownika.
    `PasswordRecovery` - odzyskiwanie hasła; `ChangePassword` - zmiana hasła; `CreateUserWizard` - rejestracja.

- id: 418
  text: Jak zarejestrować JavaScript dla kontrolek serwerowych?
  answer: |
    Przez `ClientScriptManager`: `Page.ClientScript.RegisterClientScriptBlock` lub `RegisterStartupScript`.
    Plik zewnętrzny rejestruje się przez `RegisterClientScriptInclude`.
    Przy `UpdatePanel` używa się `ScriptManager.RegisterStartupScript`.
    Można też dodać atrybut, np. `btn.Attributes.Add("onclick", "return confirm('Na pewno?');")`.

- id: 419
  text: Czym różni się silne typowanie od słabego?
  answer: |
    Przy silnym typowaniu typy są ściśle przestrzegane - niejawne, niebezpieczne konwersje są zabronione, błędy typów wychodzą wcześnie.
    Przy słabym typowaniu język sam niejawnie konwertuje typy, np. `"5" + 1` w JavaScript.
    C# jest językiem silnie i statycznie typowanym (wyjątkiem jest `dynamic`).
    Silne typowanie daje bezpieczeństwo i lepsze narzędzia, słabe - elastyczność kosztem błędów w runtime.

- id: 420
  text: Wymień wszystkie szablony kontrolki Repeater.
  answer: |
    `ItemTemplate` - szablon każdego elementu (wymagany).
    `AlternatingItemTemplate` - co drugi element; `SeparatorTemplate` - separator między elementami.
    `HeaderTemplate` i `FooterTemplate` - nagłówek i stopka.

- id: 421
  text: Wymień główne wbudowane obiekty ASP.NET.
  answer: |
    Request - dane żądania; Response - odpowiedź.
    Session - stan sesji użytkownika; Application - stan wspólny dla aplikacji.
    Server - metody pomocnicze (`MapPath`, Transfer, `HtmlEncode`); Cookies, Cache, Context i User.

- id: 422
  text: Czym jest sekcja `appSettings` w pliku `web.config`?
  answer: |
    `appSettings` przechowuje własne ustawienia aplikacji jako pary klucz-wartość.
    Przykład: `<add key="PageSize" value="20" />`.
    Odczytuje się je przez `ConfigurationManager.AppSettings["PageSize"]`.
    Wartości są stringami, więc trzeba je konwertować.

- id: 423
  text: Które przestrzenie nazw są potrzebne do utworzenia aplikacji z lokalizacją?
  answer: |
    `System.Globalization` - `CultureInfo` i formatowanie zależne od kultury.
    `System.Resources` - `ResourceManager` do pobierania zlokalizowanych zasobów.
    `System.Threading` - ustawianie kultury wątku (`Thread.CurrentThread.CurrentCulture`); w Core także `Microsoft.Extensions.Localization`.

- id: 424
  text: Jakie są rodzaje ciasteczek w ASP.NET?
  answer: |
    Ciasteczka sesyjne (nietrwałe) - żyją w pamięci przeglądarki i znikają po jej zamknięciu.
    Ciasteczka trwałe - mają datę wygaśnięcia (Expires) i są zapisywane na dysku.
    Dodatkowo ważne atrybuty: `HttpOnly`, Secure, `SameSite`.

- id: 425
  text: Jakie rozszerzenie ma plik usługi sieciowej?
  answer: |
    Klasyczne usługi ASP.NET Web Service mają rozszerzenie `.asmx`.
    Usługi WCF mają rozszerzenie `.svc`.

- id: 426
  text: Czy aplikacja ASP.NET może mieć wiele plików `web.config`?
  answer: |
    Tak. Każdy podfolder może mieć własny `web.config`, który nadpisuje lub rozszerza ustawienia z folderu nadrzędnego.
    Stosuje się to np. do ustawienia innych reguł autoryzacji dla folderu Admin.
    Niektórych sekcji (np. `sessionState`) nie można nadpisywać na niższych poziomach.

- id: 427
  text: Czym różni się `web.config` od `machine.config`?
  answer: |
    `machine.config` zawiera ustawienia globalne dla wszystkich aplikacji .NET na danym serwerze.
    `web.config` zawiera ustawienia konkretnej aplikacji (lub folderu) i nadpisuje ustawienia z `machine.config`.
    Na maszynie jest jeden `machine.config` na wersję .NET, a `web.config` może być wiele.

- id: 428
  text: Czym jest cross-page posting?
  answer: |
    To wysłanie formularza ze strony A na inną stronę B, zamiast postbacku na tę samą stronę.
    Ustawia się to właściwością `PostBackUrl` przycisku.
    Na stronie B dostęp do strony źródłowej daje `Page.PreviousPage`, a jej kontrolki można odczytać przez `FindControl`.

- id: 429
  text: Czym jest pula obiektów (`object` pooling) w kontekście aplikacji serwerowych?
  answer: |
    Object pooling to utrzymywanie puli gotowych, wielokrotnie używanych obiektów zamiast tworzenia nowych przy każdym żądaniu.
    Klient pobiera obiekt z puli, używa go i oddaje.
    Oszczędza koszt tworzenia drogich obiektów i redukuje presję na GC.
    Dawniej realizowały to COM+ i Enterprise Services, dziś `ObjectPool<T>` i `ArrayPool<T>`.

- id: 430
  text: Czym jest connection pooling?
  answer: |
    Connection pooling to utrzymywanie puli otwartych połączeń z bazą, wielokrotnie używanych przez aplikację.
    Zamknięcie połączenia (Close/Dispose) zwraca je do puli zamiast fizycznie zamykać.
    Pule są tworzone osobno dla każdego unikalnego connection stringa.
    Rozmiar konfiguruje się parametrami Min Pool Size i Max Pool Size; niezamykanie połączeń prowadzi do wyczerpania puli.

- id: 431
  text: Czym różni się `DataReader` od `DataSet`?
  answer: |
    `DataReader` to szybki, jednokierunkowy strumień tylko do odczytu, wymagający otwartego połączenia (architektura połączona).
    `DataSet` to rozłączona kopia danych w pamięci, może zawierać wiele tabel i relacje oraz pozwala na edycję.
    `DataReader` jest lżejszy i szybszy, `DataSet` bardziej elastyczny, ale cięższy.

- id: 432
  text: Jakie są komponenty dostawcy danych (data provider) ADO.NET?
  answer: |
    Connection - nawiązuje połączenie z bazą.
    Command - wykonuje polecenia SQL i procedury.
    `DataReader` - odczytuje wyniki strumieniowo.
    `DataAdapter` - wypełnia `DataSet` i zapisuje zmiany do bazy; do tego Parameter i Transaction.

- id: 433
  text: Czy można załadować wiele tabel do jednego `DataSet`?
  answer: |
    Tak. `DataSet` zawiera kolekcję Tables, więc może przechowywać wiele `DataTable`.
    Można je wypełnić kilkoma wywołaniami `DataAdapter.Fill` lub jednym zapytaniem zwracającym wiele zestawów wyników.
    Między tabelami można definiować relacje (`DataRelation`).

- id: 434
  text: Jakie są warstwy ADO.NET?
  answer: |
    Warstwa danych - fizyczne źródło danych, np. SQL Server.
    Warstwa dostępu do danych - data providerzy (Connection, Command, `DataReader`, `DataAdapter`).
    Warstwa prezentacji `/` obiektów rozłączonych - `DataSet` i `DataTable` używane przez aplikację.

- id: 435
  text: Jakie klasy są dostępne w przestrzeni nazw `System.Data`?
  answer: |
    `DataSet`, `DataTable`, `DataRow`, `DataColumn`, `DataView`, `DataRelation`.
    Constraint, `ForeignKeyConstraint`, `UniqueConstraint`.
    Interfejsy bazowe jak `IDbConnection`, `IDbCommand`, `IDataReader`.
    Konkretne implementacje dostawców są w osobnych przestrzeniach, np. `Microsoft.Data.SqlClient`.

- id: 436
  text: Jacy są dostawcy danych w ADO.NET?
  answer: |
    `SqlClient` (`Microsoft.Data.SqlClient`) - SQL Server.
    `OleDb` - źródła OLE DB, np. Access; Odbc - źródła ODBC.
    `OracleClient` (dziś `Oracle.ManagedDataAccess`), Npgsql dla PostgreSQL, MySqlConnector, `Microsoft.Data.Sqlite`.

- id: 437
  text: Czym różni się `ExecuteScalar` od `ExecuteNonQuery`?
  answer: |
    `ExecuteScalar` zwraca pojedynczą wartość - pierwszą kolumnę pierwszego wiersza wyniku, np. `COUNT(*)` lub nowe Id.
    `ExecuteNonQuery` nie zwraca danych, tylko liczbę zmienionych wierszy - służy do `INSERT`, `UPDATE`, `DELETE` i DDL.

- id: 438
  text: Która metoda klasy Command wykonuje zapytanie zwracające pojedynczą wartość?
  answer: |
    `ExecuteScalar` (lub asynchroniczna `ExecuteScalarAsync`).
    Zwraca `object`, więc wynik trzeba rzutować; gdy brak wyniku, zwraca `null`.

- id: 439
  text: Czym jest denormalizacja?
  answer: |
    Denormalizacja to celowe wprowadzenie redundancji do znormalizowanej bazy, żeby przyspieszyć odczyty.
    Przykłady: przechowywanie nazwy klienta w tabeli zamówień, kolumny z wyliczonymi sumami.
    Zmniejsza liczbę JOIN-ów kosztem większego rozmiaru i trudniejszego utrzymania spójności.
    Stosuje się ją w raportowaniu i hurtowniach danych.

- id: 440
  text: Jakie są postacie normalne?
  answer: |
    1NF - wartości atomowe, brak powtarzających się grup.
    2NF - 1NF i każdy atrybut niekluczowy zależy od całego klucza głównego.
    3NF - 2NF i brak zależności przechodnich między atrybutami niekluczowymi.
    BCNF - każdy determinant jest kluczem kandydującym; istnieją też 4NF i 5NF, rzadko stosowane w praktyce.

- id: 441
  text: Czym jest relacja i jakie są jej rodzaje?
  answer: |
    Relacja to powiązanie między tabelami realizowane przez klucze główne i obce.
    Jeden do jednego (1:1) - np. User i `UserProfile`.
    Jeden do wielu (1:N) - np. Customer i Orders; najczęstsza.
    Wiele do wielu (N:M) - np. Students i Courses, realizowana przez tabelę pośrednią.

- id: 442
  text: Jakie są rodzaje podzapytań?
  answer: |
    Skalarne - zwracają jedną wartość.
    Wielowierszowe - zwracają listę wartości (używane z `IN`, `ANY`, `ALL`).
    Tabelowe - zwracają zestaw wierszy i kolumn, używane w `FROM`.
    Skorelowane i nieskorelowane - zależnie od tego, czy odwołują się do zapytania zewnętrznego.

- id: 443
  text: Czym są zmienne lokalne i globalne w SQL Server?
  answer: |
    Zmienne lokalne deklaruje się przez `DECLARE @nazwa` typ i istnieją tylko w danym batchu lub procedurze.
    Zmienne "globalne" zaczynają się od `@@` i są to wbudowane funkcje systemowe, np. `@@ROWCOUNT`, `@@ERROR`, `@@IDENTITY`, `@@VERSION`.
    Nie można tworzyć własnych zmiennych globalnych.

- id: 444
  text: Czym jest integralność danych?
  answer: |
    Integralność danych to ich poprawność, spójność i wiarygodność przez cały cykl życia.
    Integralność encji - unikalne klucze główne; integralność referencyjna - poprawne klucze obce.
    Integralność domenowa - poprawne typy i zakresy wartości (`CHECK`, `NOT NULL`).
    Zapewniają ją constrainty, transakcje i triggery.

- id: 445
  text: Czym jest hurtownia danych (data warehouse)?
  answer: |
    To centralne repozytorium zintegrowanych danych historycznych z wielu systemów, służące analizie i raportowaniu.
    Dane są ładowane procesami ETL/ELT i zwykle zdenormalizowane (schemat gwiazdy lub płatka śniegu).
    Jest zoptymalizowana pod złożone zapytania analityczne (OLAP), a nie pod transakcje.

- id: 446
  text: Czym jest `CROSS JOIN`?
  answer: |
    `CROSS JOIN` zwraca iloczyn kartezjański - każdą kombinację wierszy z obu tabel.
    Dla tabel o 10 i 5 wierszach wynik ma 50 wierszy.
    Nie ma warunku `ON`; stosuje się go np. do generowania kombinacji (rozmiary x kolory).

- id: 447
  text: Czym jest collation?
  answer: |
    Collation to zestaw reguł określających sortowanie i porównywanie tekstu w bazie.
    Definiuje wrażliwość na wielkość liter, akcenty, typ kana i szerokość znaków.
    Przykład: `Polish_CI_AS` - polski, bez rozróżniania wielkości liter, z rozróżnianiem akcentów.
    Można ją ustawić na poziomie serwera, bazy, kolumny lub zapytania (COLLATE).

- id: 448
  text: Jakie są rodzaje wrażliwości collation?
  answer: |
    Wielkość liter (Case) - CS lub CI.
    Akcenty (Accent) - `AS` lub AI.
    Typ kana (Kana) - KS, dotyczy japońskich znaków.
    Szerokość znaków (Width) - WS, rozróżnia znaki jedno- i dwubajtowe.

- id: 449
  text: Jakie są zalety i wady procedur składowanych?
  answer: |
    Zalety: ponowne użycie planów wykonania, mniej danych przesyłanych przez sieć, bezpieczeństwo (uprawnienia do procedur zamiast tabel).
    Pomagają też chronić przed SQL Injection i centralizują logikę dostępu do danych.
    Wady: logika biznesowa rozproszona między aplikację a bazę, trudniejsze wersjonowanie i testowanie.
    Wiążą też aplikację z konkretnym silnikiem bazy.

- id: 450
  text: Czym jest OLTP?
  answer: |
    OLTP (Online Transaction Processing) to systemy obsługujące dużą liczbę krótkich transakcji w czasie rzeczywistym.
    Przykłady: sklep internetowy, bankowość, system fakturowania.
    Charakteryzują się znormalizowanym schematem, wieloma zapisami i wymaganiami ACID.
    Przeciwieństwem jest OLAP - analityka na dużych zbiorach danych.

- id: 451
  text: Czym jest klauzula w SQL?
  answer: |
    Klauzula to składowa polecenia SQL określająca jego część, np. warunek lub sposób sortowania.
    Przykłady: `SELECT`, `FROM`, `WHERE`, `GROUP BY`, `HAVING`, `ORDER BY`, `JOIN`, `TOP`.
    Klauzule razem tworzą kompletne zapytanie.

- id: 452
  text: Czym jest rekurencyjna procedura składowana?
  answer: |
    To procedura, która wywołuje samą siebie.
    W SQL Server maksymalny poziom zagnieżdżenia to 32.
    Stosuje się ją np. do przetwarzania hierarchii, choć zwykle wydajniejsze i czytelniejsze jest rekurencyjne CTE.

- id: 453
  text: Czym są polecenia `UNION`, MINUS i `INTERSECT`?
  answer: |
    `UNION` łączy wyniki dwóch zapytań i usuwa duplikaty; `UNION ALL` zachowuje duplikaty i jest szybszy.
    MINUS (Oracle) lub `EXCEPT` (SQL Server) zwraca wiersze z pierwszego zapytania, których nie ma w drugim.
    `INTERSECT` zwraca tylko wiersze wspólne dla obu zapytań.
    Zapytania muszą mieć tę samą liczbę kolumn o zgodnych typach.

- id: 454
  text: Czym jest alias w SQL?
  answer: |
    Alias to tymczasowa nazwa nadana tabeli lub kolumnie w zapytaniu, za pomocą `AS`.
    Przykład: `SELECT c.Name AS CustomerName FROM Customers c`.
    Skraca zapytania i jest niezbędny przy self-joinach oraz kolumnach wyliczanych.

- id: 455
  text: Jak utworzyć pustą tabelę na podstawie istniejącej?
  answer: |
    W SQL Server: `SELECT * INTO NewTable FROM OldTable WHERE 1 = 0`;
    Kopiuje to strukturę kolumn, ale bez danych, indeksów i constraintów (poza `IDENTITY`).
    Pełną strukturę najlepiej skopiować przez wygenerowanie skryptu `CREATE TABLE`.

- id: 456
  text: Jak pobrać wspólne rekordy z dwóch tabel?
  answer: |
    Przez `INTERSECT`: `SELECT Id FROM TableA INTERSECT SELECT Id FROM TableB`;
    Albo przez `INNER JOIN` po kluczu.
    Można też użyć `EXISTS` lub `IN` z podzapytaniem.

- id: 457
  text: Jak pobrać co drugi rekord z tabeli?
  answer: |
    Przez `ROW_NUMBER` i modulo:
    `SELECT * FROM (SELECT *, ROW_NUMBER() OVER (ORDER BY Id) AS` rn `FROM Employees) t WHERE rn % 2 = 0`;
    Dla nieparzystych wierszy warunek to `rn % 2 = 1`.

- id: 458
  text: Jak wybrać unikalne rekordy z tabeli?
  answer: |
    Przez `DISTINCT`: `SELECT DISTINCT City FROM Customers`;
    Albo przez `GROUP BY` po wybranych kolumnach.
    Do wybrania jednego wiersza z każdej grupy duplikatów używa się `ROW_NUMBER` z `PARTITION BY`.

- id: 459
  text: Jakim poleceniem pobrać pierwsze 5 znaków stringa?
  answer: |
    W SQL Server: `SELECT LEFT(Name, 5) FROM Employees`; lub `SUBSTRING(Name, 1, 5)`.
    W Oracle i innych bazach odpowiednikiem jest SUBSTR.

- id: 460
  text: Jakie są rodzaje funkcji definiowanych przez użytkownika?
  answer: |
    Funkcje skalarne - zwracają pojedynczą wartość.
    Funkcje tabelaryczne inline (inline TVF) - zwracają tabelę na podstawie jednego `SELECT`; są najwydajniejsze.
    Funkcje tabelaryczne wielowyrażeniowe (multi-statement TVF) - budują zmienną tabelaryczną w wielu instrukcjach.

- id: 461
  text: Czym są funkcje agregujące i skalarne?
  answer: |
    Funkcje agregujące operują na zbiorze wierszy i zwracają jedną wartość: `COUNT`, `SUM`, `AVG`, `MIN`, `MAX`.
    Zwykle używa się ich z `GROUP BY`.
    Funkcje skalarne operują na pojedynczej wartości i zwracają jedną wartość: UPPER, LEN, ROUND, GETDATE, `CONVERT`.

- id: 462
  text: Którego operatora używa się do dopasowywania wzorców w zapytaniu?
  answer: |
    Operatora `LIKE` z symbolami wieloznacznymi: `%` (dowolny ciąg znaków) i `_` (jeden znak).
    Przykład: `WHERE Name LIKE 'Jan%'`.
    Wzorzec z `%` na początku uniemożliwia użycie indeksu.

- id: 463
  text: Czym jest wzorzec Prototype?
  answer: |
    Prototype tworzy nowe obiekty przez klonowanie istniejącego obiektu-prototypu zamiast tworzenia od zera.
    Przydaje się, gdy tworzenie obiektu jest kosztowne lub skomplikowane.
    W C# implementuje się go przez `ICloneable`, metodę Clone lub `MemberwiseClone` (płytka kopia).
    Rekordy z wyrażeniem `with` to wbudowana forma prototypu.

- id: 464
  text: Czym jest wzorzec Builder?
  answer: |
    Builder oddziela konstrukcję złożonego obiektu od jego reprezentacji i pozwala budować go krok po kroku.
    Zwykle ma płynny interfejs: `new ReportBuilder().WithTitle("X").AddSection(...).Build()`.
    Rozwiązuje problem konstruktorów z wieloma parametrami.
    Przykłady w .NET: `StringBuilder`, `WebApplicationBuilder`, `UriBuilder`.

- id: 465
  text: Czym jest wzorzec Adapter?
  answer: |
    Adapter dopasowuje interfejs istniejącej klasy do interfejsu oczekiwanego przez klienta.
    Działa jak przejściówka do gniazdka - opakowuje niekompatybilną klasę.
    Przykład: adapter opakowujący zewnętrzne SDK płatności w Twój interfejs `IPaymentGateway`.
    Pozwala integrować kod zewnętrzny bez zmieniania go.

- id: 466
  text: Czym jest wzorzec Bridge?
  answer: |
    Bridge oddziela abstrakcję od implementacji, żeby mogły się zmieniać niezależnie.
    Zamiast mnożyć podklasy (np. `RedCircle`, `BlueSquare`), abstrakcja przechowuje referencję do implementacji.
    Przykład: Shape z referencją do `IRenderer` (`VectorRenderer`, `RasterRenderer`).
    Zapobiega eksplozji liczby klas przy dwóch wymiarach zmienności.

- id: 467
  text: Czym jest wzorzec Composite?
  answer: |
    Composite pozwala traktować pojedyncze obiekty i ich grupy w ten sam sposób przez wspólny interfejs.
    Tworzy strukturę drzewiastą: liście i kontenery zawierające inne elementy.
    Przykłady: system plików (pliki i foldery), menu z podmenu, drzewo komponentów UI.

- id: 468
  text: Czym jest wzorzec Decorator?
  answer: |
    Decorator dynamicznie dodaje obiektowi nowe zachowanie przez opakowanie go w inny obiekt z tym samym interfejsem.
    Jest alternatywą dla dziedziczenia przy rozszerzaniu funkcjonalności.
    Przykład: `CachedRepository` opakowujący Repository, logujący dekorator serwisu.
    W .NET przykładem są strumienie: `BufferedStream`, `GZipStream` opakowujące Stream.

- id: 469
  text: Czym jest wzorzec Facade?
  answer: |
    Facade dostarcza prosty, ujednolicony interfejs do złożonego podsystemu.
    Klient wywołuje jedną metodę fasady zamiast koordynować wiele klas.
    Przykład: `OrderFacade.PlaceOrder()` koordynujący magazyn, płatność i wysyłkę.
    Zmniejsza powiązania klienta z wnętrzem podsystemu.

- id: 470
  text: Czym jest wzorzec Flyweight?
  answer: |
    Flyweight minimalizuje zużycie pamięci przez współdzielenie wspólnego stanu między wieloma obiektami.
    Oddziela stan wewnętrzny (współdzielony, niezmienny) od zewnętrznego (przekazywanego z zewnątrz).
    Przykład: w edytorze tekstu obiekty glifów są współdzielone, a pozycja przechowywana osobno.
    W .NET podobnie działa internowanie stringów.

- id: 471
  text: Czym jest wzorzec Proxy?
  answer: |
    Proxy to obiekt zastępczy kontrolujący dostęp do innego obiektu, z tym samym interfejsem.
    Rodzaje: wirtualne (leniwe ładowanie), ochronne (kontrola uprawnień), zdalne (dostęp przez sieć), cache.
    Przykład: lazy loading w EF Core korzysta z proxy encji.
    Różni się od dekoratora celem - kontroluje dostęp, a nie dodaje funkcjonalność.

- id: 472
  text: Czy prawdą jest, że ASP.NET Web API zastąpiło WCF?
  answer: |
    Częściowo. Do usług HTTP/REST Web API (dziś ASP.NET Core) jest standardowym wyborem i wyparło WCF.
    WCF obsługiwał jednak też SOAP, TCP, named pipes, transakcje i duplex, czego Web API nie robi.
    Te scenariusze w nowym .NET pokrywają gRPC, a dla migracji istnieje projekt CoreWCF.

- id: 473
  text: Jaki protokół wspiera Web API?
  answer: |
    Web API opiera się na protokole HTTP (i HTTPS).
    Wykorzystuje jego metody, kody statusu i nagłówki.
    ASP.NET Core wspiera HTTP/1.1, HTTP/2 i HTTP/3.

- id: 474
  text: Które wersje .NET wspierają Web API?
  answer: |
    ASP.NET Web API pojawiło się w .NET Framework 4.0 (jako część MVC 4), a Web API 2 w .NET Framework 4.5.
    W .NET Core i .NET 5+ Web API jest częścią ASP.NET Core.

- id: 475
  text: Jakiej biblioteki open source używało Web API do serializacji JSON?
  answer: |
    Klasyczne ASP.NET Web API używało Json.NET (`Newtonsoft.Json`).
    ASP.NET Core od wersji 3.0 domyślnie używa `System.Text.Json`, ale Newtonsoft można przywrócić przez `AddNewtonsoftJson`.

- id: 476
  text: Jaki kod statusu Web API domyślnie zwraca dla nieobsłużonych wyjątków?
  answer: |
    500 Internal Server Error.
    W ASP.NET Core można to zmienić przez middleware obsługi wyjątków i zwracać `ProblemDetails` z odpowiednim kodem.

- id: 477
  text: Czym jest SOAP?
  answer: |
    SOAP (Simple Object Access Protocol) to protokół wymiany komunikatów XML między usługami.
    Komunikat składa się z Envelope, Header i Body.
    Opisuje się go kontraktem WSDL, a wspiera standardy WS-\* (bezpieczeństwo, transakcje).
    Jest bardziej formalny i cięższy niż REST.

- id: 478
  text: Jakie są korzyści z używania REST w Web API?
  answer: |
    Prostota - wykorzystuje standardowe HTTP bez dodatkowych protokołów.
    Lekkość (JSON), łatwość konsumpcji z przeglądarki i aplikacji mobilnych.
    Bezstanowość ułatwia skalowanie, a odpowiedzi można cache'ować.
    Jasna struktura zasobów i niezależność klienta od serwera.

- id: 479
  text: Jak używać Web API z ASP.NET Web Forms?
  answer: |
    Dodaje się do projektu Web Forms kontrolery `ApiController` i rejestruje trasy Web API w `Global.asax` (`GlobalConfiguration.Configure`).
    Strony Web Forms mogą wtedy wywoływać API z JavaScriptu (AJAX) lub z kodu przez `HttpClient`.
    Pozwala to stopniowo modernizować starą aplikację.

- id: 480
  text: Jak zwrócić widok z metody Web API?
  answer: |
    Web API nie zwraca widoków - służy do zwracania danych.
    W klasycznym Web API można by zwrócić HTML jako `HttpResponseMessage` z text/html, ale to obejście.
    W ASP.NET Core kontroler dziedziczący po Controller (nie `ControllerBase`) może zwrócić `View()`.

- id: 481
  text: Jak zarejestrować filtr wyjątków globalnie?
  answer: |
    W klasycznym Web API: `GlobalConfiguration.Configuration.Filters.Add(new MyExceptionFilter())`;
    W ASP.NET Core: `builder.Services.AddControllers(o => o.Filters.Add<MyExceptionFilter>())`;
    W Core często zamiast filtra stosuje się middleware lub `IExceptionHandler`.

- id: 482
  text: Jak ograniczyć metody Web API do konkretnych czasowników HTTP?
  answer: |
    Atrybutami `[HttpGet]`, `[HttpPost]`, `[HttpPut]`, `[HttpDelete]`, `[HttpPatch]` na akcjach.
    Można też użyć `[AcceptVerbs("GET", "POST")]`.
    W klasycznym Web API działała też konwencja nazewnicza - metoda zaczynająca się od Get obsługiwała `GET`.

- id: 483
  text: Kto może konsumować Web API?
  answer: |
    Każdy klient obsługujący HTTP: przeglądarki i aplikacje SPA (Angular, React), aplikacje mobilne i desktopowe.
    Inne serwisy backendowe, urządzenia IoT, skrypty i narzędzia (curl, Postman).
    Dzięki temu jedno API może obsługiwać wiele platform.

- id: 484
  text: Czym są usługi sieciowe (web services)?
  answer: |
    Web service to komponent udostępniający funkcjonalność przez sieć w ustandaryzowany sposób.
    Komunikacja odbywa się przez protokoły jak HTTP, z formatami XML (SOAP) lub JSON (REST).
    Pozwalają aplikacjom napisanym w różnych technologiach komunikować się ze sobą.

- id: 485
  text: Jakie są cechy usług sieciowych?
  answer: |
    Interoperacyjność - niezależność od platformy i języka.
    Luźne powiązanie między klientem a usługą.
    Oparcie na otwartych standardach (HTTP, XML, SOAP, WSDL).
    Dostępność przez sieć i możliwość samoopisu (WSDL).

- id: 486
  text: Jakie są komponenty usługi sieciowej?
  answer: |
    SOAP - protokół komunikacji.
    WSDL - opis interfejsu usługi.
    UDDI - rejestr do wyszukiwania usług.
    XML jako format danych i HTTP jako transport.

- id: 487
  text: Jak działa usługa sieciowa?
  answer: |
    Klient pobiera opis usługi (WSDL) i generuje na jego podstawie proxy.
    Wywołanie metody proxy jest serializowane do komunikatu SOAP i wysyłane przez HTTP.
    Serwer deserializuje komunikat, wykonuje metodę i odsyła odpowiedź SOAP, którą proxy zamienia na obiekt.

- id: 488
  text: Jaka jest rola XML w usłudze sieciowej?
  answer: |
    XML jest formatem danych i komunikatów - niezależnym od platformy i języka.
    Na nim oparte są SOAP (komunikaty), WSDL (opis usługi) i XSD (schematy typów).
    Dzięki temu różne systemy mogą się porozumiewać.

- id: 489
  text: Jakie są korzyści z usług sieciowych?
  answer: |
    Interoperacyjność między różnymi platformami i językami.
    Ponowne użycie funkcjonalności przez wiele aplikacji.
    Korzystanie ze standardowych protokołów, które zwykle przechodzą przez firewalle (HTTP).
    Ułatwiają integrację systemów i architekturę zorientowaną na usługi.

- id: 490
  text: Co oznacza interoperacyjność usług sieciowych?
  answer: |
    To zdolność systemów napisanych w różnych technologiach do współpracy.
    Usługa w .NET może być wywołana przez klienta w Javie czy PHP, bo komunikacja opiera się na otwartych standardach (HTTP, XML, JSON).

- id: 491
  text: Co oznacza luźno powiązana architektura usług sieciowych?
  answer: |
    Klient i usługa zależą od siebie tylko przez kontrakt (interfejs), a nie przez implementację.
    Usługę można zmienić lub przenieść bez zmian po stronie klienta, dopóki kontrakt pozostaje ten sam.
    Ułatwia to niezależny rozwój i wdrażanie systemów.

- id: 492
  text: Czym jest HTTP?
  answer: |
    HTTP (Hypertext Transfer Protocol) to bezstanowy protokół warstwy aplikacji do komunikacji klient-serwer w sieci.
    Opiera się na żądaniach (metoda, URL, nagłówki, body) i odpowiedziach (kod statusu, nagłówki, body).
    HTTPS to HTTP szyfrowany przez TLS.
    Nowsze wersje to HTTP/2 (multipleksacja) i HTTP/3 (QUIC).

- id: 493
  text: Czym jest WSDL?
  answer: |
    WSDL (Web Services Description Language) to oparty na XML język opisu usługi sieciowej.
    Opisuje dostępne operacje, ich parametry i typy, format komunikatów oraz adres usługi.
    Na jego podstawie narzędzia generują proxy klienta.

- id: 494
  text: Czym jest UDDI?
  answer: |
    UDDI (Universal Description, Discovery and Integration) to rejestr do publikowania i wyszukiwania usług sieciowych.
    Miał działać jak książka telefoniczna dla usług.
    W praktyce się nie przyjął i jest dziś historyczny.

- id: 495
  text: Czym jest WCF?
  answer: |
    WCF (Windows Communication Foundation) to framework .NET Framework do budowy usług zorientowanych na usługi.
    Obsługuje wiele protokołów (HTTP, TCP, named pipes, MSMQ) i standardów WS-\*.
    Konfiguruje się go przez ABC: Address, Binding, Contract.
    W .NET Core serwer WCF nie jest wspierany - jest CoreWCF, a nowe projekty używają gRPC lub Web API.

- id: 496
  text: Jakie są główne komponenty WCF?
  answer: |
    Kontrakty - `ServiceContract`, `OperationContract`, `DataContract`.
    Endpointy - złożone z adresu, bindingu i kontraktu (ABC).
    Host usługi (IIS, usługa Windows, aplikacja) i klasa implementująca usługę.
    Klient z proxy wygenerowanym na podstawie metadanych.

- id: 497
  text: Jak działa WCF?
  answer: |
    Definiuje się kontrakt usługi (interfejs z `[ServiceContract]`) i jego implementację.
    Usługa jest hostowana i udostępnia endpointy z określonym adresem i bindingiem.
    Klient wywołuje metody proxy, a WCF serializuje komunikaty, przesyła je wybranym kanałem i deserializuje po drugiej stronie.

- id: 498
  text: Czym różnią się usługi ASMX od WCF?
  answer: |
    ASMX obsługuje tylko SOAP przez HTTP i może być hostowany tylko w IIS.
    WCF obsługuje wiele protokołów (HTTP, TCP, named pipes, MSMQ) i wiele sposobów hostowania.
    WCF wspiera standardy WS-\* (bezpieczeństwo, transakcje, niezawodność), duplex i jest bardziej konfigurowalny.
    ASMX jest prostszy, ale znacznie bardziej ograniczony.

- id: 499
  text: Jakie schematy transportu wspiera WCF?
  answer: |
    HTTP i HTTPS.
    TCP (`net.tcp`).
    Named pipes (`net.pipe`) - komunikacja na tej samej maszynie.
    MSMQ (`net.msmq`) - komunikacja przez kolejki.

- id: 500
  text: Jakie są sposoby hostowania usługi WCF?
  answer: |
    IIS - z aktywacją na żądanie, głównie dla HTTP.
    WAS (Windows Process Activation Service) - pozwala hostować w IIS także usługi TCP, named pipes i MSMQ.
    Usługa Windows - długo działająca w tle.
    Self-hosting w dowolnej aplikacji (konsola, WinForms) przez `ServiceHost`.

- id: 501
  text: Jaka jest składnia adresu i formaty schematów transportu w WCF?
  answer: |
    Format adresu to `[schemat]://[host]:[port]/[ścieżka]`.
    Przykłady: `http://localhost:8080/Service`, `net.tcp://localhost:8090/Service`.
    `net.pipe://localhost/Service`, `net.msmq://localhost/private/QueueName`.

- id: 502
  text: Czym są kontrakty duplex w WCF?
  answer: |
    Kontrakt duplex pozwala na komunikację dwukierunkową - usługa może wywoływać metody na kliencie.
    Definiuje się go przez `CallbackContract` w `[ServiceContract]`, a klient implementuje interfejs callbacku.
    Wymaga bindingu wspierającego duplex, np. `NetTcpBinding` lub `WSDualHttpBinding`.
    Stosuje się go np. do powiadomień w czasie rzeczywistym.

- id: 503
  text: Jakie są tryby instancji w WCF?
  answer: |
    `PerCall` - nowa instancja usługi dla każdego wywołania; najlepsza skalowalność.
    `PerSession` - jedna instancja na sesję klienta (domyślny, jeśli binding wspiera sesje).
    Single - jedna instancja dla wszystkich klientów (singleton).
    Ustawia się je przez `[ServiceBehavior(InstanceContextMode = ...)]`.

- id: 504
  text: Czym jest SOA i co oznacza ten skrót?
  answer: |
    SOA to Service-Oriented Architecture - architektura zorientowana na usługi.
    System składa się z niezależnych, luźno powiązanych usług komunikujących się przez standardowe protokoły i kontrakty.
    Usługi są wielokrotnego użytku i mogą być rozwijane niezależnie.
    Mikroserwisy są nowocześniejszą, bardziej granularną odmianą tej idei.

- id: 505
  text: Jakie są rodzaje kontraktów danych w WCF?
  answer: |
    Data Contract (`[DataContract]`, `[DataMember]`) - opisuje strukturę przesyłanych danych.
    Message Contract (`[MessageContract]`) - pozwala kontrolować strukturę całego komunikatu SOAP (nagłówki i body).
    Fault Contract (`[FaultContract]`) - opisuje błędy zwracane klientowi.
    Do tego Service Contract i Operation Contract opisujące samą usługę.

- id: 506
  text: Jakie trzy rodzaje menedżerów transakcji wspiera WCF?
  answer: |
    Lightweight Transaction Manager (LTM) - transakcje w jednej domenie aplikacji z jednym zasobem.
    Kernel Transaction Manager (KTM) - transakcje na zasobach systemowych (system plików, rejestr).
    Distributed Transaction Coordinator (DTC) - transakcje rozproszone między wieloma zasobami i maszynami.

- id: 507
  text: Jaka przestrzeń nazw służy do korzystania z usług WCF?
  answer: |
    `System.ServiceModel`.
    Zawiera `m.in`. `ServiceHost`, `ChannelFactory`, `ServiceContractAttribute` i bindingi.
    Kontrakty danych są w `System.Runtime.Serialization`.

- id: 508
  text: Czym jest host w ASP.NET Core?
  answer: |
    Host to obiekt zarządzający zasobami i cyklem życia aplikacji.
    Zawiera kontener DI, konfigurację, logowanie, serwer HTTP i usługi hostowane (`IHostedService`).
    Odpowiada za start i graceful shutdown aplikacji.
    W nowoczesnym ASP.NET Core tworzy go `WebApplication.CreateBuilder`.

- id: 509
  text: Opisz Generic Host i Web Host.
  answer: |
    Web Host (`IWebHostBuilder`) był hostem ASP.NET Core `1.x-2.x`, przeznaczonym tylko dla aplikacji webowych.
    Generic Host (`IHostBuilder`, `Host.CreateDefaultBuilder`) od wersji 3.0 obsługuje każdy rodzaj aplikacji: web, worker service, konsolę.
    Dostarcza wspólne DI, konfigurację, logowanie i zarządzanie cyklem życia.
    Od .NET 6 `WebApplication/WebApplicationBuilder` opiera się na Generic Host.

- id: 510
  text: Opisz serwery w ASP.NET Core.
  answer: |
    Kestrel - domyślny, wieloplatformowy serwer HTTP.
    IIS HTTP Server - serwer in-process dla hostowania w IIS.
    HTTP.sys - serwer tylko dla Windows, oparty na sterowniku jądra, wspiera np. Windows Authentication bez IIS.
    Przed Kestrelem często stawia się reverse proxy: Nginx, IIS lub YARP.

- id: 511
  text: Jak działa konfiguracja w ASP.NET Core?
  answer: |
    Konfiguracja jest budowana z wielu providerów: `appsettings.json`, `appsettings.{Environment}.json`, User Secrets, zmienne środowiskowe, argumenty wiersza poleceń.
    Providery są nakładane warstwowo - późniejsze nadpisują wcześniejsze.
    Wynikiem jest `IConfiguration` z hierarchicznymi kluczami (sekcje rozdzielane dwukropkiem).
    Do silnie typowanych ustawień używa się wzorca Options.

- id: 512
  text: Jak odczytać wartości z pliku `appsettings.json`?
  answer: |
    Przez wstrzyknięte `IConfiguration`: `configuration["Smtp:Host"]` lub `configuration.GetValue<int>("Smtp:Port")`.
    Connection `string`: `configuration.GetConnectionString("Default")`.
    Najlepiej przez wzorzec Options: `builder.Services.Configure<SmtpOptions>(builder.Configuration.GetSection("Smtp"))` i wstrzyknięcie `IOptions<SmtpOptions>`.

- id: 513
  text: Czym jest wzorzec Options w ASP.NET Core?
  answer: |
    Wzorzec Options mapuje sekcje konfiguracji na silnie typowane klasy.
    Rejestruje się go przez `services.Configure<T>` lub `AddOptions<T>().Bind(...).ValidateDataAnnotations().ValidateOnStart()`.
    `IOptions<T>` - wartość stała (singleton), `IOptionsSnapshot<T>` - odświeżana per żądanie, `IOptionsMonitor<T>` - z powiadomieniami o zmianach.
    Daje walidację, testowalność i brak "magicznych stringów".

- id: 514
  text: Jak używać wielu środowisk w ASP.NET Core?
  answer: |
    Środowisko ustawia zmienna `ASPNETCORE_ENVIRONMENT` (lub `DOTNET_ENVIRONMENT`): Development, Staging, Production.
    Ładowany jest odpowiedni plik `appsettings.{Environment}.json`, nadpisujący bazowy.
    W kodzie sprawdza się `app.Environment.IsDevelopment()` i podobne.
    Domyślnie, gdy zmienna nie jest ustawiona, środowisko to Production.

- id: 515
  text: Jak działa sesja i zarządzanie stanem w ASP.NET Core?
  answer: |
    HTTP jest bezstanowy, więc stan przechowuje się: w sesji, ciasteczkach, `TempData`, query stringu, ukrytych polach lub cache.
    Sesję włącza się przez `AddDistributedMemoryCache` (lub Redis), `AddSession` i `UseSession`.
    Identyfikator sesji jest w ciasteczku, a dane na serwerze; `HttpContext.Session.SetString` i `GetString`.
    W aplikacjach skalowanych poziomo sesja wymaga rozproszonego cache, a najlepiej projektować aplikację bezstanowo.

- id: 516
  text: Czy aplikację ASP.NET można uruchomić w kontenerach Docker?
  answer: |
    Tak. ASP.NET Core działa w kontenerach Linux i Windows; Microsoft dostarcza oficjalne obrazy (`mcr.microsoft.com/dotnet/aspnet`, sdk).
    Typowo używa się wieloetapowego Dockerfile: build w obrazie SDK, uruchomienie w lekkim obrazie runtime.
    Od .NET 7 można budować obrazy bez Dockerfile przez `dotnet publish /t:PublishContainer`.
    Klasyczne ASP.NET (.NET Framework) też da się konteneryzować, ale tylko w kontenerach Windows.

- id: 517
  text: Czym jest cache'owanie i response caching w ASP.NET Core?
  answer: |
    Cache'owanie to przechowywanie wyników, by nie liczyć ich ponownie - w pamięci (`IMemoryCache`), rozproszone (`IDistributedCache`) lub `HybridCache`.
    Response caching steruje nagłówkami HTTP Cache-Control, by przeglądarki i proxy cache'owały odpowiedzi - `[ResponseCache]`, `AddResponseCaching`, `UseResponseCaching`.
    Output caching (.NET 7+) cache'uje odpowiedzi po stronie serwera, z kontrolą i unieważnianiem przez tagi.

- id: 518
  text: Czym jest cache w pamięci (in-memory cache)?
  answer: |
    To przechowywanie danych w pamięci procesu aplikacji przez `IMemoryCache` (`AddMemoryCache`).
    Jest najszybszy, ale dane są lokalne dla instancji i giną przy restarcie.
    Wpisy mają czas wygaśnięcia absolutny lub przesuwny oraz limit rozmiaru.
    Przykład: `cache.GetOrCreateAsync(key, entry => { entry.AbsoluteExpirationRelativeToNow = TimeSpan.FromMinutes(5); return LoadAsync(); })`.

- id: 519
  text: Czym jest cache rozproszony?
  answer: |
    To cache przechowywany w zewnętrznym magazynie współdzielonym przez wiele instancji aplikacji: Redis, SQL Server, NCache.
    W ASP.NET Core korzysta się z interfejsu `IDistributedCache`, który przechowuje bajty lub stringi.
    Przetrwa restart aplikacji i zapewnia spójność między serwerami.
    Jest wolniejszy niż cache w pamięci, bo wymaga komunikacji sieciowej i serializacji.

- id: 520
  text: Czym jest XSRF/CSRF? Jak się przed nim chronić w ASP.NET Core?
  answer: |
    CSRF (Cross-Site Request Forgery) to atak, w którym złośliwa strona zmusza przeglądarkę zalogowanego użytkownika do wysłania żądania do innej aplikacji z jego ciasteczkami.
    ASP.NET Core chroni się tokenami antyforgery - tag helper form automatycznie dodaje ukryty token, a `[ValidateAntiForgeryToken]` go sprawdza.
    Razor Pages walidują token automatycznie, a dla SPA token przekazuje się w nagłówku.
    Dodatkową ochronę daje atrybut `SameSite` ciasteczek; API z tokenami Bearer w nagłówku nie są podatne na CSRF.

- id: 521
  text: Jak uzyskać dostęp do `HttpContext` w ASP.NET Core?
  answer: |
    W kontrolerach i Razor Pages przez właściwość `HttpContext`.
    W middleware - jako parametr metody `InvokeAsync`.
    W minimal API - jako parametr handlera.
    W innych serwisach przez `IHttpContextAccessor` (`AddHttpContextAccessor`), ale lepiej przekazywać potrzebne dane jawnie.
