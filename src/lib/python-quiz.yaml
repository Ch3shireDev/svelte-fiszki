      correct: false
    - text: Do cache'owania odpowiedzi HTTP w przeglądarce użytkownika
      correct: false
    - text: Do memoizacji wyników funkcji
      correct: true
    - text: Do przechowywania danych w Redis
      correct: false
  explanation: |
    Dekorator zapamiętuje wyniki, więc np. rekurencyjne Fibonacci działa wtedy w czasie liniowym - argumenty muszą być hashowalne.
    Nie ma związku z cache przeglądarki, Redisem ani importami.

- id: 55
  question: Co odróżnia `match/case` od prostego switcha?
  answers:
    - text: "`match/case` wymaga `break` na końcu każdego `case`"
      correct: false
    - text: "`match/case` jest szybszy, bo zawsze kompiluje się do tablicy skoków"
      correct: false
    - text: "`match/case` działa tylko z liczbami całkowitymi"
      correct: false
    - text: Dopasowanie strukturalne z wyciąganiem wartości
      correct: true
  explanation: |
    `case {"type": "user", "id": id}`: dopasowuje kształt danych i od razu przypisuje id.
    Działa z dowolnymi typami, nie wymaga `break` (nie ma przechodzenia do kolejnych `case`) i nie jest z definicji tablicą skoków.

- id: 56
  question: Do czego służy operator `:=`?
  answers:
    - text: Do deklaracji stałej, której nie można zmienić
      correct: false
    - text: Do przypisania wartości domyślnej, gdy zmienna ma wartość `None`
      correct: false
    - text: Do przypisania wartości w środku wyrażenia
      correct: true
    - text: Do porównania tożsamości obiektów
      correct: false
  explanation: |
    Operator walrus (od 3.8) pozwala nie liczyć tej samej wartości dwa razy, np. w pętlach `while`.
    Python nie ma stałych, tożsamość porównuje `is`, a wartości domyślne przypisuje się np. przez `x = x or` domyślna.

- id: 57
  question: Czym jest metaklasa?
  answers:
