    defaultdict daje wartość domyślną dla brakujących kluczy, deque to kolejka dwustronna, a `OrderedDict` - słownik z dodatkowymi operacjami na kolejności.

- id: 53
  question: Co jest warunkiem poprawnego działania `itertools.groupby`?
  answers:
    - text: Dane muszą być posortowane po kluczu
      correct: true
    - text: Dane muszą być listą lub krotką, a nie generatorem
      correct: false
    - text: Klucze muszą być typu string
      correct: false
    - text: Grup może być maksymalnie 256
      correct: false
  explanation: |
    groupby grupuje tylko kolejne elementy o tym samym kluczu, więc nieposortowane dane dadzą wiele małych grup.
    Klucze mogą być dowolne, wejściem może być dowolny iterator, a liczba grup nie jest ograniczona.

- id: 54
  question: Do czego służy `functools.lru_cache`?
  answers:
