  explanation: |
    ASGI (Uvicorn, Hypercorn) obsługuje `async/await` i długie połączenia, a WSGI (Gunicorn) - tylko synchroniczne żądania.
    WSGI jest starszy, ASGI wspierają FastAPI, Starlette i Django, a oba to standardy interfejsu, a nie serwery czy frameworki.

- id: 64
  question: Jak bezpiecznie przekazać parametr do zapytania SQL w pyodbc?
  answers:
    - text: "`cursor.execute(f\"SELECT * FROM Users WHERE Id = {user_id}\")`"
      correct: false
    - text: "`cursor.execute(\"SELECT * FROM Users WHERE Id = \" + str(user_id))`"
      correct: false
    - text: "`cursor.execute(\"SELECT * FROM Users WHERE Id = %s\" % user_id)`"
      correct: false
    - text: "`cursor.execute(\"SELECT * FROM Users WHERE Id = ?\", user_id)`"
      correct: true
  explanation: |
    Znak ? to parametr przekazywany osobno od tekstu zapytania, więc nie może zmienić jego struktury.
    f-string, konkatenacja i formatowanie `%` doklejają wartość do SQL, co otwiera drogę do SQL Injection.

- id: 65
  question: Dlaczego operacje wektorowe w NumPy są szybsze niż pętle w Pythonie?
  answers:
    - text: Bo NumPy automatycznie uruchamia obliczenia na karcie graficznej
      correct: false
    - text: Bo NumPy wyłącza garbage collector na czas obliczeń
      correct: false
    - text: Bo pętle w Pythonie są ograniczone do 1000 iteracji na sekundę
      correct: false
    - text: Bo są zaimplementowane w C i działają na ciągłych blokach pamięci
      correct: true
  explanation: |
    Pętla w Pythonie interpretuje każdą operację osobno, a NumPy wykonuje całą operację na tablicy w zoptymalizowanym kodzie natywnym.
    NumPy nie używa domyślnie GPU, nie wyłącza GC, a pętle w Pythonie nie mają takiego limitu.

- id: 66
  question: Jakie kodowanie warto zawsze jawnie podawać przy otwieraniu plików tekstowych?
  answers:
    - text: Kodowania nie podaje się - Python zawsze używa UTF-8
      correct: false
    - text: "`encoding='ascii'`"
      correct: false
    - text: "`encoding='utf-8'`"
      correct: true
    - text: "`encoding='binary'`"
      correct: false
  explanation: |
    Domyślne kodowanie zależy od systemu (na Windows bywało cp1250), więc jawne UTF-8 zapobiega błędom z polskimi znakami.
    ASCII nie obsłuży polskich znaków, 'binary' nie jest kodowaniem, a domyślny UTF-8 we wszystkich systemach to dopiero kierunek zmian (tryb UTF-8 w nowszych wersjach).

- id: 67
  question: Co wprowadził Python 3.14?
  answers:
    - text: t-stringi i leniwie wyliczane adnotacje
      correct: true
    - text: Słowa kluczowe `async` i `await`
      correct: false
    - text: Instrukcję `match/case`
      correct: false
    - text: Operator walrus `:= i` f-stringi z debugowaniem
      correct: false
  explanation: |
    t-stringi (PEP 750) dają dostęp do części szablonu przed złożeniem stringa, a adnotacje są wyliczane dopiero przy odczycie.
    Walrus pojawił się w 3.8, f-stringi w 3.6, `match` w 3.10, a `async/await` w 3.5.

- id: 68
  question: Które narzędzie łączy funkcje lintera i formattera i zastępuje flake8 oraz isort?
  answers:
    - text: tox
      correct: false
    - text: mypy
      correct: false
    - text: pytest
      correct: false
    - text: Ruff
      correct: true
