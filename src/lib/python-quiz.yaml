- id: 47
  question: W jaki sposób CPython zwalnia pamięć?
  answers:
    - text: Wyłącznie przez algorytm mark-and-sweep, bez żadnego zliczania referencji
      correct: false
    - text: Przez zwalnianie całej pamięci dopiero przy zakończeniu programu
