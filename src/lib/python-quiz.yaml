    camelCase jest typowy dla JavaScriptu i Javy, a kebab-case nie jest poprawnym identyfikatorem w Pythonie.

- id: 62
  question: Który framework webowy Pythona opiera się na type hints i Pydantic oraz generuje dokumentację OpenAPI?
  answers:
    - text: Django
      correct: false
    - text: Flask
      correct: false
    - text: FastAPI
      correct: true
    - text: Tornado
