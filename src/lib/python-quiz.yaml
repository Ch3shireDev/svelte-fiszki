  explanation: |
    Przy imporcie `__name__` zawiera nazwę modułu, więc warunek pozwala uruchomić `main()` tylko przy bezpośrednim wywołaniu.
    Nazwa pliku i jego położenie nie mają znaczenia.

- id: 45
  question: Do czego służy python -m venv `.venv`?
