- id: 63
  question: Czym ASGI różni się od WSGI?
  answers:
    - text: ASGI jest asynchroniczny, a WSGI synchroniczny
      correct: true
    - text: ASGI to serwer, a WSGI to framework
      correct: false
    - text: WSGI jest nowszy i zastąpił ASGI
