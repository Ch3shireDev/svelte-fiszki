      correct: false
    - text: Klasą klasy, która kontroluje tworzenie klas
      correct: true
    - text: Klasą bazową generowaną automatycznie przez dekorator dataclass
      correct: false
    - text: Klasą abstrakcyjną bez żadnych metod
      correct: false
  explanation: |
    Domyślną metaklasą jest type, a własne metaklasy wykorzystuje np. Django ORM.
    Klasa abstrakcyjna, metadane w bazie i klasy z dataclass to inne pojęcia - w większości przypadków zamiast metaklasy wystarczy `__init_subclass__`.

- id: 58
  question: Na jakim mechanizmie zbudowane są property, classmethod i staticmethod?
  answers:
    - text: Na metaklasach z modułu abc
