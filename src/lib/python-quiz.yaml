    - text: Kolejnymi `await` w pętli `for`
      correct: false
  explanation: |
    `TaskGroup` uruchamia zadania równolegle i poprawnie obsługuje błędy, a gather to starszy sposób.
    Kolejne `await` wykonują się sekwencyjnie, wątki nie są potrzebne, a `asyncio.run` tworzy nową pętlę i nie służy do równoległości.

- id: 40
  question: Czy interpreter Pythona wymusza type hints w czasie wykonania?
  answers:
    - text: Tak - błędny typ argumentu zawsze rzuca `TypeError` przy wywołaniu funkcji
