    Krok -1 przechodzi przez sekwencję od końca, odwracając ją.
    "P" to `s[0]`, "n" to `s[-1]`, a niezmieniony string dałby `s[::1]`.

- id: 51
  question: Co robi `zip(a, b, strict=True)`, gdy listy mają różne długości?
  answers:
