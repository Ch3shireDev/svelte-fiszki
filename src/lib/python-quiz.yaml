- id: 1
  question: Jaki będzie wynik wyrażenia `"5" + 1` w Pythonie?
  answers:
    - text: "\"51\""
      correct: false
    - text: "\"6\""
      correct: false
    - text: "6"
      correct: false
    - text: "`TypeError`"
      correct: true
  explanation: |
    Python jest silnie typowany i nie konwertuje niejawnie stringa na liczbę ani odwrotnie.
    "51" dałby JavaScript, a 6 wymagałoby jawnej konwersji `int("5") + 1`.

- id: 2
  question: Co oznacza, że Python jest typowany dynamicznie?
  answers:
    - text: Typ jest związany z wartością, a nie zmienną, i sprawdzany w czasie wykonania
      correct: true
    - text: Zmienne nie mają żadnych typów, a interpreter traktuje wszystko jako stringi
      correct: false
    - text: Typy zmiennych są sprawdzane przez kompilator przed uruchomieniem programu
      correct: false
    - text: Typ zmiennej musi być zadeklarowany przy jej pierwszym użyciu
      correct: false
  explanation: |
    Ta sama zmienna może wskazywać kolejno na `int` i `str`, a błąd typów pojawi się dopiero przy wykonaniu.
    Statyczne sprawdzanie zapewniają dopiero zewnętrzne narzędzia jak mypy, wartości mają konkretne typy, a deklaracja typu nie jest wymagana.

- id: 3
  question: Jaką precyzję ma typ `int` w Pythonie?
  answers:
    - text: 32 bity, tak jak `int` w C#
      correct: false
    - text: 64 bity ze znakiem, jak long w C#
      correct: false
    - text: 53 bity, tak jak liczby w JavaScript
      correct: false
    - text: Dowolną, ograniczoną tylko pamięcią
      correct: true
  explanation: |
    Python automatycznie obsługuje dowolnie duże liczby całkowite, np. `2 ** 1000`.
    Ograniczenia 32, 64 czy 53 bitów dotyczą innych języków, a nie typu `int` w Pythonie.

- id: 4
  question: Który typ jest mutowalny?
  answers:
    - text: "`frozenset`"
      correct: false
    - text: "`str`"
      correct: false
    - text: "`list`"
      correct: true
    - text: "`tuple`"
      correct: false
  explanation: |
    Listę można modyfikować w miejscu (append, sort, przypisanie elementu).
    `tuple`, `str` i `frozenset` są niemutowalne - "zmiana" tworzy nowy obiekt.

- id: 5
  question: Dlaczego krotka może być kluczem słownika, a lista nie?
  answers:
    - text: Bo krotki są szybsze w iteracji niż listy, a słownik wymaga szybkich kluczy
      correct: false
    - text: Bo listy są zawsze dłuższe niż krotki
      correct: false
    - text: Bo słowniki akceptują tylko typy zapisane w nawiasach okrągłych
      correct: false
    - text: Bo krotka jest niemutowalna i hashowalna
      correct: true
  explanation: |
    Klucz słownika musi mieć stały hash, a lista może się zmienić po dodaniu do słownika.
    Szybkość iteracji, nawiasy czy długość nie mają tu znaczenia.

- id: 6
  question: Od której wersji Pythona słownik gwarantuje zachowanie kolejności wstawiania?
  answers:
    - text: "3.7"
      correct: true
    - text: Słownik nigdy nie gwarantuje kolejności
      correct: false
    - text: "2.7"
      correct: false
    - text: "3.12"
      correct: false
  explanation: |
    W CPython 3.6 była to cecha implementacji, a od 3.7 stała się częścią specyfikacji języka.
    W Pythonie 2.7 kolejność nie była gwarantowana (do tego służył `OrderedDict`).

- id: 7
  question: Czym różni się operator `is` od `==`?
  answers:
    - text: "`is` działa tylko na liczbach, a `==` na wszystkich typach"
      correct: false
    - text: "`==` sprawdza, czy to ten sam obiekt, a `is` porównuje wartości"
      correct: false
    - text: "`is` sprawdza, czy to ten sam obiekt, a `==` porównuje wartości"
      correct: true
    - text: Nie ma różnicy - `is` to alias operatora `==`
      correct: false
  explanation: |
    `is` porównuje tożsamość obiektów, dlatego używa się go do x `is None`.
    Odwrócenie ról jest błędne, `is` działa na każdym typie, a internowanie małych liczb sprawia, że `is` na liczbach daje mylące wyniki.

- id: 8
  question: Jak sprawdzić, czy zmienna ma wartość `None`?
  answers:
    - text: "`x == None` jako jedyny poprawny sposób"
      correct: false
    - text: "`x.isNone()`"
      correct: false
    - text: x `is None`
      correct: true
    - text: "`type(x) == \"None\"`"
      correct: false
  explanation: |
    `None` jest singletonem, więc porównuje się go przez `is` - PEP 8 tak zaleca.
    `x == None` działa, ale może zostać nadpisane przez `__eq__`, metoda `isNone` nie istnieje, a `type(x)` zwraca typ, a nie string.

- id: 9
  question: Co zwróci `[x * 2 for x in range(4) if x % 2 == 0]`?
  answers:
    - text: "`[2, 6]`"
      correct: false
    - text: "`[0, 4]`"
      correct: true
    - text: "`[0, 2, 4, 6]`"
      correct: false
    - text: "`[0, 1, 2, 3]`"
      correct: false
  explanation: |
    `range(4)` daje 0, 1, 2, 3, warunek zostawia 0 i 2, a po pomnożeniu otrzymujemy 0 i 4.
    `[0, 2, 4, 6]` to wynik bez filtra, a `[2, 6]` to podwojone liczby nieparzyste.

- id: 10
  question: Jaka jest główna zaleta generatora nad listą?
  answers:
    - text: Pozwala na wielokrotne przejście po tych samych danych bez ponownego liczenia
      correct: false
    - text: Działa szybciej przy dostępie po indeksie
      correct: false
    - text: Automatycznie sortuje zwracane wartości
      correct: false
    - text: Produkuje wartości leniwie, bez trzymania ich w pamięci
      correct: true
  explanation: |
    Generator nadaje się do dużych plików i strumieni, bo wartości powstają w trakcie iteracji.
    Generator jest jednorazowy, nie wspiera indeksowania i nie sortuje danych.

- id: 11
  question: Co się stanie przy drugim przejściu pętlą `for` po tym samym obiekcie generatora?
  answers:
    - text: Pętla się nie wykona, bo generator jest wyczerpany
      correct: true
    - text: Generator zacznie od początku
      correct: false
    - text: Zostanie rzucony nieobsłużony wyjątek `StopIteration` poza pętlą
      correct: false
    - text: Pętla zwróci te same wartości z cache
      correct: false
  explanation: |
    Iterator, w tym generator, przechodzi przez dane tylko raz - po wyczerpaniu kolejne `next()` od razu rzucają `StopIteration`, którą `for` obsługuje po cichu.
    Generator się nie resetuje ani nie cache'uje wartości.

- id: 12
  question: Czym jest `*args` w definicji funkcji?
  answers:
    - text: Krotką z dodatkowymi argumentami pozycyjnymi
      correct: true
    - text: Listą wszystkich argumentów, także nazwanych
      correct: false
    - text: Wskaźnikiem na pierwszy argument funkcji
      correct: false
    - text: Słownikiem z dodatkowymi argumentami nazwanymi
      correct: false
  explanation: |
    `*args` zbiera nadmiarowe argumenty pozycyjne w krotkę.
    Argumenty nazwane zbiera `**kwargs` w słownik, a Python nie ma wskaźników.

- id: 13
  question: Jaki problem powoduje definicja `def add(item, items=[])`?
  answers:
    - text: Lista jest tworzona raz i współdzielona między wywołaniami
      correct: true
    - text: Lista jest kopiowana przy każdym wywołaniu, co spowalnia funkcję
      correct: false
    - text: Parametr items staje się tylko do odczytu
      correct: false
    - text: Kompilator zgłasza błąd składni
      correct: false
  explanation: |
    Wartość domyślna jest obliczana raz, przy definicji funkcji, więc elementy kumulują się między wywołaniami.
    Poprawny wzorzec to `items=None` i utworzenie listy w ciele funkcji.

- id: 14
  question: Co oznacza `/` w sygnaturze `def f(a, b, /, c)`?
  answers:
    - text: Parametry a i b są tylko pozycyjne
      correct: true
    - text: Funkcja zwraca wynik dzielenia a przez b
      correct: false
    - text: Parametr c jest opcjonalny
      correct: false
    - text: Parametry a i b są tylko nazwane
      correct: false
  explanation: |
    Parametrów przed `/` nie można przekazać po nazwie - przydaje się to, by móc zmieniać ich nazwy bez łamania API.
    Parametry tylko nazwane oznacza się `*`, a `/` nie ma związku z opcjonalnością ani dzieleniem.

- id: 15
  question: Kiedy PEP 8 odradza używanie lambdy?
  answers:
    - text: Gdy przypisuje się ją do zmiennej
      correct: true
    - text: Zawsze - lambdy są przestarzałe od Pythona 3.10
      correct: false
    - text: Gdy używa się jej w map lub filter
      correct: false
    - text: Gdy przekazuje się ją jako argument key do funkcji sorted
      correct: false
  explanation: |
    `f = lambda` x: `x * 2` nie ma zalet nad `def f(x)`, a traci czytelną nazwę w tracebackach.
    Lambda jako krótki argument funkcji jest idiomatyczna, a nie jest przestarzała.

- id: 16
  question: Czym jest dekorator w Pythonie?
  answers:
    - text: Słowem kluczowym oznaczającym funkcję jako publiczną dla innych modułów
      correct: false
    - text: Komentarzem dokumentującym funkcję
      correct: false
    - text: Klasą bazową, po której dziedziczą wszystkie funkcje
      correct: false
    - text: Funkcją, która przyjmuje funkcję i zwraca jej nową wersję
      correct: true
  explanation: |
    `@dekorator` nad definicją to skrót `f = dekorator(f)` - stosuje się go do logowania, cache czy rejestracji tras.
    Funkcje nie dziedziczą po dekoratorach, dokumentację zawiera docstring, a Python nie ma słowa kluczowego public.

- id: 17
  question: Po co w dekoratorze używa się `functools.wraps`?
  answers:
    - text: Aby dekorator mógł przyjmować argumenty
      correct: false
    - text: Aby dekorator działał asynchronicznie
      correct: false
    - text: Aby przyspieszyć wywołanie dekorowanej funkcji przez cache wyników
      correct: false
    - text: Aby zachować nazwę i docstring oryginału
      correct: true
  explanation: |
    Bez wraps funkcja-opakowanie przesłania `__name__` i `__doc__` oryginału, co utrudnia debugowanie i dokumentację.
    wraps nie wpływa na asynchroniczność, wydajność ani obsługę argumentów dekoratora.

- id: 18
  question: Które słowo kluczowe pozwala zmodyfikować zmienną funkcji otaczającej w funkcji zagnieżdżonej?
  answers:
    - text: outer
      correct: false
    - text: static
      correct: false
    - text: "`global`"
      correct: false
    - text: "`nonlocal`"
      correct: true
  explanation: |
    `nonlocal` wskazuje zmienną z najbliższego zasięgu funkcji otaczającej.
    `global` dotyczy zmiennej modułu, a static i outer nie są słowami kluczowymi Pythona.

- id: 19
  question: W jakiej kolejności Python wyszukuje nazwy (reguła LEGB)?
  answers:
    - text: Built-in, Global, Enclosing, Local
      correct: false
    - text: Local, Enclosing, Global, Built-in
      correct: true
    - text: Local, Global, Enclosing, Built-in
      correct: false
    - text: Global, Local, Built-in, Enclosing
      correct: false
  explanation: |
    Najpierw zasięg lokalny, potem funkcji otaczających, modułu, a na końcu wbudowane nazwy jak `len` czy `print`.
    Pozostałe kolejności nie odpowiadają regule LEGB.

- id: 20
  question: Do czego typowo służy `@classmethod`?
  answers:
    - text: Do wymuszenia nadpisania metody w podklasie
      correct: false
    - text: Do alternatywnych konstruktorów, np. `User.from_dict(data)`
      correct: true
    - text: Do oznaczania metod prywatnych klasy
      correct: false
    - text: Do metod, które nie mają dostępu ani do instancji, ani do klasy
      correct: false
  explanation: |
    classmethod dostaje `cls`, więc tworzy instancję właściwej klasy, także w podklasach.
    Metody bez dostępu do instancji i klasy to staticmethod, prywatność to konwencja `_nazwa`, a wymuszenie nadpisania daje `@abstractmethod`.

- id: 21
  question: Którą metodę wywołuje `print(obj)`, gdy klasa definiuje i `__str__`, i `__repr__`?
  answers:
    - text: "`__print__`"
      correct: false
    - text: "`__format__` jako pierwszą"
      correct: false
    - text: "`__str__`"
      correct: true
    - text: "`__repr__`"
      correct: false
  explanation: |
    `print` i `str()` używają `__str__`, a `__repr__` jest zapasowe i służy do reprezentacji dla programisty.
    `__format__` wywołuje `format()` i f-stringi, a `__print__` nie istnieje.

- id: 22
  question: Która metoda specjalna tworzy nową instancję obiektu, zanim zostanie zainicjalizowana?
  answers:
    - text: "`__call__`"
      correct: false
    - text: "`__init__`"
      correct: false
    - text: "`__new__`"
      correct: true
    - text: "`__create__`"
      correct: false
  explanation: |
    `__new__` tworzy i zwraca obiekt, a `__init__` go inicjalizuje.
    `__create__` nie istnieje, a `__call__` pozwala wywoływać instancję jak funkcję.

- id: 23
  question: Jakim algorytmem Python ustala kolejność szukania metod przy dziedziczeniu wielokrotnym?
  answers:
    - text: Kolejnością importów modułów
      correct: false
    - text: C3 linearization
      correct: true
    - text: Przeszukiwaniem w głąb bez eliminacji duplikatów
      correct: false
    - text: Alfabetyczną kolejnością nazw klas
      correct: false
  explanation: |
    Wynik dostępny w `Klasa.__mro__` gwarantuje spójną kolejność, a `super()` wywołuje następną klasę w MRO.
    Naiwny DFS był stosowany w starych klasach Pythona 2, a nazwy klas i importy nie mają wpływu.

- id: 24
  question: Co robi dekorator `@property`?
  answers:
    - text: Wymusza walidację typu na podstawie adnotacji
      correct: false
    - text: Tworzy właściwość statyczną współdzieloną przez wszystkie instancje
      correct: false
    - text: Zamienia atrybut w stałą, której nie można odczytać
      correct: false
    - text: Zamienia metodę w atrybut wyliczany przy dostępie
      correct: true
  explanation: |
    `@property` pozwala dodać logikę odczytu (a z `@x.setter` - zapisu) bez zmiany API klasy.
    Nie tworzy stałych ani atrybutów statycznych i nie waliduje typów z adnotacji.

- id: 25
  question: Co automatycznie generuje dekorator `@dataclass`?
  answers:
    - text: Metody `__init__`, `__repr__` i `__eq__` z adnotacji pól
      correct: true
    - text: Interfejs REST API dla klasy
      correct: false
    - text: Walidację typów wszystkich pól w czasie wykonania na podstawie adnotacji
      correct: false
    - text: Tabelę w bazie danych na podstawie pól klasy
      correct: false
  explanation: |
    `@dataclass` usuwa powtarzalny kod - opcje frozen, order i slots dodają kolejne zachowania.
    Tabel bazy nie tworzy (to rola ORM), nie waliduje typów (do tego jest np. Pydantic) i nie generuje API.

- id: 26
  question: Jak poprawnie ustawić pustą listę jako wartość domyślną pola dataclass?
  answers:
    - text: "items: `list = list`"
      correct: false
    - text: "items: `list = field(default_factory=list)`"
      correct: true
    - text: "`items: list = []`"
      correct: false
    - text: "items: `list = None`, a lista tworzy się sama"
      correct: false
  explanation: |
    `default_factory` wywołuje `list()` dla każdej instancji, więc instancje nie współdzielą listy.
    Mutowalna wartość domyślna `[]` jest odrzucana przez `dataclass`, `list` to sam typ, a `None` nie zamieni się automatycznie w listę.

- id: 27
  question: Co daje zdefiniowanie `__slots__` w klasie?
  answers:
    - text: Automatyczne serializowanie obiektów do JSON
      correct: false
    - text: Mniejsze zużycie pamięci i stały zestaw atrybutów
      correct: true
    - text: Bezpieczeństwo wątkowe dla wszystkich atrybutów instancji bez blokad
      correct: false
    - text: Możliwość dziedziczenia po wielu klasach naraz
      correct: false
  explanation: |
    Zamiast dynamicznego `__dict__` instancja ma stały zestaw atrybutów - przydaje się przy milionach obiektów.
    `__slots__` nie serializuje, nie synchronizuje dostępu i nie ma związku z dziedziczeniem wielokrotnym.

- id: 28
  question: Co się stanie przy próbie utworzenia instancji klasy ABC z niezaimplementowaną metodą `@abstractmethod`?
  answers:
    - text: Python automatycznie wygeneruje pustą implementację
      correct: false
    - text: Metoda abstrakcyjna zwróci `None`
      correct: false
    - text: Zostanie rzucony `TypeError`
      correct: true
    - text: Instancja zostanie utworzona, a błąd pojawi się przy wywołaniu metody
      correct: false
  explanation: |
    ABC blokuje tworzenie instancji, dopóki wszystkie metody abstrakcyjne nie zostaną zaimplementowane.
    Błąd nie jest odkładany do wywołania, a Python nie tworzy implementacji automatycznie.

- id: 29
  question: Co pozwala opisać `typing.Protocol`?
  answers:
    - text: Klasę bazową, po której muszą jawnie dziedziczyć wszystkie implementacje
      correct: false
    - text: Kolejność wywoływania metod obiektu
      correct: false
    - text: Kontrakt strukturalny oparty na metodach, bez dziedziczenia
      correct: true
    - text: Protokół sieciowy, np. HTTP lub TCP
      correct: false
  explanation: |
    Protocol to formalny zapis duck typingu dla statycznych narzędzi jak mypy.
    Nie dotyczy protokołów sieciowych, nie wymaga dziedziczenia (to cecha ABC) i nie opisuje kolejności wywołań.

- id: 30
  question: Co gwarantuje instrukcja `with open('plik.txt') as` f?
  answers:
    - text: Zamknięcie pliku po wyjściu z bloku, także przy wyjątku
      correct: true
    - text: Wczytanie całego pliku do pamięci przed wejściem do bloku
      correct: false
    - text: Otwarcie pliku w trybie tylko do odczytu na wyłączność
      correct: false
    - text: Automatyczne utworzenie kopii zapasowej pliku
      correct: false
  explanation: |
    Context manager wywołuje `__exit__` niezależnie od tego, jak blok się zakończy.
    `with` nie blokuje pliku na wyłączność, nie wczytuje go od razu i nie tworzy kopii.

- id: 31
  question: Jak najprościej napisać własny context manager?
  answers:
    - text: Funkcją z `@contextlib.contextmanager` i `yield`
      correct: true
    - text: Klasą z metodą `__call__` wywoływaną przy wejściu do bloku
      correct: false
    - text: Funkcją z dekoratorem `@property` i metodą setter
      correct: false
    - text: Klasą dziedziczącą po `Exception`
      correct: false
  explanation: |
    Kod przed `yield` to wejście, a po `yield` (najlepiej w `finally`) - sprzątanie.
    Alternatywą jest klasa z `__enter__` i `__exit__`, a dziedziczenie po `Exception`, `@property` czy `__call__` nie tworzą context managera.

- id: 32
  question: Kiedy wykonuje się blok `else` w konstrukcji `try/except/else`?
  answers:
    - text: Gdy wystąpił wyjątek, który nie pasuje do żadnego `except`
      correct: false
    - text: Zawsze, niezależnie od wyjątków
      correct: false
    - text: Gdy w bloku `try` nie wystąpił wyjątek
      correct: true
    - text: Tylko gdy blok `except` rzucił nowy wyjątek
      correct: false
  explanation: |
    `else` oddziela kod, który ma się wykonać po sukcesie, od kodu chronionego przez `try`.
    Kod wykonywany zawsze to `finally`, a nieobsłużony wyjątek po prostu propaguje się dalej.

- id: 33
  question: Do czego służy `raise NowyWyjątek(...) from err`?
  answers:
    - text: Do ponowienia operacji, która rzuciła err
      correct: false
    - text: Do zachowania łańcucha przyczyn wyjątków
      correct: true
    - text: Do rzucenia obu wyjątków jednocześnie w `ExceptionGroup`
      correct: false
    - text: Do zignorowania oryginalnego wyjątku bez śladu w tracebacku
      correct: false
  explanation: |
    Traceback pokaże wtedy oba wyjątki z informacją, że jeden był bezpośrednią przyczyną drugiego.
    Ukrycie przyczyny wymaga `from None`, `from` nie ponawia operacji, a wiele wyjątków naraz obsługuje `ExceptionGroup`.

- id: 34
  question: Którą zasadę stylu obsługi błędów preferuje Python?
  answers:
    - text: Zwracanie kodów błędów zamiast wyjątków
      correct: false
    - text: LBYL - zawsze sprawdź wszystkie warunki przed wykonaniem
      correct: false
    - text: Ignorowanie błędów i logowanie ich na końcu programu
      correct: false
    - text: EAFP - spróbuj wykonać operację i obsłuż wyjątek
      correct: true
  explanation: |
    EAFP (Easier to Ask Forgiveness than Permission) jest idiomatyczny i unika wyścigów między sprawdzeniem a użyciem.
    LBYL bywa stosowany, ale nie jest preferowany, a kody błędów i ignorowanie błędów nie są stylem Pythona.

- id: 35
  question: Co blokuje GIL w CPythonie?
  answers:
    - text: Równoległe wykonywanie bajtkodu przez wiele wątków
      correct: true
    - text: Używanie bibliotek napisanych w C
      correct: false
    - text: Operacje wejścia-wyjścia na plikach
      correct: false
    - text: Uruchamianie wielu procesów Pythona jednocześnie na jednej maszynie
      correct: false
  explanation: |
    Tylko jeden wątek naraz wykonuje bajtkod, więc wątki nie przyspieszają obliczeń CPU-bound.
    Procesy mają osobne GIL-e, GIL jest zwalniany przy I/O, a biblioteki w C (np. NumPy) mogą go zwalniać.

- id: 36
  question: Co wprowadził Python 3.13 w kontekście GIL?
  answers:
