    - text: W pliku `conftest.py`
      correct: true
    - text: W pliku `setup.py`
      correct: false
  explanation: |
    pytest automatycznie wczytuje `conftest.py` i udostępnia zdefiniowane w nim fixtures testom w tym katalogu i podkatalogach.
    `setup.py` służy do pakowania, `__init__.py` oznacza pakiet, a `pytest.ini` zawiera konfigurację, nie fixtures.

- id: 61
  question: Jaką konwencję nazewnictwa funkcji i zmiennych zaleca PEP 8?
  answers:
