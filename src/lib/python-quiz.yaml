    `strict=True` (od 3.10) wymaga równej długości iterowanych sekwencji.
    Ucinanie do krótszej to domyślne zachowanie zip, a uzupełnianie `None` to `itertools.zip_longest`.

- id: 52
  question: Która klasa z modułu collections zlicza wystąpienia elementów?
  answers:
