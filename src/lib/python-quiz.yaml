  explanation: |
    Deskryptor przechwytuje dostęp do atrybutu klasy, co pozwala wielokrotnie używać logiki atrybutów.
    Metaklasy kontrolują tworzenie klas, functools zawiera pomocnicze dekoratory, a `__slots__` ogranicza zestaw atrybutów.

- id: 59
  question: Jak w pytest wykonuje się sprzątanie po teście w `fixture`?
  answers:
    - text: Funkcją o nazwie `finally_` w pliku testu
      correct: false
    - text: Metodą `tearDown` w klasie `TestCase` jako jedynym sposobem
      correct: false
    - text: Kodem umieszczonym po `yield` w funkcji `fixture`
      correct: true
    - text: Dekoratorem `@pytest.cleanup`
      correct: false
  explanation: |
    Fixture z `yield` przygotowuje zasób przed `yield`, a sprząta po nim (alternatywą jest `request.addfinalizer`).
    `tearDown` to styl unittest, a `@pytest.cleanup` i `finally_` nie istnieją.

- id: 60
  question: Gdzie w pytest umieszcza się fixtures współdzielone przez wiele plików testów?
  answers:
