    - text: Przez ręczne wywołanie `del` dla każdego obiektu
      correct: false
  explanation: |
    Obiekt jest zwalniany, gdy licznik referencji spada do zera, a moduł gc usuwa cykle.
    `del` usuwa tylko nazwę (referencję), a nie wymusza zwolnienia obiektu, a pamięć jest zwalniana na bieżąco.

- id: 48
  question: Jak utworzyć głęboką kopię zagnieżdżonej listy?
