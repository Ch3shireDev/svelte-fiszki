      correct: false
    - text: GIL dla każdego modułu osobno
      correct: false
  explanation: |
    Wersja free-threaded jest osobnym buildem - w 3.14 stała się oficjalnie wspierana, ale domyślny build nadal ma GIL.
    GIL per moduł i automatyczne przenoszenie wątków do procesów nie istnieją.

- id: 37
  question: Co wybrać do obliczeń CPU-bound w standardowym CPythonie?
  answers:
    - text: asyncio z wieloma korutynami
      correct: false
    - text: multiprocessing
      correct: true
    - text: "`time.sleep` między obliczeniami"
      correct: false
    - text: threading z wieloma wątkami roboczymi
      correct: false
  explanation: |
    Osobne procesy mają własne interpretery i GIL-e, więc mogą liczyć równolegle na wielu rdzeniach.
    Wątki i korutyny są ograniczone przez GIL przy obliczeniach, a sleep tylko spowalnia.

- id: 38
  question: Co się stanie, gdy w korutynie asyncio wywołasz `time.sleep(5)`?
  answers:
    - text: Zostanie rzucony wyjątek `RuntimeError`
      correct: false
    - text: Cała pętla zdarzeń zostanie zablokowana na 5 sekund
      correct: true
    - text: Tylko ta korutyna poczeka, a inne będą działać dalej
      correct: false
    - text: Python automatycznie zamieni to na `await asyncio.sleep(5)`
      correct: false
  explanation: |
    `time.sleep` blokuje wątek, na którym działa pętla zdarzeń, więc żadna inna korutyna się nie wykona.
    Nieblokujące oczekiwanie daje `await asyncio.sleep(5)`, a Python niczego nie podmienia automatycznie.

- id: 39
  question: Jak uruchomić kilka korutyn równolegle w nowoczesnym asyncio (3.11+)?
  answers:
